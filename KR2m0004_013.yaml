body:
  text: 宋朝事實卷十三宋李攸撰儀注三凡勘箭皆左右金吾仗司主之箭笴長二尺五寸雕羽金鼇筈輸石鏃闊二寸方斜形如匕二箭合鏃有鑿枘為雄雌體箭藏內中一為辟仗箭藏本司皆韜以絳羅銷金囊每車駕至門閣門使持鶻箭贊云勘箭官來前勘箭官稱喏跪受箭以左右箭相合奏云內外箭勘同閣門使承制云準敕行勘勘箭官稱軍將門仗官前來軍將門仗官二十八人齊聲喏勘箭官言呈箭又聲喏勘箭官云某年月日皇帝宿齋于某殿某日具天仗迎鑾駕出入某門詣某所行禮內出雄鶻箭一外進辟仗箭一準敕符左右金吾仗行勘勘箭官稱合不合和箭門仗官皆稱合如此再問對又問同不同和箭門仗皆稱同如此再問對勘箭官乃伏奏云左右金吾列駕仗勾盡都知具官臣姓名對御勘同其雄鶻箭謹奉閣門使進入諸司準式勘箭官即起居三呼萬嵗開門進輅凡宣德門出左仗主之景靈宫入右仗主之太廟入左仗主之南薰門入則勘出則否案宋史禮志熙寧四年參知政事王圭言南郊乘輿所過必勘箭然後出入此師行之法不可施于郊祀禮院亦言于是凡車駕出入門皆罷之六年以詳定所請又罷太廟及宣德朱雀南薰諸門勘契蓋自熙寧以後罷勘箭故史志不詳其儀而東都事略及長編諸書亦不復載許立家廟已賜門戟者仍給官地修建案宋史禮志慶厯元年南郊赦書中外文武官並許依舊式立家廟宋庠請下兩制禮官詳定官正一品平章事以上立四廟樞密使以下節度使東宫少保以上皆立三廟餘官祭于寢凡立廟聼于京師或所居州縣大觀問議禮局言有私第者立廟于門內之左如狹隘聽于私第側力所不及仍許隨宜詔製祭器給賜之未嘗給以官地修建也自紹興十一年詔臨安守臣為秦檜營建家廟後韋淵吳益楊存中吳璘虞允文韓世忠史浩等並請建家廟賜以祭器參用大觀紹興故事此書所載與宋史互異册公主儀制太常禮院上封册兗國公主儀注前一日有司設册使等幕次于內東門外設內命婦次于公主受册印本位門之外又設公主受册印本位于庭階下北向又設册使位于內東門副使及內給事于其南差退並東向北上又設册印案于册使之前南向又設內給事位于册使北南向其日自文德殿奉册印將至內東門內給事詣本位請公主服首飾褕翟册印至內東門外褥位置訖捧册官少退內臣引內命婦俱入就位禮直官引册使副使等俱就東向位立定內給事進就南向位通事舍人博士引册使就內給事前東向稱册使某副使某奉制授公主册印退復位內給事入詣所設受册印本位公主前言訖退內給事進詣册使前面西册使前跪以册印授內給事亦跪以授內謁者及主當內臣等持册印入內東門內給事從本位庭中內給事贊公主降詣庭中北向位立定跪取册興立于公主之右少前西向內給事立于公主之左少前東向又內給事稱有制內給事贊公主再拜訖內給事捧册跪授公主公主受以授內給事內給事捧印授公主如捧册之儀內給事贊公主再拜前引公主升位以次內臣引內命婦賀內給事贊言禮畢內命婦退遂引公主謝皇帝皇后一用內中之儀案宋史禮志載公主受封儀謂自此遂為定制太常禮院言古者結婚始用行人告以夫家采擇之意謂之納采問女之名歸卜夫廟卜而獲吉以告女家謂之問名納吉今選尚一出朝廷不待納采又公主封爵已行誕告不待問名而卜之若納吉成則既有進財請期則有司擇日宜稍依五禮之名存其物數俾知古者婚姻之事至重而夫婦之際有嚴如此則亦不忘古禮之義也欲自公主出降日令李瑋家主婚之人具合用鴈帛玉馬等物陳于內東門外以授內謁者進入內中付掌事者受之其馬即不入從之案此條脫去李瑋尚兗國公主年月太平興國五年令有司詳定打毬儀三月會鞠于大明殿用其儀有司于毬場東西樹雙木為毬門髙丈餘首刻金龍下施石蓮花座加以綵繪左右分朋主之以承旨二人守門內臣十二人案內臣十二人宋史作衛士二人與此互異持小紅旗唱籌御龍官衣錦繡服持哥舒棒以周衛毬場殿階下東西設日月旗教坊設龜兹部鼓樂于兩廂鼓各以五又于兩毬門旗下别各設五門豫定分朋狀取裁親王近臣節度觀察防禦團練使刺史錢俶劉繼元駙馬都尉諸司使副供奉官殿直悉預其兩朋官皇親及節度使以下服異色繡衣左朋黃襴右朋紫襴打毬供奉官左朋服紫繡右朋服緋繡烏皮鞾冠以花插腳折上巾天廏院擇馬之馴習者并供鞍勒上自禁中乘馬出教坊大合涼州曲諸司使以下前導從臣奉迎上降馬御殿羣臣謝宣召以次上馬馬皆結尾分朋乘馬自兩廂入序立于西廂上乘馬當庭西南駐內侍發金合出朱漆毬擲于御前通事舍人奏云御朋打東門上遂擊毬教坊作樂奏鼓毬既度颭旗叩鉦止鼓上回馬從臣奉觴上壽貢物以賀賜以酒即列拜飲畢上馬上再擊毬命諸王大臣馳馬爭擊旗下攂鼓將及門逐廂急鼓毬度殺鼓三通設繡旗二十四于毬門兩旁又設虛架于殿東西階下每朋得籌即取旗一立架上以記之上得籌樂少止從官呼萬嵗羣臣得籌即唱好得籌者下馬稱謝凡三籌畢乃御殿召從臣飲又有步擊及跨驢騾擊者時令供奉分朋戲于御前以為樂後以打毬驢騾務名不經改為擊鞠院軍中之戲也英宗葬永厚陵英宗梓宫至永厚陵館于席屋從韓公下視宫有正殿置龍輴後置御座影殿置御容東幄臥神帛後置御衣數事齋殿旁皆守陵宫人所居其東有浣濯院有南廚廚南陵使廨舍殿西副使廨舍都知石全育為陵使原注次道曰陵使三年而罷其後惟置副使及都監靈駕至儀仗轉趣園西殿中儀仗前導御容大升輿御龍輴御前殿車輅各就幕屋方相儀椁漆梓宫等置于塋外各有方位司天監處之兵士各執儀仗分屯鞏縣偃師承安命使臣董之陵北有枯河河北原合抱三陵在青龍山下其西白虎澗青龍山西即太室也少室西俗謂之冠子山陵前闊角謂之鵲臺門側臺曰乳臺陵臺三層髙五十三尺上宫方百五十步卷四重共髙八尺厭木者二重石椁髙一丈其鑿長一丈二尺深濶七尺蓋條石各長一丈闊二尺十四板皇堂方三丈深二丈三尺麓巷長八十三尺深闊一丈八尺自平地至深六十三尺隧道長四百七十尺石人物六十事韓公曰力士所得直及賜豫人不過七緍而已癸酉黎明設遣奠于幄殿有牲牢祝文餘皆如朝臨禮昌王案宋史神宗封皇弟皓為昌王及五使皆吉服金帶導龍輴降隧道抵木階梓宫升石椁西首御夷牀下不及地尺而止已時一刻乃下置珠網花結于上布方木及蓋條石及設御座于蓋下前置時果及五十味食别置五星十二辰及祖思祖明尊位于四壁又設衣冠劍佩筆硯弧矢甲胄凡平生玩好之物又設繒帛緍錢然後設册寶乃然漆燈閉柏門置逍遙于麓巷闔石門缺其閾之中央留人于內搘掂畢匍匐而出鎖其門投鑰于內司徒復土九鍤立石柱于中央縈以鐵索乃以都護排防纍石以塞門實隧以土五使乃易凶服設掩皇堂祭于隧外哭又于陵哭人易吉服黑帶俟浴虞主畢奏請降輿升輅即下宫又奏進發五使前步導至下宫奏降輅升輿設第一虞哭原注仁宗之虞不哭次道曰唐室請陵但置香藥不設食為臭腐故也乙酉未明百官序立集英殿下上自東南來登殿哭奠拜降就幄宗正卿告遷酌獻畢虞主乘腰輿出兩府前導上步從至宣德門乘玉輅上北面再拜辭是日早太祝浴栗主于廟門西幄王禹玉題之輅及廟門百官拜迎于門外虞主御腰輿入就幄辰時百官又立于殿庭內臣以腰輿迎栗主置于中庭之褥子又于褥西北面俯伏興稱英宗憲文憲武宣孝皇帝祔廟內臣奉主于腰輿升自阼階詣真宗室祔坐于東壁下少頃詣本席褥位公卿以下行禮奏樂如時享之儀畢以腰輿奉桑主埋于席北百官入慰乙酉祔英宗于太廟太宗詔天下前後詔敕並聽于敕書樓著以籍受代日交相付仍于印紙厯及南曹厯內批書凡公家文書謂之藁中書謂之草樞密院謂之底三司謂之檢今祕府有梁朝宣底即貞明中崇政院書也檢即州縣通稱焉理宗用黃封柬板或以牙作號御槧案此記理宗事疑非李攸原本至和元年詔中書提點五房公事雖無出身亦聽佩魚舊制自選人入為堂後轉至五房提點始得佩魚提點五房吕惟和非選人入授司天監五官正求佩魚特許之真宗仁宗兩朝禁銷金縷金真宗大中祥符四年七月後苑匠為民造銷金開封府奏罪當笞帝以不足懲誡刺面配中靖仁宗性節儉不喜華侈尤惜財用景祐二年五月九日謂近臣曰訪聞市肆以縷金為婦人首飾冠子及梳等潛將貨賣況先朝已有制條禁銷金之作今縷金之用耗蠧奢侈與銷金無異須議行斷絶宰臣對以法嚴則令行乃下詔曰幣器之興金鎰為重理財藝貢邦用賴焉洪惟先朝深鑒治本特嚴塗鑠之禁以杜奢僭之萌而宵人末工放利矜巧深冒舊防糜壞至寶崇華首服交相貿鬻隂長奇邪官司因循曽未呵謫宜申布于前令俾大革其非心倘或弗悛罔有攸赦敦風逺罪當稱朕懷檢會大中祥符元年至天禧二年二月編敕除大禮法物上從中禁下暨庶邦但係衣服裝著之類土木玩好之物並不得以金為飾如違並科違制之罪其臣僚之家罪在家長皇親宫宅只坐勾當使臣并駙馬都尉其充業匠人不得輒便造作罪當行處斬如官司并鄰人不覺察造作者亦當勘罪重斷仍許人告得實支賞錢一百貫文至慶厯二年又以銷金等物未盡禁止又下詔曰朕欽遵聖猷精求政治務菲躬而圖儉庶率已以先民眷乃良金時為上幣何兹流俗未穆醇風侈麗相夸蠧弊滋廣銷爇珍寶變尚服裝增效魚龍之文頗姦輿輦之制寖踰法度遂益僭差頃在先朝纍頒深詔爰重禁防之格乃開購告之塗肆朕纂承亦嘗申飭如聞近嵗違冒猶多俾條舉于舊章冀懋成于敦化必驅衆正宜自近初上從宫掖之嚴下暨臣民之伍均行屏絶用一等倫除大禮各有舊制依前行用內庭自中宫以下並不得銷金貼金縷金間金蹙金解金陷金明金泥金榜金背金闌金蒙金等但係裝著衣服並不得以金為飾其外廷臣庶之家不以有官無官封邑並皆禁斷宜令宰司申明前後條貫指揮皇祐三年殿中侍御史張澤行奏曰臣聞真宗朝已有衣明金銷金一禁之後無有犯者其故何也蓋聞先自宫中禁斷然後知禁令必行無敢犯之者如聞京師近年頗不禁絶此壞亂先帝舊法又違陛下崇儉崇孝之德夫先帝發一號出一令豈徒然哉蓋欲後世師其儉也況陛下動作皆法先訓遂致治平而世俗敢此冒禁者風俗侈靡使然也惟陛下可以裁之抑之無知之民從其所好如允臣所言亦乞先自宫中禁斷仍檢會舊敕如有犯者並從違制定斷其工匠人仍乞處斬所貴知悉上語輔臣令舉行前後詔書嚴行禁止自是銷金之弊遂止禁止奢僭制度仁宗景祐三年詔曰儉守則固約失則鮮典籍之格訓也貴不逼下賤不擬上臣庶之定分也如聞輦轂之間士民之衆罔遵矩度爭尚僭奢服玩纖華務極珠金之飾室居宏麗交窮土木之工倘懲誡之弗嚴恐因循而滋甚況歷代之制甲令備存宜命攸司參為令式庶幾成俗靡蹈非彞其令兩制與太常禮院同詳定制度以聞及羣臣議上因詔天下士庶之家凡屋宇非邸店樓閣臨街市之處毋得為四鋪作及鬬八非品官毋得起門屋非宫室寺觀毋得彩繪棟宇及間朱漆梁柱窗牖雕鏤柱礎凡器用毋得表裏用朱漆金漆下毋得襯朱非三品以上官及宗室戚里之家毋得用稜器其用銀稜者毋得鍍金玳瑁酒食之器非宫禁毋得用純金之器若經賜者聽用之凡命婦許以金為首飾及為小兒鈴鐲用餘以為叉篸釧纏珥環者聽之仍毋得為牙魚飛魚奇巧飛動若龍形者其用銀仍毋得鍍金非命婦之家毋得以真珠裝綴首飾衣服及項珠纓珞耳墜頭􅔮抹子之類凡帳幔復壁承塵柱衣額道架帕簾牀裙毋得用純錦遍繡宗室戚里茶擔子并食合毋得以緋紅蓋覆豪貴之族所乘坐車子毋得用朱漆及五彩裝繪若有黑漆而間以五彩者聽之民間毋得乘擔子及以銀骨䤪水罐子引喝隨行其用兜子所舁毋得過二人非四品以上官毋得服金帶舊經賜者聽之非五品以上官毋得乘鬧裝銀鞍其乘金塗銀裝絛子促結鞍轡自文武升朝官及內職禁軍指揮使諸班押廂軍都虞候防團副使以上聽之仍無得以藍黃為絛白皮為韉轡民庶只許以氈皮絁紬為韉京官為通判以上職任者許權依升朝官例違者物主工匠並以違制論工匠仍刺配他州有陳告者賞錢五萬其過百日而不變毁者坐之宜令宣徽院御史臺閣門左右金吾衛司開封府覺察以聞禁止鋪翠銷金等服飾太上皇帝紹興二十七年原注闕月手詔朕惟崇尚儉素實帝王之先務祖宗之盛德比年以來中外服飾過為侈靡雖纍行禁止終未盡革朕躬行敦朴以先天下近外國所貢翠羽六百餘隻可令焚之通衢以視百姓行法當自近始自今後宫中首飾衣服並不許鋪翠銷金如犯此禁重置于法仰幹辦內東門司官常切覺察不得有違若失覺察以違制論其中外士庶令有司嚴立禁法貴近之家尤宜遵守如有違犯必無容貸故兹詔諭各宜知悉宋朝事實卷十三
