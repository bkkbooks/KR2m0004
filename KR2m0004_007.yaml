body:
  text: 宋朝事實卷七宋李攸撰道釋建隆初太祖遣使詣真源祠老子于京城修建隆觀觀在閶闔門外周世宗建曰太清觀帝命重修賜今名自是齋修率就是觀自五代以來道流庸雜乾德五年右街道録何自守坐事流配乃詔萊州道士劉若拙為左街道録案左街道録原本闕街字今從李燾長編增入俾之肅正道流開寶五年閏二月詔曰沖妙之門清淨為本逮于末俗頗玷真風或竊服冠裳寓家宫觀所宜懲革以副欽崇兩京諸州士庶稱奇詭者一切禁斷其道流先有家屬同止者速遣出外自今如願入道者須本師與本觀知事同詣長吏陳牒請給公驗方許披度十月又令若拙與功德使集京師道士試驗其學業至而不修飭者皆斥之若拙蜀人自號華蓋先生善服氣養生九十餘嵗不衰步履輕捷每水旱必召于禁中致禱其法精至上甚重之大中祥符元年增宫名曰玉清昭應凡役工日三四萬發京東西河北淮南州軍禁軍調諸州工匠每季代之兵卒嵗一代並優其口糧資值選四廂都指擇使忠佐二員董役案宋初有軍頭司引見司端拱元年並冠稱御前忠佐詳見文獻通考此云忠佐從省文立賞格以勸其所用木石則有秦隴岐同之松嵐州汾隂之柏潭衡道永鼎吉之杉松桐楮溫台衢婺之豫章明越之松杉其石則淄鄭之青石衛州之碧石萊州之白石絳州之斑石吳越之奇石洛水之玉石其采色則宜聖庫之銀硃桂州之丹砂河南之赭土衢州之朱土梓州之石青石緑磁相之黛秦階之雌黃廣州之藤黃孟澤之槐花虢州之鉛丹信州之黃土河南之胡粉衛州之白堊鄆州之螺粉兖澤之墨宣歙之漆賈谷之望石萊蕪興之鐡其木石皆遣所在官部押兵民入山谷伐取挽輜車泛舟航以至餘皆分布部綱輸送又于京師置務化銅為鍮冶金箔煆鐡以給用凡宫之東西三百一十步南北四百三十步地多黑土疏惡于京東取良土易之自三尺至一丈有六等上以負擔之勞令自新城濠由廣濟濠入舊城濠抵宫門案李燾長編上以道里稍逺令丁謂等議謂等請用車載土上曰挽舟止役十人而土可速致令三司以空船給昭應宫運土浚治渠道自新城北濠入與此所載詳略互異兵匠供茶酒飲食綱卒皆給鞋錢衣屨口糧民以材木鬻于官者蠲其算或有獻良木者優賜其值車駕時來省視必有賜賚遇節序日别賜燕會及宫成令長吏于采木石處建道場以謝五年聖祖司命天尊降臨改奉尊像于玉皇後殿東建司命殿為治事之所十一月詔名玉皇殿曰太初聖祖殿曰明慶天書閣曰寶符凡宫殿門名無慮五十餘所皆御製賜名親書填金有司具黃麾仗道門威儀奉迎至宫奉安東西山院在集靈凝命之旁皆纍石為山引流水為池東有昆玉亭澄虛閣昭德殿西有瑶峯亭涵暉閣昭信殿原注山院常扄鐍中設茵褥屏風棊枰琴阮之屬北門內二宴殿曰迎禧迎祥後二殿曰崇慶崇福太初殿楚石為丹墀龍墀前置日月樓畫太陽太隂像及環殿圖八十一太一東西廊圖五百靈官前置石壇鐘樓經樓原注上聞江西有鐘洪大遣使取之既而不堪用令李溥就杭州别鑄重三萬斤四隅置樓闕其外纍甓為牆引金水為甓渠環宫垣又分為二石渠貫宫中六年四月上望拜奉迎丙午奉安肆赦門下國家重熙鼎盛席慶善之鴻基百祿惟新承昊穹之蕃錫爰自綿區砥定寶籙荐臻叶千嵗之昌辰舉一王之茂典肇營恭館式耀丕圖偉嘉會以元亨荷太靈之昭格昔者九龍垂馭啓道德之仙源五老告期顯唐虞之瑞命天人交應古今同符昨以鍊楚越之良金法紫清之妙像肅陳仗衛迎至國都榮觀焜耀歡聲沸嘒上真髙聖凝三氣之殊姿英祖神宗儼重瞳之粹質屬朝修之禮畢罄恪謹之誠深動色相趨降祥允集宅靈祕宇永申崇奉之宜賜福羣倫宜霈覃延之澤可大赦天下云云於戲昭事上帝惟懷永圖克已彌恭務守盈成之業保民在念庶躋仁壽之鄉更資同德之臣叶贊承平之治建安軍升為真州鎔笵之地建為儀真觀玉清昭應宫作于大中祥符元年至七年十一月宫成案宋史紀事本末十一月乙酉玉清昭應宫成初議營宫料工須十五年修宫使丁謂令以夜繼晝每繪一壁給二燭故七年而成凡二千六百一十楹制度宏麗屋宇稍不中程式雖金碧已具劉承圭必令毁而更造所載較此為詳附録備考大中祥符元年建玉清昭應宫太初紫微殿寶符閣上梁日上皆親臨護其日大合樂工人以文繒裹梁金飾木寓龍負之輅以升伶官讀文其上設機木散擲金錢餅果修宫使以下及營繕掌事者賜以衣帶金帛有差從官咸賜衣服金犀帶大中祥符元年真宗建玉清昭應宫又奉四像御大舟上設幄殿皆內侍主供具夾岸設黃麾仗三千人騎吹四百别列舟十艘載門旗弓矢青衣弓矢殳叉道衆幢節經過州縣道門聲讚鼓吹振作官吏出城十里具道釋威儀音樂迎拜所過禁屠宰止刑京師禁屠宰七日止行刑二日甲辰聖像至上齋于長春殿百官齋宿朝堂乙巳上衮服朝拜羣臣朝服陳玉幣册文酌獻具大駕鹵簿自宫城東出景龍門五使前導上望拜奉迎丙午奉安肆赦真宗建天慶觀大中祥符二年十月詔曰朕欽崇至道誕受元符庶敦清淨之風永洽淳熙之化式營仙館以介民禧宜令諸路州府軍縣開擇官地建道觀或改舊宫觀名題而崇葺之以奉三清玉皇並以天慶為額五年閠十月詔增設聖祖殿惟西京謂之天慶宫天禧中各賜金寶牌王捷者汀州人咸平初賈販至南康軍于逆旅遇道人自言姓趙氏是冬再見于茅山命捷市鉛汞鍊之少頃皆成金捷即隨至和州諸山得其術又授以小鐶神劍密緘之戒曰非遇人主慎勿輕言捷詣闕求見不得乃謀以罪名自達至信州陽狂大呼案陽狂錦繡萬花谷引此作佯狂遂坐配𨽻嶺南未久逃至京師官司捕繫閣門祗候謝德權知其有術即為奏請案江少虞事實類苑捷逃至京師撾登聞鼓自陳與此互異得釋乃解軍籍劉承圭聞其異為改名中正得對龍圖閣具陳靈應特授許州參軍留止皇城廨舍時出遊廛市常有道人與之偶語云即向來授法司命真君也其語祕不傳承圭為創新堂駐之乃以景德四年五月十三日降于堂之紗幬中戴冠佩劍服皆青色自是屢降中正傳達其言凡有瑞異必先告之東封畢加號司命天尊及司命降臨延恩殿乃上聖祖之號每舉大禮及有營繕中正必達靈命以藥金銀來獻後改皇城新堂為元符觀中正纍官至左神武軍大將軍康州團練使後贈鎮南軍節度使塑其像于景靈宫案事實類苑捷卒贈嶺南節度使謂之燒金王先生建祠元寧院西與此互異上為製靈遇贊紀其始終九年十月內出所進金命鑄為寶牌分給在京宫觀及外路名山聖迹并天慶觀原注寶牌長二寸許廣寸餘面文曰玉清昭應宫成天尊萬嵗其背文曰永鎮福地其周郭皆隱起龍蛇華葩之狀藥銀命鑄大錢大會道釋于天安殿賜之凡萬三千八十六人其後著令凡官吏之官罷任並詣觀朝拜聖祖禁乘馬轎入門及不得食葷茹厭遇天慶節許士庶焚香庭中八年四月上命禮儀院備録聖祖降臨置節建觀事狀咸命刻石觀中案錦繡萬花谷引此書云大中祥符五年十月聖祖降于延恩殿先是有汀州人王捷者咸平初賈販于南康軍逆旅遇道人自言姓趙是冬再見于茅山命捷市鉛汞鍊之成金捷即隨至和州諸山又授以小鐶神劍曰非遇人主勿輕言捷詣闕求見不得乃謀以罪名自達至信州佯狂大呼遂坐配𨽻嶺南未久逃至京師閣門祗候謝德權知其有術即為奏請釋軍籍劉承圭聞其異為改名中正得對龍圖閣具陳靈異特授許州參軍留止皇城舍時出遊市嘗有道人與之偶語云即向來授法司命真君也承圭為創新堂駐之景德四年五月降于堂之紗幬中戴冠佩劍服皆青色凡有瑞異必先告中正傳達其言既降延恩殿前八日上夢景德中所覩神人傳玉皇之命是夕五鼓殿廷先聞異香少頃黃光自東南來燈燭失光俄見靈仙儀仗皆冇光明天尊至冠服一如元始天尊之像旁有六人秉圭仙衣上再拜于階下俄有黃霧起須臾霧散天尊與六人皆坐上升西階仙童捧湯飲一器器類碧玉湯甘白如乳天尊曰吾人皇中九人之一也是汝趙之始祖再降乃軒轅黃帝凡世所知少典之子非也母感赤電夢天人生于壽丘後唐時七月一日下降生趙氏之族今已百年皇帝善撫育蒼生無怠前志即離坐乘雲而去及曉以語宰相等仍召至殿上觀降臨之所先東封畢加封司命天尊及此降延恩殿恭上九天司命保生天尊號曰聖祖上靈髙道九天司命保生天尊大帝聖祖名玄朗詔中外毋斥犯遂以聖祖降臨之地建新宫名曰景靈宫琢玉石為聖祖像初聖祖述感電降生之地改兖州曲阜縣為仙源壽丘建道宫以景靈為名命宰相王曽紀述其事云云與下條誤合為一條且多闕略不若此書原本為詳明足據也聖祖以大中祥符五年十月戊午降于禁中延恩殿前八日辛亥上夢景德中所覩神人傳玉皇之命即命內侍于延恩殿大設道場是夕五鼓一籌殿庭先聞異香少頃黃光自東南至燈燭失光俄見靈仙儀仗執香爐扇拂華奩之類皆有光明天尊至冠服一如元始天尊之像旁有六人四人秉圭仙衣二人通天冠絳紗袍案李燾長編云又六人皆秉圭四人仙衣二人通天冠絳紗袍與此小異上再拜于階下俄有黃霧起須臾霧散天尊與六人皆就坐侍從在東階上升西階再拜又欲拜六人天尊令揖不拜命設榻召上坐仙童奉湯飲一器器類碧玉湯甘白如乳天尊曰吾人皇中九人之一也是汝趙之始祖再降乃軒轅黃帝凡世所知少典之子非也母感赤電夢天人生于壽丘後唐時七月一日下降總治下方主趙氏之族今已百年皇帝善撫育蒼生無怠前志即離坐乘雲而去及曉以語宰相等仍召至殿上觀降臨之所十月二十五日大赦天下門下衆妙之宗藴道樞而斯祕非常之應稽天眷以有孚事敻絶于前聞理克彰于合契洪惟偉兆實煥祥經朕猥以眇沖嗣承基業荷九清之眷命遵二聖之詒謀不敢怠遑粗臻嘉靖頃以上真告貺祕檢垂文祗膺元命之符申錫無疆之祚間嵗之內盛典交修秩衆祀以咸禋感靈心之允答彌懷惕厲愈務欽崇而穹昊顧懷不忘于涼德神祗鑒燭薦發于休祥粵以冬初警于宵寐戒先期而誕告約真馭以下臨宿設靈壇仰祈鴻應果于榖旦肅奉睟儀仙霧鬱蔥異香芬郁衆真列侍寶訓躬聞示基緒長發之祥見希夷交感之盛久留扄禁倏返虛無惟瑞異之親逢曠古今而罕記載循寡昧奚以奉承蓋祖宗在天永錫爾類而雷雨作解恩及于民用均純嘏之休普浹龐鴻之慶可大赦天下於戲至神善應既本于無方王澤誕敷俾周于有截匪獨在豫之慶式均與物之春內省匪躬荷茲殊貺彌增抑畏罔敢遑寧更賴文武藎臣中外列辟共欽元誥各勵乃誠叶宣永圖同砥于道閏十月癸巳案李燾長編載閏十月己巳上天尊號乙亥上聖祖母懿號是月乙丑朔則己巳係五日乙亥十一日也此云癸巳乃二十九日又併二事為一事與長編異恭上九天司命保生天尊號曰聖祖上靈高道九天司命保生天尊大帝又上聖祖母號曰元天大聖后車駕詣宫酌獻聖祖母玉册文維天禧元年嵗次丁巳三月庚子朔六日乙巳嗣皇帝臣德昌再拜稽首上言曰恭以大道無形為一氣之祖至神育粹居二儀之先洪惟靈懿無方柔明有赫總妙本而貴始啓真緒以肇基顧以沖人嗣守鴻業夙持勵翼思致治平乃者穹昊監觀祕符申錫祐綿長之祚勗清淨之風瑞命殊尤景貺紛屬繇是勒封嶽岱展事汾脽既明察以交修復祺祥而荐至仙馭告期于中禁睟儀來自于太霄法從儼其音容諄誨受于清密諭感祥于大電聆育聖于髙丘厚德孚先濬源長發猥紹貽謀之慶敢忘克荷之艱享是休嘉永懷欽奉仰惟祖德之盛爰上丕稱而母儀之尊未崇顯號斯所以順稽巨禮式耀徽章允罄精衷肅伸昭報謹奉玉册玉寶恭上徽號曰聖祖母元天大聖后恭惟誕膺茂典丕赫殊徴垂祐後昆永錫繁祉謹言聖祖名原注上玄下朗詔中外不得斥犯遂改玄武玄冥玄枵之類並為真字玄聖文宣王為至聖七年詔曰恭以感電發祥合符御極鴻靈纍洽盛德無疆猥以眇姿獲承大統躬聞寶訓逖示遐源間覽庶僚每形奏牘或傍稽于文史必上詣于名稱雖歸美之可嘉誠瀆尊之是懼自今內外文字並不得指斥黃帝名字祥符五年十二月遂以聖祖降臨之地建宫崇奉命修玉清昭應宫使丁謂擇地及令禮官考制度以聞司天少監王希元上言謹按天文志太微宫南有天廟星乃帝王祖廟也宜就大內之丙地營建于是得錫慶院吉壤即命丁謂與內侍鄧守恩等修建初八年正月丁酉聖祖述感電降生之地即以其年閏十月改兗州曲阜縣為仙源縣壽丘建道觀奉聖祖以景靈為名建道觀奉聖祖母以太極為名九年四月宫成凡一千三百二十二區觀北即壽丘東南有小丘改名慶丘以石增纍壽丘設天尊像慶丘設壽星像上命宰相王曽紀述其事為書二十卷賜名曰聖祖皇帝天源録藏于天下名山福地大中祥符八年正月丁酉始興太極觀工作七月丙辰詔曰朕恭延飇馭逖悟璿源載懷尊祖之心用建列真之宇顧惟宗姓實兆靈仙遂命樞密使王欽若討閲道藏得趙氏神仙事迹四十八件宜令修宫使分畫廊廡庶昭懿範永耀遐宗五月宫成凡七百二十六區正殿曰天興琢玉石為聖像仍刻真宗聖容立侍國初有神降于盩厔縣民張守真家自言天之尊神號黑殺大將軍玉帝之輔帝命乘龍降世衛護宋朝但非棲真之士無以奉吾教守真有異骨吾故降之每守真齋戒祈請神必降之則室中冷風肅然聲如嬰兒獨守真能曉之具道其意所言禍福皆驗守真遂度為道士即所居創北帝宫神為守真傳結壇之法曰結壇有九上三壇則為國家設之其上曰順天興國壇凡星位三千六百為普天大醮旌旗鑑劍弓矢法物羅列次序開建門戶具有儀範其中曰延祚保生壇凡星位二千四百為周天大醮法物儀範降上壇一等案上三壇中壇各載壇名星位醮名而下壇不載係原本脫略無别本可校姑仍其舊倘非禱祀不及備此三壇亦當精潔辭章鮮異花果扣鼓集神懇禱而告去地九尺焚香以奏亦可感應也中三壇則為臣僚設之其上曰黃籙延壽壇凡星位六百四十其中曰黃籙臻慶壇凡星位四百九十其下曰黃籙去邪壇凡星位三百六十此三壇所用法物儀範各有差降下三壇則為士庶設之其上曰續命壇凡星位二百四十其中曰集福壇凡星位一百二十其下曰郤災壇凡星位八十一所用儀範量有等差此九壇之外别有應物壇或六十四位或四十九位或二十四位法物所須各以差降士民之類可量力而為之如臣庶上為帝王祈祐當作祈榖福時壇凡一千二百位或為父母師尊禳災祈福當為醮設壇隨宜增益也守真拜而受之自爾多有徴驗不能備記乾德中太宗皇帝方在晉邸頗聞靈應乃遣近侍齎信幣香燭就宫致醮使者齋戒焚香告曰晉王久欽靈異敬備俸緍增修殿宇仍表乞敕賜宫名真君曰吾將來運值太平君宋朝第二主修上清太平宫建千二百座堂殿儼三界中星辰自有時日不可容易而言但為吾啓大王言此宫觀上天已定增建年月也今猶未可使者歸以聞太宗驚異而止太祖皇帝素聞之未甚信異召小黃門長嘯于側謂守真曰神人之言若此乎守真曰陛下倘謂臣妖言乞賜案驗戮臣于市勿以斯言褻瀆上聖須臾真君降言曰安得使小兒呼嘯以鄙吾言斯為不可汝但説與官家言天上宫闕已成玉鎖開晉王有仁心翌日太祖升遐太宗嗣位尋召守真作延祚保生壇醮罷真君降言于內臣王繼恩曰吾有言汝當為吾奏之曰建隆元年奉帝言乘龍下降衛人君掃除妖孽猶間事縱橫整頓立乾坤國祚已興長安泰兆民樂業保天真八方效貢來稽首萬靈震伏自稱臣親王祝壽焚香禱遞相虔潔向君親吾有捷疾一百萬諸位靈官萬垓人若行忠孝吾加福若行悖逆必誅身賞罰行之既平等天無紛穢地無塵愛民治國勝前代萬年基業永長新繼恩録之以聞太宗覽之驚異稽首謝曰家國之幸宗廟之慶虔荷上聖賜此格言尋遣內供奉官王守節起居舍人王龜從就終南山下築宫方卜地于終南鎮真君忽降言于龜從曰此地乃修建上帝宫闕之地不可易也于是乃定凡二年宫成宫中有通明殿玉皇三十二天帝大遊小遊五福四太乙紫微帝君并二十八宿七元殿黑殺殿并靈官童子六丁神嵗星辰星又有天蓬九曜東斗三官玄武十二元辰西斗天曹殿南斗閣靈官堂龍堂命常參官一人主宫事選道士焚修軍士百人守衛題曰上清太平宫一如真君豫言之制命常參官一人監宫擇道士焚修每嵗三元及誕節皇帝本命日並遣中使致醮祀神之夕上望拜焉嵗或水旱或國家將舉事率致禱焉初宫成真君忽降言謂王龜從等曰汝奉詔修宫勤則至矣然何為不開日月華門不畫八小殿壁階墀甓甃亦未嚴備惟求速成以冀恩寵然上天亦不掩爾功亦不赦汝罪守節龜從頗切驚懼然已奏訖役不及增惟稽首祈謝而去至闕皆獲增秩賜白金千兩既而守節染疾而亡龜從殁于兵刃太平興國初太宗皇帝親征太原真君忽降言于守真曰官家已臨汾晉非久克復城池汝當令監宫內臣等設醮以謝勝捷于上帝守真等曰國家大事乞俟捷音真君曰上天已定勝負也踰旬而王師告捷監宫等以聞帝遣內臣盧文壽齎內庫香藥御書詞章詣宫陳醮以謝是夕真君降言曰官家設此大醮上帝與諸天皆喜國祚延逺過于有唐六年守真以乾明節詣闕朝賀召見因面奏曰聖真下降俯為昌朝乞降詔加號以答靈貺上允其奏尋下詔曰太平宫神受命上穹降靈下土苾芬致薦肸蠁有徵大庇斯民屢垂丕貺宜加美號以答神休其封神為翊聖將軍詔至宫守真焚香以告真君忽降言曰汝當上問官家所言翊聖者翊何聖守真數日疑懼不敢答復降言曰汝但馳奏官家不罪汝守真遂具章以聞太宗覽之召近臣謂之曰玉帝輔臣所翊者上帝也當以此意報守真令啓白也既而內臣傳命到宫守真詣殿焚香以告真君曰此意是也七年守真復詣闕朝賀真君忽降言曰吾有言汝當聞于官家曰大道興隂謀滅諸天聖衆皆欣悅宋朝社稷甚延長太平景運初興發君上端心顯明哲愛民治國常須切萬年基業永長新金枝玉葉無休歇守真得之以聞詔賜紫衣號崇元大師至道初忽降言謂守真曰吾建隆之初奉上帝命下降衛護宋朝社稷今基業已成社稷方永承平之世將繼有明君吾已有期却歸上天汝等不復聞吾言矣倘國家祈禱但嚴潔焚香北面告吾雖不降言當授福衛護宗社大中祥符七年詔曰誕敷寶命仰荷于至神昭報殊徴虔增于懿號蓋為邦之大典庇民之深旨也而況翊宣元化表式衆靈司隂騭于含生播明威于福地當王基肇啓固降治而已彰洎文考纘承復先期而斯應繇是亟營珍館備薦徽章蒙介福于無垠佐鴻圖于纍盛顧惟眇質紹撫綿區屬典禮之交修實祺祥之沓委緬懷幽贊敢怠欽崇是用益以丕稱奉之茂則式達至精之懇庶申祗答之文期克萃于寅恭永保寧于品彚爰頒成命俯告宰司深體豫懷共宣其事翊聖將軍宜加聖號曰翊聖保德真君守真又嘗啓真君曰道釋儒典並垂于世未審崇奉何者即得獲其福真君曰太上道德經大無不包小無不納修身鍊行治家治國世人若悟其旨歸達其妙用造次于是信奉而行豈惟增福諒無所不至矣釋氏之四十二章經制心治性去貪逺禍垂慈訓戒證以善惡亦一貫于道矣奉之求福固亦無涯至于周公孔子皆列仙品而五經六籍治世之法治民之術盡在此矣世雖諷讀多不依從若口誦而心隨心隨而事應仁義信行禮智之道常存于懷豈惟正其人事長生久視之道亦何逺矣守真又嘗啓告曰華山陳摶近卒時人謂之尸解未審其人修何功行證仙階乎真君曰摶之鍊氣養神頗得其要然及物之功未至但有所主掌耳端拱中知鳳翔府髙凝祐嘗詣宫致禮即去真君忽降言于監宫李鑄曰髙凝祐行虧忠信死非久矣秩滿還京為三司判官數月而卒自真君臨降官市民庶不逺千里祈禱乞聞誨言大抵多隨其性習加以訓勗人臣依于忠人子依于孝清淳者示之格言貪酷者警以要道詞甚平易頗叶音韻開寶中侍御史路沖乞賜真語真君曰盡力事君以為忠臣濁財勿顧邪事莫聞整雪刑獄救療人民動合王道終為吉人積愆為咎必有沈淪衆生本無形之性配有形之軀曠劫以來不能自悟自有無極世界不夜之鄉混合太虛杳冥同理又曰六合乾坤內衆生多不會造孽向前行如盲驀江海如將智慧觀自越千里海沖再拜録而誦之左補闕王龜從焚香懇禱曰如何修身得獲遐壽真君曰勸汝修鍊莫如精勤精勤不怠上聖皆聞太平降世用武興文無文則不正用文則益君食祿則不違王命行吉善但守清貧清貧者響合天地濁富者像火投冰投冰者火緣漸滅積惡者自貫其身自貫者殃及七祖地府下痛害及親吾懸千尺之索提釣有緣之人道之尊德之貴大道能生一切物衆生頭像天足像地中心空然合真理鑿戶牖以為室房室之中有一物亦無影亦無形杳杳冥冥人不識若能識者得長生陽在天隂在地二氣同和誠有謂空中造化乃自然自然之中生萬類天不髙地不卑大道混合虛無理學道衆生審欲聞此是修行崇妙門丞相沈倫嘗連綿臥疾遣使致告曰如何修行得免兹患真君曰靈物不病形軀自安形軀有病返照而看倫驚喜曰吾得之矣後數日疾遂愈王德淵因遊終南山寓止其宫中勤奉香火好養生而性褊多所恚怒忽一日真君降言謂之曰汝學道修真先當調習其性以順天和忘諸有為勿耗心識融怡凝湛道乃可見復見之日莫管內莫管外來往真靈無罣礙所居安樂是汝家各自勤行莫相待先達之人難滯礙真空妙藥有天堂與聖相同滅諸罪德淵曰上感真君降言教示不曉前篇內與聖相同滅諸罪願垂誨諭真君曰汝若除煩入靜鍊心修真積纍其功數盈之後泥丸百節之神靈通而自同于聖天堂妙藥無所不至豈更有諸罪也故言與聖相同滅諸罪太平興國中駕部員外郎李鑄嘗知鳳翔府備觀靈應俄復奉詔監宫凡十餘年志頗嚴潔真君前後降語僅十餘篇其有録者數首一曰建隆之初方稟希夷上帝命吾衆聖皆知乘龍下降列宿相隨五嶽受命主張地祗潛扶社稷密佐明時吾要李鑄知吾降期不得輕泄免漏天機又曰與吾盡忠理國與吾以道理民與吾慈善理家與吾不飲自醉醒時理民醉時理神此語是延年益壽之法吾勸府主記取又曰為官求理在貞明智慧俱通臨事清觀天行道合隂德食君爵祿常若驚為吾洗心復換骨背凡入聖奔長生天宫快樂勝凡世不夜之鄉挂一名又曰府主纍世為人降生中國與吾清直莫行邪曲與吾積善纍功與吾佐輔明主與吾洗雪黎民與吾挂心刑獄上帝若知名天官也剋取捨住世輸流之財但修取有形之像獲隨身之功德無量之福與吾不得因循不奈時光迅速靈官賞汝功勳天曹與汝添福若一一依吾聖言必得延年益壽又曰年登七十餘住世不久居饒君壽百嵗問汝得幾秋地府直須怕冥司難請求有功無驚懼積罪必遭誅子孫難替代早覺莫癡愚淳化中西京留守中書令趙普嘗遣使備禮致醮虔祈願聞休咎真君降言曰趙普扶持社稷甚有功勳上天所知賜汝福壽以大妨小幽府亦有寃對當啓誦真經告祈天地首懺前非吾亦與汝達于上帝庶解兹咎汝官職壽數已有限矣其使録之而去普跪讀感涕因焚詞謝過遣人詣宫設醮殿中丞張卓嘗乞聖言真君曰大道養汝性隂陽生汝身為吾勤行道為吾勤修真公廉當用意憂恤在乎民遇時佐明主清濁上帝聞濁富終不久清貧為天人莫教人道富從他人笑貧自有真家福清髙不愧貧又曰形凡性不凡為國顯清亷家積千餘口有罪自家擔真君又嘗戒宫吏等曰每存忠信齊其天文武班行自有賢為主萬年安基業常憂黎庶恐飢寒長行德行合其道燒香虔祝告虛玄但願國安君長久齊心輔佐太平年凡真君所降語帝命宰相王欽若編次之為三卷藏于祕閣仍賜本宫真宗咸平間知揚州魏羽上雩祀五龍祈雨法詔頒諸路其法以甲乙日擇東地作壇取土造青龍土器之大小龍之修短餘方皆如之凡旱建壇取五行生成之數焉長吏齋三日詣龍所汲流水設香茗果率官屬日再至祝酹不用樂巫覡雨足送龍水中擇潭洞或湫濼林木深邃之所以庚辛壬癸日先齋戒以酒脯告社令築方壇三級髙一尺闊一丈三尺壇外二十步界以白繩壇上植竹杖張畫龍其圖以縑素畫黑魚左顧環以天黿十星中為白雲龍黑色其下畫水波有龜亦左顧吐黑氣如線和金銀朱丹飾龍形又設皂幡刎鵝頸取血致盤中楊枝灑水龍上羣官再至祝酹雨足取龍投水中神宗建中太一宫衣冠之制熙寧五年建中太一宫內侍主塑像乃請下禮院議中太一衣冠禮院乃具狀請如東西二宫之制太一盡服通天絳紗有言亳州太清宫有太一塑像上遣中使視之乃盡服王者衣冠遂詔如亳州之制延祥觀紹興十四年建以奉四聖真君初靖康末上自康邸北使將就馬小婢招兒見四金甲人各執弓劍以衛上指示衆皆云不見憲仁后聞之曰我事四聖香火甚謹必其隂助及陷北庭每夕夜深必四十拜及曹勛南歸后令奏上宜加崇奉以答景貺云觀今在西湖上極壯麗其像以沈香斫之修繕之費皆出慈寧宫有司不預太宗曰古者一夫耕三人食尚有受其餒者今殆二十人矣東南之俗連村跨邑去為僧者蓋慵稼穡而避徭役耳泉州奏未剃僧尼繫籍者四千餘人其已剃者數萬人尤可驚駭案此條見江少虡事實類苑採録補入太平興國中始置譯經院于太平興國寺延梵僧翻譯新經始以光祿卿湯公悅案李燾長編太平興國七年建譯經院詔天竺國僧天息災等各譯一經以獻以光祿卿湯悅兵部員外郎張洎潤色之湯悅原本誤作陽悅今改正兵部員外郎張公洎潤色之後趙文定楊文公朝文元李尚書維皆為譯經潤文官天禧中宰相丁晉公始為使天聖三年又以宰相王冀公為使自後元宰繼領之然降麻不入銜又以參政樞密為潤文其事寖重每嵗誕節必進新經前兩月二府皆集以觀翻譯謂之開堂前一月譯經使潤文官又集以進新經謂之閉堂慶厯三年吕許公罷相以司徒為譯經潤文使明年致仕章郇公代之自後乃降麻入銜國家兩京諸州僧尼共六萬七千四百三人嵗度千人自後削平諸國其籍彌廣祖宗憫五代之亂民墜塗炭常布恩旨錫福天下太平興國七年九月詔曰朕方隆教法用福邦家念天下之度人拘有司之制度俾申素願式表殊恩應內外繫籍童行長髮並特與剃度景德三年詔曰老氏立言實宗于衆妙能仁垂教蓋誘夫羣迷用廣化樞式資善利兩京諸州道釋嵗度十人者特放一人不取經業祥符二年正月以封禪行慶詔天下宫觀寺院內十人度一人不滿十人者亦度一人三年天慶節兩京諸路宫觀每十人度一人不及十人者亦如之天禧三年八月詔普度天下道士女冠僧尼凡度二十六萬二千九百四十八人天禧末天下僧三十九萬七千六百一十五人尼六萬一千二百三十九人案錦繡萬花谷引此書云天禧三年普度僧道凡六十六萬二千四百九十人與此數不符又考文昌雜録元豐間祠部嵗比天下僧尼道士凡二十四萬然死者亦常萬人據此書所載真宗天禧時僧尼已至四十五萬八千八百餘人道士更不在此數況至神宗元豐時耶龐元英殆據當時案牘之文未足信也天聖三年判都省馬亮上言天下僧以數十萬計間或為盜而民頗患之請除每嵗合度人外非時更不度人仍自今無得收曽犯刑及文身者詔並從之禮部勘當今欲將本部例册內僧尼等師號頒降諸路州軍等處照會委所屬官司許于數內選擇書填者奉聖旨依下項僧師號法乘法真法照慧滿慧空慧海真悟真懿真戒妙空文慧普明慈懿慈濟真教明普宣祕慧照禪鑒淨因淨慧淨嚴淨悟普證圓證證悟慈覺慧覺密印崇辨通照尼師號妙清妙明妙滿妙果了慧了因了行了緣了真真懿真行真淨真戒真範慈懿慈娪慈悟慈願慈滿慈範慈因慧秀淨信圓照妙因崇智真寂勝因靖智登寂妙智真果寶勝道士師號真觀沖真沖清沖隱道清道空道安道成虛希虛安虛逺虛妙虛辨虛一虛濟虛應沖寂元觀元正明一明素靈一明微洞元淵宗沖素沖寂崇道演道明素靈寶虛寂保寧洞淵女冠師號真寂真靜真懿真妙守一守白守真安素安教安常希妙希密希真虛範凝範棲雲棲月靈素靈懿沖秀沖和通妙澄妙淵智淵妙通微希無真淨宣淨宗微澄秀宣真沖懿凝真元素沖真靈寂宋朝事實卷七
