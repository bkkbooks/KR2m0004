body:
  text: 宋朝事實卷六宋李攸撰廟制元符三年詔曰藝祖順天應人肇造區夏太宗受命繼代砥定寰宇真宗以聖繼聖撫盈成之運奉太平之業登岱告成文物典章于斯大備昔在神祖並稱千百世不祧之廟恭惟仁宗皇帝躬天地之度以仁治天下在位四十二年利澤之施丕冒山海早定大䇿授英宗以神器之重措宗廟于泰山之安功隆德厚孰可擬議英宗皇帝享國日淺未究施設奄棄萬國神宗皇帝以不世出之資慨然大有為于天下興學校隆經術勸農桑寬徭役禁暴以武理財以義凡政令法度有未當于理不便于時者莫不革而新之功業盛大何可勝紀羣臣引舊典數上徽號然自謙挹終抑而不居規模宏逺凜凜乎三代之風矣而廟祏之制殊未議所以尊崇之典闕孰甚焉朕夙興夜寢所不敢忘也宜令禮官稽參商周兩漢故事考定仁祖神宗廟制詳議以聞十一月權太常寺奏少卿盛次仲等言恭惟仁宗皇帝承文明武定章聖之後民庶物阜咸砥安樂于是純以仁德在宥天下明慎庶獄哀矜無辜側席盡芻蕘之言臨軒空巖穴之士約侈玩之好絶盤遊之娛恭儉之意無非為民夏羌猖狂欵塞則聽之儂賊背誕越疆則舍之舞干兩階卒自請吏百越之長南夷之蠻聞至仁而來歸者梯航相屬日月所照霜露所墜凡在覆幬無不丕冒草木之微昆蟲之細凡在生育無不咸若肆享國四十二年至今田童野叟有聞遺老之言述當時之事者猶春風時雨沐浴膏澤咸有生意而遺澤猶在也至于蚤定大䇿授英廟以神器之重子孫相承克享天心此又為宗社計立萬世之基也天祚有德是生神考以卓然天縱之德輔以緝熙光明之學慨然逺覽三墳五典之所載其詳既不可復見然猶得于伏羲神農黃帝堯舜之心者乎窮則變變則通通則久故變而通之以盡利鼓之舞之以盡神尊經造士而舉世知道德之意弛力便民而終嵗無煩擾之勞理財以義水旱有時而糴不加貴禁暴以武兵革以時而民不加賦循名責實而政事舉信賞必罰而勸沮行下至百工技巧咸有品式本末具舉小大畢張勵精垂御十有九年典章文物炳然與三代同風規模宏逺迄今四方向風蠻夷率服法令具而民不犯器械精而兵不試惟見農安于野男耕而女桑商賈于塗貫朽而粟腐內外晏如萬世永賴斯詒燕之效也譬如日月往來四時迭運人見其嵗功自成物物咸遂不知帝王造化之所在故曰惟天為大民無能名焉惟我神考實體之矣謹按禮記王制尚書咸有一德春秋榖梁傳荀卿之書皆言天子七廟則有天下事七世親盡則毁古今之通制也至于有功德者宗無常數故商有三宗周有二祧其來尚矣漢羣臣雜議論者不一惟大儒劉歆學術該洽謂宗無常數所以勸帝者之功德議者善之于是以髙祖為太祖孝文為文太宗孝武為武世宗司徒掾班彪世推儒宗亦以歆之議為得及光武立廟睢陽奉祀不改與天無極案此下似有闕文于是三省表請付外施行有詔恭依治平熙寧僖祖順祖祧遷議治平四年十月二十四日太常禮院奏僖祖文獻睿和皇帝文懿皇后神主祧藏于西夾室今具合行典禮如右臣等謹按禮記檀弓曰舍故而諱新注謂髙祖之父當遷者也唐㑹要永徽二年左僕射于志寧言依禮舍故而諱新故謂親盡之祖今𢎞農府君神主上遷請依禮不諱從之又元和十五年太常禮院言睿宗神主祧遷其忌日准禮合廢從之今僖祖皇帝神主祧遷伏請准禮不諱其忌日亦請依禮不諱詔恭依熙寧五年進呈兩制議僖祖廟事惟韓維異議神宗曰昨日韓維上來說廟事引文武之功起于后稷以謂因其起于后稷故推以配天王安石曰經稱文武之功非稱后稷之功稱尊祖非稱尊有功言后稷非文武之功不能有天下不能有天下則不得行祭天之禮文武非后稷焉出故行祭天之禮則以后稷配天乃所謂尊祖也上曰韓維又引王不待大以為亦待小國而王安石曰孟子自論湯文王不待大國然後有天下何關尊祖事且夏禹郊鯀禹非因鯀受封然後有天下前代固有不待有國而王天下者禹是也故揚雄以為禹以舜作土上曰鯀治水或有封國亦不可知安石曰若據書傳所載封于有夏氏曰有姒者禹也無預鯀事上曰尊祖不計有功此理無疑安石曰韓維言夾室在右自為尊位此尤無理今若子孫據正堂使祖父在偏房乃以偏房為尊位豈為不悖又言遇禘祫即令僖祖東嚮如此即是以遷祖東嚮古無此理上問配天如何安石曰以禹郊鯀言之即是當郊僖祖推太祖孝心豈以郊僖祖為憾上令禮院集議馮京進呈議僖祖事安石曰此事欲決自聖裁如韓維議西夾室在堂之右似亦無嫌譬之人家若兒婦在正堂祖父居兩偏房乃謂兩偏房為尊計韓維家必不如此安排如何令宗廟乃如此韓維又言遇禘祫即僖祖東嚮既合東嚮如何郤毁其廟遷其主所議止此兩事分明不可行上曰韓維已屈服只是疑郊配合如何安石曰前代郊配亦不一如商則祖契而宗湯周則祖文王而宗武王然以理言之若尊僖祖為始祖即推以配天于禮為允先王之制禮事亡如事存事死如事生故推僖祖以配天必當祖宗神靈之意上曰宗祀明堂如何安石曰以古禮言之太祖當宗祀今太祖與太宗共一世若迭配亦于明堂事體為允上曰今明堂配先帝安石曰此乃是誤引嚴父之說故以考配孝經所謂嚴父者以文王為周公之父周公能述父事成父業得四海歡心各以職來助明堂宗祀得嚴父之道故也若言宗祀則自前代已有此禮上曰周公宗祀乃在成王之世成王以文王為祖即明非以考配明堂也安石曰韓維本欲御史諫官禮官集議朝廷既不從乃獨議如此初欲别為僖祖立廟兩制笑其議改為今議上曰韓維是要求衆人為助然且令禮官議無妨看他别有何說後數日進呈孫固等議僖祖事上疑配天事安石曰萬物本乎天人本乎祖故王者配天以祖以祖非以功若以有功即鯀以無功殛死豈得謂之有功然夏后郊鯀即非有功可知也上疑禹因鯀之功安石曰鯀逆洪水禹順而道之是革也非因也上又疑僖祖非始祖安石曰僖祖非始祖誠是也僖祖與稷契事即不盡同即郊與不郊裁之聖心無所不可緣無害逆順之理故也若藏其主于夾室下附子孫即逆尊卑之序不可不改也上以為然乃下固議令太常禮官併郊配議奏上因言姜嫄廟欲為僖祖立别廟安石曰為祖立别廟自古無此理韓維初議如此為人所笑故改議姜嫄所以有别廟者嫄禖人也以先妣故盛其禮歌舞皆序于先祖之上不然即周不為嚳廟而為嫄廟無說也進呈僖祖奏議上曰但議宗廟事即士大夫紛紛蓋士大夫以禮文為己任故也馮京曰士大夫皆以太祖不得東嚮為恨安石曰野人曰父母何擇焉都邑之士則知尊祖矣陛下奉宗廟當擇學士大夫之髦俊與之供祭祀蓋詩人稱文王奉璋峩峩髦士攸宜為此故也然則議宗廟事要合于士大夫髦俊之心豈可以合野人為當上又曰本不合議配天議者何以及此安石曰亦須議了然本朝配天之禮亦皆不合于禮經但此事未害逆順大倫有所未暇釐正上曰今如何議安石曰宣祖見配感生帝欲改以僖祖配上曰好安石曰此事須中書門下議定乃降敕施行馮京又言禮官以祧為疑安石曰此但改正僖祖順祖合祧于禮亦無可嫌上曰莫是為忌諱無妨是年十月太常禮院言奉聖㫖詳定僖祖神主祧遷者竊以聖王用禮固有因循逆順之大倫非敢違天而變古請奉僖祖為太廟始祖遷順祖神主藏之夾室依禮不諱孟夏祀感生帝以僖祖配詔恭依先是中書言萬物本乎祖故先王廟祀之制有疏而無絶有逺而無遺商周之王斷自稷契以下者非絶嚳以上遺之以其自有本統承之故也若無尊卑之位先後之序則子孫雖齊聖有功不得以加其祖考天下萬世之通道也本朝自僖祖以上世次不可得而知則僖祖有廟與稷契宜無以異今毁其廟而藏其主于夾室替祖宗之尊而下附于子孫殆非所以順祖宗孝心事亡如事存之義求之前載雖或有之考合于經乃無成憲因情制禮實在聖時乞以所奏使下兩制詳議而擇取其當詔答曰廟祧之序蓋有典彞所以上承先王下法後世朕嗣大統獲奉宗祀而世次遷毁禮或未安討論經常屬我哲輔于以佐朕不逮而仰稱祖宗追孝之心朕覽之矍然敢不祗服宜依所請八年五月禮院言今年四月太廟禘祭排列神位以僖祖居東嚮之位自順祖而下昭穆各以南北為序自後如遇禘祫著為定禮詔恭依司馬光議英宗祔廟僖祖神主當遷夾室准朝㫖令待制以上同議臣光于嘉祐八年仁宗祔廟之時已曽與龍圖閣直學士盧士宗上言僖宗當遷夾室當時議臣不以為然朝廷遂從衆議臣謹按王制稱天子七廟三昭三穆與太祖之廟而七明太祖之外止有三昭三穆而已是以前代帝王于太祖未正東嚮之時大率所祀不過六世若僖祖于今日方議祧遷則是太祖之外更有四昭三穆與太祖之廟而八不合先王典禮難以施于後世臣愚以謂仁宗祔廟之時僖祖已當遷于夾室今英宗祔廟順祖亦合遷于夾室伏乞更賜詳擇知諫院范鎮議英宗即位祔仁宗主而遷僖祖及神宗即位復還僖祖而遷順祖鎮言太祖起宋州有天下與漢髙祖同僖祖不當復還乞下百官議不報及哲宗即位鎮又言乞遷僖祖正太祖東嚮之位崇寧二年九月詔朕寅奉宗祧丕式古訓廟室之制厥有常典於惟哲宗實繼神考傳序正統十有六年升祔之初朕方恭默乃增一室于七世之外遂成四穆于三昭之間考禮與書曽靡有合比閲近疏特詔從臣并與禮官博盡衆見列奏來上援據甚明謂本朝自僖祖至仁宗始備七世當英宗祔廟神考聖學髙明以義斷恩上祧順祖暨神考祔廟又祧翼祖則哲宗祔廟父子相承當為一世祧遷之序典禮可稽覽之惕然敢不敬聽其合行事件令禮部太常寺詳議聞奏又詔有天下者事七世古之道也惟我治朝祖功宗德聖賢之君六七作休烈之盛軼乎古先尊為不祧者至于五宗遷毁之禮近及祖考永惟景祐欽崇之詔已行而不敢渝暨我元符尊奉之文又隆而不可殺博考諸儒之說詳求列辟之宜顧守經無以見其全而適時當必通其變爰稽衆議肇作彞倫推恩以稱情而為宜則禮以義起而無愧是用酌鄭氏四親之論取王肅九廟之規參合二家之言著為一代之典自我作古垂之將來庶安宗廟之靈以永邦家之福布告中外咸使聞知太廟七室議嘉祐八年八月乙酉以修太廟成命參知政事歐陽修告七室初廟室前楹狹隘每禘祫陳序昭穆南北不對左右祭器填委嘉祐親祫築土階張幄帟乃可行禮至是宗正丞趙觀因修廟室增廣檐陛如親祫時詔從其請凡增廣二丈七尺丙戌太廟神主復歸于七室初太常禮院奏當以太祖太宗為一世神主祔廟則增一室詔兩制及待制以上與禮官議觀文殿學士孫抃等議謹按禮曰三昭三穆與太祖之廟而七書曰七世之廟可以觀德七世與昭穆云者據父子而言也若兄弟則昭穆同不得以世數數之矣商之祖丁之子曰陽甲曰盤庚曰小辛曰小乙四人皆有天下而商之廟有始祖有太祖太宗有中宗若以一君為世則小乙之祭不及其太祖祖丁案小乙之祭不及其太祖祖丁句宋史禮志作不及其父蓋小乙為祖丁之子特以兄弟世次相及遂云為其太祖于稱名不順故宋史易之是古之兄弟相及昭穆同而不以世數數之明矣故晉之廟十一室而六世唐之廟十一室而九世中宗睿宗之于髙宗敬宗文宗武宗之于穆宗案唐敬宗文宗武宗皆穆宗之子敬宗原本作恭宗以避翼祖諱宋史因之不改今從唐書改正同居穆位國朝太祖為受命之祖太宗為有功德之宗此萬世不遷者也故太祖之室太宗稱孝弟真宗稱孝子大行皇帝稱孝孫而禘祫圖太祖太宗同居昭位南嚮真宗居穆位北嚮蓋先朝稽用古禮而著之于祀典矣大行皇帝神主祔廟伏請增一室為八室以備天子之事七世之禮詔從之于是龍圖閣直學士兼侍讀盧士宗天章閣待制兼侍講司馬光議曰臣等謹按禮天子七廟三昭三穆與太祖之廟而七太祖之廟萬世不毁其餘昭穆親盡則毁示有終也自漢以來天子或起于布衣以受命之初太祖尚三昭三穆之初次故或祀四世或祀六世其太祖以上之主雖屬尊于太祖親盡則遷故漢元帝之世太上廟主瘞于寢園魏明帝之世處士廟主遷于園邑晉武帝祔廟遷征西府君惠帝祔廟又遷豫章府君自是以下大抵過六世則遷其神主蓋以太祖未正東嚮故止三昭三穆已正東嚮之位則并三昭三穆為七世矣唐髙祖初立祀四世太宗增祀六世及太宗祔廟則遷𢎞農府君神主于夾室髙宗祔廟又遷宣帝神主于夾室皆祀六世此前代之成法也惟明皇立九室祀八世事不經見難可依據今若以太祖太宗為一世則大行皇帝祔廟之日僖祖親盡當遷于西夾室祀三昭三穆于先王典禮及近世之制無不符合太廟更不須添展一室又詔抃等議議曰先王之禮自祖以下隆殺以兩故有天下者事七世有一國者事五世自漢以來諸儒傳禮者始有夏五廟商六廟之說其說出于不見商書伊尹之言而承用禮學之誤蓋自唐至周廟制不同而大抵皆七王制所謂三昭三穆與太祖廟而七者是也今議者疑僖祖既非太祖又在三昭三穆之外以為于禮當遷如此則是天子之尊而所事止于六世不稱先王制禮隆殺以兩之意且議者言僖祖當遷者以為在三昭三穆之外則于三代之禮未嘗有如此而不遷者臣等以為三代之禮亦未嘗有所立之廟出太祖之上者也後世之變既與三代不同則廟制亦不得不變而從時且自周以上所謂太祖亦非始受命之王特始封之君而已今僖祖雖非始封之君要為立廟之始祖方廟數未過七世之時遂毁其廟遷其主考三代之禮亦未嘗有如此者也漢魏及唐一時之議恐未合先王制禮之意臣等竊以為存僖祖之室以備七世之數合于經傳七世之明文而亦不失先王之禮意詔又從之太廟㦸門太常禮院言天子宗廟皆有常制今太廟之南門立㦸即廟正門也又有外牆櫺星門即漢時所謂壖垣乃廟之外門也昨新建面西牆門原在通衢以止車馬之過廟者其臣僚下馬宜勿禁從之初知宗正丞趙恭和言今廟壖短而去民居近非所以嚴宗廟請别為復牆以甓纍之故又設面西之門然而非制也滁州并州澶州三宗神御殿仁宗謂輔臣曰朕覽自古帝王凡起義及立功之地皆崇建浮圖以旌示後人如唐太宗之詔是也恭惟太祖擒皇甫暉于滁州是受命之端也太宗取劉繼元于并州是太平之統也真宗歸契丹于澶州是偃武之信也功業若此而神御缺然是朕不能顯揚祖宗之盛美也今于三州因其舊寺建殿以奉安神御滁州曰端命并州曰統平澶州曰信武神御告遷上親奠辭及太宗神御至并州是嵗四月二十二日也上謂輔臣曰朕閲平晉記所載太平興國四年親征至太原城下亦此日也事之相去七十有五年案宋史滁并澶三州神御殿建在神宗皇祐五年自太平興國四年至是年凡七十五年原本誤作十有五年今改正而日月符合如此何其異也宰相龎籍等曰陛下孝德感通故符合如此請付其事史館列聖神御殿咸平初真宗始令供奉僧元藹寫太宗聖容于啓聖後院玉清昭應宫笵金以肖祖宗像餘多塑像其殿名在京奉先禪院曰慶基者奉宣祖在太平興國寺曰開先者奉太祖案宋史開先作開元與此互異在玉清昭應宫曰二聖者奉太祖太宗在啓聖院曰永隆者奉太宗在玉清昭應宫曰安聖在景靈宫曰奉真在慈孝寺曰崇真在萬夀觀曰延聖在崇先觀曰永崇者並奉真宗在景靈宫曰孝嚴者奉仁宗曰英德者奉英宗而外郡在揚州建隆寺曰章武在西京應天院曰興先在滁州曰端命者並奉太祖在西京應天院曰常華在太原府曰統平者並奉太宗在西京應天院曰昭孝在澶州曰信武在華隂雲臺觀曰集真者並奉真宗又鳳翔太平宫有祖宗神御殿南京鴻慶宫有三聖神御殿西京永安縣㑹聖宫有五聖神御殿今京師定力院有太祖御容諸后影殿在京奉先禪院曰重徽者奉明德太后章穆皇后在慈孝寺曰章德者奉章獻太后在景靈宫曰廣孝者奉章懿太后在萬壽觀曰廣愛者奉章惠太后又曰神御殿古原廟也以奉安先朝之御容宣祖昭憲皇后于資福寺慶基殿太祖神御之殿七太平興國寺開先殿景靈宫應天禪院西院南京鴻慶宫永安縣㑹聖宫揚州建隆寺章武殿滁州大慶寺端命殿太宗神御之殿七啓聖禪院壽寧堂景福殿鳳翔上清太平宫并州崇聖寺統平殿及西院鴻慶宫㑹聖宫真宗神御之殿十有四景靈宫奉真殿玉清昭應宫安聖殿洪福院壽寧堂福聖殿崇先觀永崇殿萬壽觀延聖殿澶州信武殿西京崇福宫保祥殿華州雲臺觀集真殿及西院鴻慶宫㑹聖宫鳳翔太平宫仁宗英宗神宗哲宗四朝神御于景靈宫廣孝殿應天院章獻明肅皇后于慈孝寺章德殿章懿皇后于景靈宫廣孝殿明德章穆二后于普安院重徽殿章惠太后于萬壽觀廣慶殿紹興十五年秋復營建神御殿于崇政殿之東朔望節序帝后生辰皇帝皆親酌獻行香用家人禮其殿名徽宗曰承元欽宗曰端慶髙宗曰皇德孝宗曰系隆光宗曰美明寧宗曰垂光理宗曰章熙度宗曰昭光案此條末有光寧理度四朝神御殿名與宋史禮志略同當是後人增入非李攸原本廣親宅神御殿嘉祐三年罷修睦親宅祖宗神御殿初翰林學士歐陽修言神御非人臣私家之禮若援廣親宅例當得興置則是沿襲非禮之事詔送兩制臺諫禮官詳定上言漢韋𤣥成奏議春秋之義父不祭于支庶之宅君不祭于臣僕之家王不祭于諸侯其後遂罷郡國廟今睦親宅所建神御殿不合典禮悉宜罷時上以廣親宅置已久不欲毁之案此下似有闕文范鎮乞罷修并州神御殿鎮言竊聞并州素無火災自建神御殿未幾而輒火災天意若告陛下祖宗御容非郡國所宜奉安近日又聞下并州復加崇建是徒事土木以重困民力非以答天意也自太宗皇帝下并州距今七十七年故城父老不入新城陛下宜寬其賦輸緩其徭役以除其患使河東之民不忘太宗皇帝之德則陛下孝思豈特建一神御殿之比哉伏惟上觀天意下顧人心特賜停罷臣不勝區區之愚景靈西宫記臣謹按景靈宫實始大中祥符以奉祠聖祖逮天聖初乃易其旁之萬壽殿以為真宗館御之所治平建仁宗之殿曰孝嚴熙寧建英宗之殿曰英德而宣祖藝祖太宗之殿曰慶基曰開先曰永隆母后之殿曰隆福重徽章德廣孝皆舊寓于佛老之祠布在都邑與夫郊野之外嵗時奠謁或不克躬行而清蹕所臨動涉塗巷百工執事疲于奔走陟降跛倚而不恭殆非所以致齊莊之誠廣孝欽之本也神宗天錫聖智超然逺覽功成治定之際乃詔有司度宫之東西建六殿為原廟奉祖宗之靈設以昭穆之次列于左右又為别殿五于其北以奉母后其經營締構規畫程度靡不素定按圖即工成不期月觀者駭異以謂非造化融結孰能若是之壯麗神速也又以宣祖潛真隱耀實基王迹厯數所鍾自我流澤故名其殿曰天元藝祖膺命造邦撥亂反正兵不再試五服來享故曰皇武太宗親執晉俘混一區夏覆載之內莫不嚮方故曰大定真宗登封告成文物鼎盛珍符上瑞應圖合牒故曰熙文仁宗德教善政康濟天下涵養覆露四十二年納斯民于仁壽之域故曰美成英宗誕膺景命以紹文祖天人和同逺邇綏靖故曰治隆案龐元英文昌雜録云景靈宫神御殿成榜名皆上親製宣祖曰天元后殿白太始太祖曰皇武后殿曰儷極太宗曰大定后殿曰輝極真宗曰熙文后殿曰衍慶仁宗曰美成后殿曰繼仁是記于五后殿名皆未之及事辭稱情名實無爽雲漢昭晰揭諸門閎四方搢紳傳誦于今不絶今皇帝踐阼之七月哲宗復土泰陵議廣原廟于顯承殿之左一日顧謂輔臣曰神考盛德大業越冠古今而原廟之制實始元豐惟顯承僻處一隅日迫廛市無以稱崇報之重宜改營新宫于馳道之西奉神考為館御之首詔示萬世尊異之意羣臣踊躍附合為一退而表請其事詔曰恭依曲士腐儒有以為不當遷者皇帝持其說益堅卒破浮議計不中郤無有內外若臣若子皆延頸企踵知皇帝之繼志述事如是其篤且至也恭惟神宗皇帝聖神文武有不世出之資仁孝勤儉著無能名之德內無聲色便嬖之惑外無游宴玩好之纍正心修身以先天下而奮然大有為于世引見多士無間疏逺日昃不倦省閲幾務無憚寒暑夜分不寐孜孜焉以招徠俊乂綜核名實詢求民瘼修飭治具故興學校擇師儒建三舍崇經術以養人材發倉廩時賑貸募皂隸絶繇役以寬民力修水土之政以敦本業而盡地利嚴保伍之法以察姦宄而寓軍令宗子疏屬裁祿秩之濫而誘掖以宫學禁衛冗兵考尺籍之實而銷併其名額重祿責吏以杜苞苴請託之私限員入流以懲胥徒仕進之濫理財賦以待邦國之用修武衛以固封疆之守凡可舉之事世以為難濟而不敢建者必為可革之弊衆之所甚願而不能改者必革有勞者必賞有罪者必罰號令風采凜然更新方是時士以緣飾表彰盜名吏以便文茍偷玩令積習既久寖以成風在廷之臣議論蜂起挾衆尚異更訕迭毁而不能惑乘機伺隙危言巧中而不能搖固守而力行之沛然若决江河莫之能禦焦勞惻怛夙夜以之一時同事之人聚精㑹神叶謀并力以趨上之所嚮而上之所措縱橫泛應雖匠石之斫輪庖丁之解牛不足以喻事為之制曲為之防典章區式纎悉備具乃至尚方武庫之兵犀利堅徑期門羽林之士簡鍊精鋭皆昔者之所未有外則郡縣五溪授以冠帶開拓洮隴建之旌節嶺梅絶域重譯請吏天地順紀風雨以時年榖屢登閭里安悅英聲茂實充塞宇宙非至神大智誰能與于此乎中更元祐之變政之已改者人必病之已廢者人必思之然後益知其所設為良法善政雖偏言橫議亦莫之能易也今皇帝睿哲溫恭躬有聖質上帝眷顧駿命所集孝悌慈仁聞于海內逺識獨見明並日月沈幾剛斷堅若金石固足以紹庭緒業克成厥功然猶兢兢業業恭慎約戒毁臺榭卻珠珍罷土木不急之役而必以繕治太室建原廟為先既崇飭太宫以為斯宫之首遂奉宗祏上配烈祖世世獻享不遷不毁以為郊祀社稷並列無窮致孝寧神之道可謂盡矣蓋西宫之地東與故宫相直其棟宇之制供張之具一視故宫無有損益大明之南有門曰燕昌北有殿曰欽儀實母后之所御也西則為寶慶殿以奉哲宗而南有門曰世德東則有皇帝齊袚之館門曰昭德殿曰潔誠庖廚次舍各以其序凡為屋六百四十區經始于元符三年十月之甲子案東都事略及宋史建景靈西宫在元符三年八月據此在十月與各書互異功不罙嵗役不告勞行者不聞斧斤之聲居者不見追胥之擾而崇墉廣厦屹然特起于端門百步之外象魏之下俯視二宫樓觀崢嶸髙切辰極金碧焜耀上薄光景都人士女與夫要荒廣莫之來庭者肩摩足接卻立跂望排衆爭前以快先覩歡欣歎悅洋溢道路非皇帝睿哲至誠出于天性而不怵于卑近之說又何以臻此哉周之文武世有明德以儀刑于天下成王率時昭考以緝熙于純嘏故鳧鷖之詩言太平之君子能持盈守成神祇祖考安樂之也其詩之始曰福祿來成終曰無有後艱皇帝嗣宅神器祗率天下不愆不忘乃作斯宫以顯異先烈是似是續以追配乎前人方之成王何慊之有宰臣姓名謹記案此所云宰臣姓名未著何人據宋史元符三年十月韓忠彥為尚書左僕射兼門下侍郎曽布為尚書右僕射兼中書侍郎又考陳振孫書録解題云曽紆字公衮布之子建中靖國中布在相位奉詔撰景靈西宫碑紆之筆也復廢后制景祐二年廢皇后郭氏薨詔復后號制曰生而有貴秩于朝殁則申恤典于第矧蚤嬪于天極而奄謝于人寰不舉徽章曷旌遺躅故金庭教主沖靜元師郭氏鍾層沙之慶分寶婺之輝動鑒圖史之規居服組紃之事自玉衣叶兆金屋承榮夙施輔佐之勤益懋間和之則而乃遺情物表探味淵宗獨抗出塵之心遂厭塗椒之地靈期遽迫朝露易晞良增悼往之懷載厚飾終之典嗚呼柔儀永隔內範如存躡三景之蹤倐同于萬化應四星之象復正于尊名芳魂有知歆我渥命可特追册為皇后停諡册祔廟之禮其鹵簿儀物皆用孝章皇后故事溫成后祔廟議原注石揚休上言封香書名事附溫成皇后神主祔新廟皆以兩制攝獻官端明殿學士楊察攝太尉殿中侍御史趙抃監察吳充監禮上又遣內臣臨視祭事內出圭瓚以灌鬯充言于察曰禮上親享太廟則用圭瓚若有司攝事則用璋瓚今使有司祭溫成廟而用圭瓚是薄于太廟而厚于姬妾也其于聖德虧損不細請奏易之察有難色曰日已暮矣明日行事言之何及而內臣視祭者已聞之密以上聞詔即改用璋瓚案宋史吳充傳云張貴妃薨治喪越式判式王洙命吏以印紙行文書不令同僚知充移開封治吏罪忤執政意出知髙郵軍不載請奏易圭瓚事此書足補其闕天章閣待制何郯奏曰臣伏見故貴妃張氏自始沒贈后仍于墳所置廟不稱制度人言紛紜譏議至今不已稽其本末其有由然夫國有嬪妃蓋是常制必有賢德乃可備位蓋聞張氏之存也諫官王贄倡始建議䇿進加位因結託以固恩寵廟室之設並行定數前代之建别廟皆是不經張氏之殁也禮官王洙専用失禮講成廟議不守舊章敗亂典法二人者不正之心深可誅也況聞始謀葬之時禮臣按故事上議惟當于葬所置祠室本無立廟之說而王洙不顧歸過于上與當時執政合力務為將迎寖長其事以成黷禮之失春秋載隱公考仲子之宫初獻六羽蓋仲子非嫡而立廟獻舞故聖人譏之張氏亦非嫡又母后在宫而追冊后號仍建廟焉是尤不可也若遂而不改其招萬世之議固無窮矣今欲正其失莫若改廟名為祠室嵗時祀享不差祠官但委中官或內人掌之如此則其事初為姦臣所誤而改之則過在下而不纍聖德矣臣近纍為祠官親見禮物黷亂所不忍視故敢上縷陳述伏望聖慈下有司速更之則足以追贖前失上頗重其言雖不盡行然頗損其儀舊制每有祠祭封香稱臣書名至是祀溫成廟內出封香亦稱臣書名知制誥石揚休上言曰溫成本陛下妃妾不當稱臣此乃太廟之制有司不以時聞致有此失上曰朕見諸廟封香一例進來所以各為書名以表事宗廟之恭豈可溫成之廟亦稱臣蓋失在有司非卿言朕無由知即命改正案宋史溫成皇后祔廟時吳充知太常禮院石揚休以刑部員外郎知制誥同判太常寺各詳見本傳此書但云吳充監禮知制誥石揚休不著太常官守似失之踈略宋朝事實卷六
