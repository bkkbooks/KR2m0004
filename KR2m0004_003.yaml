body:
  text: 宋朝事實卷三宋李攸撰詔書太宗嘗為手詔戒陳王元僖等案詔稱即位十三年是為端拱元年考元僖以是年三月進封許王此詔尚稱陳王則當在是年二月以前也曰朕周顯德中年十六時江淮未賓從昭武皇帝南征戰軍屯揚泰等州數與交戰朕雖年少擐甲胄習弓馬屢與賊軍交鋒應弦而踣者甚衆行伍皆見太祖駐兵六合得知其事拊髀大喜十八從周世宗及太祖下瓦橋關瀛莫等州亦在行陳洎太祖即位親討李筠李重進朕留守帝京鎮撫都城上下如一其年蒙委兵權嵗餘授開封尹歷十六七年民間稼穡君子小人真偽無不更諳即位以來十三年矣朕持儉素外絶遊田之樂內鄙聲色之娛真實之言固無虛飾汝等生于富貴長自深宫民庶艱難人之善惡必是未曉略説其本豈盡豫懷夫帝子親王先須克己勵精聽卑納誨每著一衣則憫蠶婦每餐一食則念耕夫至于聽斷之間勿先恣其喜怒朕每親臨庶政豈敢憚于焦勞禮接羣臣無非求于啓沃汝等勿鄙人短勿恃己長乃可永守富貴以保終吉先賢有言曰逆吾者是吾師順吾者是吾賊不可不察也真宗初為開封尹既入對上諭以理民之道曰夫政教之設在乎得人心而不擾欲得人心莫若示之以誠信欲不擾莫若鎮之以清淨先聖有言曰撫我則后虐我則讎無越于此茍撫養得宜雖虎狼亦當馴擾況于民乎文王語太子發曰吾所以得民心者蓋童羊不殺童牛不使以是仁愛四海歸心祚延八百他日復對宰相語其事吕蒙正曰晉漢之世君臣疑間封疆狹隘民苦殘暴史𢎞肇輩非理殺戮都市之內橫尸流血當時議者曰如是為國其能久乎果運祚短促姦臣窺伺清淨為理誠如聖旨仁宗景祐元年四月案宋史仁宗本紀作五月丁卯此作四月與史互異詔曰織文之奢不鬻于國市纂組之作實害于女工朕稽若令猷務先儉化深維抑末緬冀還淳然猶杼軸之家相矜于靡麗衣服之制弗戒于紛華浮費居多踰侈斯甚宜懲俗尚用謹邦彝內自掖庭外及宗戚當奉循于明令無因習于偷風其錦背繡背及遍地密花透背段子並宜禁斷西川嵗織上供者亦罷之上嘗謂近臣曰聖人治世有一物不得其所若已推而置諸死地羽蟲不傷則鳳凰來毛獸不傷則麒麟出比聞臣僚士庶人家多以鹿胎製造冠子及有命婦亦戴鹿胎冠子入內者以致諸處採捕殺害生牲宜嚴行禁絶乃下詔曰冠冕有制蓋戒于侈心麛卵無傷用蕃于庶類惟兹麀鹿伏在中林宜安濯濯之遊勿失呦呦之樂而習俗所貴獵捕居多既澆民風且暴天物特申明詔仍立嚴科絶其尚異之求一此好生之德宜令刑部遍牒施行應臣僚士庶之家不得戴鹿胎冠子今後諸色人不得採殺鹿胎並製鹿胎冠子如有違犯許人陳告犯人嚴行斷遣告事人如告獲捕鹿胎人賞錢二十貫告戴鹿胎冠子並製造人賞錢五十貫以犯人家財充自是鹿胎無用而採捕者亦絶政和三年七月二十一日奉御筆禮以辨上下定民志自秦漢以來禮壞不制富人牆壁被文繡倡優僭后飾當時士之賢者至于太息時君世主亦莫能興卑得以踰尊賤得以陵貴欲安上治民難矣比裒集三代鼎彞簠簋盤匜爵豆之類凡五百餘載之于圖考其制作而所尚之象與今薦天地饗宗廟之器無一有合去古既逺禮失其傳夫祭以類而求之其失若此則豈能有格乎已詔有司悉從改造若宫室車服冠冕之度昏冠喪葬之節多寡之數等殺之别雖嘗考定未能如古秦漢之弊未革也夫道之以德齊之以禮有恥且格今無禮以齊之而刑施焉朕甚憫之可于編類御筆所置禮制局討論古今沿革具畫來上朕將親覽參酌其宜蔽自朕志期在必行革千古之陋以成一代之典庶幾先王垂法後世宣和二年六月十七日奉御筆手詔國家承祖宗積纍之休民物阜安之久禮樂明備法具令完是宜嘉與四海之人同臻逸樂而邇嵗僥幸浮偽者衆爵祿冗濫政令猥并竭天下賦入之常殆不能給當寧慨念宵旰不忘屬考先王立政立事之經紹元豐詒謀之重至于踰其名分冒濫過甚者稍加裁定所以抑僥幸澄浮偽垂裕無窮蓋非五季鐫削之計而懷姦之士尚敢造言惑衆唱為裁損之説規欲動搖夫以三省樞密院之近綱紀所自出而額外吏職踰先帝官制者幾四百員冒帶階官自朝奉大夫至中奉大夫者五十人保引入省院者至千有餘員神霄一司無所責任而置吏踰四百五十人國用之匱顧有自矣雖欲不汰可乎咨爾臣子其體兹意自今有敢妄議朝政鼓惑衆聼意在朋比為姦及奉承詔令觀望稽滯違戾者有官職人並以編置餘杖脊流配仰御史臺彈奏開封府察治仍出榜朝堂故兹親加詔諭師聽無渝詔三省依元豐成憲宣和七年四月二十七日御筆手詔神考若稽古制正名百官以貽休于萬世眷言三省稽決政事維持紀綱之地凡命令之出所以審議行者必由此焉是以有詔曰中書揆而議之門下審而覆之尚書承而行之有不當者自可論奏事無巨細遍經三省無出一已使擅其權屬政和而建議者遂以尚書令僕之名易之公相凡三省之務悉總治之後復以公相廳為都廳而領三省則初未之革使神考垂裕不刋之典奪于權臣自營之私良用憮然朕嗣守丕業率循舊章夙夜于兹大懼弗克祗紹常謂坐而論道于燕間者三公之事作而相與推行者宰輔丞弼之職今居三公論道之位而總理三省衆務使宰輔丞弼殆成備員殊失所以紹述憲章之意可于尚書省復置尚書令虛而不除三公止係階官更不總領三省若曰佐王論道經緯國事則三公其任焉三省並依元豐成憲毋復侵紊敢輒議者以大不恭論若昔大猷是正邦典朕庶幾無愧于前人播告中外咸知朕意聖學太宗篤好儒學嘗覽前代修文殿御覽藝文類聚門目繁雜失其倫次乃詔翰林學士李昉扈蒙知制誥李穆右拾遺宋白等參詳類次分定門目編為太平總類一千卷俄改為太平御覽録案宋史及各家書目皆作太平御覽此多一録字與各書異又謂稗官之説或有可採令取野史傳記故事小説編為五百卷賜名太平廣記太宗嘗謂侍臣曰朕萬幾之暇不廢觀書見前代帝王行事多矣茍自不能有所剸裁全倚于人則未知措身之所因言宋文帝恭儉而元凶悖逆及隋楊素邪佞唐許敬宗諂諛之事侍臣聳聽蘇易簡曰披覽舊史安危治亂盡在聖懷社稷無窮之福也上覽兵法隂符經歎曰此詭詐奇巧不足以訓善姦雄之志也至論道德經則曰朕每讀至兵者不祥之器聖人不得已而用之未嘗不三復以為規戒王者雖以武功克敵終須以文德致治朕每日退朝不廢觀書意欲酌先王成敗而行之以盡損益也上讀老子語侍臣曰伯陽五千言讀之甚有益治身治國並在其內至云善者吾亦善之不善者吾則不善之此言善惡無不包容治身治國者其術如是若每事不能容納則何以治天下哉太平興國八年上顧宋琪李昉等曰朕因思閭里間每日焚香祝天子萬嵗次大臣眉夀朕與卿等焉得不日思善事以副億兆人之禱宋琪曰臣等蒙陛下不次擢用又承戒諭豈敢為不善之事以負宸恩惟思公勤庶補萬一咸再拜謝太平興國九年太宗謂宰相曰朕每日所為自有常節晨間視事既罷便即觀書深夜就寢五鼓而起盛暑盡日亦未嘗寢乃至飲食亦不過度行之已久甚覺得力凡人食飽無不昏濁儻四肢無所運用便就枕血脈凝滯諸病自生欲求清爽其可得乎老子曰我命在我不在于天全繫人之調適卿等亦當留意無自輕于攝養也真宗即位每旦御前殿中書樞密院三司開封府審刑院及請對官以次奏事辰後入宫尚食少時出坐後殿閲武事至日中罷夜則傳侍讀侍講學士詢問政事或至夜分還宫其後以為常龍圖閣直學士陳彭年因次輪對儒術汙隆君臣難易之要上曰朕每念太祖太宗丕變衰俗崇尚斯文垂世教人實有深意朕謹遵聖訓紹繼前烈庶警學者人君之所難由乎聽受人臣之所不易在于忠直其或君以寬大接下臣以誠明奉上君臣之心皆歸于正上下之際靡失厥中直道而行至公而遇此天下之達理先王之治猶指諸掌孰曰難哉因作二論示之上謂近臣曰朕聽政之外未嘗虛度時日探測簡編素所耽玩古聖賢奧旨有未曉處不克廢忘昨置侍讀侍講學士自今令祕閣官每夕具名聞奏朕欲召見得以訪問其後每當直或召對多至二三鼓方退上嘗謂王旦等曰經史之文有國家之龜鑑保邦治民之要盡在是矣然三代之後典章文物制度聲名參古今而適時用莫若史漢學者不可不盡心焉旦曰孔子于周衰歷聘諸國退而刪詩書定禮樂以五常之道垂萬世法後之王者雖上聖必師範之古人云生民以來未有如夫子者蓋以此也如云志在春秋者誠欲以褒貶筆削為終古誅賞之法使亂臣賊子觀而知懼兹立教之深旨為國家之大要自司馬遷為一家之書蓋知春秋凡例不可繼故曰紀曰書曰世家曰列傳懲勸之微旨在焉班固而下不得其意但詞采而已上曰夫子之道不可斯須而舍迂儒或言堯舜之時無夫子亦治此淺識之甚殊不知夫子之道堯舜之道也故曰祖述堯舜憲章文武又曰惟天為大惟堯則之其惟尊堯而宗舜所謂夫子之道與堯舜無異也上嘗謂近臣曰古人多言禱神可以延福未必如此能行好事神必福之如禮記世子篇注云文王以憂勤損夀武王以快樂延年其聖經之旨必不如此蓋注皆不思之甚也文王焦思勞神以憂天下豈得減夀夏禹焦勞有錫圭之瑞而享國永年大約帝王能憂人之憂不自暇逸豈無感應鄭康成注此頗不近理安足為之鑒戒朕嘗與邢昺論之昺無以對右正言知制誥朱巽專對言朝廷命令不可屢有更改自應陳述利害改張法制者望先委有司詳議其經久可行者行之不可行者止之庶幾張綱紀以絶紛爭上顧宰臣曰此甚識體且事之可否報政之地所宜盡言無隱惟貴君臣道合若上下同心何憂不治今四方無虞賴卿等慎守經制若一事遽行則攀援重臣詞説競起處置頗難是知今所施行不可不慎至若言事利病輕為釐革初則皆以為當後則翻成有害及復正其事乃是朝令夕改此事允當執守書云慎乃出令令出惟行此之謂也上又曰涖官之人不可太寬致成弛慢亦不可過求人之罪務于煩擾王旦曰古人有言法出而弊作令下而姦生寬則民慢陷法者多亟則民無所措手足正為此焉上深然之治平元年祖無擇知制誥獻皇極針詔奬之治平三年二月辛丑命龍圖閣直學士兼侍講司馬光編集歷代君臣事迹于是光奏曰臣自少來略涉羣史竊見紀傳之體文字煩多雖以衡門専學之士往往讀之不能周浹況于帝王日有萬幾必欲遍知前世得失為未易竊不自揆常欲上自戰國下訖五代正史之外旁採他書凡關國家之興衰繫生民之休戚善可為法惡可為戒王者所宜知略依左氏春秋傳體為編年一書名曰通志其餘浮冗之文悉刪去不載庶幾聽覽不勞而聞見甚博私家區區力不能辦徒有其志久而無成嚮曽以戰國時八卷上進幸蒙賜覽今所奉詔旨未審令臣續成此書或别有編集若續此書欲乞一以通志為名其書上下貫穿千有餘載固非愚臣所能獨修伏見韶州翁源縣令劉恕案宋史劉恕傳恕為巨鹿主簿和川令光薦修通鑑召為局僚不言為翁源令也此與宋史互異將作監主簿趙君錫案宋史司馬光趙君錫傳均不載薦修通鑑事本傳亦不載其為將作監主簿此可補宋史之闕皆有史學為衆所推欲望差此二人與臣同修庶早成書詔從之而令接所進書八卷編集俟書成取旨賜名其後君錫父喪不赴命太常博士國子監直講劉攽代之元豐七年十二月戊辰端明殿學士司馬光上資治通鑑五代紀三十卷自治平三年置局案宋史英宗治平三年置局在祕閣每修一代史畢上之至是書成總二百九十四卷目録考異各三十卷上諭輔臣曰前代未嘗有此書過荀悅漢紀逺矣輔臣請觀之遂命付三省仍令速進入以光為資政殿學士降詔奬諭范祖禹曰神宗皇帝即位之初多與講讀之臣論政事于邇英君臣傾盡無有所隱而帝天資好學自強不息禁中觀書或至夜分其勵精勤政前世帝王未有也自熙寧至元豐之末間日御經筵風雨不易蓋一遵祖宗成憲以為後世子孫法也可不念哉御製太宗皇帝御製太師魏國公尚書令真定王神道碑案宋史趙普薨贈尚書令追封真定王太宗撰神道碑親御八分書以賜之蓋即此篇但僅見録于杜大圭名臣碑傅琬琰集而殘闕不全僅存十之三四此書所載篇幅既完且其事迹年月多與東都事略及宋史趙普本傳相異司唐堯在位聖賢謂之叶符虞舜得人天地以之開泰八方理定千載會昌必旌柱石之材以觀其壯節鹽梅之寄以濟其和平是故應運握圖明王聖帝受天寶命開國承家無不用忠確間世之臣光輔基業股肱心膂之士共同甘辛萬代通規一時遭遇保全令德克荷洪勳者其故真定王普之謂矣王姓趙氏字則平其先顓頊之裔佐禹平水土是謂柏翳帝堯賜姓曰嬴氏造父其後也有功于周穆王受封于趙周德下衰叔帶去周適晉六卿取晉遂開國焉今為常山人也案宋史趙普傳本幽州薊人父回徙常山又徙河南洛陽王蘊人倫之風槩稟山嶽之儀型晦而不彰寬而無撓竭其誠志有始有終無善不藏非義勿取頃自我太祖從周世宗南平淮甸水陸兼行龍虎震威號令始發捷如影響冥契神人是時擒其偽將皇甫暉于滁上王時為郡之參佐斷事明敏獄無寃者太祖聞名召見與語深器之案宋史太祖拔滁州普為軍事判官宣祖卧疾滁州普朝夕奉藥餌宣祖待以宗分太祖與語奇之與碑稍異洎後太祖仗鉞左馮因辟為同州節度推官歷華臺許田濉陽三鎮從事案宋史太祖移鎮宋州表為掌書記不載其為華臺許田濉陽三州從事與碑稍異其在幕府也恭敬畏慎盡竭赤誠夜思晝行勿矜勿伐可謂龍吟虎嘯雲起風從如懷萬頃之陂遭遇承平之會太祖光宅天下龍躍商丘知有佐時之才早定君臣之契擢為諫議大夫樞密學士仍頒金紫以榮之是嵗上黨帥李筠叛太祖將議親征委之留守調發軍實王以為聖上躬擐甲胄臣子宜效驅馳乃陳懇上言乞扈從鑾輅洎中途進策案宋史西京留守向拱來朝獻策急攻而不載普中途進策云云據此可與宋史互參曰陛下初登寶位應天順人將制驍雄光耀神武兵機貴速不尚迂遲若倍道兼行掩其倉卒所謂自天而下不戰而成擒也太祖深納其言舉兵速進未詣長平李筠果擁衆出戰于時靈旗指寇勇士齊心叛帥自焚餘黨就戮旋又維揚帥李重進包藏禍心阻抗王命太祖便殿召對問攻取之策王籌其繕修孤壘倚恃長淮而士卒離心資糧乏絶以順討逆動必成功太祖深然之乃親御六師長驅淮楚不踰數月果爾蕩平駕回酬其功賞階授金紫加太保充樞密使案宋史建隆元年平李重進建隆三年普始拜樞密使撿校太保據此則當在元年平李重進之後與宋史互異當以碑文為據仍賜功臣之號爰自纍代以來朝廷多故諸侯専制兵甲亂常加以僭偽未平案名臣碑傳琬琰集載此碑自首至加以僭偽未平句止以下皆闕師旅未備餘風未殄思有以革之王以庶務草創深惟逺圖利害靡不言纎微靡不達忠盡其力言無轉規啓心不疑振舉風俗故得遐邇悅服政令惟新皆其功也乾德中拜門下侍郎同中書門下平章事因之大用出于流品矣我太祖觀其才智凡事責成既升近密之權可觀立功之效英聲為之間出文物為之復興戮力同心如石投水固已蕭張讓行姚宋推功魚水之歡未足為比惟誠惟信少是少非揚歷艱難上副弼諧之任明哲兼濟聿臻命世之才忠順其言純誠克著恢張出之于人表翊戴以助于康平徇公滅私不忘片善用心合道逆邪求知開寶六年太祖以王始佐創業克志升平伐罪弔民開擴疆土下西蜀平南越擒吳會來北戎威德綏懷無逺不至雲龍際會大通合符十有餘年矣知無不為甚煩神用務均勞逸以優藎臣尋授太傅佩相印持節河陽洎朕嗣守丕圖勤修庶政腹心之寄中外攸同特授太嶽宫使相如故乃眷并汾民墜塗炭戎車一駕逆壘宵降既靜妖氛爰覃爵賞改太子太保增加井賦北連朔嶠東盡海嵎禹穴唐郊盡為王土朕嘗念往年之舊德褒賞輔弼之殊勳帷幄之謀明于果斷思置之左右前後任以耳目股肱粵自藩垣入居廊廟久竭弼諧之道更資調燮之能遂徵授守司徒兼侍中昭文館大學士三階已正百度惟貞憂國忘家直亮在意常誡諸弟諸子以為受寵逾分富貴逼身一領名藩再登上相以身許國私家之後吾弗預焉嘗念頃自宥密升于宰輔出入三十餘年未嘗為親屬而求恩澤爾等各宜砥礪無尚吾過故自始至末親黨無居清顯者昔春秋美晉大夫羊舌肸謀而鮮過惠訓不倦王復有焉八年以襄鄧之俗獄訟攸煩惠彼疲民寄之元老下車布政鄉閭阜安事有未便于民者削而去之利于民者舉而行之豪猾畏威鰥寡懷惠暨改轅襄漢民之去思如失父母時也得病于南陽經年未差就移漢水重鎮便藩案宋史太平興國八年出為武勝軍節度雍熙三年春大軍出討幽薊久未班師普手疏諫引姚元崇十事雍熙四年始移鎮山南東道節度今據碑文則移鎮在三年以前當以碑為據常思報主之誠每懷憂國之忠乃心王室時有針規上表引唐姚元崇十事陳古今治亂之由極人臣獻納之意興懷慷慨詞甚激切揣摩時事居安慮危此又其忠藎也朕以歷代藉田其禮久廢勸農務本其可忽諸乃命有司舉行舊典改元布慶帝載惟熙造膝沃心惠我耆德而王久違宸扆思拜闕庭既纍進于直言宜載踐于寢廟復授太保兼侍中昭文館大學士案宋史雍熙四年下詔親耕藉田普表求入覲明年端拱元年正月藉田禮畢拜太保兼侍中不載其兼昭文館大學士此可補宋史之闕居雲霄之上位擢列辟之崇資燭幽明而無怠無荒報恩榮而可大可久刑政之務知無不為功績播于謀猷羣庶謂之明哲獻替之職理事皆通不憚劬勞夙夜匪解可以傳聞清世書于簡編而連嵗之間風疾頻發願避賢者之路乞歸間散之官朕以勳舊之臣方深倚注命駕臨問涕泣興言齒髮雖衰痾瘵未退荷天之寵力所不任特授太保兼中書令洛陽留守又經嵗疾勢轉深上表堅乞退避以禳災眚勉強誨諭志不可奪乃册拜守太師進封魏國公就便頤養太醫中使不絶于路顒望有瘳别加殊渥豈期美疢王遽彌留以淳化三年七月十四日薨于洛陽之私第案普以淳化三年春致仕七月薨原本誤作二年今據宋史改正享年七十有一朕覽表驚嗟悲慟纍日不待巫祝桃茢親臨其喪賻服舉哀輟視朝五日遣右諫議大夫范杲持節䇿贈尚書令追封真定王特賜諡曰忠獻弔祭賵贈之數並給加等以盡君臣之禮焉四年二月命有司備鹵簿葬于洛陽北邙之原而合祔焉案宋史本傳葬日有司設鹵簿鼓吹如式不詳其年月此云二月則當在四年原本誤作二年今改正嗚呼梁木斯壞哲人云萎若濟巨川豫將安寄王性本俊邁幼不好學及至晚嵗酷愛讀書經史百家常存几案強記默識經目諳心碩學老儒宛有不及既博達于今古尤雅善于談諧馬伏波詞辨分明杜征南手不釋卷見事而敏抱器自然壯志無窮日新其德許國常存于懷抱令譽以至于名彰其為子也孝養于親動不違禮友愛于昆弟嚴慈于子孫其仕于公也奢儉酌中貞忠許國名器能守謙卑益光茂德崇勳輝映朝列寵遇之盛古今罕聞自再入廟堂時陳規諫負荷重寄常懷啓沃之心竭輸忠忱以待公家之事有萬石君之周慎孔光之謹命管葛之智略房杜之經綸舉而兼之斯謂全德朕于早嵗嘗與周旋而節操有恆始終無玷荷台鉉之任處輔弼之司既集大勳荐膺典册紀其功烈宜在旗常昔唐虞之得皋夔夏商之任虺益有周以閎散佐佑炎漢以蕭曹弼諧用能寅亮帝謨緝熙庶績儔庸比德今其勝哉天不憗遺豫何自律乃迹其景行勒之鼎彞昭臣範于將來庶令名之不朽銘曰應運開國股肱任賢委以心腹操執彌堅實猶令德王猷周旋裨贊明聖厥位名傳信任得人方言柱礎魚水同心君臣盛美夜寐夙興有終有始進思盡忠見義從矣退思補過器識安間攀龍附鳳備歷艱難縱橫志大接對溫顔官崇薦陟善惡之間近密公朝與奪非類稟性懷柔區别利害踐揚貴職綽有奇才經綸宏異學識通該赫赫皇猷恭恭近侍任以機權寵彰名器啓沃王命業茂勳崇南征北伐平蕩姦雄日侍冕旒情偽明察假仗天威好生惡殺若聞喧駭事不忸怩堪為國重制斷臨時性直如繩酌中如砥孝悌于家簡編信史惟公之德間代英靈非義不理庶務乃馨積善夤緣敦厚必顯文教潛敷聲聞自逺殊勳表信追思念功素推臣節澤被無窮奇士挺生民安俗阜允洽克從禮讓規矩悲風颯颯夜杳冥冥咨嗟永隔精魄長扃喪此貞純曷終暮景魂影已沈去路斯永廟堂師傅丘壠幽泉勒銘翠琰不勝澘然西京崇福宫記原注真宗章獻神宗欽慈神御嵩高之奠洛邑望之巍然峻極于天號稱中嶽夏之興也祝融降焉自三代以來罔不祀事深林巨谷陽舒陰慘有木有草食者不昧變化不測厥惟福壤昔我章聖齊明寅畏格于上下文思武定以底丕平大中祥符間天下無事祠祀天地山川舉典則以治神人顧山川之神足以紀綱天下者非致隆備物以昭崇極則不足以稱由是册尊嵩嶽曰中天崇聖帝嵩旁觀曰太一唐髙宗所立自唐迄今歷嵗數百天禧中章獻明肅皇后斥奩具葺而治之更宫名曰崇福且置殿曰會元以嚴后土元天大聖后之象仁祖天聖景祐之際永懷章聖皇帝建寶祥之殿以奉睟容而塑章獻明肅皇后于殿之西閣于是山川之嘉氣爰聚爰宅而王畿之西琳宫真館神聖所依崇福為之冠元豐改元嵗在戊午欽慈皇后被遇神考深惟繼承之重天下之大本夙聞嵩嶽多神異之紀而嵩旁之宫得太室瀍澗之勝有靈明肸蠁之實獨崇福為第一乃因阿保富氏俾族子永和齎持香幣有禱于會元之神神享其請賜以吉卜再卜襲吉越四年壬戍冬十月是生朕躬明年三月又遣永和自京師命羽流盛芳薦以伸昭報又十有七年當元符之庚辰朕入繼大統獲承至尊詢謀往昔留戀祕宇而增隆之典廢缺弗講圖像之威黯昧就滅榱桷之制腐剝撓折殆非所以振顯神之大庇而仰當我烈考欽慈在天之靈爰敕有司于始生之辰增度道侣而本始之元四序之首候居炎律嵗遘履端衍寶籙之徽言啓仙科之靜供者閲月而後止黃金之飾瓌麗之器皆尚方所作百具用修蓋元符庚辰之五月崇寧癸未之九月也案崇寧二年為癸未原本誤作癸巳今改正大觀元年丁亥復詔洛帥侈宫楹而大之革故取新華潔完固萬役不出于民一費不取于官庀工豫財悉自內府三年三月工告訖百辟卿士咸曰休哉必有金石刻以紀本末而垂無窮朕恭念欽慈皇后為天下之母育天下之君而不得致天下之養兹用夙夜震悼于心若乃儀式刑神考之訓繼其志述其事以紹先烈庶幾乎得四海之歡以事宗廟于以顯親于以揚名孝之本也眷求慶源想像嗣服昭答靈貺肇新寶構以示無忘朕亦安敢忽諸初新兹宫靈芝拱穀産于萬嵗峰下實會元殿之背荐生嘉卉貫芝同秀世莫識其名者凡三本河南守上其事宰臣率百官賀于閣門外天下悉以為瑞應賴天溥臨於昭孝思鋪張聲詩傳之百世非朕孰宜為辭曰覆載定位融結以類維山巖巖惟嵩中峙爰有琳宫在嵩之旁案在嵩原本作在宫據此記前有嵩旁觀曰太一之文則宫字當係嵩字之訛今改正佳氣萃止福源穰穰在昔章聖衣冠出遊惟時仁宗世德作求睟儀穆穆寶構奕奕以安以寧百神受職於皇神考克肖天德既受帝祉子孫千億欽慈方幼長發其祥神斯顧享錫羡用光念兹皇祖厥猷翼翼以保以承是荷是式緬懷欽慈永言孝思凡我有今欽慈之為作兹新宇以報以祈孝奉神明天且弗違靈芝拱穀異名同秀於昭瑞應自天之祐追惟罔極敢怠永久刻文兹石以昭厥後宋朝事實卷三
