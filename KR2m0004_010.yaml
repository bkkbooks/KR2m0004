  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2m0004_WYG_010-1a, image: WYG0608/WYG0608-0121a.png}
body:
  text: 宋朝事實卷十宋李攸撰宰執拜罷楚昭輔太平興國元年十一月自右驍衛大將軍判三司副使除檢校太保左驍衛大將軍充樞密使案李燾長編楚昭輔為樞密使在是年十月庚申與宋史同此書作十一月與各書互異柴禹錫太平興國七年四月自如京使除宣徽北院使副使案宋史宰輔表柴禹錫兼樞密副使此書去樞密二字専稱副使蓋宋以樞密院為執政此書類紀樞密拜罷諸人姓名年月故不復載如下文稱知樞密院為知院同知樞密院為同知簽書樞密院事為簽書同簽樞密院為同簽書皆從此例也雍煕二年罷為左驍衛將軍真宗嘗幸澶淵案真宗原本誤作太宗澶淵下原本脫宋湜為樞密副使扈從九字考宋史湜以真宗咸平元年拜樞密副使二年從幸澶淵三年正月以疾卒于道今從宋史改正宋湜為樞密副使扈從遇疾真宗許其先歸賜以衾褥且曰此朕所常御者雖故敝亦足以禦道途之寒也又遣中使護送之次澶州卒真宗再幸河朔追悼之加贈刑部尚書諡忠定湜秀穎有器識又善引重後進云咸平二年己亥六月戊午樞密使兼侍中曹彬卒彬自至道三年八月復為樞密使是年六月卒居樞府三年彬性仁恕清謹遜言恭色在朝廷未嘗抗辭忤旨亦未嘗言人過失博覽強記善談論被服雅同儒者伐二國秋毫無所取位兼將相不以等威自異彬歸休閉閣門無雜賓保功名守法度近代良將稱為第一七月己丑王顯樞密使原注自橫海軍節度使兼御史大夫依前檢校太尉充顯自太平興國八年六月拜樞密使淳化二年罷是年復召拜樞密使咸平三年庚子二月癸亥王顯罷樞密使原注自檢校太尉罷為山南東道節度使同中書門下平章事顯再入樞府踰半年從真宗伐契丹車駕還京乃以使相罷之四年五月顯以定州駐泊都部署兼河北諸州水陸計度都轉運使同日案宋史宰輔表周瑩王繼英王旦同日拜除皆在咸平三年二月此云同日蓋承上王顯二月罷樞密之文上四年五月句紀顯次年事也長編咸平四年載王旦同知院事與此互異周瑩王繼英並知樞密院事原注瑩自宣徽北院使遷宣徽南院使除繼英自樞密都承旨客省使遷宣徽北院使除王旦同知樞密院事原注自中書舍人翰林學士除瑩瀛州人繼英開封祥符人旦字子明大名人瑩少給事于晉邸太宗即位擢簽書樞密院事宣徽院諸房公事諸房自後不復置云繼英事真宗于藩邸至是並知樞密院事旦少好學父祜器之嘗手植三槐于庭曰吾之後必有為三公者真宗即位旦為翰林學士嘗奏事下殿真宗目送之曰與朕致治天下必此人也是年遂有此除錢若水名能知人嘗見旦曰真宰相器也若水為樞密副使罷召對苑中問誰可大用者若水言旦可大用真宗曰吾固已知之矣韓崇訓馬知節並簽書樞密院事崇訓自樞密都承旨四方館使遷檢校太傅除知節自樞密都承旨東上閣門使遷檢校太保除崇訓長厚謙畏未嘗忤物知節折節讀書至是並拜簽書樞密院事當是時契丹已盟中國無為大臣方言符瑞知節每不然之言天下安不可存去兵忘戰之意景德四年丁未原注五年改大中祥符八月庚子韓崇訓罷簽書樞密院事為齊州防禦使崇訓自景德三年二月召除簽書樞密院事是年八月罷在樞府踰年崇訓以目疾纍表求罷從之王欽若大中祥符五年九月自吏部尚書知樞密院監修國史除檢校太傅中書門下平章事監修國史充使十一月除檢校太尉七年六月罷權判都省陳堯叟大中祥符五年九月自户部尚書檢校太傅知樞密院修國史除本官同中書門下平章事監修國史充使七年六月罷冦準大中祥符七年六月案大中下原本脫祥符二字今增入自兵部尚書除檢校太尉同中書門下平章事充使八年四月罷為武勝軍節度使同平章事大中祥符八年乙卯四月壬戌王欽若陳堯叟並樞相原注欽若自判尚書都省知通進銀臺司兼中書門下封駁事依前吏部尚書同平章事充樞密使堯叟依前户部尚書檢校太尉同平章事充樞密使兼羣牧制置使欽若與堯叟自祥符五年九月並同平章事充樞密使後與堯叟同罷至是復與堯叟並命大中祥符八年四月壬戌冦準罷樞密使原注自行兵部尚書依前檢校太尉同平章事充武勝軍節度等使準自大中祥符七年六月除中書門下平章事充樞密使至是年四月罷再任樞密踰年先是準惡三司使林特姦邪數與爭忿上謂王旦等曰準年髙屢更事朕意其必能改前非今觀所為似更甚于疇昔旦等曰準好人懷惠又欲人畏威皆大臣所當避而準乃以為己任此其所短也非至仁之主孰能全之準之未為樞密也旦嘗得疾未愈上命肩輿入禁中見于偏殿問曰卿今疾亟萬一有不諱使朕以天下付之誰乎旦曰知臣莫若君惟明主擇之再三問不對上曰張詠何如又問馬亮何如不對上曰試以意言之旦強起舉笏曰以臣之愚見莫若冦準上憮然有間曰準性剛褊更思其次旦曰他人臣所不知也遂辭退及準為樞密使中書行事關送樞密院礙詔格準即以聞上謂旦曰中書行事如此施之四方奚所則旦再拜謝曰此實臣等過也中書吏既坐罰樞密院吏皇皇告準曰中書樞密院日有相干舊例止令諸房改易不期奏白而使宰相待罪既而樞密院有事送中書礙詔格吏得之欣然以呈旦卻送與樞密院白準準大慙翌日謂旦曰王同年大度如此耶旦不答旦每對上必稱準之才而準數短之一日上謂旦曰卿雖談其美彼専道卿惡旦曰理固然臣在相位久政事闕失必多準對陛下無所隱益見其忠直此臣所以重準也上由是愈賢之及準自知當罷使人私于旦求為使相旦大驚曰使相安可求耶且吾不受私請準憾之既而上問旦準罷當何官可為旦曰準年未三十蒙先帝擢置二府且有才望若使相令處方面其丰采亦足為朝廷光也及制出準入見流涕曰非陛下知臣何以至是上具道旦所以薦準者準始愧嘆出語人曰王同年器識非準所可測也七月案七月即大中祥符八年七月以上文見故不復載某年考宋史王嗣宗以是月罷副使與此書合戊午王嗣宗罷樞密副使原注為天平軍節度使檢校太保嗣宗自大中祥符七年七月除樞密副使至是年七月罷在樞府踰年嗣宗表求外郡故有是命後上章求退而猶欲領郡冦準為相惡之即以為左屯衛上將軍致仕卒年七十八嵗贈侍中諡景莊大中祥符九年正月丙辰張旻樞密副使原注自侍衛馬軍副都指揮使威塞軍節度使檢校太保遷宣徽北院使除旻開封人事真宗于潛邸及即位以殿前都虞候從祀東封是時盛興宫室人皆爭奉符瑞丁謂王欽若主其事無敢議者旻毅然謂土木之役不足以承天意是年正月遂有此除八月甲申陳堯叟罷樞相原注自樞密使行户部尚書檢校太尉同平章事罷為尚書右僕射堯叟自大中祥符八年四月復為同平章事充樞密使至是年罷再執政踰年久疾求領外任上遣閣門使楊崇勳至第撫慰且詢其意堯叟辭意懇確乃從之命其子齎告牒就第賜之尋命判河陽月給實俸嵗賜公使錢百萬堯叟力疾求入辭肩輿至便殿詔勿拜賜坐又作詩餞其行卒贈侍中諡文忠堯叟偉姿貌強力奏對明辨多任智數久典機密軍馬之籍悉能記之父省華終左諫議大夫母馮氏性嚴毅弟堯佐景祐四年拜同中書門下平章事堯咨舉進士第一後以儒臣易武守仕至武信軍節度使同日任中正樞密副使原注自樞密直學士給事中權知開封府遷工部侍郎除中正字慶之曹州濟隂人同日馬知節知樞密院事原注自潁州防禦使知天雄軍召除檢校太尉兼宣徽南院使除密案宋史宰輔表馬知節曹利用等四人同日除知樞院事在天禧元年九月此書以年月載明本條下文直以同日二字起不載年月殊為闕略曹利用任中正周起並同知樞密院事原注利用自檢校太傅樞密副使加檢校太尉宣徽北院使除兼羣牧制置使中正自樞密副使兼刑部侍郎除起自樞密直學士右諫議大夫遷給事中除起字萬卿淄州人四月案宋史宰輔表馬知節罷在天禧二年閏四月此書失載某年直書四月不言閏殊為闕略癸卯馬知節罷知樞密院事原注自檢校太尉宣徽南院使罷為彰德軍節度觀察留後知節自天禧元年九月除知樞密院是年四月罷再入樞府凡七月恩顧極厚素病足特許內朝别為一班省其舞蹈未幾疾甚賜告上親臨其第謂之曰久不相見思卿而來病既久乃罷為節度留京師卒贈侍中諡正惠知節慷慨以武力智謀自喜又能好書賓友儒者所與善必一時豪傑遇事謇謇未嘗有所顧憚天下至今稱其直云六月案李燾長編曹利用知樞密院與丁謂並樞密使皆在天禧三年此六月上缺紀年乙未曹利用知樞密院事原注自檢校太尉宣徽北院使同知樞密院事兼羣牧制置使除十二月辛卯曹利用丁謂並樞密使原注利用自檢校太尉宣徽北院使知樞密院事兼羣牧制置使除謂自吏部尚書參知政事除檢校太尉充時輔臣以郊恩俱進官故事嘗為宰相而除樞密使始得遷僕射乃以謂為檢校太尉兼本官充使樞密使舊兼御史大夫自利用始去之再入政府一年至四月拜相原注樞密使不兼御史大夫自曹利用始同日任中正周起並樞密院副使原注中正自刑部侍郎同知樞密院事遷兵部侍郎除起自給事中同知樞密院事遷禮部侍郎除天禧四年庚申正月乙丑曹瑋簽書樞密院事原注自華州觀察使鄜延路副都總管環慶秦鳳等州沿邉巡檢安撫使宣徽北院使鎮國節度觀察留後充瑋字寶臣樞密使彬之子李繼遷擾邊諸將數出無功太宗問誰可任者是時彬在樞府對以瑋可任召知渭州時年十九又知秦州秦州人立碑紀功有詔褒之至是遂有此命錢惟演樞密副使原注自翰林學士刑部侍郎知制誥除案李燾長編天禧四年八月除錢惟演樞副下九月周起曹瑋罷即是年九月也與宋史宰輔表合此書于錢惟演上闕載年月九月丙辰周起罷樞密副使原注自禮部侍郎罷為户部侍郎知青州曹瑋罷簽書樞密院事原注自宣徽北院使鎮國軍節度使觀察留後除罷為宣徽南院使環慶路馬步軍都部署起自天禧元年九月除同知樞密院事三年十二月遷樞密副使是年九月罷在樞府三年丁謂用事逐冦準而以周起為黨罷知青州又降太常少卿知光州謂得罪復禮部侍郎留守南京卒贈禮部尚書諡安惠瑋自天禧四年正月除簽書樞密院事是年九月罷在樞府一年冦準謫道州丁謂惡瑋不附己指為準黨出之未幾復降為左衛大將軍容州觀察使知萊州瑋自知宿將為謂所忌恐益為謂中即日上道從弱卒十餘人不以弓韔矢箙自隨謂敗乃復節度使卒贈侍中諡武穆治平中配享仁宗廟庭瑋好讀書通左氏春秋為將幾四十年未嘗敗衄威震西鄙罝勒斯賚案罝勒斯賚原本誤作唃􅣳囉今改正每聞其名以手加額而東嚮之鎮天雄契丹使過必戒其下無敢疾驅者在渭州始置弓箭手其所措置後皆為法云子琮之孫詩尚魯邠國大長公主案宋史魯國大長公主仁宗女治平四年封祁國熙寧九年改魯國此書作魯邠國考公主未嘗封邠國或即祁字之誤琮纍官至馬軍副都指揮使張士遜天禧五年正月自樞密直學士右諫議大夫除本官副使任中正自大中祥符九年九月除樞密副使天禧元年九月除同知樞密院事三年十二月除樞密副使四年八月除參知政事是年案宋史任中正乾興元年六月以救丁謂謫知鄆州自大中祥符九年九月至是凡六年仁宗于是年二月戊午即位此書但云是年而不著乾興元年殊為闕略六月罷為執政凡六年事真宗五年事仁宗才數月中正之貶坐營救丁謂故也後復禮部尚書卒贈左僕射諡康懿弟中師仁宗時為樞密副使張知白乾興元年十一月自翰林學士尚書右丞除本官副使案宋史張知白乾興元年自尚書右丞除樞密副使此書云本官者即指樞密而言也天聖三年十二月拜相李梲靖康元年正月自正奉大夫户部尚書除本官同知三月遷尚書右丞唐恪靖康元年正月自正議大夫吏部尚書除本官同知三月遷中書侍郎种師道靖康元年正月自靖難軍節度使檢校少保河東北路制置使除同知兼京畿河東路宣撫二月罷守本官中太一宫使李綱靖康元年正月自尚書右丞兼同知兼親征行營使二月罷三月復故兼都提舉城壁守禦使四月遷知院許翰靖康元年三月自朝散郎御史中丞除大中大夫同知八月罷孟忠厚紹興十二年某月自少保鎮潼軍節度使判紹興府除充使某月罷為福建路安撫使案宋史宰輔表孟忠厚以紹興十二年九月自護國軍節度除樞密使是年十一月罷為少傅知建康府與此互異石熙載太平興國四年正月自樞密直學士兵部員外郎本官簽書院事四月遷副使案自石熙載以下至湯思退止類紀簽書同簽書發遣領院事諸職考宋以簽書樞密院為執政其同簽書發遣領院事特以類附載王沔太平興國八年十一月自樞密直學士除右諫議大夫簽書院事雍熙元年十二月除左諫議大夫三年八月遷副使張齊賢太平興國八年十一月樞密直學士除右諫議大夫簽書院事雍熙元年十二月除左諫議大夫三年七月罷為給事中王守正端拱元年九月自內客省使除宣徽北院簽書院事張遜端拱二年七月自鹽鐵使除宣徽北院使簽書院事淳化二年九月遷知院案長編九月甲辰以樞密副使張遜知樞密院事溫仲舒冦準同知院事知院之名始此向敏中咸平三年正月以參知政事權發遣馮拯景德元年八月自給事中同知院改工部侍郎簽書二年四月遷參知政事陳堯叟景德元年八月自給事中同知院改工部侍郎二年十一月除刑部侍郎三年二月遷知院韓崇訓景德三年二月自樞密都承旨除檢校太傅簽書四年八月罷為齊州防禦使馬知節景德三年二月自樞密都承旨除檢校太保簽書大中祥符元年十一月除檢校太傅四年四月除宣徽北院使五年九月遷副使案長編景德三年二月王欽若為尚書左丞簽樞密院事陳堯叟知院事韓崇訓馬知節並簽書院事四人同日視事此書前已載欽若大中祥符五年與陳堯叟並知院事八年復與堯叟並樞相而此處自石熙載簽書院事以下並記簽書院事及同簽書發遣領院事諸人姓名及除罷年月獨不載王欽若簽院事似有闕佚向敏中大中祥符七年以宰相權發遣曹瑋天禧四年正月自華州觀察使鎮國軍節度觀察留後除宣徽北院使簽書九月罷為宣徽南院使環慶路馬步軍都部署王德用明道二年四月自侍衛步軍副指揮使福州觀察使除檢校太保同簽書十一月遷副使郭逵治平三年四月自容州觀察使檢校太保除同簽書九月安撫陕西四年正月加靖難軍節度使四月還自陜西九月罷為宣徽南院使判鄆州曾孝寬熙寧八年十二月自龍圖閣學士起居舍人樞密都承旨除樞密直學士同簽書元豐元年丁父憂趙瞻元祐三年四月自中散大夫户部侍郎除樞密院直學士本官簽書四年六月遷同知院王嵓叟元祐六年二月自龍圖閣待制權開封府除樞密學士簽書七年五月罷為端明殿學士知鄭州劉奉世元祐七年五月自朝請郎寶文閣待制除樞密直學士本官簽書紹聖元年五月罷為端明殿學士知成德軍童貫政和六年二月自少保護國軍節度使陜西河東路宣撫使簽書五月除檢校少傅威武節度使權領院事十二月除檢校少師寧江軍節度使領院事重和元年八月除太保河中節度使宣和元年八月除太保山南東道節度使二年十二月加劒南西川節度使三年八月除太師封楚國公四年七月以太師改豫國公致仕鄭居中宣和二年十二月自少傅威武軍節度使中太一宫使權領院事三年五月落權字六年六月除太保威勝軍節度使燕國公致仕童貫宣和四年五月落致仕前太師進封徐國公領院事陜西河北路宣撫使七年封廣陽郡王靖康元年二月責授左衛上將軍致仕蔡攸宣和六年六月自少師安逺軍節度使寶籙宫使侍讀河東北路宣撫使除前少師領院事七年除太保燕國公靖康元年責大中大夫提舉亳州明道宫耿南仲宣和七年二月自徽猷閣學士朝散郎太子詹事除資政殿學士簽書靖康元年遷尚書左丞路允迪靖康元年正月自朝散郎兵部尚書除資政殿學士簽書二月使河東建炎元年罷為資政殿學士提舉南京鴻慶宫宇文虛中靖康元年二月自資政殿學士中大夫除本官簽書其月改資政殿學士四月罷落職李回靖康元年八月自朝議大夫御史中丞除延康殿學士簽書十一月罷提舉萬壽觀曹輔靖康元年十一月自承議郎御史中丞除延康殿學士簽書建炎元年五月卒張叔夜靖康元年閏十一月自延康殿學士南道都總管除簽書建炎元年四月扈從北狩路允迪建炎三年二月自資政殿學士提舉洞霄宫除本官簽書四月罷為資政殿學士提舉醴泉觀兼侍讀吕頤浩建炎三年自大中大夫吏部尚書除資政殿學士同簽書江淮兩浙制置使四月拜相王淵建炎三年自嚮德軍節度使御營都統制除本官簽書四月遇害李邴建炎三年三月自翰林學士承旨案宋史建炎三年李邴自翰林學士知制誥除簽書此書作承旨與宋史互異朝奉郎除端明殿學士本官同簽書四月遷尚書右丞鄭玨建炎三年二月自朝散郎御史中丞除端明殿學士同簽書四月落同字七月卒滕康建炎三年五月自翰林學士承旨朝散郎除端明殿學士簽書七月除資政殿學士同權三省樞密院從隆祐太后幸洪州周望建炎三年七月自朝奉大夫兵部尚書除端明殿學士同簽書九月宣撫荆湖江浙十二月遷同知張守建炎三年七月自翰林學士承旨朝奉郎除端明殿學士同簽書四年四月遷參知政事案宋史張守自翰林學士知制誥同簽書在九月參知政事在四年五月此書作承旨除同簽書在七月參政在四月與宋史互異趙鼎建炎四年五月自翰林學士承旨朝奉大夫除端明殿學士簽書十一月罷提舉洞霄宫案宋史趙鼎自翰林學士承旨除端明殿學士簽書十一月罷提舉洞霄宫原本學士下脫簽書十一月罷六字今據宋史增入富直柔建炎四年十一月自奉議郎御史中丞除端明殿學士朝奉郎簽書紹興元年遷同知權邦彥紹興二年五月朝議大夫兵部尚書除端明殿學士簽書八月兼權參知政事三年二月卒徐俯紹興三年二月自翰林學士承旨中大夫除端明殿學士簽書四年五月罷案宋史徐俯以紹興四年四月罷簽事此作五月與宋史互異提舉洞霄宫韓肖胄紹興三年七月自中大夫吏部侍郎除端明殿學士同簽書充大金軍前通問使四年五月罷知溫州案宋史韓肖胄同簽書在紹興三年五月此作七月罷在四年正月此作五月與宋史互異胡松年紹興四年七月自朝奉大夫吏部尚書除端明殿學士簽書遷罷年月闕案宋史胡松年罷簽書在紹興五年閏二月折彥質紹興六年二月自朝議大夫兵部尚書除端明殿學士簽書兼權參知政事十二月罷提舉洞霄宫韓肖胄紹興八年十二月自端明殿學士知常州除本職簽書使大金十年使還罷知紹興府王倫紹興八年十二月自龍圖閣學士除端明殿學士同簽書其月罷以本官職留守東京樓照紹興九年三月自翰林學士承旨朝奉郎知制誥除端明殿學士簽書十年六月丁母憂何鑄紹興十年六月自御史中丞朝奉郎除端明殿學士簽書尋出使案宋史何鑄以紹興十一年十一月除簽書遂出使金此作十年六月與宋史互異十二年五月使還七月兼權參知政事八月罷提舉江州太平觀程克俊紹興十二年自翰林學士承旨朝奉郎除端明殿學士簽書兼權參知政事十三年二月罷兼權七月罷提舉江州太平觀樓照紹興十四年二月自資政殿學士知紹興府移知建康府過闕以本官簽書兼權參知政事四月罷提舉江州太平觀李文會紹興十四年五月自奉議郎御史中丞除端明殿學士本官簽書兼權參知政事十一月罷案宋史李文會罷簽書在十二月此作十一月與宋史互異落職奉議郎提舉江州太平觀楊願紹興十四年十一月自通直郎御史中丞除端明殿學士朝奉郎簽書兼權參知政事十五年罷案宋史楊願除簽書在十二月此作十一月與宋史互異罷在十五年十月此失載某月提舉江州太平觀李若谷紹興十五年九月自敷文閣直學士朝議大夫樞密都承旨除端明殿學士簽書案宋史李若谷除簽書在紹興十五年十月此作九月與宋史互異十七年正月遷參知政事何若紹興十七年正月自奉議郎御史中丞除端明殿學士朝奉郎簽書三月罷提舉江州太平興國宫詹大方紹興十八年八月自朝奉郎工部尚書除端明殿學士本官簽書兼權參知政事十一月卒案宋史詹大方以紹興十八年九月卒以余堯弼代之即在是年十月此俱作十一月與宋史互異余堯弼紹興十八年十一月自朝散郎御史中丞除端明殿學士本官簽書兼權參知政事二十年三月遷參知政事巫伋紹興二十年三月自朝奉郎給事中除端明殿學士本官簽書兼權參知政事二十一年四月使大金為祈請使是嵗還仍兼權參知政事二十二年二月罷落職案巫伋除簽書在紹興二十年二月此作三月罷在二十二年四月此作二月與宋史互異提舉太平興國宫章夏紹興二十二年四月自朝散郎諫議大夫除端明殿學士本官簽書兼權參知政事十月罷落職提舉太平興國宫宋朴紹興二十二年十月自奉議郎御史中丞除端明殿學士朝奉郎簽書兼權參知政事二十三年十月罷落職提舉太平興國宫史才紹興二十三年十月自朝奉郎諫議大夫除端明殿學士本官簽書兼權參知政事二十四年六月罷落職提舉太平興國宫魏師遜紹興二十四年自奉議郎御史中丞除端明殿學士朝奉郎簽書參知政事十一月罷提舉太平興國宫鄭仲熊紹興二十四年十二月自承議郎諫議大夫除端明殿學士朝奉郎簽書二十五年四月兼權參知政事五月罷落職提舉太平興國宫湯思退紹興二十五年五月自承議郎禮部侍郎直學士院除端明殿學士朝奉郎簽書兼權參知政事八月罷蔡懋宣和六年九月自朝議大夫開封尹除中大夫同知靖康元年遷尚書左丞案自蔡懋以下至張慤皆紀宣和以後尚書左右丞諸人姓名及除罷年月而自宣和六年以前皆闕葉夢得字少藴蘇州吳縣人官至尚書左丞在鎮以其子模將數千人守馬家渡金人果使叛將酈瓊將輕兵來襲見有備乃去時以屯兵衆嵗費米八十萬斛錢八百萬緡𣙜貨務所入不足以贍且命夢得兼總四路漕運時江淮多難甚賴之以勞進觀文殿學士蔡仲熊濟陽人好學博聞執經議論往往與時宰不合亦不改操求同歷年方至尚書右丞當時憾其不遇王璠以尚書右丞為京兆尹自李諒後政條隳弛姦豪寖不戢璠頗修舉政治有名進左丞王安中字履道號初寮道人宣和中為翰林學士遷尚書右丞安中文學稱于時靖康中坐纍謫象州館于謝氏之扶疏堂又建炎間貶道州司户避冦寓臨賀有和李師中布水寺詩及稽古閣墨迹李綱為尚書右丞上欲親征命綱為東京留守以李棁副之時宇文粹中扈從東幸綱建議守城罷親征辛未上登宣德門親勞問將士命李綱吳敏撰數十語示金人犯順欲危宗社決策固守各令勉勵之意俾閣下官宣讀一句將士聲喏須臾六軍皆感泣于是固守之議始決乃以綱為親軍行營使二月罷後三日士庶伏闕言綱不當罷復除尚書右丞都大提舉京城四壁守禦使張慤建炎元年六月自中大夫户部尚書除本官同知至十一月遷尚書右丞欣州地震災異數見時陳堯佐與王隨同在相位諫官論政事錯繆由宰相不得人堯佐亦先自援漢故事數上章請行策免下制曰適因災異繼有奏陳慮煩宰制之勤宜錫都俞之命從優禮云曾布與韓忠彥同輔政忠彥既罷相而布亦力請去位乃有是命未幾臣僚論列布與宦官閻守勤等相交結使門人李士京通道密語暨陛下發揮睿斷斥逐守勤是時布在公堂忽覺驚駭失色曰昨日見李士京來不言及今日何遽如此又聞金山登雲門外下鼻唐地嘗有讖記遂諷金山寺僧獻其地又以常住地不可買遂面欺乞令潤州估價買之王防獻賄于其子紓納妾以事之布亦薦用朱彥任府界提點日朝廷便錢往京西紓與布之壻吳則禮攬客人便錢所得息錢甚多彥以此速進陛下深察其姦終以必去而不疑可謂有人主之英斷矣及其既去則譽以美詞寵以要職罪狀未著天下惘然于是落職提舉亳州明道宫太平州居住又責授賀州别駕衡州安置二年又責授亷州司户參軍案前條不著年月此條首云乃有是命末云二年又責授則原本必有元年罷相之文而傳寫脫去且陳堯佐王隨罷相在景祐五年三月韓忠彥曽布罷相在崇寧元年五月乃錯置建炎後皆由傳寫淆亂興化軍仙遊人陳瓘因朝會見蔡京視日久而不瞬嘗以語人曰京之精神如此他日必貴然矜其稟賦敢敵太陽吾恐此人得志必擅私逞欲無君自肆矣尋居諫省遂攻其惡京聞瓘言因所親以自解且致情懇而以甘言啖瓘瓘使答之曰杜詩所謂射人先射馬擒賊必擒王不得自已也于是攻之愈力草四章將上會聞隔對不得見乃悉繳而奏之案宋史瓘以論皇太后預政因罷監揚州糧料院瓘出都門繳四章上之與此互異其奏曰紹聖之初哲宗之意本無適莫章惇雖挾功自恣然其初猶有兼取元祐之意京自成都而來與其弟卞共毁宣仁共欺哲宗京之得售其説自役法始從大改役法以後事事無不大改兄弟同朝塤篪相和無有一事不如其意當此之時不以所聞神考聖訓告于哲宗至于今日然後引所自書實録以為證驗倡為不經之論而欲遷神考于西宫其為矯誣可謂明矣京以矯誣之筆妄增實録之事以矯誣之舌偽造神考之訓朝廷用矯誣之言而輕改宗廟信矯誣之説而力沮言者臣恐自此矯誣之人無復忌憚矣今朝廷大政又皆委曲遷就而為一京之地公議洶洶人不敢言京當紹聖之初與其弟卞俱在朝廷導贊章惇共作威福卞則隂為謀畫惇則果斷力行且謀且行者京也哲宗篤于繼述一于委任事無大小信惇不疑卞于此時假繼述之説以主私史惇于此時因委任之篤自明己功京則盛推安石之聖過于神考以合其弟又推定策之功毁蔑宣仁以合章惇惇之矜伐京為有助卞之乖悖京實贊之當此之時言官常安民屢攻其罪京與惇卞共怒安民協力排陷斥為姦黨而孫諤董敦逸陳次升亦因論京相繼黜逐哲宗晚得鄒浩不由進擬置之言路浩能忘身徇國京又因其得罪從而擠毁是以七年之間五害言者凡所施行得以自恣遂使當時之所行皆為今日之所改卞之尊紹王氏知有安石豈知有神考知有金陵豈知有京師絶滅史學一似王衍重南輕北分裂有萌臣之痛心默憂非一日也陛下融會南北去卞不疑然而京尚未去人實憂之兄弟一心皆為國害一去一留失政刑矣熙寧之末王安石呂惠卿紛爭以後天下之士分為兩黨神宗患之于是自安石既退惠卿既出之後不復用此兩人而兩門之士則皆兼取而並用之也當時天下之士初有王黨吕黨而朋黨之禍終不及于朝廷者用此術耳自京卞用事以來牢籠薦引天下之士處要路得美官者不下數百千人其間才智藝能之士可用之人誠不為少若京去朝廷則私門之士數百千人者皆為朝廷之用矣京在朝廷則皆蔡氏之黨也然則消黨之術惟在去京而己國家內外無事一百四十年矣至于保養隂邪必成心腹之患瓘又論哲宗實録不當止以蔡京兼修疏奏上甚感其言密賜瓘黃金百兩案宋史瓘以上書明宣仁誣謗事賜黃金百兩后亦令勿遽去畀十僧牒為行裝改無為軍與此所載詳略互異上謂輔臣曰瓘言事極不可得暫貶亦不久前日遣人以金百兩賜之瓘受賜泣下布曰陛下待遇如此宜其感泣也元符三年十月京遂以翰林學士承旨出知永興軍至是除尚書左丞京執政凡二月而相王黼上章乞骸骨曰陛下用臣不為不盡任臣不為不専緣臣薄祜取戾隂陽內積憂虞外傷疲弊捫心自悼弔影興嗟獲戾天人莫之可逭儻許盡還印綬退即里居脫身于風波洶湧之中收功于桑榆衰蹇之域人非鬼責少緩顛隮永言此恩是為終惠詔依所乞守本官致仕應得恩禮朝謁人從等並依蔡京例仍給節度使俸從優禮也黼當國之久専權稔惡中外畏之無敢言者及是太上皇覺悟罷其政事天下稱快宋朝事實卷十
