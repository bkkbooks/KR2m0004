body:
  text: 宋朝事實卷十一宋李攸撰儀注一太祖乾徳元年將有事于南郊為壇于城南南薫門外徑五丈髙九尺四成案四成原本誤作四出攷宋史禮志壇舊制四成一成二十丈再成十五丈三成十丈四成五丈成髙八尺一寸此書言徑五丈指一成而言徑為五丈則四圍為二十丈然不及宋史之詳又髙九尺與宋史言八尺一寸者不合附註備攷帝致齋于便殿屏葷茹前一日上服衮冕備大駕鹵簿宿齋于青城上御青城門觀奏嚴夜設警場用鼓吹一千二百七十五人奏嚴用金鉦大角大鼓樂用大小横吹觱篥笳笛角手歌六州十二時每更三奏之導引二首和調玉燭睿化著鴻明緹管一陽生郊禋盛禮燔柴畢旋軫鳳皇城森羅儀衛振華纓載路溢歡聲皇圖大業超前古垂象泰階平嵗時豐衍九土樂升平當寰海澄清道髙堯舜垂衣治日月竝文明嘉禾甘露登歌薦雲物煥祥經兢兢夕􅅥持謙徳未許禪云亭六州嚴夜警銅史漏遲遲清禁肅森陛㦸羽衛儼皇闈角聲厲鉦鼓收宜金管成雅奏逐次逶迤薦蒼璧郊祀神祇屬景運純熙京坻豐衍羣材樂育諸侯述職盛徳服蠻夷原註和聲殊祥萃九苞丹鳳來儀為膏露降和氣洽三秀煥靈芝鴻猷播史冊相輝張四維卜世永固丕基敷𤣥化蕩蕩無為合堯舜文思混并寰宇休牛歸馬咸偃革蹈詠慶昌期十二時承寳運馴致隆平鴻慶被寰瀛時清俗阜治定功成遐邇詠由庚儼郊祀文物聲明天正星拱奉嚴蹕布羽儀簪纓宸心䖍潔明徳播惟馨動蒼冥神降享精誠原註和聲燔柴十萬乗移天仗肅鸞輅旋衡千官雲擁羣后輸誠玉帛旅明庭韶濩薦金奏諧聲集休享皇澤浹黎庻普率洽恩榮仰欽元后睿聖貫三靈萬邦寧景貺愈駢臻鹵簿使張昭又上言準舊儀鑾駕將出宫入朝赴南郊宿齋之辰皆有夜警晨嚴之制奏嚴之設本縁警備事理與作樂全殊況齋宿之夜千乗萬騎宿于儀仗之中茍無鼓漏之徼巡何警衆多之耳目其宫門廟門南郊夜警晨嚴之制望依舊制施行詔從之太祖乾徳元年八月六日太常禮院言南郊壇衆星位版并刻漏時辰司天臺應奉豫申嚴辦從之太宗淳化四年五月三日吏部侍郎陳恕言郊壇祭祀其神位席褥望自今並委逐司長官封送祀所禮畢監祭使封還從之太祖乾徳元年將有事于南郊司天監新定從祀星辰圖上之中書門下詳定祀昊天上帝儀設皇地祇之位從祀五方五帝日月五星中官外官總六百八十七位案原本五帝下脱日月二字五星下脱中官外官四字今據宋史禮志増入有司議請以僖祖升配昊天上帝太常少卿張昭請以宣祖崇配詔從之案宋史禮志張昭議曰隋唐以前雖追立四廟或六七廟而無偏加帝號之文梁陳南郊祀天皇配以皇考北齊圜丘祀昊天以神武升配隋祀昊天于圜丘以皇考配唐貞觀初以髙祖配圜丘梁太祖郊天以皇考烈祖配恭惟宣祖皇帝積累勲伐肇基王業伏請奉以配享從之此書不載其議乾徳元年將有事于南郊禮儀使陶穀建議取天文大角攝提列星之象作攝提旗及北斗旗二十八宿旗十二辰旗龍墀十三旗五方神旗五方鳳旗四瀆旗于時有貢黄鸚鵡白兔及馴象又作金鸚鵡玉兔馴象旗帝又詔别造大黄龍負圖旗一黄龍負圖旗一案宋史禮志無黄龍負圖旗一六字但以下二十一旗數之則大黄龍負圖旗外又有黄龍負圖旗觀下文云大黄龍負圖旗陳于明徳門前餘二十旗悉立于宿頓宫則此本二旗而宋史刪去可以證其闕大神旗六日旗一月旗一君王萬嵗旗一天下太平旗一獅子旗二金鑾旗一金鳳旗一五龍旗五二十一旗皆有架南郊用之大黄龍負圖旗陳于明徳門前餘二十旗悉立于宿頓宫前遇朝㑹冊禮亦皆陳于殿庭牙門旗赤質錯采為神人象中道前後各一門左右道五門門二旗金節制黒漆竿上施圓盤周綴紅絲拂八層黄繡龍袋籠之幢制如節而五層韜以袋繡四神隨方色朱漆柄取曲禮行前朱鳥而後𤣥武左青龍而右白虎之義絳麾如幢止三層紫羅囊䝉之黄麾古有黄朱纁三色所以指麾也漢鹵簿有前黄麾䕶駕御史宋制絳帛為之如幡錯采成黄麾字下繡交龍朱漆竿金龍首上垂朱絲小葢幡本幟也貌幡幡然有告止傳教信幡案原本脱教字今據宋史儀䘙志増入皆絳帛錯采為字上有朱絲小葢四角垂羅文佩繋龍頭竿上有錯采字下告止為雙鳳傳教為雙白虎信幡為雙龍又有絳引幡制頗同此作五色間暈無字兩角垂佩氅為四角小葢每角垂朱佩間以朱絲周綴五色帶繡雲龍孔雀白鵝有三色之别繋龍頭竿竿制如㦸案宋史儀衞志氅本緝鳥毛為之唐有六色孔雀大小鵝毛鷄毛之制後志云今制有青緋皂白黄五色工有朱葢下垂帶帶繡禽羽末綴金鈴青則繡以孔雀五角葢緋則繡以鳳六角葢皂則繡以鵝六角葢白亦以鵝四角葢黄則以鷄四角葢每角綴垂佩掲以朱竿上如㦸加横木龍首以繋之與此書互冇詳畧王公所給幢黒漆柄紫綾袋節韜以碧玉麾以紫綾袋餘制同范質與禮官議案宋史范質與禮官議郊祀輿服之制在建隆四年此書失載年月道駕官服袴褶之衣按袴褶衣其制度所起先儒皆無其説惟開元雜禮五品以上通用細綾及羅六品以下服小綾褶衣其色隨本品綬色原註褶衣即複衣也又按諸王朱綬四采赤黄縹紺赤即朱也以純朱為地更次第輕入黄白青汁内染之共為四采亦謂之朱褶一品緑綟綬四采緑紫黄赤原註綟即綠也是草之綠色以綠為地亦謂之綠綟綬褶二品三品紫綬三采紫黄赤謂之紫褶其衣身領袖袂請依今制又按令文武弁金飾平巾幘簪導紫褶白袴玉梁珠寳鈿帶鞾騎馬服之金飾即金附蟬也附蟬之數一品九蟬二品八蟬三品七蟬四品六蟬五品五蟬又令文武弁平巾幘侍中中書令散騎常侍加貂蟬侍左者右珥侍右者左珥案宋史輿服志侍左者左珥侍右者右珥與此互異又開元雜禮導駕官竝朱衣冠履依本品朱衣今之朝服也然自一品至三品並用四入之朱為衣乃協上下之文異絳繒之色又令文三品以上紫褶五品以上緋褶七品以上緑褶九品以上碧褶並白大口袴起梁帶烏皮鞾看詳籠巾籠冠平巾與武弁大冠其名雖殊本是一物製同而飾别蓋以官品為差其幘戴在籠冠下今請造袴褶如今制其起梁帶形制檢尋未獲欲乞以革帶代之奏可又令博士檢緋紫裲襠制度按開元禮武臣陪位大仗加蛇裲襠如袖無身以覆其膞胳原註胳音各蓋掖下縫也從肩領覆臂膊共一尺二寸又按釋文玉篇云其一當胷其一當背謂之兩當今詳裲襠之制其領連所覆膊胳其一當左膊其一當右膊故謂之起膊今請兼存兩説擇而用之是嵗造裲襠遂用當胷背之制乾徳元年將有事于南郊于是范質上言三公祭服舊皆畫升龍請令禮官檢尋故事按三禮三公毳冕無龍章上公衮冕二品鷩冕又周禮言上公衮冕九旒以五采繩貫五采珠旒長九寸每寸以珠玉瑱其衣𤣥色五章山龍華蟲火宗彛畫于衣其裳朱色四章藻粉米黼黻繡于裳又按令文旒並貫青色珠青纊其珠及充纊今請依令文青色之制詔從之遂改製焉淳化四年正月辛邜合祭天地圜丘以宣祖太祖皇帝同配有司因請孟春祈穀孟冬神州地祇季秋大饗明堂請以宣祖配冬至祀昊天夏至祀皇地祇孟夏雩祀請以太祖配從之案宋史淳化四年以宣祖太祖並配圜丘禮儀使蘇易簡請郊祀圜丘奉宣祖太祖同配其常祀祈穀神州地祇明堂以宣祖配圜丘北郊雩祀以太祖配奏可此以下三條從事實類苑採出而字句多訛缺復據宋史訂正太宗將南郊彗星見宰相趙普召檢討杜鎬問之鎬曰當祭日食猶廢祭謫見如此罷祀不疑遂從其説至煕寧五年將郊而河決神宗問輔臣曰議者以河決地震不當郊王安石曰古者年不順成八蜡不通八蜡小祭或可以變異廢上帝之祭乃祭之大者恐不宜如此上亦以為然建隆四年太常博士和峴奏唐以前寅日蜡百神卯日祭社宫辰日臘饗宗廟開元定禮三祭皆于臘辰以應土徳聖朝火徳合以戌日為臘而以前七日辛卯便行蜡禮恐未為宜下太常議而請蜡百神祀社稷饗宗廟同用戌臘日案以上各條皆郊祀之儀此係蜡臘擇日故以類從不復以時代為先後仁宗慶厯四年十月壬辰太常禮院言新修禮儀並據通禮而郊廟舊儀所設罇罍之數乃與通禮不同南郊配帝位舊誤著罇二山罍二今宜如通禮犧罇之次益以象罇二其下壇午階之東舊設象罇二壺罇二山罍二今宜如通禮増山罍為四每太廟室舊設斚彞一黄彝著尊二今宜如通禮用斚彝一黄彝一犠罇一象罇二山罍二仍于堂下階間及設壺罇二山罍二從之仁宗景祐二年十一月十一日詔訪聞祀天地社稷宗廟簠簋籩豆祭器多是損壊收掌不得嚴潔令太常禮院相度修整不堪者别引創造淨潔處置庫收盛封禪帝每道經險峻必降輦徒步所司議増侍衛皆郤之導從者或至疲頓而帝辭氣益壯侍臣莫不瞻悚至回馬嶺以天門斗絶給從官横板選親從卒推引而上原註板之制長三尺許兩端施綵帛上則施于背下則施于臆衛士皆給釘鞵上至御幄命近臣觀玉女泉及古碑前一夕山上大風裂帟幕遲明未巳及上之至天氣温和纖羅不動祥光瑞雲交相輝映辛亥設昊天上帝位于山上圜臺太祖太宗配帝位于東方西向北上側向以申祖宗恭事之意設五方帝日月天皇大帝北極神座于山下封祀壇之第一等青帝于卯陛之比赤帝于午陛之東黄帝于午陛之西白帝于酉陛之南黒帝于子陛之西大明于卯陛之南夜明于酉陛之北天皇大帝于戌陛之北北極于丑陛之東席皆以藁秸上加席褥設五星十二辰河漢及内官五十四座于第十有二陛之間各依方面几席皆内向其内官北斗于未陛之東天一太一皆在北斗之東五帝内座在亥陛之西帝座在卯陛之北又設二十八宿及中宫一百五十八座于第三等其二十八宿及大角攝提太微太子明堂軒轅三台五車諸王月星織女建星天紀等一十六座並差在外位前又設外官一百六座席位于内壝之内又設衆星三百六十座席位于内壝之外各依方次十有二陛之間席皆以莞所司陳寳及嘉瑞等于樂縣之北東西廂玉昊天上帝以蒼璧青帝以青珪赤帝以赤璋白帝以白琥黒帝以𤣥璜黄帝以黄琮日月以珪璧幣昊天上帝幣以蒼地祗幣以黄配帝幣以白五天帝日月内官以下各從其方之色各長一丈八尺又方丘玉幣皇地祇以黄琮其幣以黄神州以兩圭有邸其幣以𤣥配帝之幣以白封祀壇内官五十四座中官一百五十八座外官一百六座社壇嶽鎮海瀆以下一十八座依南郊隨方色用幣正位配位依南郊各位犢一羊一豕一五方帝每位羊一豕一日月神州每位羊一豕二從祀七百三十七位羊豕每位使肉二段計使一千四百七十四段上服衮冕侍中奏中嚴少頃又奏殿中監進鎮圭皇帝出次盡屏導衛減去拂翟燭籠前導亦徹去上至幄殿登歌樂作用高安之曲禮儀使引皇帝就褥位西向樂止禮儀使奏請皇帝再拜拜訖禮生贊拜在位羣臣皆再拜次禮儀使引皇帝詣罍洗樂作侍中跪取匜盥沃水皇帝搢圭盥手門下侍郎進帨巾皇帝帨手訖樂作解劔脱舄如常儀禮儀使贊引皇帝升幄殿樂作降神用禮安之曲皇帝自午陛升詣昊天上帝正座前禮儀使奏請皇帝再拜上香進酒貢幣俯伏興再拜中書侍郎讀玉冊維大中祥符元年嵗次戊申十月戊子朔二十四日辛亥嗣天子臣徳昌敢昭告于昊天上帝臣嗣膺景命昭事𤣥穹昔太祖揖讓興邦案興邦宋史禮志作開基太宗憂勤致治肅清寰海案肅清宋史作廓清混一車書升中告成猥延積慶案此二句宋史作固抑升中以延積慶元符錫祚衆寳效祥異域咸懐豐年屢應䖍修封祀祈福黎元謹以玉帛犧牲粢盛庻品備茲禋燎式薦至誠皇伯考太祖皇帝啟運立極英武聖文神徳𤣥功大孝皇帝皇考太宗至仁應道神功聖徳文武大明廣孝皇帝配神作主尚饗次詣太祖皇帝配座前行禮玉冊文案太祖太宗玉冊文宋史禮志並失載此足補其闕維大中祥符元年嵗次戊申十月戊子朔二十四日辛亥孝子嗣皇帝臣徳昌敢昭告于皇伯考太祖啟運立極英武聖文神徳𤣥功大孝皇帝恭以在昔昊穹顧懐聖神開統救衰五代先徳後刑平亂四方有征無戰荆湘請覲巴蜀知歸海隅既同江左亦服臣猥以孱眇祗荷慶靈再炳元符誕彰休應封祀喬嶽陟配上𤣥䖍舉典章敢祈昭格謹以制幣犧牲粢盛庻品式伸嚴配侑神作主尚饗次詣太宗皇帝配座前行禮玉冊文維大中祥符元年嵗次戊申十月戊子朔二十四日辛亥孝子嗣皇帝臣徳昌敢昭告于皇考太宗至仁應道神功聖徳文武大明廣孝皇帝恭以欽明御宇𤣥徳應天撫泉浙之强雄除并汾之負固誕敷景化聿致太平儀抑升中功遵不宰臣猥承積慶獲荷鴻休時臻太和屢惟稔嵗大錫遐祚再炳元符紀號名山永揚徽烈謹以制幣犧牲粢盛庻品式伸嚴配侑神作主尚饗封祀玉牒文維大中祥符元年嵗次戊申十月戊子朔二十四日辛亥有宋嗣天子臣徳昌敢昭告于昊天上帝運啟大同惟宋受命太祖開階案開階宋史作肇基功成治定太宗膺圖重熙累盛粵惟沖人丕承列聖案宋史此句下有寅恭奉天憂勤聼政二語一紀于兹四隩來暨𤣥貺殊尤元符章示案宋史此句下有儲慶發祥清淨可致二語時和年豐羣生咸遂案宋史此句下有仰荷顧懐敢忘繼志二語僉議大封聿伸昭事躬陟喬嶽對越上𤣥案宋史此句下有率禮祗肅備物吉蠲以仁守位以孝奉先等語祈福下民侑神奉先天禄無疆靈休允迪萬葉其昌永保純錫禮儀使贊引皇帝復褥位亞獻終獻行事宰臣以下分祀羣神訖皇帝飲福酒攝中書令王旦跪稱天賜皇帝太元神策周而復始永綏兆民送神上詣昊天上帝座前封玉匱太祖太宗座前封金匱還立石䃭南攝太尉王旦奉玉匱于䃭中有司徹饌燔燎將作監率工人封石䃭畢禮儀使跪奏禮畢前導皇帝歸幄殿佩劔納舄樂作殿中監跪受鎮圭皇帝至御幄樂止司天跪奏慶雲繞壇月有黄輝氣宰臣率從官稱賀即日還仗奉髙宫壬子禪祭社首山如封祀之禮禪祭皇地祇玉冊文維大中祥符元年嵗次戊申十月戊子朔二十五日壬子嗣天子臣徳昌敢昭告于皇地祇無私垂祐有宋肇基命惟天啟慶賴坤儀太祖神武威震萬㝢太宗聖文徳綏九土臣恭膺寳命纘承丕緒穹昊降祥靈符下付景祚延鴻祕文昭著八表以寧五兵不試九穀豐穰百姓親比方輿所資涼徳是愧溥率同詞縉紳叶議因以時巡亦既肆類躬陳典禮祗事厚載致孝祖宗潔誠嚴配以伸大報聿修明祀本支百世黎元受祉謹以玉帛犧牲粢盛庻品備茲禋祀式表至誠皇伯考太祖啟運立極英武聖文神徳𤣥功大孝皇帝皇考太宗至仁應道神功聖徳文武大明廣孝皇帝配神作主尚饗上至山下服靴袍步出大次侍臣言山路險滑請乗步輦上曰接神在邇敢不徒行前夕隂晦風勢勁猛不能燃燭及行事風頓止天㝢澄霽燭燄凝然不動封石䃭訖紫氣䝉壇法駕還奉髙宫日重輪五色雲見鼓吹振作觀者塞路萬嵗之聲震動山谷配座金匱迴日奉置太廟本室上作登泰山謝天地述二聖功徳銘初王欽若言唐高宗𤣥宗二碑之東石壁南丘平峭欲即崖成碑以勒聖製上曰朕之功徳故無所紀若須撰述不過謝上天敷佑叙祖宗盛美是日幸仁聖天齊王炳靈公廟岱嶽觀王母池宜福寺青帝君觀天貺殿靈液亭改上泰山奉髙宫曰㑹真宫増葺室宇選道士住持焚修仍給供具物放國朝以來天下所獻珍禽奇獸悉縱于山下癸丑御朝覲壇肆赦案此赦文東都事略及長編宋史俱失載門下式觀邃古眇覿前王功成治定之餘時和嵗豐之際三靈孚佑萬㝢宅心則攷登封降禪之文率建顯垂鴻之禮無懐而下間封祀于崇巒開元以來曠講求于徽典時更五代運應千年當聖祖之開基肇平郊壘暨神宗之制作益固邦基升喬嶽以未遑謂沖人之克嗣肆予纂紹每務精勤動經畫于永圖庻奉承于先志顧惟寡徳素昧王猷遵奕世之貽謀承慶靈之逺及屬以五兵銷偃四海澄清良民合歸厚之風嘉榖茂重華之嵗荷洪符之昭錫示大厯以無疆允叶昌期實繁靈眷葳蕤絶瑞覺倍輿情是用承列聖之垂休徇衆臣之勤請聿崇大報躬造神區文物聲明具陳于法駕豆籩珪幣悉奉于彞章紫壇伸嚴配之儀玉檢視封崇之制諒三神之降鑒伊百福以潛臻輯瑞班朝率從肆覲省方問俗用慰來蘓遵王度以無愆展國容而有耀既被紛綸之景貺宜覃渙汗之洪恩冀與羣生共膺遐嘏可大赦天下云云於戲升中展采曠古之盛儀尊祖配天哲王之洪範既周旋而集事諒中外以咸歡載省眇躬獲成大禮猥當殊慶愈勵深衷思廣聼于嘉謀貴同裨于闕政更賴朝廷勲舊藩輔親賢逮諸文武之臣共立忠勤之效式扶昌運永保丕休是日上有黄氣如匹素五色雲如葢紫氣翊仗是夕次中牟縣辛丑過訾村設幄殿奉置三陵神主上鞾袍拜哭奠獻是夕晴霽始就次蒼煙白露赴陵上俄覆神幄禮畢乃散咸以為上哀慘所感案此以下為真宗大中祥符四年二月幸西京祀汾隂后土之儀原本不載年月今依宋史序訂是日帝召近臣登延慶亭南望仙掌北瞰龍門自宫至脽上列植嘉樹六師環宿行闕旌旗帟幕照耀郊次帝眺覽久之先是脽上多風及行禮頓止黄氣遶壇月重輪衆星不見惟大角光明上登鄈丘亭視汾河望梁顧左右曰此漢武帝泛樓船處也一時之樂垂于千古即日還奉祇宫鼓吹振作紫氣四塞觀者溢路民有扶老攜幼不逺千里而至者咸感泣言曰五代以來此地為戰場今乃獲覩天子巡祭實千載一時之幸赦文門下為人倫之紀律禮曰天經著王者之誠明祀惟大事凡致恭于幬載求介福于黎元已建圜封是崇方澤攷乾元之設象配乾健以同符厚徳無疆柔祇定位矧髙脽之靈境有前古之嚴祠誕集祺祥薦從禋瘞登隆祭典焜燿國容歴五運以下衰曠六飛之戾止顧予菲徳叨纂慶基欽燕翼之貽謀荷豐融之敷祐既無文而咸秩顧墜典以交修多愧眇沖獲遵盛美率由勤請勉徇輿情慰蒲津佇望之民奉鄈上親祠之事百神幽贊九服駿奔嘉瑞必升靈休允答遂涓良日式展鴻儀務極洗心以申精意薦豆籩而惟潔奠琮帛以斯嚴禮樂相資神祇胥悦集顧懐之殊貺契茂育之𤣥功是用周覽時風肆覲西后輯瑞圭而成列羅琛貢以充庭和氣沖融頌聲洋溢肇迎嘉慶適鍾神賜之祥均被華夷宜廣雲行之施可大赦天下云云於戲龐洪之慶既浹于八區眷佑之靈普臻于兆庻更賴宗親勲舊文武忠良罄同徳之端誠贊卜年之景祚庶期寰宇永洽純熙是行塗中屢有甘澤之應皆夕降晨霽從官衛兵無沾霈之患又農事方興耕民懽抃相屬三月駐蹕西京陳堯叟李宗諤來朝堯叟奏曰臣等供使職日面奉宸㫖今之祀事皆為蒸民如不擾人集事即副朕意臣等自經度訖于禮成凡土木工三百九十萬餘止役軍士至于輦送芻糧供億頓置亦未嘗科率編民上稱善久之始雍熙初議封禪特命翰林學士扈䝉宋白賈黄中右散騎常侍徐鉉兵部員外郎張洎太常丞吕端殿中丞韓頊詳定儀注真宗東封命翰林學士杜鎬待制陳彭年與禮官同撰儀注至是祀汾隂亦如之宋朝事實卷十一
