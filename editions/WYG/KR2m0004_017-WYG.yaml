body:
  text: 宋朝事實卷十七宋李攸撰削平僭偽孟昶初名仁贊及僭位改焉是時契丹破晉漢祖起并門中原旱蝗連歳昶益自大君臣奢僭及太祖下荆楚昶欲遣使朝貢王昭遠方總内外軍柄固止之太祖詔蜀之邸吏将卒先在江陵者竝放還乃給錢帛以遣乾德二年昶懼王師討伐潛遣謀者孫遇等間道齎蠟丸帛書結太原劉鈞為朝廷所獲其書云蚤歳曾奉尺書遠逹睿聽丹素備陳于翰墨歡盟已保于金蘭洎傳弔伐之嘉音實動輔車之喜色尋于襃漢添駐師徒只待靈旗之濟河便遣前鋒而出境云云先是太祖己有西伐之意而未發及得書笑曰吾出師有名矣十一月詔曰朕奄宅萬邦于茲五稔陳師鞠旅出必有名伐罪弔民動非獲已睠惟庸蜀乆限化風舞階詎識于懷柔干紀自貽于禍釁近擒獲四川偽樞密大程官孫遇二人搜得孟昶與河東劉鈞蠟書潛相表裏欲起寇戎致姦謀之自彰蓋天道之助順將定一方之亂難稽六月之師爰命將臣俾正戎律建靈旗而西指授成算以徂征言念坤維乆沈汙俗旣為民而除害必徯后以来蘇式清全蜀之封止正渠魁之罪況西川將校多是北人所宜翻然改圖轉禍為福茍執迷而不復雖後悔以何追如能引導王師供饋軍食率衆歸順舉城来降咸推不次之恩用啓自新之路重念征行之際宜申約束之文已戒師徒務遵法令不得燔盪廬舍毆掠吏民開發丘墳翦伐桑柘共體救焚之意以成不陣之功凡彼烝黎勿懐憂慮故茲詔示知朕意焉于是命忠武軍節度使王全斌充西川路行營前軍兵馬都部署武信軍節度使侍衞歩軍都指揮使崔彦進副之樞密副使王仁贍充都監龍㨗右廂都指揮使史延徳充馬軍都指揮使隴州防禦使張凝充先鋒都指揮使左神武大將軍王繼儔充壕寨使内染院使康延澤充馬軍都監翰林副使張煦充歩軍都監供奉官田仁明充壕寨都監殿直鄭璨充先鋒都監歩軍頭目向韜充先鋒都軍頭目全斌而下率禁軍歩騎二萬諸道兵一萬由鳯州路進討以給事中沈義倫為隨軍水陸轉運使又以寧江軍節度使侍衞馬軍都指揮使劉光義充歸州路行營前軍兵馬副都部署内客省使樞密承㫖曹彬充都監客省使武懐節充戰棹部署龍㨗左廂都指揮使張廷翰充馬軍都指揮使虎㨗左廂都指揮使李進卿充歩軍指揮使前階州刺史高彦暉充先鋒都指揮使右衞將軍白廷誨充壕寨使御㕑副使朱先緒充馬軍都監儀鸞副使折彦贇充歩軍都監八作副使王令嵒充先鋒都監供奉官郝守濬充壕寨都監馬歩軍都軍頭楊光美充戰棹左右廂都指揮使供奉官藥守正充戰棹左廂都監殿直劉漢卿充戰棹右廂都監自光義而下率禁軍歩騎一萬諸道兵一萬由歸州路進討以均州刺史曹翰為西南面水陸轉運使詔令孫遇等指畫江山曲折之狀及兵寨城守之處道里遠近俾畫工圖其險要上以授全斌等仍令所至之處以前詔告喻偽將吏軍民等上問全斌曰西川可取否全斌等對曰臣等仗天威遵廟算刻日可定龍㨗右廂都校史延德奏曰西蜀一方儻在天上人不能到固無可奈何若在地上以今日之兵力到卽平矣上壯其言喜曰汝等果能如此我何憂哉帝又謂全斌等曰凡克城寨止籍其器甲芻糗悉以錢帛分給戰士勿害良民十二月全斌等收復乾渠渡萬仞燕子二寨下興州偽刺史藍思綰退保西縣官軍敗蜀軍七千人獲軍糧四十餘萬石乗勝連㧞石圌魚闗白水閣二十餘寨二十八日詔曰命將出師指期殄寇今所向皆下㨗音繼来方乗破竹之功更示戰兵之令如聞收復州縣其偽署軍員兵士或投竄山林或散匿民舍俾安疑懼特用招懷詔到限一月許于逐處首身更不問罪是月史延德等進軍至三泉寨敗蜀軍數萬人生獲偽招討使山南節度使韓保正副使洋州節度李進等又獲軍糧三千餘萬石三年正月劉光義等收復三㑹巫山等寨殺偽將南光海等三千餘人案李燾長編光義等收復三㑹巫山等寨在乾徳二年冬十二月此在三年正月又宋史殺偽將南光海等八千此作三千餘人彼此互異生擒戰棹都指揮使渝州刺史袁德宏等千二百人奪戰艦二百餘艘又殺水軍三千人案長編作殺水軍六千人拔䕫州偽節度高彦儔縱火自焚原註初光義等行帝以地圖示之指䕫州鎮江處謂光義曰我軍至此泝流而上慎勿以舟師爭先當先令歩騎前行出其不意而擊之俟其稍卻即以戰棹夾攻敗之必矣及㨗奏至帝問其状果如所料詔蜀中偽將士死于兵刃暴露原野者所在郡縣速收瘞之又詔行營兵戰陣被傷者等第給賜繒帛八日詔行營馬歩兵士及諸道義軍所經之處長吏以牛酒犒之王全斌進拔利州得軍糧八十萬石崔彦進康延澤等逐蜀兵過三泉殺戮擄獲甚衆遂至嘉州進擊金山寨不破蜀人依小漫天寨至深渡旁江列陣以待我師彦進遣張萬友等擊之奪其橋㑹天暮蜀人退保大漫天寨詰朝彦進萬友與康延澤分兵三道擊之蜀人悉以精鋭来拒又大破其衆乗勝奪其寨擒寨主王審超監軍趙崇渥又獲三泉監軍劉延祚蜀將王昭遠引兵来救遇我師三戰三敗追至利州北昭遠遁去渡桔柏江焚浮橋退守劍門王師遂入利州原註先是官軍至嘉州㑹蜀人斷閣道未得進王全斌議欲取羅川路遂入康延澤謂彦進曰羅川路險諸軍難進不如督工修閣道取大路與全斌㑹于深渡彦進然之不數日閣道成遂進軍全斌等旣收復劍州殺蜀兵萬餘人生擒偽都監通奏使知樞密院事山南節度使王昭遠原註王昭遠居常好大言有雜耕渭上之志聞王師壓境對賓客援手言曰此送死来爾乗此追之當遂定中原不煩再舉也及此兵敗奔匿官倉中凡不食數日擒獲縶送京師後歴諸䘙大将軍卒馬歩軍都指揮使前洋州節度使趙崇韜原註先是王師發利州至益光全斌㑹諸將各陳進取之計侍衞軍頭向韜曰得降卒牟進言益光江東大山數重有小路名来蘇蜀人于江西置寨對岸可渡路出劒門南二十里至𤯝彊店與大路合可于此進兵則劒門之險不足恃也全斌即欲領兵赴之康延澤曰来蘇小路無煩王師自徃蜀人已與官軍相遇數戰數敗今聞併兵守劍門不知諸師協力可命偏將趨来蘇直逹青彊北至劍門與大兵夾攻破之必矣全斌等然之遂命史延德等分兵趨来蘇造浮橋于是蜀人見兵至来蘇又見橋成棄寨而遁昭逺聞延德至青彊即退兵陣于漢源坡上留偏将守劍門全斌等以鋭師直擊走破之昭遠崇韜又遁走全斌遣輕兵追之皆生致焉劉光義等收復萬施開忠四郡至遂州偽知州少府少監陳愈率其將吏出降光義即日入城安撫盡出府庫錢帛以給軍士原註初諸将入辭帝戒曰所復郡縣當發帑藏為朕賞戰士國家所取惟土疆耳至是人皆効命所至成功如席卷之易王師由劒門而入昶益惶懼問計于左右有老將石斌案石斌長編作石奉頵此與宋史合對以王師遠来勢不能乆請聚兵固守以老之昶歎曰吾父子以豐衣美食養士四十年及遇敵不能與我東嚮發一箭今若閉壘何人與我効命乃遣偽通奏使伊審證齎表詣全斌請降其表曰三皇御宇萬邦歸有道之君五帝垂衣六合順無為之化其或未知厯數猶昧死亡致興貔虎之師實懼雷霆之怒敢祈英睿俯聽哀鳴伏念臣生自并門長于蜀土幸以先臣之基業獲從幼歳以纂承只知四序之推遷不覺三靈之改卜爰自大明出震盛德居尊聲教被于遐荒慶澤流于中夏當凝旒正殿虧以小事大之儀及告類圜丘曠執贄奉琛之義素居遐僻久阻聲明曽無先覺之心固有後時之責今則皇威電赫聖略風馳干戈所指而無前鼙鼓纔臨而自潰山河郡縣半入于提封將卒倉儲盡歸于圖籍且念臣中外骨肉二百餘人高堂有親七十非遠弱齡侍奉只在庭闈日承訓撫之恩粗勤孝飬之道實願克修甘㫖保此衰年次望免子孫之暌離守血食之祭祀敢冀容之如地葢之如天特軫仁慈以寛厄辱臣輒援故事上瀆嚴聰竊念劉禪有安樂之封叔寶有長城之號皆自歸款盡獲生全願眇昧之餘魂得保家而為幸使先臣寢廟不為樵採之場老母庭闈尚有問安之所已令緘封府庫肅靖軍資用付典司將期臨照今則車書混其文範正朔奉以靈臺敢布腹心恭聽赦宥臣昶謹率文武見任官望闕再拜上表歸命披瀝肝膽以聞全斌等既受其降遣馬軍都監康延澤先以百騎入城見昶諭以恩信留三日盡封府庫而還昶又遣其弟仁贄詣闕上表曰臣歴觀先覺克奉忠區竇融受累世之封吳芮襲傳家之慶愚者暗于成事智者見于未萌則臣在執迷以何多致顛沛之如是罪豈容于擢髮形可寘于磔尸既無遠慮之明甘受後期之責伏念先臣受命唐室建牙蜀川因時事之變更為人心之擁迫先臣即世臣方丱年猥以童䝉謬承餘緒乖以小事大之禮闕稱藩奉國之誠染習偷安因循積歳所以上煩神算遠發王師勢甚疾雷敏如破竹顧惟懦卒焉敢當鋒尋束手以云歸正傾心而俟命今月七日已令私署通奏使宣徽南院使伊審證奉表歸降以前路寇攘前進不得臣尋更令兵士援送至十一日尚恐前表未逹續遣供奉官王茂隆再齎前表至十二日以後相次方到軍前料惟血誠上達睿聽臣今月十九日已領親男諸弟納降禮于軍門至于老母諸孫延餘息于私第陛下至仁廣覆大德好生顧臣假息于數年所望全軀于今日今䝉元戎慰䘏監護撫安若非天地之垂慈豈見軍民之受賜臣自量過咎尚切憂疑謹遣親弟詣闕奉表待罪以聞太祖賜詔曰朕以受命上蒼臨制中土姑務保民而崇德豈思右武而佳兵至于興戎蓋非獲已矧惟蜀郡僻處一隅靡思僭竊之愆輒肆窺覦之志潛結并寇自起釁端爰命偏師徃申弔伐靈旗所指逆壘自平朕常中夜憮然念兆民何罪屢馳驛騎嚴戒兵鋒務宣拯溺之懷以盡招攜之禮而卿果能率官屬而請命拜表疏以祈恩託以慈親保其宗祀悉封府庫以待王師追咎改圖將自求于多福匿瑕含垢當盡滌于前非朕不食言爾其無慮昶乃舉族與官屬由峽而下至江陵上遣皇城使竇儼迎勞之昶與母至襄陽復遣使齎詔賜茶藥所賜詔不名仍呼昶母為國母昶將至命太宗勞于近郊昶率子弟素服待罪闕下時乾德三年也帝以昶来降意嘉之詔翰林學士承㫖陶榖等約前代儀制草定受降之禮正月十六日昶至前一日有司設御座于崇元殿陳仗衞于庭如元㑹之儀又為昶及偽官屬設次于明德門外設表案于門横街之北是日大陳馬歩諸軍于天街左右昶及弟偽官李昊等三十二人至闕下皆素服紗㡌通事舍人引昶于表案南序立北向偽官屬皆班于昶後置待罪表于案昶跪授閤門使持表入昶等還位序立以俟命表至帝前侍臣讀訖閤門使承㫖出宣昶等悉俯伏于地通事舍人二員掖昶起偽官屬皆起竝鞠躬聽命閤門使宣制釋罪昶等再拜三呼萬歳閤門使又承㫖賜昶等襲衣冠帶衣庫使導所賜陳于前昶再拜跪受各就次易服乗馬昶至升龍門下馬官屬至啓運門下馬就次入見于崇元殿帝衮服升座軸簾郤扇文武百官先入起居訖分班東西相向閤門使引昶等入起居舞蹈稱謝宣徽使承㫖喚昶升殿昶等皆再拜偽官屬依位序立通事舍人引昶升自東階宣徽使承㫖安撫至御座前鞠躬帝親撫問之昶還位與官屬皆舞蹈再拜三呼萬歳昶出中書門下率百僚稱賀禮畢御明德門宣赦門下伐罪弔民所以昭宣王略眚災肆赦所以盪滌羣非稽有國之舊章蓋哲王之能事朕飛龍撫運躍馬興邦雖禹别九州盡為王土而蜀川一境猶隔華風天兵飛渡于劍門蜀主哀號而納款念其生聚曲為保全宜推曠蕩之恩用慰傷殘之俗易苛政以平恕革重斂為輕徭用舉宏綱正我王度自乾德三年正月二十四日昧爽以前應偽蜀管内罪無輕重常赦所不原者咸赦除之自乾徳二年終所有殘欠租税竝與除放仍特放今年夏税及沿納諸雜物色等一半兼令逐州子細分析自前諸色税賦及科配煩重名目聞奏當與等第永遠減放應敗闕場務仍各具事申奏當議指揮西川城内人戸食鹽偽蜀估定每斤一百六十文足陌令每斤特減六十文足陌今後只定一百文足陌所有諸州鹽各取逐處價例三分中與減一分應鄉村不濟人戸闕少糧食者委逐處官吏開倉賑貸候豐熟日令人戸一斗只納一斗昨者收復之際亦已嚴切指揮或慮諸軍擄得丁口便仰各放還本主不得更有隱藏如敢固違當行嚴斷其偽蜀内外文武臣僚及將校職員等能奉其主歸我大朝念茲通變之方宜預旌酬之寵各令分析名銜申奏當與加恩管内應有負罪逃竄之人亡命山林之輩限赦到一月内許自陳首竝仰放罪仍令逐處長吏倍加安撫如限滿不自陳首復罪如初乃睠劍南北為内地自累朝之艱否據千里之江山豈無沈滯之人宜下旁求之詔所在州郡及山林有懷才負藝未霑寸祿者委長吏聞奏先賢丘壠不得樵採古来廟宇咸與修崇其餘節婦義夫順孫孝子有堪旌賞當議舉明官吏軍民各勤職業樂予景運當慶新恩告示一方咸知朕意是日宴近臣及昶等于大明殿昶奉觴上壽是日又賜昶玉帶金鞌勒馬金器千兩銀器萬兩錦綺千段衣著萬匹賜昶母李氏金器三百兩銀器二千兩錦綺千段絹千匹自仁贄𤣥喆李昊等恩賜各有差先是帝詔有司于右掖門街臨汴水起大第五百間以待昶供帳悉備至是賜之又為其偽官屬各營居第翼日詔曰伯禹導川黑水本梁州之域河圖括象岷山直井絡之墟是曰坤維素為王土屬中原多故四海羣飛遂割裂于山河競僭竊于位號朕削平㝢縣載整皇綱復周漢之舊疆寵綏羣后采唐虞之大訓協和萬邦六年于茲百揆時叙禮樂征伐之柄盡出朝廷蠻夷山海之君咸修職貢一昨順長庚而授律法時雨以興師先申誕告之文以慰徯来之衆咨爾偽蜀主孟昶克承餘緒保據一隅擅正朔以自專歴歳年以滋乆而能屬王師之致討察天道之惡盈體此綏懷思于効順盡率官吏来降軍門抗手疏以陳誠伏天閽而請命是用昭示大信盡滌汝瑕度越彝章升于崇秩冠紫微之近署以奉内朝翦鶉首之奥區為之封邑率從異數式洽殊私爾宜欽承徃踐厥位可開府儀同三司檢校太師兼中書令秦國公給上鎮節度使俸祿餘偽官除拜有差昶數日卒年四十七太祖廢朝五日素服發哀于大明殿贈中書令追封楚王諡恭孝賻布帛千匹葬事官給後數日其母李氏亦卒初李氏隨昶至京師太祖數命肩輿入宫勞之曰母善自愛無戚戚懐鄉土異日當送母歸李氏曰使妾安徃太祖曰歸蜀爾李氏曰妾家本太原儻得歸老并土妾之願也時晉陽未平太祖聞其言大喜曰俟平劉鈞即如母所願因厚加賜賚及昶卒不哭以酒酹地曰汝不能死社稷貪生以至此吾所以忍死者以汝在爾今汝既死吾何生焉因不食數日卒太祖聞而傷之賻贈加等與昶俱𦵏洛陽詔發奉義甲士七千人䕶送七月正衙備禮冊命昶其文曰維乾德三年歳次乙丑七月己未朔二十四日戊子案朔日是己未則二十四日是壬午若二十四日是戊子則朔日是乙丑據宋史太祖本紀七月壬辰追封孟昶為楚王下書丁酉又書八月戊戌朔是七月己巳朔二十四日壬辰附註備攷皇帝若曰咨爾故檢校太師兼中書令秦國公孟昶夫冊贈之典所以彰世祚而紀勲伐繼絶之義所以旌異域而表来庭茍匪全功寧兼二者國家承乾撫運括地開圖稽至德于勲華體深仁于湯禹既定壺關之亂復翦淮夷之兇暨荆及衡洗蕩逋穢以為人君之道先德而後刑王者之師有征而無戰兵威震疊寰宇来同以致薄伐西川徂征三峡惟爾昶襲乃堂構據有巴庸而能祗畏皇靈保全宗緒知機識變委順圖全馳子牟魏闕之心奉伯禹塗山之㑹朕自聞獻款良切虛懐舟車欣至止之初邸第錫非常之制封崇異數期保永年景命不融奄然殂謝嗚呼爾有及親之孝特異常倫爾有奉上之情所期終養何高穹之不祐與幽壤以同歸斯朕所以當宁興悲徹縣永歎詢于史氏申命禮官今遣使起復雲飛將軍檢校太傅右神武統軍兼御史大夫上柱國平昌縣開國伯食邑七百戸孟仁贄持節冊贈爾為尚書令仍追封楚王嗚呼式備哀榮載光簡牒南宫峻秩全楚大邦併示追崇夐超彝制始終之分朕無愧焉尚冀英魂歆兹盛禮嗚呼哀哉禮畢其冊載以犢車設鹵簿鼓吹導至其第冊及門主人迎冊使入是日仍賜昶墳莊一區給守墳人米千石錢五十萬案宋史作五萬初昶在蜀專務奢靡為七寶溺器他物稱是每歳除命學士為詞題桃符置寢門左右末年學士韋寅遜撰詞以其非工昶自命筆題云新年納餘慶嘉節號長春昶以其年正月十一日降太祖命呂餘慶知成都而長春乃太祖誕聖節名也又昶襲位後民質錢取息者將徙居必書其門曰召主取贖其末年西川婦女競理髪為高髻號朝天髻始周世宗平淮甸克關南議討而未果至太祖乃平之自始伐至降凡六十六日昶父子據有二蜀三十一年至是國除王全斌既平蜀部下多漁奪民財及凱旋太祖盡得其狀召行營都監王仁贍面詰之仁贍歴詆諸將所為奢縱不法冀以自解且曰清廉畏慎不辜陛下任使者惟有曹彬一人耳即日授彬宣徽南院使彬入奏曰征西諸將皆獲罪臣獨受賞何以寧處上曰卿有功無過又不自矜茍若有纖芥之累王仁贍豈有為卿隱耶勸懲國之常典可無讓也蜀平得州府四十六益彭眉嘉緜漢資簡梓遂黎雅陵戎瀘維茂昌榮原註闕文閬渠合龍普利原註闕文渝涪黔施達洋原注闕文百四十戸五十三萬四原註闕文十案長編蜀平得州四六縣二百四十戸五十三萬四千二十九宋史載得州四十五縣一百九十此書大略與長編相合李筠在鎮擅其征賦頗招集亡命嘗以私忿囚監軍使世宗不能堪但下詔責讓而已至是遂以建隆元年四月十四日叛太祖遣侍衞親軍副都指揮使歸德軍節度使石守信殿前副都指揮㸃檢義成軍節度使高懐德率諸軍進討五月二日又命宣徽南院使昝居潤赴澶州巡警詔殿前都㸃檢昭化軍節度使慕容延釗彰德軍節度觀察留後王全斌由東路㑹兵進討前德州刺史曹翰前耀州刺史張暉竝充行營壕寨使由東路與守信等合敕守信等曰勿縱筠下太行急進師扼其隘破之必矣帝乃下詔曰違天逆命不可以逋誅伐罪弔民式慰其徯望昭義軍節度檢校太師兼中書令李筠出于賤隸驟列通侯詭譎多端包藏有素朕以皇天眷命厯數在躬念同事于前朝每曲形于厚禮推赤心而示信指天日以申盟而不體予懐自隳爾節窺覦神器俶擾天常囚辱使臣䖍劉民吏結劉鈞于幷壘害張福于高平肆其兇謀干我大戮國有常憲人其舍諸將申齊斧之刑用致靈旗之討李筠宜削奪在身官爵令諸道㑹兵進擊宥其驅脅實前王之令猷示以招懷亦吾民之何罪黎城舊壤上黨名區俗本貞純人知節義豈私從亂必自改圖茍去危以就安可轉禍而為福立功名于當世保富貴以終身勿成染汙之風自取覆亡之咎凡爾士庶當體朕懷五月十九日内降手詔親征朕仰膺天睠肇啓皇圖念可畏之非民敢無名而動衆李筠不知天命犯我王誅棄帶河礪嶽之恩為干紀亂常之事已行攻討即俟盪平當九夏之炎蒸念六師之勞苦深居宮闕情所難安當議省巡用伸慰撫朕取此月内暫幸軍前所司供頓務從儉約郡國長吏不得擅赴行在兩京留司官起居表章傳置以聞勿令勞擾以稱朕意以二十四日次滎陽西京留守向拱河陽節度使趙晁来朝太祖召拱與語拱曰李筠逆節乆露兵勢漸盛陛下宜速濟大河歴太行乗其未集而擊之平賊必矣若稽留浹旬臣恐賊鋒益熾攻之難力矣帝深然之其月石守信敗筠軍于長平斬首三千餘級拔大㑹寨十九日命侍衞親軍都指揮使天平軍節度使韓令坤率兵屯河陽石守信高懐德又破筠衆三萬于澤州獲偽河東節度使范守圖降河東援軍數千皆殺之原註初筠送款于河東劉鈞及王師至筠求援于鈞鈞遣守圖等赴之至是并獲焉帝以親駕大赦天下門下天生五材武可以厎寧禍亂君有一德恩所以輯睦兆民爰自睠命自天膺圖開國繄朕寡昧勉徇樂推式造新邦務求治道郡縣小大之政必切躬親蕃宣勲舊之臣敢忘禮遇以四海樂康為念以一物失所為憂勿敢怠荒庶期開泰不謂壺關之地分野纏災守臣無事以生疑同惡望風而相濟朕推心勉諭屈己俯從和氣不能易豺狼之心平地于是作荆榛之路昨者長驅禁旅直上太行始戮賊軍尋平澤潞鋒交矢接瓦解冰消潞州既逼危亡尋輸降款契我好生之意各覃加等之恩一境熙春萬家安堵既豁黔黎之望實憑宗社之靈重念將士同心服干戈而展効官吏奉職部力役以有勞将同慶于域中宜大賚于天下應天下見禁罪人自六月二十三日昧爽以前云云原註餘同本傳李重進九月反狀聞太祖遣石守信王審琦李處耘宋偓等四將率禁兵討之仍令友規䕶前軍案仍令云云當是上文已載友規為傳寫者脱佚據長編揚州都監右屯将軍安友規知重進必反踰城来奔至是果反故仍令䕶前軍討之乃下詔曰黄軒御極嘗行中冀之誅虞舜登庸先正四凶之罪芘民靖亂何莫由斯朕以歴試艱難肇膺眷命務輯寧于華夏思康濟于黎元爰整鋭師濯征多壘慰其徯后匪曰佳兵新授平盧軍節度淄青等州觀察使檢校太師兼中書令李重進位列公侯任隆藩翰自皇家之起運包異志以無君朕法天無私與物更始特含垢以宥罪聽改行而自新申撫諭于璽書形誓言于金券特遷大鎮用保永圖而敢固守孤城拒違王命此而可忍孰不可忍宜正彝章用懲大憝其李重進在身官爵竝宜削奪上謂左右曰朕于周室近臣無所圖間重進不體朕心自懷反側今大師在野朕當自慰撫之十月二十一日内降手詔曰朕以反臣負國兇黨嬰城勞將帥以征行救生靈之塗炭重念䝉犯霜露跋渉山川將親示于撫循須暫離于京闕朕取今月内幸揚州凡所供須務令省約方期靖亂無至勞人餘依征澤潞詔書從事原註餘同本傳陳洪進入朝以其地来歸太宗優詔嘉納之以洪進為武寧軍節度同平章事留京師奉朝請諸子皆授以近郡五月一日降德音門下朕纂紹基圖臨御區宇慶五兵之銷偃致四海之混同顧惟動植之間悉被生成之澤念清源之一境隔朝化以多年江山雖在于照臨黎庶未霑于恩惠節度使陳洪進素懷明略喜遇昌期偃戎節以来朝錄地圖而上進今者川塗無壅聲教大同宜覃寛宥之恩俾洽維新之化應泉漳等州管内州縣諸色罪人限德音到日竝從釋放云云於戲同文共軌荷宗社之殊休恤物愛民乃帝王之常道矧惟遠俗初被皇風用安歸嚮之心倍注撫柔之意降九天之雨露蘇比屋之生靈必令其萬戸千門永樂于輕徭薄賦凡爾衆庶當體朕懷主者施行太宗征太原次澶淵太僕寺丞宋㨗者掌出納行在軍儲迎謁道左太宗見姓名喜以為我師有必㨗之兆車駕將至令語攻城諸將曰我端午日置酒宴㑹于太原城中至癸未繼元降乃五月五日也太宗朝平蜀賊李順原註劉旰附淳化四年青城縣民王小波聚徒起而為亂謂其衆曰吾疾貧富不均今為汝均之貧民附者益衆先是國家平孟氏之亂成都府庫之物悉載歸于内府後来任事者競功利于常賦外更置博買務禁商旅不得私市布帛蜀地土狹民稠耕稼不足以給由是羣衆起而為亂二月殺彭山縣令齊元振十二月與巡檢張玘鬭于江原縣玘死之小波亦病創卒衆推小波妻弟李順以淳化五年正月叛攻邛蜀二郡官吏多被其害又敗都巡檢郭允能于新津賊勢益盛衆附者數萬永康軍雙流新津温江郫縣皆為順所陷縱火大掠遂進攻成都既陷成都知府事郭載率官吏奔東川賊遂據成都上命昭宣使河州團練使王繼恩為劍南兩川招安使率兵討之以便宜決遣又命樞密直學士張詠知成都府案長編據成都志及宋祁所作墓誌韓琦所作碑謂詠知成都乃是春除既而留不行至九月代雷有終任實錄及㑹要竝于是春即書以張詠知成都誤矣此書亦仍實錄會要之誤雷有終裴莊劉錫周渭等掌川峽隨軍漕運馬歩軍都軍頭王杲率兵趨劔門崇儀使尹元率兵由峽路而進竝受繼恩節制又命成都府監軍供奉官宿翰為崇儀使先是羣盜自成都分攻劔門翰先自成都領兵投劔門適與正兵合案長編李順分兵攻劔門都監西京作坊副使上官正禦之㑹宿翰領兵至破之上喜以正為六宅使劔州刺史充劔門兵馬部署翰為崇儀使昭州刺史此云與正兵合不載上官之姓當是上文有脱佚因迎擊大破賊衆數千人餘三百人奔歸成都順怒其驚衆盡殺之奏至上嘉翰功故有是命三月詔繼恩朕以兇民嘯聚蜀郡驚騷俾聊舉于軍師務速令于平盪已聞虎旅將覆梟巢既顯戮于鯨鯢慮俱焚于玉石頃令分别用振恩威宜令王繼恩候前軍所到處其賊黨等或敢恣兇頑或輒行拒抗即盡加殺戮不得存留其有或先被脅從或自能歸順更不問罪竝與安存不惟推好生惡殺之心亦用舉懲惡勸善之典諒爾將兵之意知予及物之恩四月繼恩由小劔門路入研石寨破賊斬首五百級遂北過青彊嶺平劔州進破賊五千衆于柳池驛斬首六百級賊衆望風奔走殺戮溺死者不可勝計又克閬緜二州五月至成都破賊十餘萬斬首三萬級獲順及偽官甚衆及議賞功中書欲除宣徽使太宗曰朕讀前代書史不欲令宦官預政事宣徽使執政之漸也止可授以他官宰相懇言繼恩有大功非此任無足以議賞典上深怒責丞相等命學士張洎錢若水議别立宣政使序位于昭宣使之上以授之繼恩握重兵乆留成都轉餉不給專以飲宴為務每出入前後奏音樂又令騎兵執博局棊枰自隨威振郡縣僕使軰用事恣横縱所部剽掠子女金帛坐而翫寇軍士亦無鬭志餘賊竄伏山谷間州縣有復陷者太宗知之乃命入内押班衞紹欽同領其事命給事中參知政事趙昌言充川峽路兵馬都部署自宣政使王繼恩以下皆聽其節度御札數幅丁寧授以方略姦黨悉平至道二年春布衣韓拱辰詣闕上言繼恩有平賊大功當秉機務今薄賞無以慰中外之望上大怒以拱辰妖言惑衆杖脊黥面配崖州俄召繼恩還又有劉旴者廣武指揮軍卒也至道三年八月都巡檢使韓景祐至懷安軍旴謀殺景祐而叛是夜三鼓嘯聚軍士逐景祐景祐踰垣遁逸遂掠懐安及漢蜀邛州永康軍招安使上官正即與鈐轄馬知節領兵趨新津賊出邛州方井擊敗之斬旴盡平其黨九月太宗因言西川叛卒事輔臣或曰蓋地無城池所以失其制禦上曰儻官吏得人善于綏撫使其樂業雖無城可也昌言為人辯智于上前指畫破賊之䇿上悦之恩遇甚厚既行時有峨眉山僧茂真以術得幸謂上曰昌言額紋有反相不宜委以蜀事上方悔之㑹昌言至鳳翔是時寇準知州密上言趙昌言素有重名又無子息不可征蜀授以兵柄太宗得疏大驚曰朝廷皆無忠臣言莫及此賴有寇準憂國家爾乃詔昌言以軍事付王繼恩罷知政事以戸部侍郎知鳳翔召寇準參知政事西川招安使王繼恩部送賊酋句重榮等五軰詣闕上曰汝曹本非為惡但官吏失于撫御致爾為盗及兵興武人務在立功肆行殺戮爾軰懼死亡命耳朕今諭以恩信不忍誅也皆釋甲放之太宗聞蜀賊起顧侍臣曰蜀土之民近歳日益繁盛但習俗囂浮多事遨賞物極必反今小寇驚動豈天意抑其浮華耶呂䝉正曰昔楚莊小國之君常懼無災今昇平之代遠方忽有狂寇亦恐天垂警戒呂端曰䝉正之言望陛下留意上深納之宋朝事實卷十七
