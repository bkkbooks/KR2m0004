body:
  text: 宋朝事實卷八宋李攸撰玉牒宋有天下百餘年所與分天工共民事者皆取之疎逺側㣲不私其親故宗室之賢未有以勲名聞者神宗皇帝實始慨然欲出其英材與天下共之増立教養選舉之法所以封植琢磨之者甚備行之二十年而文武之器彬彬稍見焉上嘗語及宗室多求外居者宰相韓琦曰臣請許親盡無服者外居然後因之試以外官上曰宗子素未諳民政若補外官但慮易致過失爾琦曰陛下若命宗室習律令久之何患其不能從政也參知政事趙槩曰人臣子弟未必皆有過人之才使之從政尚能粗了局事蓋積習使然宗室固多美才若擇而任之庻幾漸知為政之方也上曰五七年漸當以外官試之案此條但稱上語宰相云云不指為何代攷宋史韓琦于仁宗嘉祐三年六月拜同平章事趙槩于嘉祐七年三月除參知政事是時琦與槩並為宰執此當為仁宗嘉祐七年以後事也富弼議裁損宗室授官英宗問輔臣前代宗室樞宻使富弼對曰唐之名臣多出宗室樞密副使吳奎曰祖宗時宗室皆近親然初授止于殿直侍禁供奉官不如今之過也朝廷必為無窮計當有所裁損上然之徽宗朝増神宗教養選舉法尚書右僕射蔡京等言伏攷宗室在祖宗朝制祿蓋寡至仁宗時始除南班官自率府副率凡五六遷遂至正任承平日久皇支寖繁神宗皇帝乃下詔書别其親疎異其等殺遂斷自祖宗袒免親罷補環衛之官盡除班行名目袒免以外更不賜名授官止許應舉自熙寧至今宗室人無官者已一千五百餘人宗女之未嫁者亦千五百有奇皆宣祖太祖之裔或有貧困失所者臣等伏攷神宗詔書蓋為袒免既已賜名授官若願應舉者自當依進士法其非袒免既不賜名授官故止令量試藝業即推恩數非若應進士舉之難也至于年長累試不中則又有特與推恩量材録用之制則隨其材器收録盡矣至于世數稍逺及貧無依者則又賜田存恤有差逮元祐紛更廢量試之法改依進士科舉之制是以自熙寧至元符初三十餘年中科舉者才二十餘人既廢量試之法亦未嘗有以年長推恩者賜田之令徒為虚文雖有量給錢米之法未能周濟其乏遂致宗室不能自給臣等謹追攷神宗詔書推原本㫖稽之往者増以當今所可行者謹條具如右一非袒免親乃祖宗六世孫伏請將上件服屬宗室二十五以上者今次許于禮部投狀試經義或律義一道以文理稍通者為合格分為兩等候至來春附進士榜推恩内文藝優長者臨時取㫖其不能試或試不中者並赴禮部書家狀讀律列作一項奏名今來止為前此未曽推廣補攷量試推恩之令致使宗室無官者遂衆有此陳請只作一時指揮不為永法今後自依熙寧詔書賜田並于兩京近輔沿流州軍取應未賣官田物業撥充每州府各置宗室官莊専差文武官各一員與逐州通判同行管幹逐縣兼管仍置指揮使二員每嵗量入為出宗女量給嫁資仍立定則例量支嫁娶喪𦵏之費其逐州自今後有沒官田産物業更不出賣並撥入官莊仍先于京西北路撥田一萬頃一熙寧詔書袒免以下許隨處置産業其出官即置田宅一如外官之法蓋以宗支寖廣其疎屬理當聴其外居勘㑹宗室舊來在宫有出入之限有不許外交之禁宫門有譏察之令今疎屬外居僅遍都下出入無禁交遊不節往往冒犯法禁伏請非袒免親以下兩世欲分于西京南京近輔或沿流便近居止各隨州郡大小創置屋宇仍先自西京為始每處置敦宗院差文臣一員武臣一員管幹參酌在京院法禁可施行者頒下應無父母兄弟見任將軍副使以上官者許令前去若有父母兄弟而願去或無而不願者聴從便依外官赴任立法量給舟船接人一乞依神宗詔書不拘世數應宗子宗女尤貧失所者伏請委所在州郡報明量加存恤訖奏一乞于兩京置外宗正司官掌業所在宗室擇宗室之賢者管勾外宗正事仍自朝廷于本州通判職官内選差二人兼領丞簿以主其事一乞隨所在諸宫置學添教授立法教養量試宗室依熙寧文武官試出官法策試經義中選者許令出官若再試不中者止許在宫院使食其禄一神考釐正宗室袒免非袒免各立奏補子孫之法獨緦麻親舊用國䕃自來未有䕃孫以下明文伏請依外官例得補䕃孫一舊制宗室袒免親參選常許不拘名次陳乞指名差遣非袒免親初選依條添差外更不拘名次陳乞指名差遣一次以後每到部與陞一年名次陳乞今後宗室非袒免以下親量試出官者並各于員闕外添差每大郡通屬縣不得過十人中郡不得過七人小郡不得過四人候到任不簽書本職公事如有本轄長貳或監司二人保奏堪任釐務方得供職未釐務者添支驛劵供給人從從之宗室賜名授官孝字親王之子授武衛將軍其餘宗室不用此例祖宗緦麻親賜名承字男賜名克字宗字男賜名仲字從字男賜名世字授官太子右内率府副率祖宗袒免親賜名克字男賜名叔字仲字男賜名士字世字男賜名令字授官右班殿直祖宗非袒免親不賜原註熙寧二年以前叔字男賜名之字士字男賜名不字令字男賜名子字奏薦原註熙寧二年以前授太子右内率府副率以上承字宗字磨勘至使相止從字仲字世字至觀察使止叔字士字令字授副率者至遥郡防禦使止之字不字子字賜名授官者至遙郡刺史止襲封原註國朝舊制諸王之後用本宫最長一人封公繼襲熙寧二年十一月敕祖宗之子皆擇其後一人為宗令世世封公補環衛之官以奉祭祀不以服屬盡故殺其恩禮案宋史秦王廷美傳熙寧二年詔宣祖太祖太宗之後擇一人封公世襲無補環衛官之句而神宗本紀是年十一月甲戌詔祖宗之後世襲補外官與此環衛之官亦異存此偹攷祖宗之子並傳嫡襲封原註熙寧二年閏十一月五日聖㫖祖宗之子並令傳嫡襲封宗案宋史秦王廷美傳熙寧三年以太常禮院言令祖之子傳嫡襲封神宗本紀亦作三年七月詳定宗室襲封制度此書作二年與宋史互異濮安懿王諸子案熙寧十年十月詔濮王子以次襲封奉祀此條濮安懿王諸子句下有闕文並脫去小註宗室轉官資級圖原註并料錢節度使兼侍中案宋史宗室敘遷之制由節度使同中書門下平章事轉節度使兼侍中節度使同中書門下平章事即使相也原本使字上脱節度二字侍中字上脱兼字今從宋史補正使相左衛上將軍右衛上將軍節度使三級原註四百貫節度觀察留後案宋制節度觀察留後月俸三百貫觀察使防禦使並二百貫此書誤以觀察留後為留後觀察而于防禦使之上脱觀察使三字將觀察留後及觀察使二職混而為一今從宋史改正二級原註三百貫觀察使防禦使一級原註二百貫團練使遥郡防禦使一級原註一百五十貫刺史遙郡團練使一級原註一百貫遙郡刺史案自此遙郡刺史以下至衛將軍月俸若干貫各有不同攷宋史職官志皇親任諸衛大將軍領刺史八十千將軍領刺史六十千將軍三十千率府率二十千副率十五千蓋宗室俸禄之制與敘遷之制不同故諸衛大將軍本六十千兼領刺史則增為八十千將軍本三十千兼領刺史則增為六十千矣此書俱闕註附識偹攷一級左右衛大將軍左右金吾衛大將軍左右龍武軍大將軍左右羽林軍大將軍左右神武軍大將軍左右驍衛大將軍左右武衛大將軍左右屯田衛大將軍左右領軍衛大將軍左右監門衛大將軍左右千牛衛大將軍一級左右衛將軍左右金吾衛將軍左右龍武衛將軍左右羽林軍將軍左右神武軍將軍左右驍衛將軍左右監門衛將軍左右千牛衛將軍左右領軍衛將軍一級太子左右衛率府率太子左右司禦率府率太子左右清道率府率太子左右監門率府副率太子左右内率府副率一級原註十五貫宗室換官案宋制有文臣換右職武臣換文資俱見宋史職官志至宗室換官之制則略而不書此足補其闕諸衛將軍原註就文官者換太常丞就武官者換率府率率府率原註就文官者換太子中允就武官者換内殿崇班率府副率原註就文官者換大理評事就武官者換西頭供俸官左右班殿直原註换試銜知縣三班奉職借職原註無専條以上須袒免親將軍以下方許換出外官其大將軍以上願換外官者並臨時取㫖宗室轉官資級太子右内率府副率原註轉太子右監門率府率太子右監門率府率原註轉右千牛衛將軍右千牛衛將軍原註轉右監門衛大將軍右案宋史職官志千牛衛將軍當轉右監門衛大將軍監門衛大將軍轉遙郡刺史原本右千牛衛將軍下脱小註轉右監門衛大將軍并大字右監門衛大將軍十五字今從宋史増入右監門衛大將軍原註轉遙郡刺史遙郡刺史原註轉遙郡團練使繼諸王後見封國公特㫖即轉正刺史遙郡團練使原註轉遙郡防禦使繼諸王後見封國公及特㫖即轉團練使案轉遙郡防禦使原本誤作團練使今從宋史職官志攷正刺史原註轉團練使團練使原註轉防禦使練案宋制宗室敘遷之制團練使轉防禦使原本團使下多遥郡防禦使五字今從宋史删去防禦使原註轉觀察使觀察使原註轉節度觀察留後節度觀察留後原註轉節度使特㫖轉左右衛上將軍左右衛上將軍節度使原註轉節度使同中書門下平章事節度使同中書門下平章事原註轉節度使兼侍中宣祖五子太祖皇帝太宗皇帝邕王光濟秦王廷美原註本名光美䕫王光贊案光濟早亡宋初追封邕王徽宗時改封曹王廷美太宗初封齊王進封秦王太平興國七年降涪縣公九年追封涪王真宗復秦王徽宗改封魏王光贊幼亡宋初追封䕫王徽宗改封岐王攷東都事略及宋史皆書其最後徽宗時封國故光濟稱曹王廷美稱魏王光贊稱岐王而此書則書太祖時封國為號體例與各書不同太祖四子楚王徳秀燕王徳昭舒王徳林秦王徳芳原註太宗嘗謂宰相曰徳昭徳芳先帝之子朕篤愛之猶子也不欲異其稱呼當令有司與昭慶公主而下依舊稱皇子封案東都事略徳秀早亡徽宗追賜名封滕王徳昭初武功郡王太平興國四年追封魏王英宗改封越王徽宗改封吳王徳芳太宗追封岐王楚王徽宗改封秦王宋史並同攷徳秀未嘗封楚王徳昭未嘗封燕王于徳芳則又書其最後封國為號與本書體例復不合疑有訛誤太宗九子楚王元佐真宗皇帝案東都事略及宋史太宗九子長漢王次昭成太子次真宗今此書列真宗于昭成太子之前與各書互異昭成太子元僖陳王元份安王元傑宻王元偓曹王元偁涇王元儼代國公元億案宋史元佐原名徳崇初封衛王進封楚王改今名雍熙二年廢為庶人真宗即位復楚王追封齊王潞王英宗封魏王徽宗改封漢王昭成太子初名徳明封廣平郡王進封陳王改名元佑後改今名進許王追贈太子諡恭孝改諡昭成元份初名徳嚴改名元俊封冀王又改今名封越王真宗改雍王追封陳王潤王英宗改魯王徽宗改封商王元傑初名徳保後改今名封益王真宗封兖王追封安王邢王英宗改封陳王徽宗封越王元偓初封徐國公真宗封彭城郡王進寧王徐王追封鄧王宻王英宗封韓王徽宗封鎮王元偁初封安定郡王進舒王追封曹王華王英宗封蔡王徽宗封楚王元儼初封曹國公真宗封廣陵郡王進封榮王尋降端王改彭王通王涇王仁宗封定王荆王追封燕王英宗封吳王徽宗改封周王元億早亡追賜名封代國公英宗封安定郡王徽宗改封崇王此書于太宗諸子皆書其始沒時追贈封國為號而于元偓不書鄧王而書宻王于元儼不書燕王而書涇王則又自亂其例矣仁宗四子襃王昉豫王昕鄂王曦英宗皇帝案太宗諸子以後應繼以真宗諸子永樂大典原本附玉牒于祖宗世次之後自真宗及英宗以下世次既闕而諸子玉牒亦復不詳公主秦國長公主嘗為子莊宅使世隆求正刺史案宋史秦國長公主即太祖女昭慶公主太宗改封秦國真宗時進長公主下嫁王承衍子世隆為如京副使厯洛苑六宅二使不言其為莊宅使此足補宋史之闕真宗曰正刺史係朝廷公議不可魯國長公主案宋史魯國長公主即太祖女延慶公主至元符初追封魯國為翰林醫官使趙自化求尚食使兼醫官院事上謂王繼英曰雍王元份亦為自化求遙郡朕以遙郡非醫官所領此固不可也駙馬都尉石保吉自求見上言僕夫盜財乞特加重罪上曰有司自有常法豈肯以卿故亂天下法也又請于私第決罰亦不許案此條見江少虞事實類苑今採録補入胡宿上仁宗論兖國公主議行册禮劄子今月二十一日草福康公主特進兖國公主制竊聞議行冊禮然于事體頗有未便祖宗以来公主長公主未有行此禮者昔漢明帝封皇子悉半諸國明徳馬皇后曰諸子食數縣不已儉乎帝曰我子豈敢與先帝子等也唐貞觀中太宗長樂公主將出降帝令有司資送倍于永樂公主魏徵曰不可引漢明帝之言為對且曰天子姊妺稱長公主加長字是有所尊崇或可情有淺深無容禮相踰越太宗然其言入告長孫皇后后遣使賜徵金帛陛下即位以来累曽進封楚國魏國二大長公主亦不曽行冊禮今施于兖國公主是與大長公主相踰越兼以貴主之故賢妃亦䝉殊典有㫖令進諭告不行冊禮是母子之間一行一不行禮意尤不相稱書于史冊後世將有譏議必謂陛下偏于近情虧聖徳之美臣願陛下采漢明之言開文皇之聴遵祖宗舊典如國朝公主曽行此禮行之粗且無嫌如其不曽則宜且罷臣以陛下好忠諫納至言臣職在論思不敢不言除皇女福康公主進封兖國公主制案宋史福康公主仁宗長女嘉祐二年進封兖國門下天道之美濟下而光明王化之行由中而洽被唐堯有釐降之典召南載肅雍之詩範俗崇風于是乎在國家慶靈憑厚徳教深長迪厥真源育兹懿主儀我皇室繄于舅門待年及于有行涓日申于誕告皇女福康公主閑和居徳秀映棲神聰悟之姿非由于外奬徽柔之性乃蹈于自然朕懐先后之慈篤外家之愛將敦美化是選密親教著沁園導人倫之婦順恩加渭水廣天下之孝思是用詳按舊章稽合嘉禮爰築其館載肅之車卜以仲秋祉兹元吉向班初冊嘗擇美名未拓膏腴尚闕湯沐進開曲阜之國衍食龜隂之田儀服有光號名増重於戲貴宜思降富勿期驕尚懐國史之言緬念衿䄜之戒往服休寵永綏壽昌韋驤代陳少卿賀福康公主進封兖國表中宸有命美化務先于族親貴主進封優恩不奪于典禮風聲遐被中外交忻臣誠歡誠喜頓首頓首恭惟尊號皇帝陛下配天地之徳紹祖宗之基守無逸于持盈槩至公于立極御逺以近齊邦以家治宫等周官之規訓女偕堯舜之法罔愧前躅克成令猷公主分乾之英體巽之順雖曰愛之欲其富不以生而榮案愛之欲其富以下疑有脱誤無别本可校姑仍其舊豈湯沐不可一而充印綬不可一而足蓋誨育之存節故寵私之有階龍光一宣慈孝兩得教其有素下嫁豈忘其矩度澤非不隆四方孰謂之偏黨朝野歡浹人神氣和邁治古之休光増太平之盛事臣限以官守不獲奔走闕庭稱慶無任瞻天踴躍之至徳寧公主將出降上謂輔臣曰公主第及房從之物比福康公主皆減三之一又對羣臣數稱唐公主多適名人而近世士人乃畏尚主命擇士人得尚書職方員外郎王克臣之子孝莊者故駙馬都尉承衍曽孫而父子皆業進士令至宰相第試以詩而并其所業一編以進上召見清居殿拜左衛將軍駙馬都尉賜名師約又命以毋廢學後又出經籍及紙筆墨賜之案徳寧公主英宗長女進封徐國宋史載王師約字君授英宗命宰相諭㫖令師約持所為文至第明日獻賦一編即坐中賦大人繼命詩遂賜對選尚公主而賜玉帶及九經筆硯勉之進學與此書所載詳略不同史亦不載其本名孝莊賜名師約據此可補宋史之闕宣祖女陳國長公主案宋史太祖有姊一人未笄而夭建隆三年追封陳國長公主又案太祖同母妹初適米福徳建隆三年封燕國長公主冄適髙懷徳元符三年改封秦國宋史但為秦國立傳而附陳國于傳末以其早夭未及下降也洓水紀聞太祖將北征京師喧言出軍之日當立㸃檢為天子太祖懼密以告家人太祖姊面如鐵色方在厨引麫杖逐太祖擊之曰丈夫臨大事可否當自決胷懐乃來家間恐怖婦女何為耶太祖黙然而出或云即魏國長公主攷魏國長公主太祖女即昭慶公主非太祖姊也據史云太祖姊早夭則引麫杖逐太祖者當為太祖妹秦國長公主可知洓水紀聞屬傳聞之誤而此書于宣祖女止載陳國長公主不載秦國長公主意陳國必秦國之誤蓋此書于公主早亾及未下嫁者俱削而不書如太祖六女申國成國永國三公主早亾不載正載秦國晉國許國三公主太宗七女滕國早亾邠國為尼沒後始有封號故不載其體例與宋史互異太祖女秦國大長公主晉國大長公主許國大長公主太宗女燕國長公主曹國長公主晉國大長公主鄭國長公主申國大長公主案太宗女以下應繼以真宗以下公主永樂大典原本俱失載宋朝事實卷八
