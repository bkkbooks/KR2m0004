body:
  text: 宋朝事實卷一宋李攸撰祖宗世次僖祖諱朓原註土了切窱䠷眺趒窕原註大中祥符五年七月真宗謂宰相曰僖祖廟諱本是上聲近見臣僚章疏多避去聲更令兩制詳定晁迴等謂僖祖諱字從月從兆按説文曰晦而月見西方也音土了切又從肉祭肉也土了切一作他凋切今請止從平聲又眺目不正也他弔切音義各異望不迴避奉聖㫖依不案四祖廟諱南宋以祧廟不避故淳熙重修文書式載釋文互注韻畧亦然攸南宋人猶載嫌名蓋以存故實耳仕後唐歴永清文安幽都三縣令十二月七日崩𦵏欽陵原註幽州建隆元年追尊文獻皇帝案元年原本誤作二年今據李燾長編改正大中祥符五年加上文獻睿和皇帝大觀元年再加上立道肇基積德起功懿文憲武睿和至孝皇帝樂舞大善之舞冬至祀昊天上帝夏至祀皇地祇升侑后崔氏建隆元年追諡文懿翰林學士禮部侍郎竇儼議行見于外曰懿子順祖順祖諱珽原註他鼎切圢脡侹頲町艼裎侱珵頊䵺蜓葶閅濎鋌䱓仕歴藩鎮從事御史中丞正月二十五日崩𦵏康陵原註幽州建隆元年追尊惠元皇帝大中祥符五年加上惠元睿明皇帝樂舞大寧之舞上辛祈穀孟冬祭神州地祇升侑后桑氏建隆元年追諡惠明翰林學士禮部侍郎竇儼議容儀恭美曰明子翼祖翼祖諱敬原註居慶切竟鏡獍璥曔仕歴營薊涿三州刺史周顯德中贈左驍衛上將軍四月十二日崩𦵏靖陵原註始曰定陵乾興元年改卜更陵名自國初加上四祖陵名欽陵康陵定陵並幽州惟安陵舊在京城東南隅及改卜𦵏安陵後三陵尚未修奉真宗即位有言順祖翼祖𦵏保州者詔内侍與長吏同共詢訪又令中書門下定議遂迎奉至京師安于佛寺景德元年將卜改𦵏十月降手詔曰康陵定陵已經迎奉將議修崇國家事祖宗之尊以園陵為大始自開國之際首行議禮之文尋建陵名尚虚神寢而有司懇拜章表面述聽聞有此二陵尚居清苑朕以事關宗廟理合審詳周詢輔弼之臣旁采中外之議而宰相上表亦曰素所聞知輿人之談皆云盡有摭據朕以為更須重慎宜廣諮詢至于命中使以經營委藩侯而訪察繼覩來奏執曰無疑復俾大臣再陳定議遂有迎奉之請用慰追逺之情既覩僉同因從典禮遷之梵刹營乃山陵今則安厝有期儀制將舉朕每從餘暇常閲羣書因覽太祖實録明載二陵所在又皆不指保州疑慮之間夙夜増念雖朝廷之議延訪無嫌而信史之文標載有異況陵寢之事朝廷之儀舉而行之無大于此宜令中書門下與樞密院同共詳定奏聞中書門下樞密院上言伏以尊崇祖禰務極孝思營奉陵園必尊典制向者始基王業首舉徽章欲行四廟之儀尋建諸陵之號雖未崇于兆域已備載于冊書向以職司連上章表述其聞見頗陳懇激之言詢以宰司亦有僉同之議羣論既從于採納宸衷過務于審詳特選使臣仍委牧守式資審慎密往詢求尋訪之間皆有依據敷陳之際頗謂周詳大臣之奏如初輿人之誦允屬矧重熙之肇啟當大孝之丕承遂伸迎奉之儀將行安厝之禮陛下爰因暇日徧閲羣書覩信史之所標指塋域之有異誠如聖慮更切參詳事繫宗祧允宜重慎臣等共議其迎到神寢向期卜𦵏即望權停所有二陵伏請量加營繕務從儉約倍節煩勞𦵏以衣冠設其園寢用伸朝拜之禮以慰尊祖之懷徐俟辨明别期遷奉庻不違于古道且頗協于人情狂瞽之言仰期聖擇奉詔康陵定陵宜令藍繼宗罷修其迎到神柩遂以一品禮𦵏于河南縣為二位大中祥符四年正月車駕幸汾陰次西京遣知制誥錢惟演詣一品墳以香幣酒脯祭告毎朝拜諸陵日以少牢致祭建隆元年追尊簡恭皇帝大中祥符五年加上簡恭睿德皇帝樂舞大順之舞案大順原本誤作大善今據宋史樂志改正大雩祀升侑后劉氏父正平州刺史初追封京兆郡太夫人建隆元年追諡簡穆翰林學士禮部侍郎竇儼議布德執義曰穆子宣祖宣祖諱𢎞殷原註上一字胡肱切下一字於斤切政和元年九月二十七日敕宣祖皇帝廟諱下一字民姓有犯者今擬作商字尚恐士庶難曉檢准武王克商封夏后氏之後于杞封殷之後于宋合改殷之字為商慇㶏溵蒑磤濦㥯案宣祖廟諱上一字嫌名永樂大典原本缺仕晉為龍捷左廂都指揮使岳州防禦使顯德三年案宋史宣祖于顯德三年督軍平揚州累官檢校司徒天水縣男卒贈武清軍節度使原本作元年今改正贈武清軍節度使七月二十六日崩𦵏安陵原註乾德元年改卜皇堂深五十七尺髙三十九尺陵臺三層正方下層毎面長九十尺南神門至乳臺鵲臺皆九十五步乳臺髙二十五尺鵲臺増四尺神牆髙九尺五寸周逥四百六十步各置神門角闕景徳初析鞏縣偃師緱氏登封縣地置縣曰永安以奉陵寢三年七月詔曰列聖在天因時永感贍言陵域肇建官司咨爾朝闕之臣仍兼宰邑之務式嚴崇奉用著典彝宜以殿中丞黄昭度知陵臺令兼永安縣事置令自此始乾德三年九月太祖命内人安陵送寒衣遂為定式自是寒食亦往開寳九年三月帝親謁安陵奠獻號慟崇寧元年六月十四日敕中書省尚書省送到兵部二狀荆湖北路轉運司狀據鼎州申契勘本州龍陽有永安驛及永安鋪各與陵名相犯永安驛合行改為龍潭驛永安鋪改為龍潭鋪名目申候指揮奉聖㫖依如諸處更有如此者並仰一面改正内太常寺供到陵名下項永安陵永昌陵永熙陵以上係永昌院永定陵係永定院永昭陵永厚陵以上係昭孝禪院永裕陵永泰陵以上係寧神禪院建隆元年追尊昭武皇帝大中祥符五年加上昭武睿聖皇帝樂舞大慶之舞大饗明堂感生赤帝升侑原註國初有司上言國家受周禪周木德木生火皇朝運應火德色尚赤臘以戊日祀赤帝為感生帝景靈宫天元殿奉安御容后杜氏父爽贈中書令周顯德中封南陽郡太夫人建隆元年有司請上尊號曰皇太后原註有司上言伏以王者立顯親之殿所以尊母儀開長樂之宫所以伸子道稽諸歴代實有彝章伏惟帝母南陽郡太夫人象叶陰靈功深厚載塗山助夏道冠于三王文母興周名存乎十亂徽號未正闕孰甚焉謹案漢書帝祖母曰太皇太后帝母曰皇太后陛下膺圖資始孝治攸先宜彰墜鷰之祥式表躍龍之貴伏請上尊號曰皇太后詔恭依未行冊禮二年六月二日崩諡明憲太常少卿馮吉議照臨四方曰明聖善同達曰憲乾德二年改諡昭憲原註二年改卜安陵吏部尚書張昭上言伏自漢魏以來追尊帝后多以兩字為諡后諡上一字皆與帝諡上字同國朝追尊四親廟自翼祖而上三廟后諡上一字並與帝諡同惟明憲皇后不連昭字伏請改上尊諡曰昭憲皇帝子太祖太宗太祖諱匡𦙍原註上一字去王切下一字羊晉切筐邼眶恇劻洭䖱䒰軭框迋軖靷引䏖鈏酌洕濥戭廴枃螾椼後唐天成二年丁亥嵗二月十六日生于西京大内甲馬營以其日為長春節仕周為歸德軍節度使原註唐宋州後唐改為歸德軍帝由此受命景德三年升應天府大中祥符七年升南京殿前都㸃檢顯德七年正月四日受周禪乾德元年十一月上尊號曰應天廣運仁聖文武至德皇帝開寶元年十一月加上尊號曰應天廣運聖文神武明道至德仁孝皇帝開寶九年十月二十日崩太平興國二年四月十五日葬河南府鞏縣永昌陵原註宰臣薛居正撰陵名太祖生于洛陽甲馬營樂其風土國初遣營繕宫室有遷都之志開寳九年西幸郊祀既至而宫殿宿衛者多不安處宫中或見怪異又霖雨彌月芻粟不集遂東歸歎曰朕生不得居此死當𦵏于此還謁安陵哭奠畢更衣登闕臺西北向慷慨涕數行下發鳴鏑中其所曰我後當𦵏此大中祥符元年嵗次戊申十一月戊午朔二十七日甲申孝子嗣皇帝臣某謹再拜稽首上言臣聞長發其祥流芳于商頌克昌厥後播美于周詩慶以積善而綿長祖以有功而丕顯純熙之祉舄奕無疆由資始于景靈爰錫羡于來裔是以允升岱社祗薦牲瑄式昭嚴配之儀恭率追崇之典聿隆皇運仰屬𤣥猷伏惟太祖英武聖文神德皇帝奮武開階膺圖構象神機天縱睿斷飇馳當建極以居尊乃卜年而垂裕靈旗直指革輅親征多壘削平中區大定烝黎以之富壽寰海于是混同禮樂交修梯航畢至倒干戈而弗用肅刑政以惟清推恩雨施于萬方發號風行于四表成功不宰至德無踰時格太平民用丕變盡垂鴻之經制資奕世之宏規遺烈具存信書攸紀臣猥以沖眇逮兹纂承履大寶之尊奉神器之重寤寐思治旰昃忘勞動循燕翼之謀克致治平之化屬兵鋒載戢年穀順成琛賮來庭邊防罷警仰昊穹之敷佑繄宗社之儲休景貺薦臻寶符載錫將伸昭報祇事禋燔而民庶相趨表章狎至願遵時邁固請升中勉徇輿情用成先志靈辰協吉毖祀允修罄誠明之心禱蒼黔之福上封喬嶽既畢于増髙歸格太宫敢忘于尊祖粤若應期之康濟創業之艱難底績之基扃歸厚之風化垂于不朽可得而言欽奉威靈重揚徽懿謹遣攝太尉推忠協謀同德佐理功臣金紫光禄大夫工部尚書同中書門下平章事集賢殿大學士監修國史上柱國太原郡開國公食邑三千七百户食實封一千八百户臣王旦奉寶冊謹加上尊諡太祖啟運立極英武睿文神德聖功至明大孝皇帝恭惟本仁觀德宗廟載嚴致孝因心簡冊増耀在天降鑒錫祚有孚眷祐後昆永永無極謹言參知政事馮拯撰樂舞大定之舞冬至祀昊天上帝升侑原註景祐二年太常禮院奏准今月三日詔書敕中書門下王者奉宗廟貴功德禋天祀地則有侑神作主之尊審禘合食則有百世不遷之重朕以寡薄獲承天序實賴先烈訖臻治平懼不能揚祖宗之休丕顯懿鑠夙夜惟念弗遑寧居恭以太祖皇帝奮淳曜之精輯樂推之俗五代屯否中華剖裂天威一震㒺不率俾夷僭黜暴皇綱再張革其桀驁納諸􅁤度規模宏逺詒萬世法太宗皇帝躬上聖之資乃膺繼服來閩粤復汾晉方夏一統尉候萬里興文教拔羣材思皇政經憂勞庶務惠澤漸漬浹人骨髓真宗皇帝欽明孝熙恢績鴻緒勤儉以率下哀矜以慎刑撫和三邊兵不復用民靡知役物遂其生因時昭泰逺攷古章登封巡祭聲明焯燿享國多載仁恩溥博昔商周之際則長發大禘嚴父配天逮于漢氏亦能尊二宗立廟樂朕甚慕之肆我藝祖之受天命建大業可謂有功矣二聖繼統重熙累洽可謂有德矣其令禮官稽按典籍辨崇配之序二祧之位中書門下審加詳閲稱朕意焉故兹詔示想宜知悉奉詔如前臣等言王者建廟祏之嚴合昭穆之綴祖一而已始受命也宗無豫數待有德也由宗而變世胄之疏戚以為迭毁之制使後嗣雖冇顯揚襃大猶不得與祖宗並列所以一統古之道也皇帝陛下躬孝治發德音永惟三后之盛烈際天接地而推奉之禮有所未稱明發悼懼圖惟厥衷使攸司得稽舊章開羣議攄懿鑠闡孫謀將脗合靈心垂榮無極非臣等孤陋所能及也竊以太祖皇帝誕受寶命付畀四海鋪敦燮伐潛黜不端夷澤潞之畔兼淮海之昧東焚吳輿右因蜀壘湘楚閩禺請吏入朝當此之時天下之人去久潛䝉更生永年長世丕闡洪業太宗皇帝敦受大業廣運大武龔天之討底定太原由是審九刑之辟藝四方之貢信賞類能重食勸功官無煩苛人無恫怨又引搢紳諸儒講道興學炳然右文與三代同風真宗皇帝乾粹日照執競惟烈重威撫和休寧北方順紀有度先天作聖遂攷夏諺稽虞巡祕牒岱宗休兵異壤翕受瑞福普浸黎元肖翹蠕動㒺有不寧百度已備眷受明辟洪惟一祖二宗之烈歴攷墳誥未有髙焉者也昔成湯為商之祖漢孝文孝武特崇兩廟皆子孫奉承不輟我皇伯祖經綸草昧遂有天下功宜為帝者之祖皇祖勤勞制作皇考財成治定德宜為帝者之宗三廟並萬世不遷宣布天下以示後世臣等請如聖詔至升侑上帝褒對先烈本之周道克厭典禮昔太宗親郊奉宣祖太祖配焉建真宗肇祀奉太祖太宗配焉自爾有司不敢輕議今二宗同躋不祧之位則禮無異等伏請自今以往太祖為定配二宗為迭配稱情適事理實無嫌其將來皇帝親祀伏請以三祖皆侑上顯對越之盛次申遹追之感聖人之能事羣臣之大願此後迭配還如前議昔真宗登介丘降社首並以太祖太宗崇配天地此三聖皆侑之明準其嵗時常祀則至日圜丘仲夏地祇配以太祖孟春祈穀夏雩祀冬祀神州配以太宗孟春感生帝配以宣祖季秋大饗配以真宗伏請皆如禮便陛下重宗祧之事昭鑒前載抑畏䖍恭讓而不專故令臣等得申愚管謹用敷罄惟聖心裁覽奉敕恭依景靈宫皇武殿揚州建隆寺西京㑹聖宫應天院滁州天慶觀南京鴻慶宫奉安御容后賀氏父景思右千牛衛率府率晉開運初來歸周顯德中封㑹稽郡夫人生燕王德昭魏國魯國二大長公主顯德五年正月三日崩建隆三年追冊為皇后乾德二年諡孝惠陪𦵏安陵案宋史孝惠皇后神宗時升祔太廟此失載祔祭后廟王氏父饒彰德軍節度使周顯徳五年來歸六年賜冠帔封琅邪郡夫人建隆元年八月冊為皇后生皇子皇女二人皆早世乾德元年十二月七日崩諡孝明陪𦵏安陵祔祭后廟太平興國二年升祔太祖室宋氏父偓左衛上將軍邢國公乾德六年入宫為皇后太宗即位號開寶皇后太平興國二年居西宫雍熙四年移東宫至道元年四月二十八日崩翰林學士宋白議慈愛忘勞曰孝温克令儀曰章升祔太祖廟案東都事畧開寶皇后至神宗時升祔太祖廟此失載太宗諱炅原註古迥切熲炯煛泂㯋耿昋鎣扃憬皛舊諱光義匡義原註開寶九年十月詔官階及州縣名有與朕名下一字同者宜改與上一字同者仍舊乃以諫議大夫為正諫大夫正議大夫為正奉大夫通議大夫為通奉大夫朝議大夫為朝奉大夫朝議郎為朝奉郎承議郎為承直郎奉議郎為奉直郎宣議郎為宣奉郎太平興國二年二月詔曰王者對越上天祗見九廟凡遇祭告必署名稱稽歴代之舊章貴難知而易避爰遵故事載易嘉名凡在庶寮當體兹意朕今改名炅自臨御以來除已改州縣散官職事官名號及人名外其舊名二字今後不須迴避仍令擇日奏告天地宗廟大中祥符二年六月詔曰太宗藩諱溥率咸知雖先訓之具存俾臨文而不避近覩列奏或犯二名聞之矍然載増永慕自今中外文字有與二字相連及音同者並令迴避晉天福四年己亥十月七日生于開封府浚儀縣崇德坊護聖營之官舍以其日為乾明節淳化三年改為夀寧節建隆元年為殿前都虞候睦州防禦使八月領泰寧軍節度使二月七日加同中書門下平章事開封尹乾德二年六月加中書令開寶六年九月封晉王九年十月二十一日遂即尊位案太宗以開寶九年十月二十一日即位原本誤作二月二十一日今據宋史改正太平興國三年羣臣上尊號應運統天睿文英武大聖至明廣孝皇帝端拱二年詔曰朕嘗覽羣書備觀前古居尊之號近代方行固非軒昊之令猷且異唐虞之舊典載惟涼德尤愧前王浮實之名非所宜稱向者羣后同詞封章見請䖍懇斯至避讓無由勉從將順之心遂極尊崇之號每一念此深用憮然豈敢以謙德自私必將以古道為法其自前所加尊號並宜省去令後四方上表只稱皇帝庶叶至公翌日宰相吕䝉正等奏事長春殿進曰陛下神功聖德輝映古今在于尊稱止可増益忽奉詔㫖省去中外無不驚駭帝曰至如皇帝二字亦不可兼稱此起自秦始皇後代因之不改朕比欲復止稱王又以諸子封王有所妨礙朕志先定勿煩確奏其後羣臣累上尊號曰法天崇道文武皇帝詔除文武二字外宜依至道三年三月二十九日崩𦵏河南府永安縣永熙陵原註宰相吕端譔陵名大中祥符元年嵗次戊申十一月戊午朔二十七日甲申孝子嗣皇帝臣某謹再拜稽首上言臣聞應期受命聖人所以致太平卜世其昌上帝所以祚明德然則升中昭事既報本于圜方順美歸尊當増華于簡冊伏惟太宗神功聖德文武皇帝元功不宰妙用無方若唐堯之聖神有周公之材藝在朱邸也懸象集連珠之慶紹寶厯也長江出瑞石之文閩越于是來同并汾以之盪定若乃揚庭以選士闢館以育材得人而致治也集河洛之圖書闡周孔之經籍用文以立教也授律以貞師取威而禁暴經武以定功也審官以攷績議獄以緩刑信賞而慎罸也既而講三王之禮備六代之樂躬肆類以享帝尊二祖以配天人神感通上下交泰和氣充塞德澤涵濡百靈效祥溢圖牒之所記九譯來貢超載籍之所聞然猶旰食勵精實行慈儉除宫室之藻飾絶弋獵之嬉遊省去名稱抑罷封禪積德深厚垂慶緜長俾臣薄祜嗣膺丕錫守位一紀率土咸懷疊委禎符屢惟稔嵗狥黎庶之確請循虞夏之舊章告成介丘昭紀大號奉揚前烈傳之無窮而陟配方嚴鴻名未稱敢不周爰古道侔揣大猷上以協神祇之心下以伸臣子之志再章節惠永播英聲謹遣攝太尉推忠協謀同德佐理功臣金紫光禄大夫工部尚書同中書門下平章事集賢殿大學士監修國史上柱國太原郡開國公食邑三千七百户食實封一千八百户臣王旦案實封一千八百户原本誤作二千五百户攷王旦實封户于大中祥符元年遣祭太祖文已載明與長編同今改正奉寶冊加上尊諡太宗至仁應道神功聖德文武大明廣孝皇帝恭惟至神俯歆令典延休萬葉介福兆人謹言樂舞大盛之舞案長編分注云太宗廟未見樂舞名當檢此作大盛與宋史樂志合祈穀雩祀神州地祇升侑景靈宫大定殿西京應天院崇福宫㑹聖宫奉安御容后尹氏父廷勛滁州刺史太平興國元年追尊為皇后諡淑德案宋史淑德皇后太宗在周時娶焉早薨𦵏孝明陵西北享于别廟後升祔太廟不詳年代攷文昌雜録元豐癸亥以詳定禮文所言七月十二日升祔淑德皇后于太宗室此失載太常少卿馮永錫議言行不回曰淑富貴好禮曰德符氏父彦卿魏王周顯德中來歸國初封汝南郡夫人進楚國越國開寳八年十二月十九日薨太平興國元年追冊為皇后諡懿德太常卿張永錫議案追諡后尹氏符氏同在太平興國元年而太常議諡者一作少卿馮永錫一作太常卿張永錫未知孰是東都事畧李燾長編及宋史俱無可攷姑仍其舊温柔聖善曰懿富貴好禮曰德陪𦵏安陵升祔太廟太宗室李氏父處耘淄州刺史開寳末納幣太平興國二年七月入宫雍熙元年十二月十七日立為皇后至道三年四月八日尊為皇太后景德元年三月十五日崩諡明德吏部侍郎郭䞇議無幽不察曰明中和純備曰德升祔太宗廟庭案宋史景德三年明德皇后祔𦵏永熙陵此失載李氏父英乾州防禦使贈安國軍節度使常山郡王開寳初來歸封隴西縣君太平興國初封隴西郡夫人二年三月十二日崩至道三年追封賢妃十二月追尊為皇太后咸平元年諡元德都官員外郎秘閣校理舒雅議茂德丕績曰元中和淳淑曰德大中祥符六年去太字子真宗案宋史元德皇后咸平三年祔𦵏于永熙陵主祔别廟大中祥符六年升祔太廟此失載章獻明肅劉后益州華陽縣人父通后為蜀人龔美攜入京為開封府人美以鍜銀為業真宗尹開封美因鍜銀得見真宗語之曰蜀婦人多才惠汝為我求一蜀姬美因納后年十五寵幸專房太宗一日問乳母曰太子近來容貌清瘦左右有何人乳母以后對上命去之太子不得已置于殿侍張耆家未幾太宗晏駕太子即位祥符五年立為皇后案太宗以下應載真宗事實今永樂大典原本闕惟錦繡萬花谷所引國朝事實有章獻明肅劉后事一條劉真宗后也録附太宗之後仁宗諱禎原註陟盈切楨貞偵􅬬媜徴癥湞寊揁大中祥符三年庚戌嵗四月十四日生于開封府以其日為乾元節七年三月授左衛上將軍封慶國公八年十二月授中正軍節度使檢校太尉兼侍中封夀春郡王天禧元年二月加中書令二年二月改建康軍節度使太保進封昇王八月立為皇太子乾興元年二月十九日遂即尊位案宋史乾興元年二月戊午真宗崩仁宗即位攷戊午為十九日原本誤作二十九日今改正天聖二年十一月上尊號曰聖文睿武仁明孝德皇帝明年二月加號睿聖文武體天法道仁明孝德皇帝七月詔去睿聖文武之號十一月加景祐體天法道欽文英武聖神孝德皇帝寶元元年十一月以寶元易景祐冠于舊號康定元年詔省去睿聖文武四字在位四十二年嘉祐八年三月二十九日崩十月二十九日𦵏永昭陵原註刑部尚書平章事韓琦奏臣奉敕撰定先帝陵名者為兆域之圖按禮經而伊始因山川之故奉先訓以惟嚴宜立嘉名上符至德伏以先皇帝仁無不浹道極莫稱開夀域以濟民咸歸聖治建善經而長世坐致時雍豈徒超軼于百王固以光輝于萬古先帝陵伏請以永昭為名翰林學士王珪等議諡曰臣聞元精磅礴濟萬物而不昭其迹者薦名曰天至德汪洋澤萬世而不有其功者建諡于帝伏思在昔帝王生膺大名終紀大德使金聲而玉振之以詒乎無窮之聞者帝莫盛于堯舜王莫隆于禹湯也蓋易名之典下不得誄上古者將為至尊之諡必質于郊然後定之兹所以推天下之至美案然後定下原本脱之兹二字今據王珪華陽集補明天下之至公雖天子不得以自専也洪惟先皇帝躬上主之資承累聖之序流大漢之豈弟履放勲之欽明包富有之業而能守以約攬泰定之勢而弗恃以安固嘗邈然究視所未形俛焉積思所不及謂天命之匪易迺嚴恭戒懼庶以答靈心之顧謂民懷之靡常迺涵容煦沫庶以陶善類之歸智括萬慮而不可測恩滲四垠而不可形如兩儀之無不幬載如三辰之無不臨燭于時修廢官繼絶世禮髙年勸力穡減常賦抑末游虚已以遇豪俊之材降志以從忠直之諫振立賞罰而權衡之章昭典禮而黼黻之宥恕刑獄而蕩滌之惠哀困窮而衣食之人情莫不欲逸愛其力而不勞人情莫不欲夀輔其生而不傷羣公庶尹㒺弗夷正相與謀王之朝殊鄰絶區㒺弗億寧相與慕王之境父父子子兄兄弟弟罔弗祇順相與立于王之塗葢仁政之施沛然其若是莫之能禦也矧夫耕籍于千畝之田祫祭于先王之廟報天之誠篤則八奠于圜丘嚴父之志盡則再侑于明堂宗室既蕃則廣諸分玉之愛邦統未昭則豫有主器之屬下議樂之詔以攷鐘石之和置寫書之官以緝經墳之學邇英敷席圖講藝也凝幾校字案凝幾原本誤作疑機今據華陽集改資味道也藻思粹發窮聖作也飛毫灑落肆天縱也知聲色之靡伐于德義于是乎屏燕飲之娯知雉兔之獲殫于精神于是乎絶盤遊之欲念組織之勤則卻服御之華念土木之費則損宫室之麗西羌阻命不欲久戍勞師而遂納玉關之誓南蜑肆姦不欲深入討除而自致藁街之戮時則有踰沙絶漠卓犖之貢委應圖合牒沕潏之瑞叢四十二年于茲可謂海内大治矣竊迹羲黄之前夐乎莫索其詳自詩書之載未有如兹之盛者也方將勒鴻休受永祐豈圖神機欻厭邦釁上延仙鼎已成不返荆山之御玉衣雖在空陳渭水之遊嘉原既新同軌畢至下華葢于北極引龍輴之西巡此萬國所以摧心三靈為之變色有司繇是飭舊典冊丕備案丕備原本誤作不稱今據華陽集改正皇哉鑠乎幾有以綏王靈而炳帝烈也謹按諡法治民無為曰神經緯天地曰文通達先知曰聖保大定功曰武照臨四方曰明慈惠愛親曰孝若乃羣生啿啿案啿啿原本作嘻嘻攷羣生啿啿句本漢郊祀歌今從華陽集改正鼓之舞之不知至化之所自然非至神乎制作禮樂際天接地煥然而大備非至文乎永惟宗廟之奉實發先識以建大本非至聖乎戴白之老不識兵革之警非至武乎遐末荒昧之情格于聰明而無所遺非至明乎惇叙九族以述夫祖先之志非至孝乎粤廟號之建尚矣維其歴古聖賢之君莫不極所以尊明令顯之稱又或至于代相襲之夫仁者聖人之盛德豈獨未有以當之耶抑當時鴻儒鉅學反畧于稽求抑又天之所啟期以克配先帝之廟乎詩云維天之命於穆不已此之謂歟惟功以創業為祖德以守成為宗皆尊尊之大義也先帝尊諡宜天錫之曰神文聖武明孝皇帝廟曰仁宗元豐八年加諡體天法道極功全德神文聖武睿哲明孝皇帝樂舞大仁之舞祭皇地祇升侑原註殿中侍御史趙鼎奏請遞遷真宗配孟夏雩祭以太宗專配上辛祈榖孟冬祀神州地祇循用有唐故事翰林學士王珪等議以為天地之祭有七皆用歴代故事以始封受命創業之君配神作主于明堂用古嚴父之道配以皇考故朝廷真宗時以太宗配在仁宗時以真宗配今則以仁宗配方仁宗始罷太宗明堂之配太宗先以配雩祈穀及神州之祭本非遞遷今明堂既用嚴父之道則真宗配天之祭于禮當罷不當復分雩祭之配天章閣待制兼侍讀李受天章閣侍讀𫝊奏以趙鼎之議為得禮若以太宗雩祭既久不欲遷侑則乞以仁宗與真宗並配明堂亦為得禮詔從珪等所議至治平元年七月辛酉詔以仁宗享明堂初禮院奏乞與兩制同議大行皇帝當配何祭翰林學士王珪等奏唐代宗即位用禮儀使杜鴻漸等議季秋大享明堂以考肅宗配昊天上帝德宗即位亦以考代宗配王涇郊祀録注云即孝經周公嚴父之道本朝祀儀季秋大享明堂祀昊天上帝以真宗配循周公嚴父之道知制誥錢公輔議謹按三代之法郊以祀天而明堂以祭五帝郊之祭以始封之祖有聖人之德者配焉故孝經曰昔者周公郊祀后稷以配天宗祀文王于明堂以配上帝又曰孝莫大于嚴父嚴父莫大于配天則周公其人也以周公言之則嚴父也以成王言之則嚴祖也方是之時政則周公祭則成王亦安在乎嚴其父哉我將之詩是也後世失禮不足攷據請一以周事言之臣竊謂聖宋崛起非有始封之祖也則創業之君遂為太祖矣太祖則周之后稷祭于郊者太宗則周之文王配祭于明堂者也此二配者至大至重萬世不遷之法也真宗則周之武王宗乎廟而不祧者也雖有配天之功而無配天之祭未聞成王以嚴父之故廢文王配天之祭而移于武王也仁宗則周之成王也雖有配天之業而亦無配天之祭亦未聞康王以嚴父之故廢文王配天之祭而移于成王也以孔子之心推周公之志則嚴父也以周公之心攝成王之祭則嚴祖也嚴祖嚴父其義一也下至于兩漢去聖未甚逺而明堂配祭東漢為得在西漢時則孝武始營明堂而以高帝配之其後又以景帝配之孝武之後無聞焉在東漢時則孝明始建明堂而以光武配之其後孝章孝安又以光武配之孝安之後無聞焉當始配之代適符嚴父之説及時異事遷而章安二帝亦弗之改此最為近古而合乎禮者也有唐始在孝和時則以髙宗配之在明皇時則以睿宗配之在永泰時則以肅宗配之禮官杜鴻漸王涇鞏不能推明經訓合古初反雷同其論以惑時主延及于今牢不可破當仁宗嗣位之初倘有建是論者則配天之祭常在乎太宗矣當時無一言者故使宗周之典禮不明于聖代而有唐之曲學流弊乎後人願陛下深詔有司博謀羣賢使配天之祭不膠于嚴父嚴父之道不専乎配天循宗周之典禮替有唐之曲學于是又詔臺諫及講讀官與兩制禮院再詳定以聞觀文殿學士兼翰林侍讀學士孫抃等奏謹案孝經出于聖述其談聖治之極則謂之行莫大于嚴父而配天仲尼美周公以居攝而能行天子之禮尊隆于父故曰周公其人不可謂安在乎必嚴其父也又若止于太祖比后稷太宗比文王則宣祖真宗向者皆不當在配天之序推而上之則謂明堂之祭真宗當以太宗配先帝不當以真宗配今日不當以仁宗配必配以祖也臣等按易豫之説曰先王作樂崇德殷薦之上帝以配祖考蓋若祖考並可配天者也兹又符于孝經之説亦不可謂安在乎必嚴其父也祖考皆可配帝郊與明堂不可同位亦不可謂安在乎必嚴其父也雖周家不聞廢文配而移於武廢武配而移于成然而易之配考經之嚴父歴代循守固亦不為無説魏明帝宗祀文帝于明堂以配上帝史官謂是時二漢郊祀之制具存魏而損益可知則亦不可謂東漢章安之後配祭無傳遂以為未嘗嚴父也自唐至本朝其間賢哲講求不為少所不敢以異者捨周孔之道無所本統也今以為我將之詩祀文王于明堂而歌者也亦安知非仲尼刪詩存周之全盛之頌被于管絃者獨取之也仁宗繼本體保成業置天下于泰安者四十二年功徳于人可謂極矣今祔廟之始遂抑而不得配上帝之享甚非所以宣章陛下為後嚴父之大孝臣等稽參大典博攷公論敢以前所定論為便知諫院司馬光吕誨議竊以孝子之心誰不欲尊其父者聖人制禮以為之極不敢踰也故祖已訓髙宗曰典祀無豐于昵孔子與孟懿子論孝亦曰祭之以禮然則親者不敢數祭為孝貴于得禮而已先儒所謂禘郊祖宗皆祭祀以配食也禘謂祭昊天于園丘也祭上帝于南郊曰郊祭五帝五神于明堂曰祖宗故詩曰思文后稷克配彼天又我將祀文王于明堂此其證也下此皆不見于經也前漢以髙祖配天後漢以光武配明堂以此觀之古之帝王自非建邦啟土及造有區夏者皆無配天之文故雖周之成康漢之文景明章其德業非不美也然而子孫不敢配天者避祖宗也孝經曰嚴父莫大于配天周公其人也孔子以周公有聖人之德成太平之業則制禮作樂而文王適其父也故引之以證聖人之德莫大于孝答曽子之問而已非謂凡有天下者皆當以其父配天然後為孝也近世祀明堂者皆以其父配五帝此乃誤釋孝經之意而違先王之禮不可以為法也景祐二年仁宗詔禮官稽參典籍辨崇祀之序定二祧之位乃以太祖為帝者之祖比周之后稷太宗真宗為帝者之宗比周之文武然則祀真宗于明堂以配五帝亦未失古禮今仁宗雖豐功美德洽于四海而不在二祧之位議者乃欲捨真宗而以仁宗配祀明堂恐于祭法不合又以人情言之是黜祖而進父也夏父弗忌躋僖公先兄而後弟孔子猶以為逆祀書于春秋况黜祖而進父乎必若此行之不獨乖違禮典恐亦非仁宗之意臣等竊謂宜遵舊禮以真宗配五帝于明堂為便詔從抃等議景靈宫美成殿奉安御容后郭氏故中書令郭崇孫女天聖二年九月十五日太后手書已于此月特展嘉禮納為皇后竢南郊畢備禮冊命十一月二十一日降制太后稱制恃勢頗驕横太后崩美人向氏楊氏尤得幸案向氏東都事畧作尚氏尚與向古姓相通今仍其舊向氏恩寵傾京師后妒屢與忿爭向氏嘗于上前有侵后不遜語后怒起批其頰上自起救之后誤抓上頸上大怒閻文應白上以抓痕示執政大臣而謀之上以示吕夷簡且告之夷簡曰光武漢之明主郭后止以怨懟廢況傷乘輿乎上于是有廢后意右司諫范仲淹諫諍不納后乃請入道賜號金庭教主沖淨元師居于安和院改院曰瑤華宫景祐二年薨詔追復皇后曹氏父玘尚書虞部員外郎贈太傅兼侍中東海郡王祖彬樞密副使檢校太師兼侍中贈魯王案東都事畧彬贈韓王非魯王玘贈吳王非東海郡王與此所載互異景祐元年九月内降制立為皇后所司擇日備禮冊命十一月冬至行冊禮嘉祐八年三月尊為皇太后四月權同聽政治平元年五月降手詔還政英宗尊皇太后所居宫曰慈夀熈寧元年曽公亮表請名太皇太后宫殿並以慶夀為名二年正月尊為太皇太后五年十一月二十一日崩諡慈聖光獻原註諡議闕后案東都事畧慈聖光獻𦵏永昭陵升祔太廟此失載張氏父堯封祖潁進士及第終于縣令堯封景祐元年釋褐授石州軍事推官未赴卒于京師堯封母錢氏女也后與其姊妹三人幼無依由錢氏納于章惠太后宫時后八嵗寖長得幸慶歴元年封清河郡君嵗中為才人遷修媛三年被疾願下遷為美人上許之八年十月進貴妃十二月三日發冊原註故事國朝以來命妃未嘗行冊禮然故事須竢旨方以告敕授之又凡降制皆從學士院待詔書告詞送中書結三省銜官告院用印然後進入宣制翰林學士宋祁止就院寫告直取官告院印用之遽封以進方妃寵盛欲行冊命之禮告入進后怒曰故事妃當得冊命何用告為抵于地上為奪祁職改命觀文殿學士丁度撰文案九朝編年云國朝命妃當冊拜宋祁以進誥落職祁初亦疑進誥非是以李淑明于典故而問之淑心知其誤而俾之進祁果得罪攷宋自温成以前並無命妃冊拜者當以此書為正至和元年薨冊贈為皇后諡温成原註初諡廣明又諡元明竟諡温成諡議闕成案東都事畧及宋史仁宗本紀后妃傳但稱諡温攷九朝編年載初諡恭德樞密副使孫沔言太宗四后皆諡曰德從廟諡也今恭德之諡其法何從遂改今諡此載初諡元明廣明與各書互異子英宗英宗天聖十年生于宣平坊赤光滿室咸見黄龍往來室中濮王夢兩龍與日並墮以衣承之復戲于空中其一龍視王曰吾非王所能有也後仁宗立為皇子案是書各類中所載事實俱至南渡髙宗朝止而世次一類自仁宗以後累朝俱闕惟錦繡萬花谷所引國朝事實有英宗事迹一條補録于此宋朝事實卷一
