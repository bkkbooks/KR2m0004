body:
  text: 宋朝事實卷十二宋李攸撰儀注二國初因唐與五代之制文武官每日赴文明殿原注即文德殿正衙常參宰相一人押班五日起居即崇德長春二殿原注崇德即紫宸長春即垂拱中書門下為班首其長春殿常朝則內侍省都知押班率內供奉官以下并寄班等先起居次客省閣門使以下原注呈進目者次三班使臣原注節度觀察防禦團練刺史等子弟充供奉官侍禁殿直有旨令預內朝起居者次內殿當直諸班原注殿前指揮使左右班都虞候內殿直散員散指揮散都頭金鎗班等次長入祗候東西班殿侍次御前忠佐次殿前都指揮使率軍校至副指揮次駙馬都尉原注任刺史以上者綴本班次諸王府僚次殿前都軍使都頭次皇親將軍以下至殿直次行門指揮使率行門起居原注以上並內侍贊喝如傳宣前殿不坐即宰相樞密使文明殿學士三司使翰林樞密直學士中書舍人三司副使知起居注皇城內監庫藏朝宫諸司使副內殿崇班供奉官侍禁殿直翰林醫官待詔等同班入次親王次侍衛親軍馬步軍都指揮使率軍校至副都指揮使次使相次節度使次統軍次兩使留後觀察使次防禦團練使刺史次侍衛馬軍步軍使都頭起居畢見謝班入如御崇德殿即樞密使以下先就班俟升坐原注諸司使副以下至殿直分東西對立餘皆北向宰相參知政事最後入原注以上並閣門贊喝日止再拜朔望及三日假即樞密使以下皆舞蹈建隆三年三月重定合班儀升六曹侍郎在給事舍人之上郎中在補闕之上員外郎在拾遺之上節使在六曹侍郎之上中書侍郎之下故事京兆省官為侍從班五品押南省四品六品押南省五品節使在諸司三品之下至是改焉案文獻通考載合班圖于朝儀後可與此互證十月賜文武常參官冬服纍朝止賜將相翰林學士諸軍大使至是太祖曰冬服不及百官甚無謂也故賜之乾德元年閏十二月詔一品致仕官曽帶同平章事者每遇朝會宜綴中書門下班是時太子太師致仕侯益等來陪祀故有是詔淳化二年十二月太宗御文德殿羣臣入閣禮畢賜百官廊下飱唐制朔望天子御宣政殿受百官起居諸司奏事仗衛如式敬宗始于紫宸為入閣之儀五代以來禮容多闕至是始復舊三年正月太宗御朝元殿受賀禮畢改服通天冠絳紗袍升殿羣臣上壽國朝以來元正冬至朝賀御正殿即以退御大明殿羣臣常服上夀奏教坊樂至是始約開元禮皆以法服設宫懸萬舞酒三行而罷大宴羣臣于廣德殿分設宰相使相三師三公參知政事東宫三師僕射學士御史大夫中丞三少尚書常侍賓客太常宗正卿丞郎給事諫舍節度兩使留後觀察防禦團練刺史上將軍都指揮使坐于殿上文武四品以上知雜御史郎中郎將禁軍都虞候坐于朵殿餘升朝官諸軍頭都頭以上諸蕃進奉使諸道進奉軍將以上分坐于兩廊宰相使相坐以繡墩原注曲宴行幸用杌子參知政事以下用二蒲墩花毬原注曲宴樞密使副使並同案花毬宋史禮志作罽毯軍都指揮使以上用一蒲墩自朵殿而下皆緋緣氈條席殿上器用金餘以銀其日樞密使以下先起居訖當侍立者升殿宰相率百官入宣徽閣門通唱致詞訖宰相升殿進酒各就坐酒九行每上舉酒羣臣立侍次宰相次百官舉酒或傳旨命釂即皆搢笏起飲再拜原注曲宴多令不拜或上壽朝會止令滿酌不勸中飲更衣賜花有差宴訖舞蹈拜謝而出太平興國後止設春宴雍熙三年後常以暮春召近臣賞花釣魚于苑中三館之職皆預淳化四年令京官兼館職者並預大宴咸平三年始備設春秋大宴五年十二月詔凡內宴宗正卿令升殿坐班次依合班儀又以翰林學士梁灝請春秋大宴小宴賞花行幸次為四圖頒下閣門遵守案宋史禮志春秋季仲及聖節郊祀藉田禮畢巡幸還京凡國有大慶皆大宴天聖後大宴率于集英殿次宴紫宸殿小宴垂拱殿若特旨則不拘常制天禧四年從集賢院祖士衡言大宴將更衣羣臣下殿然後更衣更衣後再坐則羣臣班于殿庭候上升坐起居謝賜花再拜升殿案文獻通考有大慶殿再坐上壽立班圖初入面西躬候通銜位姓名訖引當殿贊喝兩拜搢笏舞蹈三拜不起奏聖躬萬福喏贊又再拜喝祗候出如喝有敕賜酒食更兩拜搢笏舞蹈三拜訖祗候差遣見引當殿立躬喝兩拜隨拜山呼奏聖躬萬福喏喝祗候平身立俟喝謝恩兩拜隨拜山呼案此條不著某年所定某處儀注與文獻通考宋史禮志所載常朝起居入閣賜宴諸儀互有異同疑原本尚詳傳寫闕之唐王及善曰中書令可一日不見天子乎太祖開寶九年以中外無事始詔旬假日不坐然其日輔臣猶對于後殿問聖體而退至道三年三月二十九日旬假是日太宗猶對輔臣至夕帝崩李南陽永熙挽詞曰朝憑玉几言猶在夜啓金縢事已非時稱佳作至真宗朝旬假輔臣始不入寶元中西事方興假日視事慶厯初乃如舊諸蕃入朝皇朝之制西北蕃部及契丹髙麗東南蠻西南夷及諸外蕃國來貢者並對于崇德殿契丹使捧書函入殿庭北向鞠躬閣門使降受升殿以進內侍都知受而啓之通事舍人導使者升殿代其主跪問聖躬上令內侍都知報問之皆通事傳譯畢乃降階西向通名起居舞蹈賜冠帶器幣鞍勒馬上親宴其使于內殿他國使或止就長春殿皆于殿庭北向跪奉表函通事舍人受以進南蠻東夷西南夷海外蕃國西北蕃部對訖復引對于崇政殿案宋史禮志凡外國使至及君長來朝皆宴于內殿開寶八年宴契丹使于長春殿太平興國三年宴契丹使諸國蕃客于崇德殿以契丹使來賀故也景德澶淵會盟以來始定儀注引對于崇德殿宴使于長春殿至政和五禮新儀則朝見賜宴朝辭皆于紫宸殿假日皆于崇政殿諸國不及也此書所載蓋據宋初之制有善本國歌舞者令奏之契丹髙麗交址使歸赴內朝奉辭皆于崇德殿其契丹使召升殿授書他國書皆有司付之其賜物有差真宗景德後契丹請盟每使至遣官為接伴館伴使副使舍于都亭驛班在上將軍之下宴賜加等餘蕃使分館諸驛髙麗使至遣閣門祗候接送直館一員館伴宴餞亦命近臣諸蕃夷奉朝貢四十三國原注契丹夏州嵗遣使入貢已載本門髙麗國原注漢玄菟郡國境南北一千五百里東西三千里定安原注馬韓之種為契丹所攻餘衆保于西部稱定安國案西部文獻通考作西鄙女真原注渤海之别種本駕姓日本原注倭奴國也以近日所出故改稱交址原注本南越之地交州總管也後改安南都護府溪洞諸蠻原注隋置辰州唐置錦州巫州欽州皆唐末蠻酋分據其地自置偽刺史建隆以後溪洞諸蠻皆歸順乞內附朝廷悉命其酋長為刺史南丹州原注溪洞别種與宜州接撫水州原注在宜州南有縣四曰撫水曰京水曰多逢曰古勞唐隸黔南西南蕃原注漢牂牁郡地唐置費珍莊琰播郎牂夷等州卭部州蠻原注漢越嶲郡由黎州十一程至部落黎州山前山後蠻原注西南夷之别種其酋長號都鬼主黎州南行七日而至其地又一程至巂州又二程至建昌又千里至雲南雅州蠻原注西南夷别種風琶蠻原注在建昌城之上占城原注在中國西南北至廣州便風半月程至兩浙一月程三佛齊原注南蠻之别種與占城為鄰闍婆原注國在南海中勃泥原注在中國之西南大海中注輦原注其國水行至廣州約四十一萬一千四百里蒲端原注國在海上與占城接丹流眉原注國在海上水路東北至廣州一百三十五程天竺原注舊名身毒赤白摩伽陀又曰婆羅門大食原注本波斯之别種于闐原注國在京師之西九千九百餘里西南帶蔥嶺與婆羅門接相去三千餘里東接吐蕃西北至疏勒二千餘里龜兹原注回鶻之别種髙昌原注漢車師前王之地其國有髙昌城取其地勢髙敞人民昌盛以為名回鶻原注胸奴之別裔國在西北婆羅陵水上後魏號鐡勒唐初號特勒吐蕃原注本漢西戎之地或云南涼秃髮利鹿孤後以秃髮為國號語訛吐蕃族帳分處各有首領內屬者為熟戶黨項原注古析支之地漢西羌之别種部落分處各有首領內屬者為熟戶西涼府原注西涼即涼州也唐末陷河西之地雖為吐蕃所隔然其地亦自置牧守東至靈武千里西北去至甘州五百里沙州原注瓜沙二州本漢燉煌故地達靼原注東方靺羯之别部音訛謂之達靼罝勒斯賚原注吐蕃餘種董戩原注罝勒斯賚之子為會州刺史層檀原注國與占城大食相近勿巡原注南海上小國大中祥符中其國主蒲加心烏皇遣使來貢伊州案原本闕注龐元英文昌雜録謂即漢之伊吾郡賓同隴原注海南小國其王室利波庶稅至道中來朝貢今不具到甘州原注甘州回鶻可汗舊𨽻沙州歸義軍西州案自此以下五國原本俱闕注文昌雜録謂西州本髙昌國漢車師前王之地貞觀中平其地為西州大食陀羅離慈案文昌雜録作陀羅離宋史大食國傳作陀婆離俱無慈字大食俞和盧地案文昌雜録誤以俞盧和地為南荒之國考宋史謂大食國人入貢路由沙州涉夏國抵秦州天聖元年恐為西人鈔略乃詔自今取海路由廣州至京師其國部屬各異名故有勿巡有陀婆有俞盧和地有麻囉跋等國然皆冠以大食則其為西方之國無疑大理國案范成大桂海虞衡志曰大理南詔國也本唐小夷自皮邏諾併五詔為一受册封雲南王至異牟尋封南詔王後自稱大禮國今其與中國接乃稱大理國與唐史禮理字異未詳所始西天大食國案文獻通考宋史俱不著西天之稱惟于熙寧六年載都蕃首蒲陀婆利慈表奉貢物事據此書後篇所記是年西天大食國來朝疑係一事附注備考日本淳化二年貢方物太平興國九年獻銅鈴磬景德元年來朝大中祥符二年來朝熙寧五年來朝元豐元年來朝交址開寶元年八月來貢方物太平興國二年五年七年八年來貢方物雍熙二年貢方物三年貢金器牙犀端拱元年貢方物淳化元年貢龍鳳椅子傘握子五年貢方物至道三年貢七寶交椅方物咸平元年獻馴象四年貢馴犀象景德元年遣其子明提來貢四年遣其弟明昶來貢乞賜九經佛經大中祥符二年貢馴犀三年五年七年貢方物天禧三年遣弟鶴來貢方物熙寧二年六年貢方物元豐元年貢方物溪洞諸蠻逐年同天節端午貢方物南丹州開寶七年貢銀器馬九年求賜牌印太平興國五年貢銀淳化元年遣其子來貢銀五年貢方物撫水州咸平四年正月貢方物三年十一月十二月又來朝天禧元年貢方物西南蕃乾德四年五年六年貢方物開寶二年貢方物八年貢馬太平興國三年貢方物五年貢馬雍熙二年八年貢方物九年貢馬淳化元年遣其弟漢興來朝三年貢方物馬至道元年貢方物咸平元年貢方物二年五年貢馬景德元年貢方物大中祥符二年貢賀東封馬六年八年九年貢方物天禧四年貢方物天聖四年貢方物康定元年貢馬熙寧三年貢方物六年四次貢方物十年貢方物卭部州蠻開寶二年貢方物太平興國四年貢方物雍熙二年貢馬端拱二年貢御馬淳化二年貢方物馬至道三年遣其子來朝賀咸平二年五年貢方物景德二年貢象牙大中祥符元年貢馬景祐四年貢方物黎州山前山後兩林蠻開寶二年八年貢方物太平興國二年四年貢馬雍熙二年貢方物端拱二年貢馬淳化元年貢方物大中祥符元年貢方物天禧二年貢方物雅州蠻太平興國二年貢方物大中祥符二年貢馬犎牛三年貢方物馬風琶蠻咸平元年貢馬景德二年貢犀角犎牛青羊占城建隆元年貢方物二年來朝三年貢方物乾德四年三月九月貢方物五年貢方物開寶二年貢馴象牙四年貢方物六年四月貢方物七年九月貢方物太平興國二年三年四年七年貢方物八年貢馴象淳