body:
  text: 宋朝事實卷十八宋李攸撰升降州縣一東京開封府大中祥符二年案宋史地理志作三年改浚儀縣為祥符縣復後唐匡城縣為長垣縣原注梁名長垣隆案宋史隋匡城縣建元年改為鶴丘後乃改長垣建隆四年升東明鎮為東明縣以濟陽鎮屬縣咸平五年升通許鎮為咸平縣案此書于各府州所領縣沿自前代者皆不記惟記自建隆迄紹興升改者據宋史謂政和七年改酸棗縣為延津則事在宣和以前此書不應闕載然文獻通考仍存酸棗舊名而不著延津其互異未審所由今就二書之顯與此書不同者附注各條下以備參證西京河南府熙寧八年案宋史作五年省洛陽縣入河南縣元祐二年復置熙寧八年省緱氏縣入偃師縣熙寧五年省伊闕縣入伊陽縣案文獻通考景德四年升永安鎮為縣屬京西路此闕載南京應天府景德四年案宋史作三年升歸德軍為應天府大中祥符七年升南京北京大名府慶厯二年升大名為北京案文獻通考熙寧六年省經城縣為鎮入宗城縣省洹水縣為鎮入成安縣此闕載京東東路青州淳化五年改為鎮海軍節度使原注唐為平盧軍節度政和元年曰齊郡密州開寶五年升為安化軍節度案文獻通考元祐三年以板橋鎮置膠西縣此闕載拱州崇寧四年以開封府襄邑縣建州名輔州以為東輔又改今名案文獻通考大觀四年廢拱州復為襄邑縣還隸開封政和四年復為州此闕載又通考及宋史並云屬京東西路與此屬京東東路有異齊州治平二年升為興德軍節度咸平四年省臨濟縣入章丘縣案文獻通考政和六年升齊州為濟南府又云景德三年以章丘置清平軍熙寧三年廢軍復為縣此皆闕載濰州建隆三年以青州北海縣置北海軍乾德二年升為濰州政和元年曰北海郡建隆三年析北海縣地置昌邑縣乾德三年以營丘城置安仁縣尋改為昌樂淮陽軍太平興國七年置太平興國七年以徐州之宿遷縣屬淮陽軍案文獻通考云以徐州之下邳宿遷二縣建淮陽軍元豐初改屬京東西路與此稍異京東西路襲慶府建隆元年復泰寧軍節度案文獻通考大中祥符元年升泰寧軍節度為大都督政和八年升為府大中祥符元年改乾封縣為奉符縣大中祥符元年案文獻通考作五年改曲阜縣為仙源縣案宋史大觀四年以瑕丘縣為瑕縣以龔丘縣為龔縣此闕載興仁府建中靖國元年改周彰信軍為郡後升府案宋史作崇寧元年升曹州為興仁府大觀三年升都督府大觀二年改宛句縣為宛亭縣案宋史作元祐元年改冤句縣為宛亭鄆州大觀二年升大都督府案宋史作大觀元年升大都督府宣和元年改為東平府廣濟軍太平興國三年以定陶鎮置廣濟軍至熙寧四年廢屬曹州元祐元年復置案文獻通考云漢定陶縣唐為鎮太平興國二年建為軍四年割曹澶濟濮四州地復置縣以隸焉熙寧四年廢軍以定陶縣隸曹州元祐元年復為軍視此所記覺更明晰鄧州建隆初省臨瀨縣入穰縣案宋史太平興國六年升順陽鎮為順陽縣慶厯四年廢方城縣入南陽縣此皆闕載襄州乾德三年以隂城鎮置乾德縣案文獻通考隂城鎮宋初升為光化軍熙寧五年廢軍改為光化縣隸襄陽元祐初復為軍又宋史云乾德二年析榖城縣三鄉置乾德縣與此所記互異太平興國元年復改義清縣為中廬縣均州乾德六年省豐利縣入鄖鄉縣案宋史均州本防禦宣和元年為武當軍節度此闕載隨州乾德五年升崇義軍節度太平興國元年改崇信軍熙寧元年省安化縣案宋史作熙寧元年廢光化縣為鎮入隨縣與元和郡縣志隨州管縣有光化之文相合而與文獻通考熙寧五年改光化軍為光化縣隸襄陽及此作元年省安化縣者先後沿革互有岐異金州乾德五年升昭化軍節度後為防禦熙寧六年省平利縣案宋史作省為鎮入西城縣元祐二年復置案宋史乾德四年廢渚陽縣入洵陽縣此闕載房州雍熙三年升保康軍節度開寶中省永清縣開寶中省上庸縣京西北路潁昌府元豐三年升許州為府原注唐為潁川郡升忠武軍節度梁為匡國軍後唐復為忠武軍崇寧四年建為南輔熙寧四年省許田入長社縣崇寧四年以汝州之郟縣屬潁昌府鄭州景祐元年升奉寧軍節度崇寧四年建為西輔崇寧四年以河南府密縣屬鄭州滑州太平興國四年改武成軍節度原注唐為宣義軍節度治平三年案宋史作熙寧三年省靈河縣入白馬縣孟州大中祥符中改汜水縣汜水關為行慶關慶厯三年以唐洛州王屋縣屬孟州案宋史汜水縣熙寧五年省入河隂元豐二年復置王屋縣熙寧五年自河南來隸此未詳蔡州景祐二年升淮康軍節度案宋史大中祥符五年改郎山縣為確山縣此闕載陳州案文獻通考陳州宣和元年升為淮寧府此未詳建隆元年改溵水縣為商水縣熙寧六年省南頓縣入商水元祐元年復置順昌府元豐二年升順昌軍節度政和六年升為潁州府案文獻通考作政和六年改為順昌府汝州熙寧四年案宋史作五年省龍興縣入魯山縣元祐二年案宋史作元年復置案文獻通考汝州政和中升陸海軍節度又宋史魯山縣宣和二年改為寶豐縣此皆闕載信陽軍唐義陽郡開寶九年降為軍太平興國元年改為信陽開寶九年省鍾山縣屬義陽開寶九年以羅山縣屬信陽軍案文獻通考開寶九年廢羅山縣雍熙二年復置此未詳河北東路開德府大觀元年升府原注唐屬澶濮魏三州晉升鎮寧軍節度崇寧四年建為北輔雍熙四年省臨黃縣入觀城縣熙寧四年案宋史作六年省頓丘縣入清豐縣崇寧四年以大名府南樂縣屬開德府案宋史崇寧四年以大名府之朝城縣來隸此闕載河間府大觀二年升府原注唐為瀛州宋初升瀛海軍節度熙寧六年省束城縣入河間縣熙寧六年省景城縣入樂壽縣案宋史樂壽縣至道三年自深州來隸熙寧六年省景城入焉又束城縣元祐元年復此未詳冀州慶厯八年升安武軍節度皇祐四年省堂陽縣入南宫縣棣州大中祥符八年徙州城及厭次縣于陽信縣地徙陽信縣于故厭次縣雄州政和三年為易陽郡太平興國元年改歸義縣為歸信建隆四年復置容城縣原注周顯德六年廢霸州政和三年為永清郡景祐元年案宋史作二年省永清縣入文安縣莫州熙寧六年省長豐縣為鎮又省鄚縣入任丘元祐二年復鄚縣尋又罷為鎮濱州大中祥符五年省蒲臺縣入渤海縣慶厯六年析渤海縣地置招安縣案宋史慶厯三年升招安鎮為縣熙寧六年省入渤海元豐二年復為縣與此互異恩州唐為貝州天寶初曰清河郡案宋史宋初為節度慶厯八年罷節度以平王則改貝州為恩州至和元年省漳南縣入厯亭縣案宋史熙寧四年省清陽縣入清河縣此闕載清州太平興國七年以滄州永安縣置原注周為乾寧軍後廢大觀二年河清七晝夜因改為清州政和三年為乾寧郡太平興國七年以永安縣之范橋鎮置乾寧縣熙寧六年省為鎮後復置縣崇寧三年又省之案宋史乾寧縣政和五年復置此闕載永靜軍慶厯七年以將陵縣原注周屬景州屬永靜軍淳化元年以阜城縣原注唐屬冀州屬永靜軍案宋史將陵縣景祐元年移治長河鎮阜城縣嘉祐八年省入東光熙寧十年復置與此詳略互異保定軍太平興國六年以涿州歸信縣新鎮置平戎軍景德元年改今名河北西路相州天聖七年改永定縣曰永和熙寧五年省入安陽熙寧五年省鄴縣入臨鄣中山府太平興國元年改定武軍節度原注唐為定州義成軍節度政和三年改中山府為中山郡康定元年省陘邑縣入安喜縣景德元年以祁州無極縣屬中山府洺州建隆元年升為防禦熙寧三年省曲周縣入雞澤縣熙寧六年省臨洺縣入永年縣案宋史元祐二年曲周臨洺復為縣尋復為鎮四年曲周雞澤依舊别為兩縣此闕載祁州景德元年徙治蒲隂縣原注周景福二年置祁州于無極縣端拱元年以恆州鼓城縣屬祁州熙寧六年省深澤縣入鼓城元祐元年復置保州政和三年為清苑郡案宋史保州本清苑縣建隆初置保塞軍太平興國六年建為州政和三年為清苑郡太平興國六年改清苑為保塞縣案宋史太平興國六年析易州滿城之南境入保塞此未詳趙州崇寧四年升為慶源軍節度開寶五年改昭慶縣為隆平縣熙寧六年省入臨城元祐元年復置熙寧五年省柏鄉贊皇入髙邑縣邢州熙寧六年省平鄉縣入巨鹿縣元祐元年復置熙寧六年省堯山縣入內丘縣元祐元年復置熙寧五年省任縣入南和縣元祐元年復置大觀元年八月二十六日詔遷趙州隆平縣邢州巨鹿縣于髙地以隆平地下濕巨鹿近為黃河陷沒故也政和三年十二月十七日尚書省言邢州巨鹿縣昨日黃河淹沒之事今來水勢已退乞興復舊縣從之永寧軍雍熙四年以博野縣地置寧邊軍景德元年改永定天聖四年改今名廣信軍太平興國六年置為威虜軍景德元年改今名陜西路永興軍路京兆府案宋史永興軍大觀元年升大都督府宣和二年詔守臣不用軍額稱京兆府此未詳大中祥符八年改昭應縣為臨潼縣大觀二年復以清平鎮置終南縣原注唐為縣鎮元案宋史清平鎮大觀年升為清平軍復置終南縣隸京兆府清平軍使兼知終南縣與此紀年稍異而原委較詳河中府太平興國七年改護國軍節度原注唐為河中節度案宋史熙寧三年省西河縣六年省永樂縣入河東此闕載陜西太平興國元年改保平軍節度原注唐為保義軍節度案宋史熙寧六年省硤石縣並入陜縣太平興國三年以虢州之湖城閿鄉二縣屬陜州此闕載延安府唐延州後唐彰武軍皇朝升府案宋史元祐四年升府熙寧五年省豐林縣金明縣入膚施八年省延水縣入延川縣此闕載同州太平興國七年升為定國軍節度案宋史熙寧四年省夏陽縣入郃陽此闕載耀州開寶五年為感義軍太平興國元年改感德軍淳化四年以雲陽縣之梨園鎮置淳化縣案宋史淳化縣宣和元年撥屬環慶路邠州此闕載虢州建隆元年改𢎞農縣為常農縣至道三年改曰虢略熙寧四年省王城縣入虢略銀州唐銀川郡案宋史五代以來為西夏所有熙寧三年收復尋棄元豐四年復旋被西夏陷沒崇寧四年復仍為銀州五年廢為銀川城此闕載綏德軍熙寧二年收復唐綏州又廢為綏德城後升為軍案宋史熙寧二年作三年元符二年升綏德軍與此稍異保安軍太平興國二年以延州永安鎮置軍天禧四年置建子城天聖元年改為德靖寨慶厯四年置順寧寨環慶路環州淳化五年復周之通逺軍為環州天聖四年復改方渠縣為通逺縣慶州乾德二年復為安化郡原注唐天寶元年曰安化郡至德元載曰順化郡升安定軍節度後唐降乾德二年復順化縣為安化縣乾德二年省同川縣入安化縣熙寧四年復置合水縣省華池樂蟠兩縣入合水熙寧三年以寧州彭原縣屬慶州涇原路涇州太平興國元年改彰化軍節度原注唐為彰義軍咸平四年置保定縣五年省為寨大觀二年復置案宋史咸平四年升長武鎮為縣五年省為寨屬保定縣大觀二年復為縣俱指長武言與此作保定有異渭州熙寧五年儀州廢以安化縣來屬乾德元年以舊崇信軍地置崇信縣屬鳳翔府淳化中屬儀州熙寧五年州廢來屬熙寧五年儀州廢以華亭縣來屬案渭州宋史入秦鳯路與此入涇原路有異原州太平興國元年改寧州豐義縣為彭陽至道三年屬原州懷德軍大觀二年升平夏城為軍以蕭關等寨原注唐蕭關縣地來屬鎮戎軍至道元年案宋史作三年以故平髙縣地置德順軍慶厯三年以渭州隴干城置元祐八年置隴干縣秦鳳路鳳翔府熙寧五年以好畤縣屬府隴州開寶元年案宋史作二年析􅊈陽置