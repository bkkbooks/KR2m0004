body:
  text: 宋朝事實卷十四宋李攸撰科目進士之舉惟本朝尤盛而沿革不一開寶六年因徐士廉伐鼓訴訟太祖御講武殿覆試原註講武殿即今崇政殿覆試自此始案此句疑有脱誤據文獻通考宋史選舉志命中書覆試己行之乾德中御殿命題重試則自開寶六年始賜詩自太平興國二年吕䝉正榜始分甲自太平興國八年王世則榜始賜袍笏自大中祥符中姚曄榜始案文獻通考賜袍笏亦自吕䝉正榜始錫宴自吕䝉正榜始賜同出身自王世則榜始賜别科出身自咸平三年陳堯咨榜始唱名自雍熙二年梁灝榜始封彌謄錄覆考編排皆始于景德祥符之間案宋史選舉志淳化元年蘇易簡知貢舉糊名考校遂為例景德四年定親試進士條制試卷内臣收之付編排官去其卷首鄉貫狀别以字號第之付封彌官謄寫校勘用御書院印付考官定等畢復封彌送覆考官再定等編排官閲其同異未同者再考之如復不同即以相附近者為定取鄉貫狀字號合之即第其姓名差次并試卷以聞大中祥符八年始置謄錄院令封印官封試卷付之集書吏錄本文獻通考謂糊名考校淳化己用之殿試景德復用之禮部此書以封彌與謄錄覆考編排並言始于景德祥符間似脱漏淳化糊名前事蔡齊大中祥符八年舉進士第一真宗臨軒見其舉止端重顧謂宰相寇準曰得人矣特詔金吾給騶從使傳呼道上因以為例開寳六年翰林學士李昉知貢舉放進士及諸科及第者凡三十八人下第進士徐士廉自陳屈抑即詔貢部以入等進士并終場經學人並親覆于殿廷内出未明求衣賦懸爵待士詩進士宋準等一百二十七人並放及第昉所放退落者十人案文獻通考云昉取宋準等十一人上令籍下第人召見擇之并準等御試詩賦黜昉所取武濟川一人續取十六人附後共得進士二十六人又五經開元禮三禮三傳三史學究明法諸科共一百有一人恰合此書一百二十七人之數惟初取十一人與三十八人後黜一人與十人彼此多寡懸殊當是通考專言進士此書合諸科言之責授昉太常寺卿御試舉人自此始也案文獻通考云昉等皆坐責自茲殿試遂為常式又云是年雖别試而共為一榜至八年御試别為升降始有省試殿試之分省元狀元之别大中祥符元年貢士萬二千人真宗自擇太子少保晁迥知貢舉仁宗慶厯二年詔罷殿試時臣僚言案文獻通考宋史選舉志並作知制誥富弼言國家沿隋唐之制設進士科取采賢俊雖至公之道過于前代而得人之實或所未至葢自咸平景德後條約漸密然省試有三長殿試有三短省試主文者四五人皆兩制辭學之臣又選館閣官數人以助考校復有監守廵察糊名謄錄上下相警不能容毫釐之私一長也又引試凡三日詩賦可以見辭藝䇿論可以見才識四方之士得以盡其所蘊二長也又貢院凡兩月餘日硏究差次必窮功悉力然後奏號三長也殿試考校之官多不精慎一短也一日試詩賦論三題不能盡人之才二短也考校不過十日不暇硏究差次三短也或云省試放榜則恩歸有司殿試唱第則恩出主上是忘取士之實而務收恩之名也歴代取士悉委有司獨後漢文吏課牋奏而上之端門亦未聞天子親試也至唐武后載初之年始有殿試此安足法哉往時未有糊名謄錄之制主文者尚可專取捨今既無以容其私則殿試未見所長請自今南省放榜必恐恩歸有司則宜如天聖二年貢舉先令考定髙下以混榜引于殿廷然後賜第則與殿試無異矣因降是詔案文獻通考載是篇大畧相同其末云遂詔罷殿試而議者多言其輕上恩隳故事旋復殿試如舊韓忠獻公宋景文公同召試中選是時王德用帶平章事例當謝自謙空疎德用曰亦曽見程文誠空疎少年更宜學問二公大不堪景文至曰吾屬見一老衙官是納誨也後二公俱大名德用已卒忠獻謂景文曰王公雖武人尚有前輩激勵成就後學之意樂律太祖乾德元年將有事于南郊翰林學士竇儼撰定樂章降神用高安皇帝行禮用隆安奠玉幣用嘉安奉俎用豐安酌獻飲福並用禧安亞獻終獻並用正安送神用高安之曲案宋史樂志載竇儼撰樂章在建隆元年此因乾德元年始南郊故繫年互異治平二年禮官李育言開寳通禮載圜丘宗廟大樂令率二舞工人就位文舞陳于縣北武舞立于縣南今郊廟文武二舞工六十八人方行禮時文舞既罷乃捨羽籥執干戚以為武舞竊惟天子親執珪幣以事天地祖考可謂極嚴恭矣而舞者紛然旁午縱横于下進退取捨蹙迫如此非所以稱嚴恭之意也上曰自今郊廟二舞各用六十四人以備八佾自是二舞之數全矣崇寧四年九月蔡京用魏漢津鑄九鼎作大晟樂時漢津取身為度之義以帝年二十四當四六之數取帝中指以為黄鍾之寸而生度量權衡以作樂漢津本剰員兵士為范鎮虞候見其制作略取之而京又使劉昺緣飾之原註以上見楊氏編年嘗攷劉昺大晟樂論云五季滅裂之餘樂音散亡周世宗觀樂懸問工人不能答乃命王朴審定制度其規模鄙陋聲音焦急非惟朴之學識不能造微葢焦急之音適與時應藝祖以其聲髙近于哀思乃詔和峴減下一律仁宗朝詔李照與諸儒典治取京縣黍累尺成律審其聲猶髙更用太府布帛尺為法乃下太常四律然太府尺乃隋尺也照知樂聲之髙而無法以下之乃取世俗之尺以為據是時樂工病其歌聲太濁乃私賂鑄工使減銅齊實下舊制三律然照卒莫之辨于是議者紛然遂廢不用皇祐中命阮逸胡瑗參定詔天下知樂者亟以名聞逸瑗減下一律三年而樂成言者以其制不合于古鐘聲弇鬱震掉不和滋甚遂獨用之常祀朝㑹焉神考肇新憲度將作禮樂以文治功元豐中採楊傑之論驛召范鎮劉几與傑參議下王朴樂二律用仁宗所制編鐘稽攷古制是正闕失煥然詳明夐出前世焉然諸儒之議互有異同而其論不出于西漢雖粗能減定而其律皆本于王朴未有能超然自得以聖王為師者也魏漢津居西蜀師事李良授鼎樂之法良惟以黄帝后䕫為法餘代皆有所去取皇祐中漢津與房庻以善樂被薦既至黍律已成阮逸始非其説漢津不得伸其所學後逸之樂不用乃退與漢津議指尺作書二篇叙述指法其書行于世漢津嘗陳其説于太常樂工憚改作皆不主其説逮崇寧初上以英明濬哲之姿慨然逺覽將稽帝王之制而自成一代之治乃詔宰臣置僚屬令講議大政顧惟大樂之制訛謬殘闕甚矣太常以樂器敝壊遂擇諸家可用者琴瑟制度參差不同簫篴之屬樂工自備每大合樂聲韻淆雜而皆失之太髙筝筑阮秦晉之樂也乃列于琴瑟之間熊羆案梁隋之制也乃設于宫架之外笙不用匏舞不象成曲不協譜樂工率農夫市賈遇祭祀朝㑹則追呼于阡陌閭閻之中教習無成懵不知音議樂之臣以樂經散亡無所據依秦漢之後諸儒自相非議不足取法乃博求異人而以漢津之名達于上焉高世之舉適契聖心乃請以聖上中指三節為三寸三三為九而黄鍾之律成焉漢津得之于師曰人君代天理物其所稟賦必與衆異然春秋未及則其寸不足春秋既壯則其寸有餘惟三八之數為人正得太蔟之律今請指之年適與時應天其興之乎前此以黍定律遷就其數曠嵗月而不能決今得指法裁而為管尺律之定曽不崇朝其聲中正平和清不至髙濁不至下焦急之聲一朝頓革聞者無不懽忻調唱和氣油然而生焉越崇寧四年八月庚寅樂成詔罷舊樂賜新樂名曰大晟明年冬致祠于帝鼐殿有甘露自龍角鬛下降案崇寧四年鑄帝鼐九鼎成大觀間御製大晟樂記云明年冬備三獻九奏奉祠鼎鼐後有雙鶴來儀不言甘露降則此特昺之飾説也詔令樂府官屬排設宫架備三獻九奏以祗謝景貺曲再作有雙鶴迴旋于宫架之上後再習樂羣鶴屢至黄帝大合樂有𤣥鶴六舞于前葢和聲上達而後鶴為之應傳曰不見其形當察其影世之知音者鮮矣而羽物之祥可卜其聲和也葢聲音之和上繫人君之壽考下應化日之舒長焦急之聲固不可用于隆盛之世昔李照欲下其律乃曰異日聴吾樂當令人物舒長照之樂固未足以感動和氣如此然亦不可謂無其意矣自藝祖御極知樂之聲高歴一百五十餘年而後中正之聲乃定葢奕世修德和氣薰蒸一代之樂理若有待壽考舒長之應豈易量哉四年八月庚寅崇政殿奏新樂詔曰道形而下先王體之協于度數播于聲詩其樂與天地同流雅頌不作乆矣朕嗣承令緒荷天降康四海泰定年榖順成南至夜郎牂牁西踰積石青海罔不率俾禮樂之興百年于此然去聖逾逺遺聲復存迺者得隱逸之士于草茅之賤獲英莖之器于受命之邦適時之宜以身為度鑄鼎以起律因律以制器按協于庭八音克諧葢祖宗積累之休上帝克相豈朕之德哉昔堯有大章舜有大韶三代之王亦各異名今追千載而成一代之制宜賜名曰大晟朕將薦郊廟享鬼神和萬邦與天下共之豈不美歟其舊樂勿用實錄不載詔㫖亦不載本紀于辛夘日書賜新樂名大晟置府建官辛夘大理卿曹調少卿李孝稱中書舎人張閣許光凝各以本職進對上謂閣曰昨日新樂如何閣對曰昨日所按大晟樂非特八音克諧盡善盡美至于樂莫不皆應古制竊聞初按時已有翔鶴之瑞與簫韶九成鳳凰來儀亦何以異臣無知識聞此和聲但同鳥獸蹌舞而已閣因奏被㫖以古州等處納土差官奏告永昭永厚陵上曰古州是古牂牁夜郎之地閣對曰牂牁夜郎接連南陸最為荒逺所謂上仁所不化者今不緣征誅文告之煩舉國内屬非陛下文德誕敷何以致此今告功諸陵在天之靈亦當顧享次光凝奏云昨日按新樂臣忝侍從之末得遇榮觀不勝幸甚上曰八音甚諧光凝曰此聖德所致可謂治世之音安以樂至如陛下收復青唐趙懷德歸順近古州二千餘里盡内附今正功成作樂之時上曰盡出詒謀光凝曰神考厲精庶政今陛下收其成效若非陛下善繼善述何以致此九月乙未朔以九鼎成御大慶殿受賀始用新樂大觀四年八月丁夘御製大晟樂記云在藝祖時常詔和峴在仁宗時常詔李照阮逸在神考時常詔范鎮劉几然老師俗儒末學昧陋不達其原曽不足以奉承萬一以迄于今朕仰繼先烈推而明之葢古之作樂者事與時並名與功偕制作各不同故文王作周大勲未集則虡業之聲不可行于武成之後武王嗣武卒其功伐則大武之聲不可施于太平君子持盈守成之日周雖舊邦樂名三易朕承累聖之謀述而作之有在乎是然奮乎百世之下以追千古之緒遺風餘烈莫有存者夙夜以思賴天之靈祖宗之休李良之弟子出于卒伍之賤獻黄帝后䕫正聲中聲之法宋成公之英莖出于受命之邦得其制作範模之度協于朕志于是斥先儒累黍之惑近取諸身以指為寸以寸生尺以尺定律而樂出焉爰命有司庀徒鳩工一年制器三年樂成而金石絲竹匏土革木之器備以崇寧四年八月庚寅按奏于崇政殿庭八音克諧不相奪倫越九月朔百僚朝大慶殿稱慶樂九成羽物為之應有鶴十隻飛鳴其上乃賜名曰大晟置府建官以司掌之明年冬備三獻九奏奉祠鼎鼐復有雙鶴來儀自後樂作則鶴至形影之相召于以薦壇廟和萬邦與天下共之乃按習于宫掖教之國子用之太學辟廱頒之三京四輔以及藩府焉及親筆手詔布告中外以成先帝之志不其美歟孟子曰今樂猶古樂葢感人以聲則無古今之異四夷之樂先王所不廢也雖樂不同而聲豈有二古今參用永為一代之制繼周勺之後革百王之陋以遺萬世貽厥子孫永保用享大觀庚寅八月一日宣和殿記政和三年五月御筆手詔樂廢乆矣歴世之君千有餘嵗莫之能述以迄于今去古尤逺循沿五季之舊非治世之音祖宗肇造之始每未遑暇百年後興葢在今日崇寧之初納漢津之説成大晟之樂薦之郊廟而未施行于燕饗夫今樂猶古樂也知樂者知其情而已循聲以知音循音以知樂循樂以知政所通在政所同在音而無古今之異比詔有司以大晟樂播之教坊按試于庭五聲既具八音始全無怨滯焦急之聲有純厚皦繹之美朕奉承聖謨立政造事昭功繼志一紀于兹乃者𤣥圭告成今則雅樂大備功成而作于是始信荷天之休宗廟遂謀追三代之盛成一代之制以遺萬世嘉與天下共之可以所進樂並頒行天下舊樂悉行禁止仍令尚書省措置立法行下故兹詔示想宜知悉牒奉敕依己得指揮并大晟府既頒降候頒行日禁止舊樂六年閏正月戊申大晟府奏神宗皇帝嘗命儒臣肇造玉磬藏之樂府乞令畧加磨礱俾與律合并造金鐘專用于明堂以薦在天之神從之厯象太宗詔新厯載六十甲子至道二年十一月司天冬官正楊文鑑請于新厯六十甲子外更増六十年事下有司判司天監苗守信等議以為無所稽據不可行用帝曰支干相承雖止六十儻兩周甲子共成上壽之數使期頤之人得見所生之嵗不亦善乎因詔新厯以百二十甲子為限自此始仁宗朝司天論月蝕分刻皇祐五年知制誥王洙言案宋史厯志不載是年月食事及王洙奏議此可補其闕據司天監李用晦等狀十一月望月蝕十分七厯並同復圓在書不辨刻惟驗起虧時刻内宣明算在丑正二刻儀天丑正三刻應天乾元寅初一刻後大衍景福寅初二刻而其夜食寅初四刻惟大衍景福稍近然景福算景祐三年四月朔日食二分强而崇天乾元宣明不食後果不食大衍厯算唐開元十二年七月戊午朔日食八分半十三年十二月庚戌朔日食十五分之十三至日皆不食所以一行大衍厯議云假令理厯者因開元二食曲變交限以就之則所協甚少而所失甚多用晦等亦不敢指定大衍景福為宻緣厯算日交月食諸厯互有疎密不可常准的葢月日豈不少有盈虧亦變常不定厯象必無全宻所謂天道逺而人道邇古來撰厯名賢如太史公洛下閎劉歆張衡杜預劉綽李淳風僧一行等尚不能窮究況用晦等淺學止依古法推歩難為指定日月所食疎宻又據編修唐書官劉羲叟狀據厯官等稱參校諸厯互有疎宻及稱止依古法推步不敢指定厯准的參定者古聖人厯象之意止于敬授人時雖則豫考定交㑹不必脗合辰刻故有修德救食之理天道神變理非可盡設謂必可盡耶則先儒不容自為疎闊又大衍等七厯所差不多法數大同而小異亦是遞相因藉乗除積累漸失毫釐且辰刻更籌惟據漏刻或微有遲速未必獨是厯差按隋厯志日月食既有起訖早晩亦或常變進退于正見前後十三刻半内候之今止差三刻或是天道變常未為乖謬又一行于開元中治厯以大衍及李淳風麟德劉綽皇極三厯校日食三十七事大衍課第一所申纔二十二麟德得五皇極得十以一行聰明博達時謂聖人宜考古今尚未能盡如淳風輩益以疎逺況聖朝崇天厯法頒用踰三十年誕布海内熟民耳目方將施之無窮兼所差無幾不可偶緣天變議改移詰其本原葢亦出于大衍其景福厯行于唐季非治世之法不可循用詔仍用崇天厯法英宗治平元年三月賜新厯名曰明天命翰林學士承㫖王珪序之初上即位司天監奏崇天厯五星之行及諸氣節有差詔判司天監周琮等七人同造新厯案宋史英宗即位命判司天監周琮及司天冬官正王炳丞王棟主簿周應祥周安世馬傑靈臺郎楊得言作新厯此書止載琮等七人而官職姓名俱未及詳厯成而中官舒易簡監生石道李遘各獻其所造厯詔翰林學士范鎮諸王府侍講孫思恭國子監直講劉攽詳定周琮等所造最宻乃用其厯遷琮等各兩官賜物有差然琮等厯後亦不可用而琮等皆奪所得官案宋史熙寧三年七月以琮等推驗月食不效乃詔復用崇天厯奪琮等所遷官與此可互證天文官李自正上星變圖且言月與太白俱犯昴當有邊兵大起上謂輔臣曰隂陽占候之説或中或否紂以甲子亡武王以甲子興盛衰之理何其異也由是言之王者當祗畏天道要在人事應之如何爾宋朝事實卷十四
