body:
  text: 宋朝事實卷四宋李攸撰郊赦一太祖乾德元年案東都事略十一月甲子合祭天地于圜丘改元乾德從張昭議以宣祖配考宋史十一月甲子十六日也此書失載月日南郊禮成車駕將還宫有司請乘金輅上顧侍臣曰朕欲乘輦可乎對曰無爽典禮乃改乘輦還帝御明德門肆赦前一日有司設文武百官皇親及蕃國諸州朝貢使僧道耆老位于明德門外太常設宫縣置鉦鼓其日刑部録御史臺開封府京城繫囚以俟及車駕還至明德門內就幄次改御常服羣臣就位皇帝登樓即御坐樞密使副宣徽使分侍立仗衛如儀通事舍人引羣官橫行再拜訖復位侍臣宣曰承旨通事舍人詣樓前侍臣宣敕樹金雞通事舍人退詣班宣付所司訖太常擊鼓集囚少府監樹雞竿于樓東南隅竿木伎人四面緣繩爭上取雞口所銜絳幡獲者呼萬嵗樓上以朱繩貫木鶴仙人乘之捧制書循繩而下至地以畫臺承鶴有司取制書置案上閣門使承旨引制案宣付中書門下轉授通事舍人北面宣云有制羣官再拜宣赦訖還授中書門下轉付刑部侍郎承制釋囚羣官稱賀閣門使進詣樓前承旨宣達訖百官又再拜蹈舞而退赦文門下朕以三靈腃命五讓興邦躬親罔憚于萬幾德教將加于四海屬嵗時屢稔華夏大同干戈漸偃于靈臺文軌皆通于象闕俗阜而南薰風競刑清而貫索星沈仰觀則日月麗天俯視而龜龍在沼加以物無疵癘民樂雍熙蓋玄穹垂祐于皇家非涼德自臻于昌運由是考百王之舊制緝千古之憲章墜典必修無文咸秩潔犧尊而謁清廟被大裘以郊上玄萬乘雲屯而在途千官星拱而就列公侯助祭共江漢以朝宗鐘鼓在懸與風雷而相薄百靈效職羣后受釐明德惟馨神心有答非煙塞望以呈瑞嘉氣浮空而襲人民具爾瞻禮無違者乃回金輅乃御應門律且協于黃鍾日正臨于甲子順三元之更始慶萬彚之咸亨而又藩嶽勳臣宰衡庶尹外達蠻貊內暨緇黃謂豫厯數在躬以應天廣運順其美謂豫溫恭允塞以仁聖文武成其功兼至德之隆名盡哲王之能事物議斯允豫衷莫遑宜覃曠蕩之恩用慰黎元之望可大赦天下云云於戲崇德報功取天地無私之象眚災肆赦推雷雨作解之恩更賴中外大臣佐佑厥辟必使萬邦黎獻盡躋仁夀之鄉百姓平章用致勳華之上布告億兆咸使聞知其後郊祀遵用此制改是年為乾德元年宣制畢御崇元殿百寮奉玉册上尊號曰應天廣運仁聖文武至德皇帝壬申大宴于廣德殿上壽號曰飲福宴乾德六年改開寶元年十一月二十四日南郊赦文門下我國家受天景福率土咸賓聲明洞照于萬方德教咸加于四海風雨順而嵗年豐稔干戈戢而刑政澄清域中共慶于小康海外咸欣于至化朕顧惟寡昧祗奉玄穹荷上帝之垂休致中原之大定遂發誠意再舉舊章恭陳告謝之儀仰答自天之祐羽衛森羅而在野王公肆覲而在庭六樂無不調五禮無不備躬奠玉爵陟配紫壇具物薦誠神心昭格非煙塞望以呈瑞嘉氣浮空而降祥宜與寰區同茲胥悅象闕既還于綵仗雞竿大舉于鴻恩同玉厯之惟新與蒼生而共慶盡日月照臨之內罔間幽遐極車書混同之邦咸均雨露庶成端拱永洽可封可大赦天下案宋史開寶元年南郊大赦十惡殺人官吏受贓者不赦後凡郊赦俱大略倣此改乾德六年為開寶元年自今年十一月二十四日昧爽以前云云於戲皇王報本之義乾坤助順之祥既舉彜章諒無闕政更賴中外宣力將相同心保黎庶之乂安致邊陲之寧靜扶持景運翊亮皇猷長懷魚水之歡共樂太平之化布告億兆咸使聞知案宋史是年南郊禮成上尊號曰應天廣運大聖神武明道至德仁孝皇帝前乾德元年赦文載尊號此後多失載赦文門下我國家膺上天之景命洽四海之歡心車書大同聲教遐被爰自塵清五嶺浪靜南溟開萬里之封疆致兆民之蘇息山川克復日月光華風雨順時嵗年大稔朕君臨天下道蒞人寰致率土之同情自玄穹之垂貺于是恭循典禮親執豆籩當愛日之迎長罄虔誠而告謝羣后執圭而肆覲神郊備物以陳儀柴燎既升乾光下燭瑞氣浮空而不散生民鼓舞以同歡宜覃作解之恩用洽自天之慶可大赦天下自開寶四年十一月二十七日昧爽以前云云於戲天地垂休所以祚開泰皇王報本所以告成功盛禮行而人神協和慶澤流而寰海胥悅文武列位將相具寮同心同德以逢時盡節盡忠而宣力宜勤翊亮共致太平九年案宋史開寶九年四月庚子祀圜丘此書失載年號并月日太祖將幸西京正月十三日詔曰定鼎洛邑我之西都燔柴泰壇國之大事今江表砥定方內大同祗遹景靈用伸報謝乃眷西顧郊兆在焉將飭駕以時巡躬展誠于陽位朕今幸西京以四月有事于南郊案東都事略正月庚辰詔後月幸西京有事于南郊幸西京當在二月而此書載正月十三日詔云今幸西京以四月有事南郊考宋史禮志正月詔以四月幸西京而太祖本紀復作三月丙子幸西京與此互異及赴齋宫先時霖雨彌旬是日雲物晴霽觀者如堵垂白之民咸相謂曰我輩少屬亂離不圖今日復覩太平天子儀衛皆相對感泣赦文門下我國家受命開基化民育物荷乾坤之垂佑致文軌之大同內則朝政雍熙外則武功振耀洎兩川克復五嶺蕩平被聲教于寰瀛納生靈于富壽惟有江表未息祅塵頃勞動于六師尋廓清于一境數千里氛妖既殄百餘年生聚知歸蘇其久困之民布以惟新之化非沖人之克乂皆上帝之儲休今者卜首夏之良辰就西都之正位備其燔燎靖乃豆籩躬伸告謝之誠用達恭虔之志奠玉之盛儀既舉普天之慶澤方行宜覃曠蕩之恩用表混同之化可大赦天下云云於戲牲牢報本所以答天地之休雷雨行恩所以洽華夏之慶御鳯樓而風雲助順案宋史開寶九年四月庚子祀圜丘回御五鳳樓大赦揭雞竿而士庶同歡眷惟文武之具寮並效忠勤之亮節佐我隆平之運實多翊亮之勞方切注懷更宜宣力太宗太平興國三年十一月南郊赦文門下王者負扆居尊繼天垂統順三靈之眷命契萬國之歡心宵衣旰食以忘疲恤物愛民而為念自臨宸極再易炎涼朝政允釐嘉穀屢稔四海盡同于文軌九州重正于封疆顧菲薄以何功賴穹旻之降祐爰循舊典親祀上玄獻琛而率土皆來執玉而諸侯畢會風雲助順羽衛增華慶皇祚之昌隆見禮容之繁盛而又王公庶尹中外具寮同傾愛戴之心奉我龎鴻之號億兆之願豈獨在豫宜覃大賚之恩用洽可封之化可大赦天下自太平興國三年十一月十五日昧爽以前云云於戲郊天祀地牲牢已薦于至誠布惠行恩雨露均霑于萬彚灑渥澤而瑕疵盡滌出縲囚而囹圄皆空凡諸有位之臣體我無私之意更資忠力共贊皇圖寰宇克定于丕平竹帛永光于千古案宋史是年南郊禮成上尊號曰應運統天聖明文武皇帝此失載太平興國六年十一月十七日南郊赦文門下王者繼統居尊握圖臨極法二儀而行化親萬務以忘勞兢兢如涉于大川蕩蕩期臻于至化日慎一日于兹六年八紘之文軌大同四序之隂陽不忒兵鋒偃戢年穀順成蘇杭千里之土疆盡歸臨照汾晉一方之生聚頓愈瘡痍邊陲載息于煙塵宇宙俱凝于和氣顧惟涼德享是豐功蓋穹昊之降靈兼祖宗之垂祐爰伸大報特備嚴禋被衮冕以陟圜壇薦牲牢而饗上帝而又中外列辟文武庶寮復以徽名加于眇質尊崇之號念何德以克堪億兆之心顧抑情而從徇祗膺典禮良用兢慙宜覃作解之恩用洽普天之慶可大赦天下云云於戲玉帛薦誠已陳于盛禮雲雷覃慶咸被于殊休效忠良者悉與旌酬負瑕釁者皆從滌蕩百神受職萬國來同當景運之昌隆嘉禮容之繁盛風雲薦瑞士庶同歡更資有位之臣共質無私之化各宣忠力永輔皇家布告寰區咸令悉知案宋史是年南郊禮成上尊號曰應運統天睿文英武大聖至明廣孝皇帝此失載赦文門下惟皇撫運樹鴻業于中區惟辟奉天表至誠于大報既謹就陽之禮宜覃及物之恩用慶昌期式符前典朕自虔膺寶運嗣守瑶圖九載于兹一心無怠雖寰區既乂敢忘于旰食宵衣而風雨弗迷屢覩于年豐俗阜加以非煙甘露氛霏繼灑于人寰瑞獸珍禽馴擾咸歸于御苑四塞之干戈自息八方之文軌大同集是丕休匪由涼德斯蓋玄穹之所降鑒清廟之所儲祥朕所以躬事禋燔告謝天地千官景從陪玉輅以供宸諸侯駿奔仰玄壇而助祭矧乃文物大備聲名孔修當六變以升聞荷百神之昭格純嘏之錫豈獨在豫思與萬邦同兹大慶仍改紀元之號遐均作解之恩可大赦天下改太平興國九年為雍熙元年自雍熙元年十一月二十一日昧爽以前云云於戲景運方隆荷乾坤之眷祐彝倫式敘在刑政以交修更賴文武藎臣方嶽庶尹各伸乃力共泰吾民庶令擊壤之謡不獨唐堯之代可封之俗復追虞舜之朝凡爾含靈知豫至意四年正月二日案宋史禮志淳化三年將以冬至郊前十日皇子許王薨宋琪請以來年正月上辛合祭從之即此正月二日辛卯也南郊赦文門下我國家創業垂統踰三十年禮讓興行車書混一外則五侯九伯立屏翰之奇功內則三事庶僚罄股肱之亮節共贊無私之化成兹不拔之基加以紫壇屢饗于天宗青輅早修于農事既禮交而樂舉致逺肅而邇安內顧眇躬享兹介福是用就上辛之良日薦大報之至誠乾坤既錫于鴻休祖宗是崇于嚴配案東都事略淳化四年南郊以宣祖太祖並配八蠻景附咸伸助祭之儀百辟靈從盡展陪鑾之禮覩士民之繁盛望羽衛之駢羅思與普天同兹大慶自淳化四年正月二日昧爽以前云云於戲郊天地以致誠明咸尊典故法陽春而施德澤盡滌瑕疵中外逺播于歡聲宇宙遍凝于和氣更資有位益勵乃誠展安民濟物之謀助旰食宵衣之化庶俾照臨之內俱躋富壽之期咨爾萬方咸知朕意南郊畢御乾元門下制曰泰壇燔柴國之大典上辛祈穀禮有舊章祗見上帝祈福天宗案此句下疑有脫文無别本可校姑仍其舊癸巳上賦南郊宿齋五七言詩六首賜近臣乙未雨雪作立春日瑞雪詩三首祕書監李至言自廟徂郊纖飇不搖羽衛如植升壇而星象炳煥訖事而雲氣鬱興應門肆赦非煙可挹案此句下疑亦有脫文赦文案宋史至道二年正月辛亥南郊此書失載年月日考下原注宋白為禮儀使及問吕端云云按是年宋白為禮部侍郎進翰林承旨吕端同中書門下平章事宋制禮儀使専命翰林學士為之白以翰林承旨為禮儀使故知此赦當在是年也門下我國家千齡啓運百世其昌惟列聖之在天介鴻休于下土朕自祗膺眷命嗣守皇圖垂二十餘年居億兆之上域中四大常師古聖之言天下一家幸接隆平之運逺肅而蠻夷率服時和而風雨弗迷盡禹别之九州來修厥貢懋堯咨之四嶽咸建庶官刑政于是相宣聲明以之大備夫何涼德集是丕休皆由九廟之儲靈實荷二儀之降鑒得不討論方策博採乎禮經祗奉郊丘興崇于祀事達孝思于清廟祈景福于上玄用薦精誠斯為大報百神效祉諸侯駿奔羅羽衛于康莊煙霞動色設宫縣于兩觀金石成文千官扈蹕以雲從百姓歡呼而雷動禮終嚴祀喜成昭事之心候屬載陽廣布惟新之慶宜覃恩宥溥洽寰區可大赦天下云云於獻時當獻嵗禮畢嚴禋祖宗之純嘏無疆天地之祥符有耀仰資玄貺敷佑蒼生更賴三事大臣六師上將炳人文而宣教化揚我武以定疆場逮夫庶邦冢君凡百執事咸有一德永孚于休俾我邦家紹統前代盡善盡美不其偉歟告示萬方明知朕意原注先是禮儀使宋白奏曰伏詳儀注朝饗太廟皇帝先詣罍洗後奠瓚其祀天地望先詣罍洗後奠玉幣上以問吕端言得禮之中遂從白議二年十一月丙戌合祭天地于圜丘案宋史真宗咸平二年十一月丙戌南郊此書失載咸平年號今據詔中嗣業三年等語考之宋史知在是年也以太祖太宗配還御乾元門下制曰天祚明德民懷有仁惟景運之泰階實昊穹之眷命太祖皇帝以武功定亂驅除八方四登泰壇親行大禮太宗皇帝以文德柔服混成一統五奠玉爵合祭二儀粵以沖人仰嗣丕業三年無改恭依典禮之文百穀用成亟獲豐年之瑞退朝之暇內省于懷未熟化源未成治定夫何涼德集是鴻休上由天地之元符人神協贊復荷祖宗之餘慶輔弼宣功履春冰而常積戰兢涉大川而詎知涯涘非惕厲不能繼先業非精虔何以答上蒼必在乎假清廟而擁神休舉皇儀而陳備物于以示昭報于以伸孝思爰當亞嵗之辰躬展事天之禮玉帛在笥金石在縣一陽生而寰海會同九奏成而神祗下降禮無違者天必從之宜覃作解之恩共洽無疆之祐可大赦天下云云於戲國容全盛天仗旋班非煙散朱雀之街旭日麗蒼龍之闕歡聲雷動喜氣雲從肆士庶之榮觀賴皇家之大慶更賴文武多士將相藎臣各竭忠規順成元化同心同德咸罄于嘉猷無怠無荒不忘乎明戒同砥于道不其偉歟布告萬民咸知朕意咸平五年十一月十一日南郊赦文門下禮莫大于事天孝莫重于嚴父因心崇陟配之義垂訓懋翼子之規自伯考建萬世之基聖父纘重熙之業莫不三年而郊上帝九廟以饗神宗用薦精誠以伸昭報顧豫寡薄獲荷慶靈奉以周旋焉敢廢墜矧乃寰區砥定黎庶幾于小康農畝豐登稼穡呈于上瑞皆玄穹之所降祐繄列聖之所垂休得不飭備物以告虔升禋燎而報本蠲吉之祀廣至福于兆民曠蕩之恩宜大賚于四海可大赦天下云云於戲天下之至大萬物之至繁雖勵力以自強願恭已而自治更賴藩嶽列辟股肱元臣暨禦侮之羣才逮盈廷之多士咸盡忠而奉化各無隱于厥誠俾豫垂拱而仰成致俗一變而至道共臻多福永孚于休景德二年十一月十三日南郊赦文門下朕自猥紹慶基君臨宇縣奉若天道馴致時雍常念守位維艱纂圖斯重納隍軫慮旰食視朝于今九年罔敢逸豫幸玄穹之降鑒荷宗廟以垂休農祥荐臻邊候不警屬天正上元之日陳吉土享帝之儀因得躬執豆籩祗見祖考牲牢備物圭幣薦誠四海九州皆來助祭六蠻三獻斯用降神仰景貺之自天慶蒼生之蒙福報本既行于盛禮回鑾乃御于應門萬國來庭集梯航而入貢九賓就列覩書軌之混同宜大賚于中區洽鴻恩于庶品永言純嘏豈獨在豫爰稽肆眚之文式布維新之澤可大赦天下云云於戲順天行慶俾渙汗以維均與物為春浹幽遐而廣被偃革已臻于開泰垂衣方示于穆清更賴文武具僚中外列辟體君臣之同德罄金石之純誠資政教于和平納生民于福壽共扶昌運永享于休案景德二年郊赦以後大中祥符七年二月壬申以謁聖祖于鴻慶宫恭謝南郊大赦又天禧元年正月辛亥以上聖祖尊號于景靈宫南郊大赦今此書二次赦詔俱缺無别本可考姑仍其舊天禧三年十一月十九日南郊赦文門下朕以仰欽皇緒夙奉慶基自列聖之貽謀逮眇躬之繼統兵戈銷偃海域混同何嘗不日慎居懷時乘在御絶畋遊而育物戒服玩以敦風納民歸仁壽之區涉道究希夷之際撫安四極賓延萬靈表下風以丁辰致彌文而熙載講求典禮肅恭神人燕處穆清聿懷沖粹荷太清之孚佑示祕籙以降祥靈運嘉亨景輿臨暨載聆諄誨逖悟仙源勵翼彌堅欽修備至考古先之盛則畢封禪之洪徽崇尚真宗登隆妙號言念元良之嗣生知至德之方善訪名山特開珍館祝壽昌之介祉見忠孝之存誠疊委寶文愈昭殊應是用答顧懷于穹厚成禋享于壇壝薦玉幣以告虔陳豆籩而蠲潔金匏協奏文物駢羅九賓相儀百神受職天旗總集既彰祚國之休王澤涵濡宜洽均禧之慶可大赦天下云云於戲展嚴恭之禮獲擁神休覃滂霈之恩式符衆望諒周隆于慶賜增激勵于神明更賴中外信臣文武列辟竭以忠勤之節傾其愛戴之心協贊重熙永膺多福天聖二年十一月十三日南郊赦文門下三載一郊國朝茂典蓋所以報貺天地致虔祖宗盡欽翼之心膺錫禆之福昊穹眷命三聖重光化無逺而不懷惠無幽而不浹肆豫寡昧纂是隆平端扆永思臨淵匪懼幸賴母儀申誨先烈在民三事羣卿禆我以公道百工庶尹贊我以逺圖政常敦本間邪刑必蠲苛慫善邊陲撤候方聘修歡東南之畝屢登隂陽之沴不作是用采甘泉之曩制方委粟之前經度土就陽占辰亞嵗豫祠真館虔饗太宫乃陟嘉壇肅陳量幣羣司戒潔工器協恭瞻來格于窈冥納降衷于髙厚天清日潤禮備樂崇克伸孚佑之文實荷厖鴻之賜宜均渙號溥及含生可大赦天下於戲積纍之業存乎時涵濡之澤加乎逺邦家所著憲度甚明豫惟遵行罔敢失墜班朝文武有位忠賢庶益藎規以弼涼德勿休屢省稱朕意焉禮成輔臣皆進官宰相王欽若等固辭上謂曰郊祀慶成朕為卿等進官懇辭何也欽若等對曰臣等待罪近司獲陪盛禮幸甚復遷官秩益為忝冒上懇諭久之欽若等再拜稱謝而退案宋史是年南郊禮成上尊號曰聖文􅌖武仁明孝德皇帝此失載是月甲辰案宋史仁宗天聖五年十一月癸丑南郊此書失載年月今以宋史及所載事迹考之當在是年也百官集尚書省受薦饗景靈宫誓乙巳受朝饗太廟誓丙午受合祭天地誓丁未上謂輔臣曰此三日百官受誓禮當然耶王曽等對曰宗廟告饗皆沿郊祀之事止當一日受誓今蓋循先朝舊制請俟他日釐正之庚戌宿齋于天安殿百官宿齋于朝堂辛亥薦饗于景靈宫宿齋于太廟大禮使王曽言案宋史禮志是年郊後擇日恭謝大禮使王曽請節廟樂云云今據此則在郊前二日宿齋太廟時也與宋史先後互異皇帝執圭被衮酌獻七室而每室奏樂章恐陟降為勞請節宫架之奏上曰三年一饗朕不敢憚勞也卿勿復言原注其後每親祀至版位必遣內侍密諭樂卿令備其音節又以戒樂工云壬子朝饗七室宿齋于南郊癸丑冬至合祭天地于圜丘三獻終增禮生七人各引本室太祝升殿徹豆畢赦文門下朕以紹膺端命祗服睿圖六載于茲萬幾在念守大中之曩訓遵聖善之懿猷被四表以宅心浹羣倫而從乂有祈必應惟動斯和歲事省成河流順復案宋史是年七月塞滑州決河故曰河流順復此皆鴻靈敷佑列聖顧懷乃砥輯寧愈增惕勵奉先之道固竭于精衷報本之儀聿循于舊典既卜郊而叶吉粵定位之載嚴沿襲有初講求惟允格太宫而祼獻率迪肅雍類上帝以燎熏並昭妥侑罄齋莊而備至荷肸蠻以居歆矧乃真系垂謨夙展欽崇之禮玉虛攸館將申裒對之文回寶眷以博臨介純禧而舉集顯無疆之大慶豈獨在豫霈作解之洪恩式均有衆可大赦天下於戲天人交感繄默定之有孚中外胥歡諒寵綏而宣洽尚賴既睦之宗戚同體之忠良暨諸邇臣逮夫庶士協一德以修輔廣四聰而必聞慎固基扄振明紀律無隱厥志用恢永圖主者施行宣制畢百官稱賀上恭謝太后于會慶殿案宋史禮志是年郊後三日齋長春殿謝玉清昭應宫禮畢恭謝皇太后與此郊後即日恭謝皇太后後三日齋長春殿又一日謝玉清昭應宫先後互異當以此書為據內常侍贊引皇帝皇帝自殿後幄詣皇太后前再拜跪奏曰臣禎虔遵舊典郊祀禮成中外協心以歡以抃皇太后宣答曰案宋史禮志是年皇太后宣答曰皇帝德備孝恭禮成嚴配萬國稱頌歡豫增深云云與此互異郊祀之祉與皇帝同之皇帝還內百官賀皇太后垂簾賜酒三行丙辰宿齋于長春殿百官宿齋于朝堂丁巳恭謝于玉清昭應宫案宋史天聖五年郊赦以後天聖八年十一月戊辰合祀天地于圜丘大赦此書失載此次赦詔無别本可考姑仍其舊是月壬辰案宋史仁宗景祐二年十一月乙未冬至南郊大赦此書失載年月今以乙未冬至及三宗並配考之宋史知在是年也上宿齋于大慶殿百官宿齋于朝堂癸巳薦享景靈宫宿齋于太廟甲午饗七室又饗奉慈廟宿齋于南郊乙未冬至合祭天地于圜丘以太祖太宗真宗並配案東都事略景祐二年詔以太祖為定配二宗為迭配皇帝親祀請以三聖並侑赦文門下朕膺天地之丕貺紹祖宗之慶基政典咸融兆民祗若休祥狎應大田屢兆于豐年髦俊並生多士協寧于景運熙平在旦燕翼有光諸侯盡賓納黎元于富庶三公論道升遺逸于簪紳豈惟沖人克致茂實必修報本之義以答上靈之心盛服展儀至日惟吉欽從謨訓率致精明清廟肅雍既備陳于圭瓚閟宫靜侐復親薦于豆籩被衮就陽燔柴定位嚴配並饗昭格于至誠陟降交歡誕膺于純嘏念紹庭之垂裕顧受福之永昌思與萬邦同茲大澤禮交樂舉既明嚴上之規雷動風行宜覃渙汗之號可大赦天下於戲大事在祀聿從裒對之文與物為春用穆好生之化更賴良弼賢戚維藩文武藎臣中外庶尹體恭肅以修輔本中和而在寬俾敦孝友之倫咸躋仁壽之域翼宣王度永播時雍主者施行太常禮院言南郊第一龕饗五方帝大明夜明神州地祇北極天皇大帝比嵗上差司天監保章正攝事且五帝尊神而獻官秩卑饗接非稱今詣第一龕以少卿監或正郎為獻官第二第三龕以員外郎壇下及內壝之外以京官或保章正分獻從之案宋史禮志景祐二年詔神州皇地祇舊常參官攝事非所以尊神自今命兩省嵗九大祀宰臣攝事者參知政事尚書丞即學士奉祠與此稍異大禮使言宗室詣中書受誓戒不至者六十餘員詔停郊廟幄位太常禮院言皇帝行郊廟之禮故事止設更衣幄殿而未有小次是以薦獻之際皇帝立版位以至于禮成未有所以裕主尊究恭肅也謹按周官朝日祀五帝則張大次朝覲會同亦如之鄭康成謂大次所往所止居也小次既按祭退俟之處也引祭義周人祭日以朝及暗雖有強力孰能支之是以退俟與諸臣代有事焉故説者以為祀昊天上帝亦張大次小次古者大次在壇壝之外猶今更衣幄殿也小次在壇之側今所未行按魏武帝祠廟令降神禮訖下陛就蕞而立須奏樂畢似若不愆列祖遲祭不速訖也故吾坐俟樂闋送神乃起爾然則武帝坐俟容須引設近次與周官義符今參驗前代謂宜設小次于皇帝版位少東每獻畢降壇若殿就小次俟終獻徹豆則復就版位至禮畢如此則奉神之意在久益虔執禮之容有恭無闕從之禮畢羣臣上尊號曰景祐體天法道欽文聰武聖神孝德皇帝三年七月己卯孫奭子瑜上崇祀録二十卷詔送史館原注奭領太常倣唐王涇郊祀録紀國朝典禮未奏而卒赦文案宋史神宗寶元元年十一月庚辰南郊大赦此書失載年月日今考之宋史知在是年也門下升禋陟配誠孝所以兼申擁休肆眚神靈于是交豫朕奉承丕厯欽率先謨永惟置器之重浩若涉川之廣託在尊極弗敢遑寧幸席成規寖尋至治而疆陲賓欵嵗物順繁民罔時恫政克用又斯皆昊穹開佑之貺宗祏燕詒之謀幽贊于茲朕將何力內循涼寡期保顧存是用圖講舊章毖修大報祓飾壇兆豐潔粢盛虔會迎長之辰躬陳合祭之典至于前獻道祖歷祼廟昭案自真宗以後凡南郊前必先饗景靈宫及太廟奉慈廟寶元元年十一月戊申享景靈宫己酉享太廟及奉慈廟故曰前獻道祖歷祼廟昭蓋經禮必先之文庶哲王能饗之義措事之日備物有嚴百執駿奔二聖參侑獲率強力以砥盛容居歆在上降鑒如答迪拜胙之吉敢曰余勤沛崇朝之澤方思衆共再念嚮徇羣議許加徽稱深揆浮實之華如乖克己之訓宜因冠號俾易建元顧無専享之福更示惟新之命可大赦天下於戲逮下之慶方與物而皆昌屢省之思冀後天而攸奉尚賴三事庶尹列辟衆司交輸乃誠躋格鴻化茂對乾施永孚于休禮畢宰臣張士遜等五人上表加上尊號寶元體天法道欽文烈武聖神英睿孝德皇帝案宋史是年南郊禮成上尊號曰寶元體天法道欽文聰武聖神孝德皇帝不載去英睿二字此書聰武作烈武當以此為正可證宋史之闕訛上屢郤之謂士遜曰唐穆宗云強我懿號不若使我為有道之君加我虛尊不若居我于無過之地朕常愛斯言卿等亦宜體此意士遜等懇諸不回上不得已至二十九日下詔惟不稱英睿二字餘允其請右司諫韓琦以京城內逼郊祀數月盜賊公行輦轂之下宜有禁暴之法請南郊前一月降敕開封府約束強盜罪至徒并折傷人以上如犯在敕後毋得以赦原其竊盜贓重者奏聽裁從之康定二年有獻議者以西事未寧欲權罷郊天上以為不可至十一月二十日南郊畢肆赦門下朕誕膺寶命嗣守鴻基荷上靈降監之祥奉列聖紹庭之憲撫寧典運司牧黎元慎保盈成之難思隆久大之業祗勤抑畏垂二十年何嘗不中昃勵精幽微博聼慮一夫之不獲期百志之惟熙務湯盤之日新致禹疇之時若至于秉慈儉之訓絶遊畋之娛器物屏雕文之功刑政革煩苛之弊雖未臻于淳古庶無怠于始初幸以諸夏謐清百嘉彚茂民涵豐楙之樂物違疵癘之傷玉燭四時蕭勺羣祀斯皆三神之所孚佑九廟之所撫綏豈繄眇眇之躬克召穰穰之福是用順考聲名之典寖尋禋燎之儀祓飾壇壝祗薦瑄幣揆天元景至之序定國陽郊見之儀皇穹后祗勔降瞻饗之原藝祖文考毖陳升侑之嚴本陶秸以致其誠合羶薌以達其氣望秩羣祀懷柔百神兾精意之獲伸奚備物之能稱若乃首趨真館前謁太宫肅修祼獻之常罄兹僾愾之慕所以因昭事之大述追孝之恭交集盛容克成美報禮由衆舉慶靡専承當天地並貺之仁聿均大嘏法雷雨作解之施用霈醲恩仍建號以紀元美受釐而布度可大赦天下宜改康定二年為慶厯元年於戲謹漢畤之親祠茲為大事體虞書之肆眚所重好生許清多辟之流咸沐維新之澤尚賴臣鄰同德官尹修方協進忠規允釐庶績丕格至平之治共酬純錫之私初設有小次壇下又設褥為黃道屬之神位至是上不御小次徹黃道改拜褥用緋以盡恭肅之志慶厯四年南郊御札敕內外文武百僚等朕荷祖宗之謀託黎元之上日慎夕惕罔敢怠遑故嘗六款圜丘祗見上帝今賴天之福浹宇以和雖右鄙留屯南方薄稔已加撫綏期砥靖安匪云交修思有昭報聖則能饗誠慙于寡德祭不欲數既及于三年通奉先規講求多物愾聞列聖之祫裒對明靈之臻況祈祉下民弗為専美在國大事其敢憚行朕以今年十一月二十五日有事于南郊咨爾攸司各揚乃職凡于供億母俾煩勞應諸道州府不得以進奉為名别行科率比者多緣嚴配加上徽名止循率籲之常徒為薦誠之纍且應神以實何用虛文與禮之奢不如寧儉其文武百官僧道父老等不得因郊祀上表請加尊號永言有衆宜喻先庚共奬至虔以副朕意故兹札示想宜知悉郊祀赦文門下朕聞為國莫重于祭報本莫尊于天禮不欲至于煩類當三嵗物無以稱其德是竭至誠比者原田有秋辰緯澄晷地數見寶蝗弗為災關輔簡餉與之調羌夏露懷徠之請間遣近輔分慰三垂案東都事略慶厯四年夏元昊稱臣命范仲淹宣撫陜西河東富弼宣撫河北就恤邊吏之勤無重編氓之困亦克用乂方致小康朕用欽荷顧存謹修禋類抑止貢奉之費裁節供帳之勞前敕攸司毋加徽稱雖微有善之讓姑砥事神之恭且復稽參典文改告兹諡案東都事略是年十一月改諡真宗五后尊諡從真聖之尊統貫乾德之舊章既款殊庭遂見清廟叶長日之嘉會祗靈壇而順享皇穹后地之合藝祖神宗之配六變而樂備三獻而禮成煬蒿煙于太霄達爟火于羣祀兩儀洪洞萬瑞紛綸斯固足以表上帝之眷懷罄沖人之明察又念乃文乃武有壬有林或奉引掃除或侍祠顯祖八屯擁衛之格九州獻力之常共贊眇躬克成毖祀美不専饗命則惟新用推多福之祥肆為兆民之慶可大赦天下於戲明德惟馨已回蓋髙之鑒與衆更始誠慕列辟之良矧曰如台敢云自暇益當居降祥之地而懼其咎席已安之勢而念其危弗徇非彞弗為無益建中道以臨總渙大號而胥歡嘉與羣元共臻斯路慶厯七年十一月二十八日南郊赦文門下朕嘗博覽載籍詳觀古今每資取于典彞用昭施于政教且夫大事在祀所期奉而益恭讓德于天必欲善不自處斯皆垂芳簡策作範邦家歷世相因百王不易在沿革而雖異諒稽參而靡渝故假廟致虔掃地尚質實奉先而嚴配取報本以貴誠粵自纘承逾茲二紀遵述詒謀之訓企及欽明之風慎持守于盈成念懷柔于逺邇萬幾之務罔怠于旰宵含生之倫冀登于富壽尚兢虞于譴戒彌鑒省于昏荒治格隆平物無疵癘制作禮樂敢謂其時協和人神當成厥事是用虔修毖祀參講縟儀抑菲德之徽稱增先皇之顯諡案東都事略是年加上真宗尊諡祗見觀德之室嚴禋定位之方圜壇載升長日協吉順考舊典傾竭精衷九州獻力以惟寅百神受職而咸秩紛綸之貺仰降于髙穹曠蕩之恩宜覃于率土可大赦天下云云於戲惟聖饗帝益罄于齋莊惟德動天敢忘于惕勵尚冀祖宗垂祐輔弼協謀繄維城親懿之賢暨衛社忠勞之士百工庶尹咸一乃心共贊昌期永臻皇極十一月四日南郊赦文案宋史仁宗皇祐五年十一月南郊大赦此書失載年號今以下太常禮院議三聖並侑考之宋史知在是年也門下燔柴報本崇經禮之親郊渙號宣恩廣春秋之大眚朕肅膺統業寅奉政機未昭厥塗猶涉淵水荷乾祗之敷佑賴宗社之擁全治克用平思無不服茂息生齒屢登康年蓋先烈之纍仁省眇躬之何德比舉秩于元祀用答揚于靈休三紀于茲涓衷敢怠自合宫之訖饗即陽位以薦誠申命道司詳稽舊典卜日南之長晷祠地上之圜丘前詔諸儒考正雅樂蓋以遵達孝之述事昭盛德之流光遹觀厥成升奏羣祀庶德音之致相接于天人沿豫象之辭登配于祖考率前期而戒誓復先甲以潔齊欽翼徂宫欵見于道祖肅僾在廟永懷于前人懼饗弗能臨祼惟惕紫營未旦赤霄在望執事有恪備物無違蒙上帝以居歆奉列聖之參侑蒼璧既奠朱燎以升惠我無疆肅然有感欽惟天表之應誕錫壽康嘉與宇內之人均承貺施可大赦天下於戲合祫大祀固靡神之不宗在宥羣方思與物而更始尚賴左右承弼中外臣工秉德輔豫竭忠圖治惟休惟恤永砥康哉太常禮院言奉詔再詳定三聖並侑事伏以配侑之法前代不同古則一王而後或兼配皆是變禮彌文廣申誠愛也國朝景祐二年曽下詔書令次郊禋三聖並侑其後以太祖定配二宗迭配明堂大禮亦三后並侑今陛下濬發德音欽明大孝況是本朝舊制已再躬行于義無爽故下詔曰王者因郊反始無大于躬親本孝奉先莫尊于主侑且明堂之配已著于定儀而景祐之文蓋存于甲令雖協事親之愛猶慎緣情之舉再諏羣議述考舊典皆以謂祖宗功德宜對越于上靈文昭武烈亦無嚴于祀位息民昭德定保永圖自今南郊三聖並侑布告內外宜體至懷三年罷南郊九月十二日恭謝案宋史仁宗至和三年改元嘉祐九月辛邜恭謝天地于大慶殿此書失載年號以宋史考之知在是年也敕內外文武臣僚執圭璧以事神嚴祖宗而配帝雖有國之常典亦因時而制宜朕承三聖之丕基撫萬邦之有衆儉于已思天下之民豐勞于心致天下之民佚罔敢怠忽庶幾治平而首春以來偶爽調適賴三靈敷祐百福來臻順以節宣獲茲康裕加以邊隅不聳風雨以時雖庶物之咸和顧眇躬而增惕是用稽先朝之成憲詢故實于有司即廣殿之翼嚴擇靈辰之良吉式申昭謝以格純休宜用先期俾茲誕告朕取今年九月內于大慶殿行恭謝之禮其今年冬至親祀南郊即宜權罷所有合行諸般恩賞並特就恭謝禮畢一依南郊例施行至日朕親御宣德門宣制仍令所司詳定儀注以聞務遵典禮勿俾煩勞咨爾多方咸體豫意故茲札示想宜知悉至九月十二日恭謝畢降赦門下朕纘繩基緒統御幅員周視萬幾僅成三紀思守文之尤重念居上之至難或未明而衣或既旰乃食惟正人是訪惟公論是稽恬然過勤舉不知困比春云始平履成虧荷髙明之博臨膺厚順之丕擁宗社降福士民輸忠眇眇之躬遄臻于綏乂便便之政率遂于講修雖屬水潦遘災河流移道案宋史是年四月大水河決商胡眷言方國成克妥安邦經所繫朕力何有亶茲循省彌用戰兢秋廩戒期農收畢務誕詢故事參繹前文約郊壝之儀嚴路廷之制工師虔鞏物品晏清祗罄誠忱潔清款見上以答乾元之開佑下以蘄生聚之樂康寖通明靈大示肸蠁宜與兆庶共均休嘉式覃渙汗之恩仍易紀年之號以孚神貺以順物宜可大赦天下云云初仁宗得疾議者以太宗至道年升遐乃深惡其年號趣詔中書改之是嵗以郊為恭謝天地改元曰嘉祐四年十月詔罷冬至祀南郊十三日祫享宋朝事實卷四
