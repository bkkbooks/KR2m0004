body:
  text: 宋朝事實卷十九宋李攸撰升降州縣二荆湖南路潭州淳化四年以衡州衡山縣嶽州湘陰縣來屬熙寧六年以益陽縣地置安化縣太平興國七年案文獻通考作二年析長沙縣置寧鄉縣案宋史載開寶中廢長豐縣入長沙元符元年以長沙五鄉湘潭縣兩鄉為善化縣此闕載衡州乾德三年以安仁場置安仁縣析衡陽衡山二縣地入焉道州熙寧五年省永明縣入營道縣元祐二年案宋史作元年復置乾德三年改延唐縣為寧逺縣省大歷縣入寧逺永州雍熙元年以零陵縣之東安場置東安縣郴州太平興國元年改郴義縣為桂陽縣改義章縣為宜章縣熙寧六年改髙亭縣為永興縣邵州熙寧五年收復梅山以其地置新化縣元豐四年以溪洞徽州為蒔竹縣崇寧四年以臨口寨為臨岡縣武岡軍崇寧五年升武岡縣為軍以蒔竹縣分為綏寧臨岡二縣隸焉桂陽軍本桂陽監景德元年以郴州藍山縣來屬荆湖北路江陵府乾德三年以江陵縣地置潛江縣乾德三年置建寧縣熙寧六年省入石首縣元祐元年復置鄂州開寶八年改臨江縣為崇陽縣景德四年改永安縣為咸寧縣案文獻通考熙寧五年升通城鎮為通城縣此闕載安州熙寧二年省雲夢縣入安陸縣元祐元年復案文獻通考安州宣和元年升為德安府此闕載復州熙寧六年廢復置熙寧六年州廢以景陵縣屬安州省沔陽縣入監利縣後置州復來屬乾德二年以白沙院置玉沙縣屬江陵府至道三年以縣來屬熙寧六年省入監利元祐元年復置鼎州大中祥符五年改武陵郡曰鼎州乾德元年析武陵縣置桃源縣峽州開寶八年省巴山寨入夷陵縣嶽州淳化五年升王朝場為縣至道二年改為臨湘縣乾德元年復朗州橋江縣為沅江縣來屬歸州熙寧五年省興山縣入秭歸後復置案宋史元祐元年復置沅州熙寧七年平溪洞地置沅州以潭陽縣地原注唐為敘州置盧陽縣為州治熙寧五年以龍標縣地置鎮江寨元豐三年廢為鋪熙寧七年以龍門縣地置龍門鋪元豐三年升黔江城置黔陽縣靖州熙寧九年平溪洞復置誠州元祐二年廢為渠陽軍三年廢為寨屬沅州紹聖中復置誠州崇寧二年改靖州元豐六年置渠陽縣為誠州治改羅蒙縣為通道縣漢陽軍熙寧四年廢屬鄂州元祐元年復置太平興國二年改汶川縣為漢川縣荆門軍開寶五年置熙寧六年廢元祐元年案宋史作三年復置初治當陽後治長林縣成都路成都府太平興國六年降為益州端拱元年復升成都府劍南西川節度原注唐改蜀郡為成都府又分為劍南西川節度淳化元年復為益州嘉祐四年復升為府六年復為劍南西川熙寧五年省犀浦縣為鎮入郫縣天聖四年改靈池縣為靈泉縣眉州太平興國元年改通義縣為眉山縣蜀州紹興十四年升崇慶軍節度為府案宋史作紹興十年升崇慶軍節度淳熙四年升府開寶四年改唐興縣為江源縣案宋史作改唐唐安縣為新津彭州開寶四年改唐昌縣為永昌崇寧中案宋史作元年改為崇寧綿州熙寧五年省西昌縣入龍安縣熙寧九年以茂州石泉縣來屬嘉州熙寧五年省平羌縣入龍遊縣淳化四年以眉州洪雅縣來屬乾德四年省綏山縣入峨眉縣邛州熙寧五年省臨溪縣入臨邛縣黎州慶厯七年案宋史作六年省通望縣入漢源縣茂州熙寧七年案宋史作九年即汶川縣治置威戎軍使簡州熙寧五年省貴平縣入平泉縣威州景祐三年改維州為威州原注屯田員外郎知祥符縣郭輔之奏切見維州屬西川益州路與京東路濰州相去近六千里臣昨知維州日有廣南龔州淮南髙郵軍京西陳州曽轉遞往東濰州遞角文字臣雖便遞往京東濰州及開封府曽轉遞到東濰州逃軍一名尋監送本路鈐轄司勘斷切緣逐州軍見有係刑禁轉遞往來一萬餘里動經三兩個月住滯兼濰州最是邊處監送到逃軍或至逺去走透深為不便欲乞别州名上曰非李德裕言吐蕃得此而號無憂城者耶侍者曰是因取地圖而觀之曰此足以威服西土八國遂改為威州天聖元年改通化縣為金川縣景祐四年復舊名治平三年即縣治置通化軍隆州熙寧五年降陵州為陵井監政和三年案宋史作宣和四年改為仙井監原注漢張道陵開陵州本朝不欲斥天師名改為仙井隆興元年復為州更名隆州咸平四年省始建縣入井研縣永康軍乾德四年置熙寧五年廢元祐初復乾德四年以彭州導江縣蜀州青城縣來屬熙寧軍廢復屬彭州蜀州元祐初復來屬潼川路潼川府乾德四年改劍南東川節度為靜戎軍節度太平興國三年改安靜軍重和元年十一月升梓州為潼川府大中祥符五年改五城縣案文獻通考作玄武縣為中江縣乾德四年以蜀招葺院置東關縣熙寧五年省永泰縣為鎮入鹽亭縣十年復置永泰尉司後改曰安泰遂寧府政和五年升遂州遂寧郡為府太平興國元年復改方義縣為小溪縣原注齊梁名縣曰小溪果州熙寧六年省流溪縣為鎮入南充縣資州乾德五年省月山丹山銀山三縣入盤石案文獻通考作廢月山丹山銀山清溪四縣王存九域志謂三縣入盤石清溪入內江此似脫去清溪入內江句普州乾德五年案文獻通考作熙寧五年省普康縣入安嶽縣省崇翕縣入安居縣省普慈縣入樂至縣敘州政和四年改戎州為敘州乾德五年省開邊縣歸順縣入僰道縣政和四年省僰道縣入宜賓縣太平興國元年改義賓縣為宜賓熙寧四年省瀘州宣和元年升瀘川軍節度原注晉江陽郡梁置瀘州唐為瀘川郡屬劍南道領縣六瀘川富義涇南江安綿水合江乾德四年廢綿水以富義置監案宋史大觀二年建純州置九支安溪兩縣三年建滋州置承流仁懷兩縣以合江之安溪寨為縣隸純州宣和二年廢純州改九支縣為九支城三年又廢滋州為武都城以承流縣併入仁懷此皆闕載合州乾德三年改石鏡縣為石照縣榮州治平四年改旭川縣為榮德縣熙寧四年省公井縣入榮德縣乾德五年省和義縣入威逺縣渠州景祐二年案宋史作三年王存九域志亦作二年省大竹縣入流江縣懷安軍乾德五年以金水縣立軍原注先是蔡州團練使曹翰上言遂州取金水縣路至西川五百里其金水縣又是簡州大路最居津要請建置為軍又西路轉運李鉉奏金水縣路通徹東西兩川及遂果閬商客往來不絶及非時使命文牒轉遞久逺無虞須是一路安靜方可得上件州府遞相應接緣此縣自乾德四年所納見在戶稅夏秋共五百貫有竒若仍舊此縣更屯駐兵士即人户凋殘賦稅全少必有供應不辦須是諸處般運又更困弊民力若割漢州金堂縣共建一軍額不離鎮撫數州界人户亦商客往來急疾兩川文字報應及使臣經過並得利濟其金水金堂相去五十里金水與三州軍水陸兩路相接若置軍額甚便故有是命乾德五年以漢州金堂縣來屬廣安軍開寶二年置開寶二年以渠州渠江縣果州嶽池縣合州新明縣來屬富順監乾德四年以富義縣地置富義監太平興國元年改曰富順治平元年置富順縣熙寧元年省長寧軍宋朝初置淯井監政和四年改置軍原注唐羈縻長寧等十州隸瀘州之地熙寧八年夷人獻納十州地利州路利州景祐四年改寧武軍節度原注蜀升昭武軍節度乾德三年改胤山縣曰平蜀熙寧三年省入嘉川縣案宋史開寶五年改益昌縣為昭化咸平五年以嘉川縣來隸此闕載洋州景祐四年改武康軍節度原注蜀升武定軍節度乾德四年省黃金縣入真符縣閬州乾德四年改安德軍節度原注後唐升保寧軍節度乾德五年案文獻通考作熙寧四年省岐坪縣入奉國縣劔州熙寧五年省臨津縣入普安縣案文獻通考乾德五年廢永歸縣此闕載巴州乾德四年省盤道縣入清化咸平五年以靜州清化縣屬集州熙寧三年省七盤縣入恩陽縣乾德四年省歸仁縣熙寧五年省其章縣入曾口縣熙寧五年以廢壁州通江縣來屬省廣納鎮白石縣入通江縣案宋史作省壁州白石符陽二縣入通江與此有異又乾德四年廢始寧縣熙寧五年省清化縣入化城此闕載蓬州大中祥符五年更郎山縣案宋史作唐朗池縣為營山縣熙寧三年省蓬山縣入營山縣乾德三年省宕渠縣入良山縣熙寧五年省良山縣入伏虞縣大安軍乾德五年以三泉縣直隸京師至道二年升為軍以興元府西縣屬焉三年軍廢復為縣而西縣還故屬紹興七年案宋史作三年復為軍夔州路黔州嘉祐八年省洪杜縣入洋水縣為寨原注熙寧二年以洋水縣為鎮又省信寧縣都濡縣皆入彭水縣為鎮達州乾德三年更唐通州通川郡為今名乾德五年省閬英縣入新寧熙寧六年省三岡縣七年省石鼓縣分屬通川永睦新寧乾德五年省宣漢縣入東鄉忠州熙寧五年省桂溪縣入墊江縣乾德六年以夔州龍渠鎮屬南賓縣開寶二年置尉司開州慶厯四年廢新浦縣入開江縣改萬嵗為清水縣涪州熙寧三年省溫山縣入涪陵縣恭州崇寧元年更唐渝州南平郡為今名乾德三年案宋史作五年省萬夀縣雍熙五年省南浦縣入江津縣珍州大觀二年大駱解上下族帥駱世華駱文貴等獻地東西四百五里南北三百五十一里以其地為珍州亦曰樂源郡復立樂源縣為州治焉原注珍州本唐珍州後屬髙州樂源縣本唐珍州屬縣承州大觀二年蕨平帥任漢崇獻地東西三百五十九里南北六百六十五里改為承州原注本唐夷州地領綏陽都上洋川寧夷等縣皇朝收復但據夷人所指以置縣然原其始析置移屬則都上近黔州寧夷近思州溱州熙寧七年招收唐溱州置榮懿寨屬南平軍崇寧中復立溱州案宋史作大觀二年復立溱州梁山軍開寶三年以石氏屯田務立軍以萬州梁山縣為軍治元祐元年七月二十五日詔梁山軍撥隸萬州其稅租令逐年科折就本軍輸納梁山縣開寶三年以萬州梁山縣隸軍熙寧五年又析忠州桂溪縣地益焉南平軍熙寧八年招收西南蕃部以恭州南川縣銅佛壩地置軍隆化縣八年自涪州來隸南川縣皇祐五年置縣隸恭州熙寧八年來隸尋廢為鎮隸隆化縣元豐元年復遵義軍大觀二年蕃帥楊文貴獻地東西百二十里南北六百一十二里以其地置軍原注唐貞觀元年析牂牁置遵義縣屬朗州十一年州廢縣亦省十三年復立播州亦復置縣十四年更名羅蒙十六年更名遵義後自播州徙州治唐衰播州為楊氏兩族所分據一居播州一居遵義以江水為界其後居播州者曰光榮得唐所給州銅牌居遵義者曰文貴得州銅印大觀二年兩族各獻地皆自以為播州議者以光榮為族帥重違其意乃以播州立州遵義立軍大寧監開寶六年立監于夔州大昌縣之鹽泉所端拱元年以大昌來屬為監治福建路福州太平興國二年復為威武軍節度原注唐為威武軍後周改彰正軍太平興國五年復析閩縣置懷安縣崇寧元年更永泰縣為永福縣天禧元年改永貞縣為永昌縣乾興元年又改為羅源縣建州端拱元年升建寧軍節度原注本閩王氏鎮武軍節度南唐降為軍事治平三年析建安建陽浦城置歐寧縣與建寧分治郭下熙寧三年省元祐四年復置淳化五年升崇安場為縣咸平五年升關隸鎮為縣政和三年改為政和縣泉州太平興國三年改平海軍節度原注南唐為清源軍節度淳化五年案文獻通考作太平興國六年析晉江縣置惠安縣南劔州太平興國四年改劔浦郡為今名太平興國四年以建州將樂來屬汀州乾德四年復以唐汀州為汀州原注南唐改為南州淳化五年升上杭場武平場並為縣元符元年析長汀寧化置清流縣漳州太平興國五年以泉州長泰縣來屬邵武軍太平興國六年析邵武縣置光澤縣太平興國五年以建州之泰寧縣建寧縣來屬興化軍太平興國