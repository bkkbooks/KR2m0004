body:
  text: 宋朝事實卷二宋李攸撰登極赦太祖建隆元年正月初五日登極赦案太祖以周顯德七年正月初四日即位此書云初五日者蓋登極肆赦在次日也門下朕以五運推移上帝于焉眷命三靈改卜王者所以膺圖朕起自側微備嘗艱險當周邦草昧從二帝以徂征洎虞舜陟方翊嗣君而纂位但罄一心而事上敢期百姓之與能屬以敵國侵疆邊民罹苦朕長驅禁旅往靖邊塵鼓旗才出于國門將校共推于天命迫回京闕欣戴眇躬幼主以厯數有歸尋行禪讓兆庶不可以無主萬幾不可以曠時勉徇羣心以登大寶昔湯武革命發大號以順人唐漢開基因始封而建國宜國號大宋改周顯德七年為建隆元年乘時撫運既協于歌謠及物推恩宜周于華夏可大赦天下應正月五日昧爽以前天下罪人所犯罪已結正未結正已發覺未發覺罪無輕重常赦所不原者咸赦除之應貶降責授及勒停等官並與恩澤諸配徒役男子女人等並放逐便其內外馬步兵士各與等第優給諸軍內有請分料錢者特與加等第添給中外見任前任職官並與加恩文武升朝官內諸司使副使禁軍都指揮使以上及諸道行軍司馬節度副使藩方馬步軍都指揮使應父母妻未有官及未曽敘封者並與恩澤亡父母未曽封贈者並與封贈諸處逃亡軍都限赦到百日內仰于所在陳首並與放罪依舊軍分收管如出百日不來自首者復罪如初念彼愚民或行姦盜屬兹解網咸許自新諸軍有草寇處仰所在州府及巡檢使臣曉諭招喚若願在軍食糧者並與衣糧如願歸農者亦聽取便於戲革故鼎新皇祚初膺于景命變家為國鴻恩宜被于寰區更賴將相公王同心協力共裨寡昧以致隆平凡百軍民深體朕意案永樂大典所載登極赦文獨佚此詔今從趙普龍飛記所載補入原注翰林學士承旨陶穀行蓋穀筆也昭憲太后常與太祖參決大政及疾甚太祖侍藥餌不離左右太后曰汝自知所以得天下乎太祖曰此皆祖考與太后之餘慶也太后笑曰不然亦由柴氏使幼子主天下耳因戒敇太祖曰汝萬嵗後當以次傳之弟則并汝之子亦獲安矣太祖頓首泣曰敢不如太后教其後太祖遂傳位太宗皇帝開寶九年十月二十一日登極赦門下王者繼統承祧所以嗣神器節哀順變所以寧萬邦顧歷代之通規諒舊章而可法先皇帝勤勞啓國宵旰臨朝萬幾靡倦于躬親四海方成于開泰念農民之疾苦知戰士之辛勤氛祲盡平生靈永逸而寒暄遘厲寢疾彌留方臻偃革之期遽起遺弓之歎猥以大寶付于沖人遵理命而莫能固辭涉大川而罔知攸濟負荷斯重攀號莫任宜覃在宥之恩俾洽維新之澤可大赦天下云云恭惟先皇帝推誠損己焦思勞神念將士之忠勤知戰伐之辛苦衣糧祿賜無非經手經心土地官封不惜酬勳酬效生靈是念稼穡為憂罷非理之差徭去無名之侵耗不貪遊宴盡去奢華減後宫冗食之人停諸司不急之務方嶽止甘鮮之貢殿庭碎珠玉之珍獄訟無寃刑戮不濫凡關物務盡立規繩豫小子纘紹丕基恭稟遺訓仰承法度豈敢越違更賴將相公卿左右前後共遵先志同守成規庶俾沖人不墜洪業真宗至道三年四月一日登極赦門下創業垂統于以貽後昆嗣位承祧于以紹前烈為股肱之元首俾億兆之宅心洪惟永圖屬在明辟夫何涼德享是丕休先皇帝膺籙上玄受遺太祖臨御逮踰于二紀憂勤遂冠于百王無一日不舉皇綱無一事不親聖覽宵衣旰食焦思勞神禹迹混同方致太平之運堯心未倦俄興不豫之災棄大寶以上仙付沖人之神器仰遵顧命下迫推崇若涉大川罔知涯涘黽勉負荷兢畏交并宜覃作解之恩聊展奉先之意可大赦天下云云恭念先朝庶政盡有成規謹守奉行不敢失墜所宜開諫諍之路拔茂異之材鰥寡無告之民悉令安泰動植有生之類冀獲昭蘇庶幾延宗社之鴻休召天地之和氣更賴中外百執左右藎臣各盡乃職輔兹不逮布告遐邇咸使聞知仁宗乾興元年二月十九日登極赦門下天生蒸民惟君所以司牧國有神器有子所以傳歸先皇帝紹纍聖之丕圖輯庶邦之大治焦勞虔鞏二紀于兹忽興憑几之言永結遺弓之慕循顧眇質獲嗣慶基適屬承祧之初宜覃在宥之澤可大赦天下常赦所不原者咸赦除之恭念夙侍聖顔備承寶訓凡百機務盡有成規謹當奉行不敢失墜更賴宗工良佐中外臣僚咸竭乃誠以輔不逮布告遐邇咸使聞知英宗嘉祐八年四月一日登極赦門下蒸民之生置君為之司牧神器之重有子所以傳歸先皇帝天資慈仁聖德深厚臨御嵗踰于三紀憂勤日覽于萬幾常旰昃以忘勞因晦明而遘厲寖違沖豫遂至彌留遽興憑几之言念及承祧之寄猥以大業屬于沖人永惟負荷之艱矧在哀迷之次罔知攸濟祗率舊章宜覃在宥之恩式表奉先之志可大赦天下云云恭念夙奉聖顔備聞聖訓在于庶政悉有成規惟謹奉行罔敢廢失更賴中外多士左右忠賢各盡乃誠以輔台德布告遐邇咸使聞知神宗治平四年正月九日登極赦門下夫民之戴君尊如元首之奉天之與子傳有神器之歸先皇帝紹履至尊欽篤先烈圖治百王之上垂精五載之間玉几留章每及夜分之覽紫闈訪道多逾日昃之咨既寤寐之積勤因寒暄之遘厲神機未厭遽至彌留之憂邦禍何勝已聞遺訓之託屬哀荒之靡次固負荷之惟艱煢然自思浩莫能濟宜本承祧之始用覃澤物之私可大赦天下云云於戲奉先昭孝實本于天經肆眚推恩蓋循于國典更繄文武之助忠賢之規各勉交修永輔不逮咨爾有衆體豫至懷哲宗元豐八年三月六日登極赦門下生蒸民而立之君所以出四方之令有天下而傳于子所以維萬世之安先皇帝道極聖神德兼文武圖治三王之上儲精七閏之間緝熙事功董正法度積勤勞于日昃違沖豫于春元植璧以歸方致金縢之禱綴衣遽設忍聞玉几之言眷豫沖人屬以重器永荷艱難之託曷勝哀疚之懷宜謹始于承祧用渙恩而及物可大赦天下云云恭念先朝之治必循五聖之謀思祗率于舊章用答揚于光訓尚賴中外列辟左右忠賢交修厥官以輔豫治布告遐邇咸使聞知徽宗元符三年正月十三日登極赦門下朕承先帝之末命嗣纍世之丕圖若履淵冰未知攸濟先皇帝睿明聰哲克勤于邦遵制揚功篤紹先烈十有六載海內蒙休憂勞爽和遂至大漸乃以神器屬豫沖人負荷惟艱怵惕以懼用謹承祧之始肆頒在宥之恩可大赦天下云云恭念元豐詒謀紹聖遺訓具在天下可舉而行惟既厥心罔敢廢失其率循于天下用奉若于先王更賴忠良盡規文武合慮永弼乃后共圖康功咨爾萬邦體豫至懷欽宗宣和七年十二月二十五日受內禪登極赦門下我國家創業守成紹二百年之祚運宅中圖大奠三萬里之幅員施及眇躬嗣膺神器永念纘承之重懼劇春冰載惟臨御之難憂深朽索矧今邊垂未靖師旅方興肆推曠蕩之恩用慰邇遐之望可大赦天下云云於戲清蹕而朝萬宇敢忘丕冒之仁繼明以照四方宜布惟新之澤更賴忠良協贊文武交修永孚于休同底于道咨爾有衆體豫至懷光堯夀聖太上皇帝建炎元年五月一日登極赦門下皇天祐宋卜世過于漢唐藝祖承周受禪同乎舜禹列聖嗣無疆之厯保邦隆不拔之基屬以朝姦稔成邊釁恃中都之安富忘外敵之憑陵馴致金人來犯京邑初登城而不下終邀駕以偕行痛念鑾輿逺征沙漠宗族從而盡徙宫闕為之一空仍仰臣僚俾僭位號朕以介弟之親而授指開元帥之府以總師方輸敵愾之忠忽奉講和之詔豈圖變改終致阽危蓋嘗指日以誓諸軍使前迎而後請不憚瀝血而檄率土冀外附而內親而三事大夫與萬邦黎獻共致樂推之懇靡容牢避之思謂亹亹萬幾難以一日而曠位矧皇皇四海詎可三月而無君勉徇羣情嗣登大寶宵衣旰食紹祖宗垂創之基疾首痛心懷父兄播遷之難籲號久隔衆罔繫心軍旅荐興農多失業慰民耳目之注敷朕心腹之言爰布湛恩誕敷區夏可大赦天下於戲聖人何以加孝朕每懷問寢之思天子必有所先朕欲救在原之急嗟我文武之列同時忠義之家不食而哭秦庭士當勇于報國左袒而為劉氏人咸樂于愛君其一德而一心佇立功而立事同徯兩宫之復終圖萬世之安副我憂勤躋時康乂案周輝清波雜志云髙宗即位于南京肆赦文有兩本首尾皆同如道君發德音而罪已退辭履位之尊淵聖以震長而繼天首正誤國之罪悉捐金幣分割膏腴思愛惜于兩朝忍輕加于一矢生靈受賜中外聞風要質賢王既驅車而北渡連結異域復擁衆以南侵慨溪壑之無厭昧蜂蠆之有毒廷臣乏䇿敵使詭和欵貔虎以退師致金湯之失險肆令狼子薦食都畿等語與今所傳本異蓋時有忌器之嫌也皆太常少卿滕康行永樂大典所載即當時所傳本而前詔特詳于清波雜志附識于此又考宋史髙宗即位大赦常赦所不原者咸赦除之惟蔡京童貫王黼朱勔李彥孟昌齡梁師成談禎及其子孫見流竄者更不收敘並載清波雜志中是當時亦不盡赦也孝宗皇帝紹興三十二年十三日受內禪登極赦門下春秋法五始之要聿嚴受命之符天地之大德曰生爰下維新之令太上皇帝慈儉為寶遹駿有聲垂精三紀之間圖治百王之上神謨獨運總一日萬幾之繁聖武旁昭極四海九州之廣未嘗暇逸久積倦勤黃屋非唐堯之心居懷重負泰元增漢武之策欲介長年顧睿訓之博臨懼朕躬之弗稱凡今者發政施仁之目皆得之問安侍膳之餘爰舉舊章用覃曠澤可大赦云云於戲有天下傳歸于子敢忘付託之難建皇極敷錫厥民允副邇遐之望尚賴股肱同德中外協謀共底績于中興以益光于永世咨爾有衆宜體朕懷紀元太祖朝建隆元年原注庚申周顯德七年正月四日受禪改元建隆二年原注辛酉建隆三年原注壬戌建隆四年原注癸亥十一月十六日南郊改乾德元年案建隆四年十一月十六日改元乾德東都事略李燾長編宋史以是年為乾德元年其未改元以前之事俱係之乾德元年之下故建隆有三年無四年其後凡改元不在正月朔日即以所改之元紀年如乾德六年十一月改元開寶即書開寶元年惟于九年十月太宗即位改元太平興國仍書為開寶九年特為變例而事實所載統以所改之元年分注是年之下至次年直書為二年其體例與各書互異乾德二年原注甲子乾德三年原注乙丑乾德四年原注丙寅乾德五年原注丁卯乾德六年原注戊辰十一月二十四日南郊改開寶元年案十一月原本誤作十二月今據宋史改正開寶二年原注己巳開寶三年原注庚午開寶四年原注辛未開寶五年原注壬申開寶六年原注癸酉開寶七年原注甲戌開寶八年原注乙亥開寶九年原注丙子十二月二十二日太宗改元為太平興國元年案宋史太宗以開寶九年十月二十一日即位十二月二十二日改元原本誤作十月二十日今改正建隆四年始議改元太祖謂宰相曰勿用前代舊號于是改乾德他日帝于禁中見內人鏡背有乾德之號以問翰林學士陶穀穀對曰偽蜀時年號也宫人果故蜀王時人帝于是益重儒者而歎宰相寡聞也按偽蜀王衍以正明五年十二月改明年為乾德盡六年太宗朝太平興國二年原注丁丑太平興國三年原注戊寅太平興國四年原注己卯太平興國五年原注庚辰太平興國六年原注辛巳太平興國七年原注壬午太平興國八年原注癸未太平興國九年原注甲申十一月二十一日南郊改雍熙元年案二十一日原本誤作二十四日今據雍熙元年郊社文改正雍熙二年原注乙酉雍熙三年原注丙戌雍熙四年原注丁亥雍熙五年原注戊子正月十七日藉田畢肆赦改端拱元年端拱二年原注己丑淳化元年原注庚寅正月一