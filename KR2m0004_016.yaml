body:
  text: 宋朝事實卷十六宋李攸撰兵刑自唐天寶後歷肅代藩鎮不復制以及五代之亂太祖即位罷藩鎮權擇文臣使治州郡至今百餘年生民受賜每一詔下雖擁重兵臨大衆莫不即時聽命建隆二年太祖謂宰臣曰五代以來諸侯跋扈有枉法殺人朝廷置而不問刑部之職幾廢且人命之至重姑息藩鎮當若是耶令諸州決大辟訖録案聞奏委刑部覆視之奏案自此始太祖嘗讀虞書嘆曰堯舜時四凶之罪止從投竄何近代憲網之密耶蓋有意于措刑也故自開寶以來犯大辟非情理深害者多貸其死五代時鼎澧辰沅邵陽五州之境案江少虞事實類苑作武陵辰澧邵陽為五州宋史作辰錦溪巫敘為五州與此互異各有蠻猺保聚依山阻江殆十餘萬馬希範周行逢時數出寇邊以至圍迫辰沅二州案宋史作辰永二州殺掠民畜嵗嵗不寧太祖既下荆湖思得通蠻情習險厄智勇可任者以鎮撫之有辰州猺人秦再雄者長七尺武健多謀在周行逢時屢以戰鬭立功蠻黨畏伏太祖召至闕下察知可用以一路之事付之再雄起蠻酋除為辰州刺史官其一子為殿直賜豫甚厚仍使自辟吏屬盡與一州租賦再雄感激異恩誓死報效至州日訓練土兵得三千人皆能被甲渡水歷山飛塹捷如猿猱又遣親校二十八人分使諸蠻以傳朝廷懷來之意莫不從風而靡各得降表以聞太祖大喜再召至闕面加奬諭再雄伏地流涕嗚咽不勝感恩改辰州團練使又以其門客王乃成案宋史作王允成為本州推官再雄盡瘁邊圉故終太祖世無蠻貊之患五州延袤數千里不增一兵不費帑庾而邊境妥安由神機駕用一再雄而已淳化三年太宗謂宰相曰治國之道在乎寬猛得中寬則政令不成猛則民無所措手足有天下者可不慎之哉吕蒙正曰老子稱治大國如烹小鮮夫魚擾之則亂近日內外皆來上封求更制度者甚衆望陛下漸行清淨之化上曰朕不欲塞人言路至若愚夫之言賢者擇之亦古典也趙昌言曰今朝廷無事邊境謐寧正當力行好事之時上喜曰朕終日與卿等論此事何愁天下不治茍天下親民之官皆如此留心則刑清訟息矣上嘗御便坐録京城繫囚至日旰近臣或以勞苦過甚為言上曰不然倘惠及無辜使獄訟平允不致枉撓朕意深以為適何勞之有因謂宰相曰國家設官分職本為治人如受任外官悉能盡公決斷焉有不治之事古人宰一邑治一郡致飛蝗避境虎渡鳳集臣下為政尚能致兹感應若帝王用意惠民申理寃滯豈不感召和氣朕孜孜求治今得天下安泰亦其效也宋琪曰天下治亂繫在一人陛下臨御十年勤勞致治陰陽和順寰海寧謐每日前殿所談止在刑政退朝惟觀古史究歷代興亡善惡之事以法古成憲上資神聖中外幸甚案宋史刑法志太宗親録繫囚至日旰近臣或諌勞苦過甚帝曰儻惠及無告使獄訟平允朕深以為適因謂宰相云云與此條大略相同繫于雍熙二年十月靈州河外寨主李瓊以城降賊有司將坐其家屬上曰窮邊孤壘又無援兵緣坐之法朕不忍行也案下文書二年則此上自必繫年為傳寫者脫去二年契丹入邊邊將言文安大成二縣監軍棄城遁走請以軍法論上遣中使誅之既行謂之曰此奏尚有疑得無所部召之耶當詳而後決使至訊之果乾寧軍令部送民入城非擅離所部遽釋之上之明察如此上謂侍臣曰法律之書甚資政理人臣若不知法舉動是過苟能讀之益人知識比來法寺新案多不識治體侍臣曰今天下所上案牘獄情已定法官止閲案定刑事之虛實不可改也當在精擇知州通判庶知清獄訟若州縣得良吏一二其下必無寃人上然之上聞汴水輦運卒有私貨市者謂侍臣曰幸門如鼠穴何可塞之但去其尤者可矣篙工楫師苟有少販鬻但無妨公不必究問冀官物之入無至損折可矣吕蒙正曰水至清則無魚人至察則無徒小人情偽在君子豈不知之若以大度兼容則萬事兼得曹參不擾獄市者以其兼受善惡窮之則姦慝無所容故慎勿擾也聖言所發正合黃老之道上親録京師繫囚謂近臣曰為君勤政即得感召和氣如後唐莊宗不恤國事惟務畋遊動經旬浹月每出大傷苗稼及還蠲其租稅此甚不君也張𢎞曰莊宗兼惑于音律縱酒伶官典郡者數人上曰大凡君人以節儉為本仁恕為念朕在南衙時亦嘗留意音律今來非朝會未嘗張樂每旦下藥多以鹽湯代酒鷹犬之娛素所不好且多殺飛走真誥所不許朕嘗以此為戒李繼隆討夏寇與轉運使盧之翰有隙欲陷之罪乃檄轉運使期八月出塞令辦芻粟轉運司調發方集繼隆復為檄言隂陽人狀陳八月不利出師當更取十月轉運司遂散芻粟既而復為檄云得保塞胡偵候狀言賊且入塞當以時進運芻粟即日取辦是時民輸挽者適散倉卒不可復集繼隆遂奏轉運司乏軍興太宗大怒立召中使一人付三函令乘驛取轉運使盧之翰竇玭及某人首丞相吕端樞密使柴禹錫皆不敢言惟樞密副使錢若水爭之請先推驗有狀然後行法上大怒拂衣起入禁中二府皆罷若水獨留廷中不退上既食久之使人偵視廷中有何報云有細瘦而長者尚立焉上出詰之曰爾以同州推官再期為樞密副使朕所以擢用爾者為賢爾乃不才如是耶爾尚留此安候對曰陛下不知臣無能使待罪二府臣當竭愚慮不避死亡補益陛下以報厚恩李繼隆外戚貴重莫比今陛下據其一幅奏書誅三轉運使雖彼有罪天下何由知之鞫驗事狀明白乃爾加誅亦何晚焉獻可替否死以守之臣之常分臣未獲死故不敢退上意解乃召吕端等端等奏請如若水議先令責狀許之三人皆黜為行軍副使既而敵欲入塞事皆虛繼隆坐落招討知秦州若水由是知名天下真宗即位首下詔求言上謂近臣曰朕樂聞朝廷闕失以警朕心然臣僚章奏多是自陳政績過行鞭撲以取幹辦之名國家政事自有大體使其不嚴而理不肅而成斯為善矣豈可慘虐刻薄邀為己功使之臨民徒傷和氣此輩真酷吏也石熙政知寧州上言昨清逺軍失守蓋朝廷素不留意因請兵三五萬真宗曰西邊事吾未嘗忘之熙政逺不知耳周瑩曰清逺失守將相不才也熙政敢如此不遜必罪之真宗曰羣臣敢言者亦甚難得其言可用則用之不可用置之若必加罪後復誰敢有言者因賜詔書褒嘉焉仁宗天聖七年十月詔諸軍班典賣官所給軍號法物以違制論自餘以不應為從重科之先是樞密院言御馬直于榮鬻自製紫衫而開封府以軍號法物定罪請下法官議而審刑院言捧日天武拱聖驍騎寧朔龍猛神勇飛猛宣武虎翼衛聖服緋紬衫渤海神衛捧節牀子弩雄武飛山服紫紬衫吐渾員寮直龍衛雲騎武騎龍衛帶甲剩員紫紽衫又皆有緋小綾卓畫帶甲背子一以上為軍號殿前諸班直馬軍諸班殿前左右班內殿直散員散指揮金鎗東西班鈞容直皆服錦襖背子給塗金銀束帶銀鞍勒謂之儀注御龍直服錦襖背子皂羅真珠頭巾塗金銀帶以上為法物犯者亦以軍號論今于榮鬻自製紫衫難從軍號法物定罪也故降是詔平廣西蠻賊歐希範歐希範環州思恩縣人嘗舉進士試景祐五年應募從官軍擊安化州叛蠻既而詣登聞求録用案宋史作擊登聞鼓求録用下宜州而知州馮伸己言其妄要賞朝廷遂編管全州未幾輒遁歸其族百餘人謀為亂殺馮伸己而曰若得廣西一方當建為大唐國因問術士石太清太清曰君貴不過封侯也乃殺牛建壇場祭天神推白崖山酋蒙趕為帝叔歐正辭為奉天開基建國桂王慶厯四年正月十三日遂領衆二千餘人破環州劫州印以環州為武成軍又破鎮寧州及普義寨宜州捉賊李德用出韓婆嶺擊卻之獲偽將崖盈談護二人希範遂入保荔波洞間出拒官軍明年轉運使杜杞大領兵至環州使攝官歐曄進士曽子華宜州押司官吳香誘其黨六百餘人始與之盟置蔓陀花酒中既昏醉稍呼起問勞至則皆推于後廡下盡擒殺之後三日得希範等十數人剖其腹繪五臟圖仍醢之以賜諸溪洞殿中侍御史梅摯等言廣州轉運使杜杞誘降人歐希範等六百餘人悉于會上殺之失朝廷所以推信逺人之意宜劾罪以聞上為賜書申戒之廣西捉殺歐希範兵官禮賓使陳拱等四十三人並行賞有差慶厯三年盜起京西掠商鄧均房叛兵燒光化軍逐守吏吏不能捕天子患之問宰相誰可任者宰相言度支判官尚書虞部員外郎杜杞名家子好學通知古今宜可用乃以杞為京西轉運按察使居數月賊平叛兵誅死明年廣西歐希範誘白崖山蠻蒙趕襲破環州陷鎮寧帶溪普義有衆數千以攻桂管宰相又言前時杜杞守橫州言蠻事可聽宜知蠻利害天子驛召杞見便殿所對合意即除杞刑部員外郎直集賢院廣南西路轉運按察安撫等使杞至宜州得州人吳香及獄囚歐世宏脫其械使入賊洞説其酋豪杞乘其怠急擊之破其五洞斬首數百級復取環州因盡焚其山林積聚希範窮迫走荔波洞蒙趕率偽將相數十人以其衆降杞與將佐謀曰夫蠻習險恃阻如捕猩猱而吾兵以苦暑難久是進退遲速皆不可為故常務捐厚利以招之蓋威不足以制又恩不能以懷此其所以數叛也今吾兵雖幸勝然蠻特敗而來爾豈真降者耶啖之以利後必復動乃慨然歎曰蠻知利而不知威久矣吾將先威而後信庶幾信可立也乃擊牛為酒大會環州戮之坐中者六百餘人而釋其尫病脅從與其非因敗而降者百餘人後三日兵破荔波擒希範至并戮而醢之以賜諸溪洞于是叛蠻無噍類而杞威震南海言事者論杞殺降為國失信于蠻貊天子置之不問詔書諭杞賜以金帛杞即上書引咎仁宗平保州雲翼叛軍慶厯四年八月壬寅降敕榜招安保州叛軍又詔保州兵亂本路見領兵甲捉殺慮恐北界緣邊人户驚疑可令知雄州王德基牒報之蔡襄言保州兵士閉城為亂殺黨中懦兵十餘人指為首惡以要朝廷招安臣與臣修臣甫已有論列欲令知定州王杲引兵隨招榜入城盡行誅戮不聞施行竊以天下內外之兵百有餘萬茍無誅殺決行之令必開驕慢叛亂之源今州兵殺官吏閉城門從而招之使傳于四方明朝廷有畏衆不殺之意官司有觸事畏忌之勢則姦何憚而不為議者若謂今日北戎妄生釁端不可便于極邊之地張皇其事為敵人所窺是不知制兵之權而昧威戎之略也夫以中國為夷狄所輕者本由朝廷威令不行今以徑兵入城誅一二千叛卒以絶天下禍亂之萌而敵人咫尺必將竦動安慮其見窺乎况事機不可失惟陛下特發睿斷而行之丙辰田况言保州緣邊人户多煽言軍賊作亂將引契丹軍馬入界以臣所料必有姦人因欲搖動邊民乞下沿邊安撫使密令緝捕法外施行從之又言保州纍有人縋城不得其造逆不肯開城門軍士雲翼左第九指揮一十一人招收第三指揮一十一人第四指揮一十人姓名已令用牀子弩射箭射入城中告示韋貴若能設畫擒戮得叛人則當優遷官資如軍中人能自相殺併一人以上並與軍員髙排三兩人則不次擢之丁巳命內侍武繼隆齎赦敕赴保州招安令田況李昭亮劉渙楊懷敏相度如己開門即更不以赦敕示之初河北自五代以來保州廣信安肅别領兵萬人為三部號都巡檢司亦曰策先鋒以知州軍為使置副使二人使鄰道相為援太祖嘗用此兵有功因詔每出巡别給錢糧以優之其後州將不出巡惟巡檢司所領得給為不均通判祕書丞石待舉乃建議于都轉運使張昷之請領所部兵更其出入季一出巡出則别給錢糧餘悉罷之至是巡檢司雲翼等軍悉揚言為亂知州如京使興州刺史劉繼宗不自安乃悉令納所置教閲器仗會都監韋貴與待舉射弓賭酒而于衆辱之貴慿酒慢詈曰徒能以減削軍糧為己功因激其衆八月五日給軍衣衆遂劫持兵入衙門待舉挈家上城出東門入無敵營會繼宗挈家至與待舉列敵兵守關城率神衛招收兵郤入東門以拒亂既而轉鬭不敵繼宗待舉復上城避之遂下城繼宗墮城死待舉藏鹿角中為亂卒所害衆怒待舉甚揭其首于是又疑走馬承受公事劉崇古言與待舉同議亦害之始迫沿邊巡檢都監王守一不從而死乃擁韋貴據城以叛賊平既降昷之等又降知定州案前有知定州王杲之文此當云降知定州王杲而傳寫脫去張昷之為河北都轉運使保州界河巡檢兵士常以中貴人領之與使州抗衡多齟齬不相平州常下之其士卒驕悍糧賜優厚雖不出巡徼常廩口食通判石待舉以為虛費申轉運司罷之士卒怨怒遂作亂殺知州通判等懸其首于木上每旦射之箭不能容則拔去更射推都監為主不從則以槍刺之洞心刃出于背又脅監押韋貴貴曰若必能用吾言乃可衆許之遂立貴為主貴稍以言諭之令勿動倉庫及妄殺人且説之以歸順朝廷衆頗聽之會朝廷遣知制誥田況齎詔諭之況遣人于城下遙與賊語出詔示之賊終狐疑不聽稍近城則射之不能得其要領有殿直者徑踰壕詣城下謂賊曰我班行也汝下索我就汝語賊乃下索即授之登城謂賊曰我班行也豈不自愛茍非誠信肯至此乎朝廷知汝非樂為亂由官吏遇汝不以理使汝至此今赦汝罪又以祿秩賞汝使兩制大臣奉詔書來諭汝尚疑之豈有詔書而不信耶兩制大臣而為妄誕耶詞氣雄辨賊皆相顧動色曰果如此更使一二人登城即復下索召其所知數人登城于是信之爭投兵下城降即日開門大軍入收一指揮坑之餘皆勿問加閣門祗候案此即指殿直者佚其姓名保州城未下時有中貴人張懷敏與張昷之不協在軍中密奏賊云得張昷之首我即降願賜昷之首以示賊宜可得上從之遣中使奉劍往即軍中斬昷之首以示賊是時參知政事富弼宣撫河北遇之即遣中使復還且奏曰賊初無此言是必怨讎者為之若以一卒之故斷都轉運使頭此後政令何由得行上乃解昷之落職知虢州案宋史不載富弼諫止斬張昷之事此可補其闕平貝州妖賊王則慶厯七年十二月河北安撫使知北京賈昌朝奏十一月二十八日貝州宣毅軍大將王則據城叛則本涿州人以飢饉流亡至貝州始去涿時母與之别刺福字于其背以為記恩冀之俗多尚妖術案貝州以平王則改為恩州此云恩冀已從改後之名後因習妖法謀為亂遂言背有福字自然隱起以惑衆衆頗信事之而州吏張巒卜吉為之主謀會冬至知州張得一與官屬俱謁聖祖于天慶觀則率其徒劫庫兵得一保驍捷營賊焚營門執得一囚之兵馬監押內殿承制田斌以從卒巷鬭不勝而出城門閉提點刑獄田京任黃裳持印棄其家屬縋城出保南城賊從通判董元亨取軍資庫鑰不得殺之遂縱獄囚囚有憾司理王奬者遂殺奬既而節度判官李浩清河令齊開主簿王湙皆被害則僭號東平王以張巒為宰相卜吉為樞密使建國曰安陽榜所居門曰中京居室廏庫皆立號改元曰得聖以十二月為正月置破趙得聖等軍百姓年十二以上並刺為軍所用旗幟號令率以佛為稱城上置四總管各主一方又列其徒為知州然縋城下者日衆于是令守者五人為保一人縋則四人悉斬之貝州民汪文慶郭斌趙宗本汪順自城中為書射出約為內應夜以索引官軍數百人上城焚敵棚賊率衆拒文慶等與官軍復自城而下功雖不就上曰文慶等能嚮順可嘉也悉録以官三班奉職馬遂為北京指揮使則叛遂中夜叱吒晨起詣留守賈昌朝請擊賊自效昌朝因使持招降榜入城則盛服見之遂諭以禍福不答時知州事張得一侍側遂目之不應乃起投杯于地扼則喉擊之流血左右無助者賊黨至斷其一臂殺之將死猶罵賊曰妖賊恨不斬汝萬段上聞歎息久之贈宫苑使封其妻為旌忠縣君仍賜冠帔官其五子及賊平得殺遂者驍捷卒石慶上使其子剖心而祭之則始與妖黨謀以八年正旦斷澶州浮橋相應為亂會其黨潘方淨者以書謁留守賈昌朝昌朝執之故未及期而發所習妖書有五龍經滴淚經始則之叛也上以權知開封府明鎬為端明殿學士河北體量安撫使節制討賊既屢攻未克上憂賊熾亟召髙陽關總管王信問貝州事且戒信曰凡軍營在關城內與賊為亂者家屬悉羈管之餘非是作亂者常加曉諭勿使之憂疑也又曰城中軍民來投者毋得枉有殺戮以求功賞使諭河北安撫使賈昌朝與言亟示之以約束違者以軍法從事上又曰城下要害處既多設寨柵以防奔衝即隂晦雨雪賊乘夜突出以害吾主將不可無備軍中盛寒凡係官材植及河防物料權許就取為薪上之憂恤軍民如此一日得賈昌朝奏貝州事憂形于色悵然曰相公樞密日上殿來無一人與國家了事者何益彥博早朝慷慨請行以破賊自任上大喜既而左右贊曰官家無憂貝加文則敗矣上益喜丁丑右諌議大夫參知政事文彥博為河北宣撫使本路體量安撫使樞密直學士左諫議大夫明鎬副之戊寅詔文彥博以便宜從事仍以將作監主簿鞠真卿試將作監主簿成偉進士李景元掌機宜文字其明鎬所辟官吏並仍舊彥博行上燕餞賜賚榮盛傾一時乙酉降空名敕告宣敕劄子三百道下河北宣撫使以備賞功是時明鎬功垂成將士知上委任彥博隆重人百其勇待彥博之來以自效上亦曰彥博必生擒此賊矣至未踰月閏正月辛丑彥博等遣承受公事李繼和來告貝州平總管王信生捕獲王則則自反至敗凡六十六日凱旋戊申以彥博為同中書門下平章事制曰膺重任者必勵許國之忠建竒功者必峻登賢之賞其有早毗大政夙負偉材自奮臨戎之行遂成蕩寇之略宜揚顯命以告治廷推忠佐理功臣朝散大夫右諫議大夫參知政事上輕騎都尉平陽郡開國侯食邑一千戶賜紫金魚袋文彥博器業異倫智謀適用有強明果斷之才而濟之以溫裕有周通敏洽之識而輔之以端方自班近途寖發賢藴向以預政之地深念擇人之難采西南之治聲陪左右之機論屬凶徒搆孽孤壘偷生巢幕之勢雖危拒轍之狂尚肆始定恢于勝策往即殄夫妖氛賞而緩功庸何以勸宜升台席之貴更陟中臺之華兼書殿之美資衍轅田之真賦褒功馭賞併示優崇於戲舍爵策勳已奉謀于太室代天理化終濟治于王家其懋乃猷用祗攸訓可特授金紫光祿大夫行尚書禮部侍郎同中書門下平章事集賢殿大學士上柱國進封開國公加食實封四百户仍賜推忠協謀佐理功臣上顧彥博曰卿朕之裴度也彥博歸功于明鎬讓位久之上屢詔不允詔以鎬為端明殿學士給事中遂除參知政事以王信為感信軍節度觀察留後自餘兵官各以功次遷京朝官及選人預軍期者六十人都虞候至士卒八千四百人第其功為五等第一等一百六十人轉五資第二等二百人轉四資第三等三百人轉三資第四等六百人轉二資第五等一千八百人轉一資王則檻送京師乙丑剮則于都市誅西上閣門使知貝州張得一于麗景門外得一太子太師耆之少子也視事八日而遇亂匿營中為賊所得置其家屬于州廨之西廳日為具飲食初賊取州二印猶語曰用訖卻見還後每見必呼則曰大王先揖而後坐坐必東向又為則僭排儀衛以故得不害既誅而兄弟悉降黜妻子論如律閏正月初五日降曲赦其文曰門下朕纂承寶緒導發化源思固本之在民每敦仁而修政仰遵先訓罔咈大猷刑審厥中處之以明決信孚無外示之以懷柔惟寧雖砥于萬邦失所每矜于一物近以貝丘舊壤孽豎為妖嘯聚郡城稽誅旬朔眷兹境土不無殘傷當興師之𠞰除且有衆之蹂踐而又枕戈袵甲暴露于夙宵挽粟飛芻疲勞于道路暨列蕩平之效宜推優奬之恩念彼封疆並均渥澤可曲赦河北諸州軍云云於戲天道助順固逆亂之無萌君德好生惟寬仁之可尚恩威並及善惡用分布告羣倫當體朕意王則挾妖法為亂既敗州郡大索妖黨被繫者不可勝數仁宗聞之歎曰如此得無濫及良民乎命有司寬其禁諸傳習妖法非情涉不順者毋得過有追捕明鎬討貝州久未下上深以為憂問于兩府參政文彥博請自往督戰八年正月丁丑以彥博為河北宣撫使節制諸將時樞密使夏竦惡明鎬凡鎬所奏請多從中沮之惟恐其成功彥博知其如此即受命乞以便宜從事不從中覆止許之閏月庚子朔克貝州擒王則以獻初彥博至貝州與明鎬督諸將築距門以攻城旬餘不下有牢城卒董秀劉炳請穴地道以入彥博許之貝州城南臨御河秀等夜于岸下潛穿穴棄土于水晝匿穴中城下不之見也有帳前虞候楊遂請行許之既出穴登城殺守者垂絙以引城下之人悉登城中驚擾賊以火牛突登城者不能拒頗引卻楊遂力戰身被十餘創以槍刺牛牛卻走賊遂潰王則張巒卜吉與其黨突圍走至村舍官軍追圍之則猶戴花幞頭軍士爭趣之部署王信恐其死無以辨以身覆其上遂生擒之巒吉皆死于兵不知所在彥博請斬賊于北京夏竦尚忌其功建言恐非真乞令檻車送京師董秀劉炳皆除內殿崇班案王則之叛宋史附具始末于明鎬傳後而于文彥博傳僅云貝州王則反明鎬討之久不克彥博請行旬日賊潰檻則送京師又考東都事略李燾長編亦記之甚簡如董秀劉炳楊遂皆其時出死力以破賊者不一著其姓名惟此書所載詳備足補其闕平廣南蠻賊儂智髙皇祐四年四月廣源州蠻儂智髙反陷雍州橫山寨五月破雍州又入橫州貴州龔州藤州梧州康州端州昭州圍廣州廣源州其先韋氏黃氏周氏儂氏為首領互相劫掠雍管經略使徐申厚撫之黃氏遂納質而十三部二十九州之蠻皆定自交址竊據而廣源等州多服役之州在雍管西南鬱江之源其地巖險峭深産黃金丹砂俗尚椎髻左衽善戰鬭輕死好亂初知儻猶州儂全福殺其弟知萬涯州存祿及其妻之弟知武勒州儂當道而併有其地交址怒興兵虜全福及其子智聰以歸而其妻阿儂遂嫁商人而生智髙智髙生十三年殺其父商人曰天下豈有二父耶因冒儂姓與其母奔雷火洞久之復出據儻猶州建國曰大厯國阿儂偽稱皇太后天資慘毒嗜小兒肉每食必殺小兒智髙攻陷城邑皆其謀也交址復伐儻猶州執智髙釋其罪使知廣源州文火雷火頻婆四洞又以思浪州附之居四年智髙內怨交址攻安德州據之僭稱南天國改年景瑞原注一本云自稱其巢為天南大理國名其年為天瑞又曰啓厯皇祐元年寇雍州明年廣西轉運使蕭固遣雍州指揮使亓贇往候之而贇擅發兵攻智髙為其所執且問中國虛實贇頗為陳大略説智髙內屬由是遣贇還并奉表願嵗貢方物許之遂齎金函書請獻金銀朱砂知雍州陳拱以其事上聞不報智髙既不得請又與交址為仇且擅山澤之利遂招納亡命數出敝衣易米紿言本洞飢部落離散拱信其微弱不設備乃與廣州進士黃瑋黃師宓及其黨儂建侯儂志忠等日夜謀入寇一夕焚其巢穴紿其衆曰平生積聚今為天火焚無以為生計窮矣當拔雍州據廣州以自王否則死于兵刃之下四年四月率衆五千沿鬱江東下攻橫山寨破之又破雍州自號仁惠皇帝改年啓厯赦境內黃師宓以下皆稱中國官名相繼破沿江九郡貴橫龔潯藤梧封康端所至殺官吏焚府庫進圍廣州知英州蘇誠案宋史作蘇緘屯兵邊渡村扼其歸路番禺令蕭注募土丁具戰艦賊少懼會張忠自京師至不介馬戰于白田死之賊圍廣州凡五十三日案宋史作五十七日又再戰于皇渡村七月壬戌由清逺濟江擁婦女作樂而去攻賀州不克殺蔣偕于太平場破昭州殺王正倫于館門驛復據雍州十二月壬申又敗陳曉于金城驛案陳曉宋史作陳曙此書避英宗諱改曙為曉自智髙初叛上擢狄青宣徽南院使充京湖南北路宣撫使提舉廣南經制賊盜事降空名宣頭一百道付青以備賞功明年正月旦會兵于賓州責斬廣西兵馬鈐轄崇儀使陳曉及左班殿直袁用等三十二人于賓州初曉遇智髙于金城驛令東頭供奉官王永吉將宜州勇敢兵五百為先鋒輕而失利曉又素無威令既遇賊士卒猶聚博營中倉卒被甲以前曉既先受青節制令不得輕進恐青至成功故徼幸一戰以至覆軍為青所斬軍中股栗遂下令更十日進軍賊諜者既去詰旦遂行至歸仁鋪遇賊迎戰前鋒少卻左第一將孫節死之青親執旗幟麾左右蕃落騎馳出賊後大破之斬首二千二百傷創重者三千三百獲賊謀主黃師宓儂志忠等五十七人牛馬器用數萬得賊所虜士女三千餘人招復丁壯七千三百以所得賊財四十萬均給戰士仍築京觀以志功露布曰臣青言臣出身行伍備位要樞屬嶺表之虔劉致聖情之宵旰董師而出承命不遑受鈇鉞之初皆親稟于睿算當矢石之際則全仗于天威石投卵以何虛竹迎刃而自解臣戊辰自連州整兵甲戌至潯州遇冦蕩平小蠢若躡無人度越重江始逢大敵戊寅儂賊領烏合之衆帥蟻附之徒親統全軍結為一陳輕兵搏我驕氣凌人臣堅壁不爭張翼而待候其鋭鋒稍挫剛氣微衰奮驍勇而斬將搴旗侮敗亡則追奔逐北自旦至暄殺獲無餘既梟凶獷之俘囚遂舉甌城之降附民歸慈母氣廓遐陬元凶已縶于檻牢餘黨合尸諸市肆伏念濵潯之地脅從者皆是吾民僭偽之中緣坐者不無非罪今則重輕差罰首級書功續遣使臣别具敷奏謹先具露布馳驛以聞云云初廣南謡言農家種糴家收至是為青所破如謡言云是時朝廷以承平之久嶺外州縣類不為備官吏狃以為常故寇至如入無人之境前後遣將又不得人以至暴踐一方幾一年云二月班師詔加青檢校太尉河中尹召為樞密使賜城南第一區青始受命討賊即言于上曰官軍征蠻數敗走士氣不振請選馬步軍及虎翼五指揮嘗經禦邊者以往庶于必勝上悉選精鋭而遣之曰此皆吾徑兵纍歷戰鬭可用也青果以此敗賊始上以青為宣撫使付以廣南討賊言者以青武人不可專任以事上以問大臣宰相龐籍對曰青起行伍若以文臣副之彼視青為何者不如不遣乃詔嶺南一皆受青節制既行上謂侍臣曰青有威名賊當畏其來左右使令非青之親信不可雖飲食起卧亦宜防竊發乃特使以戒之及捷至上喜顧左右曰向非委青專制豈能成功如是之速也二月十三日曲赦廣南門下朕膺穹昊之眷命奉祖宗之貽謀副億兆心垂三十稔何嘗不博稽教化之大勤視蒸黎之繁延登雋良採納嘉謨以補治具以迎休風肆惟宵旰罔或暇逸蠢兹蠻旅敢冒典刑驅馳犬羊越去溪洞陰窺守禦之間寖生狡狂之謀傷夷我版民剽盜我州域屬以夏秋屆候潦霧交蒸言涉險艱遂稽平殄朕託居人上奄宅域中豈朝經之未孚將吏職之不舉致是方國困于擾攘慮焉及斯嗟亦良甚爰申命于將鉞俾總臨于師干鼓行而前俘馘殆盡今雖醜類正罰既伏于天誅尚念編氓何辜久罹于寇虐宜推渙宥之澤曲示憂勞之懷可曲赦廣南東西路云云於戲綏寧封疆翦滅凶焰下則賴兵戎之講律上則繫廟社之垂靈粵豫統臨益用祗率眷爾官吏參輸志誠招懷流亡勸勵種斂亟復饒富永臻治平布告羣倫庶體朕意主者施行上以蠻賊彌年逋誅鄰境調發應副亦推恩宥二月十六日降江西湖南德音門下朕紹承基緒維御幅員丕循燕翼之謀慎固盈成之守內之則詢求文理外之則講練武經冀此蒸民臻于至治屬溪蠻之釁孽案新安文獻志作興孽承邊吏之失防踰越土疆繹騷生聚薄言問罪爰命行師蕞爾狡凶尋抵擒殄然念江湖之列郡實鄰海嶠之遐陬封域犬牙道塗碁錯或護巡城堞或輸挽糗糧奔馳險艱暴露丁壯凡此調發豈無勞煩茲惟眷瞻頗用嗟惻宜推宥典曲示矜懷云云於戲寇盜猖狂既仗翦平之畫生靈瘵敝必資生養之方咨爾庶官體豫深意儂智髙入寇廣南東西官吏有棄城而逃者大理將議法上諭輔臣曰官吏不能城守可罪也然朕聞南方無城郭戰具一旦有倉卒之變而責人以死朕不忍也若兵備可以固禦而棄者論如法其無城與兵力不能敵者當末減由是免死者甚衆宋朝事實卷十六
