body:
  text: 宋朝事實卷九宋李攸撰官職乾德四年詔御史臺吏部流內銓南曹刑部大理寺自少卿郎中員外郎知雜侍御史以下及丞簿司直評事等並以三周年為滿須常在本司蒞事者至日限滿即與轉官案此與下二條俱見江少虞事實類苑今採録補入考李燾長編乾德四年八月壬寅詔以憲府繩姦天官選吏秋曹讞獄俱為難才理宜優異故詔御史臺吏部刑部大理寺等官並蒞事滿三嵗者即遷其秩此書刪去上數語于詔意未能明晰詔京朝官將命出入及受代歸闕者宜令中書舍人郭贄膳部知雜事滕中正户部郎中雷德驤同考校勞績及銓量材器候有闕中書類能以授之先是常參官自一品以下皆謂之京官未常參官謂之未常參官近代以常參官為朝官未常參官為京官故有朝官之目淳化五年十一月詔吏部選人赴調並須于京朝官內求一人為職目用府縣諸司監印太平興國之初朝臣班簿才二百人至咸平初四百人天聖元年乃踰千人原注李淑疏真宗初即位以工部侍郎郭贄知天雄軍贄自陳戀闕下不肯去真宗曰全魏重地委任于卿亦非輕也宜去贄退召輔臣問之輔臣對以近例亦有己受命而復留者曰朕初嗣位命贄知大藩而不行則何以使人卒遣之羣臣皆畏服案此與下一條據江少虞事實類苑補入諫官陳升之言比來館閣選任益輕非所以聚天下賢才張弛成就之意請約今在職者之數著為定員有論薦者中書籍其名若有闕即取其文學行義傑然為衆所推者取旨召試詔從之景祐四年三月詔自今尚書省議事應帶職官三司副使以上並不赴如集議大事詔特赴者即别設坐初明道中殿中侍御史段少連言國家每有大事必集議于尚書省而本省官自三司副使已帶職者多移牒不赴請凡託故不集者以違制論既而太常博士集賢校理兼宗正丞趙良規言都省集官議諡用段少連請應本省官帶學士知制誥待制臣謹按國朝故事及令敕儀制别有學士知制誥待制三司副使著位視品即與前朝制度不同固無在朝敘職入省敘官之理今若全不論職假有中後行郎中兼學士案中後行郎中兼學士長編作員外郎兼學士與此小異在朝立丞郎以上入省綴駕庫之次知制誥待制入朝與六行侍郎同行入省即位郎官之下又如員外郎任三司副使郎中為判官者在三司為參佐入省却位其上所以舊來議事除别詔三省悉集則中書舍人知制誥與常侍給諫至左右正言皆赴若內朝官悉集則學士待制三司副使皆赴若更集他官則諸司三品武臣三品各在本司長官之次若止是集尚書省官其帶職者並合不赴按閣門儀制大宴學士坐殿上與僕射同行知制誥與尚書丞郎同行若曲宴則三司副使在知制誥之後重行異位豈有親奉至尊于殿上其禮如此暫入都省而郤降損著位又按故事尚書省官帶知制誥者並中書奏班簿即是于尚書省御史臺並不著籍故有絶曹之語又國朝以來凡定學士舍人兩省以上著位除先後入外若有升降皆是特奉朝旨豈有在朝入省迭為髙下又郎中員外兼侍御史及任裏行者皆稱臺官不赴都省集議臣以為本省官兼佐臺職即是與帶知制誥待制等事體無異又按唐翰林學士有不知制誥者只是與今直館事體相類若國朝學士知制誥待制則顯有著位與唐不同其侍讀侍講龍圖閣樞密等學士及三司副使即是國朝新制唐朝三司自是尚書之職自後别置使額而與今不同請自今除集三省官議事即如舊外若是本省議事其學士知制誥待制三司副使更不赴議詔御史臺與太常禮院詳定以聞禮院言按唐李肇翰林志凡學士無定員皆兼它官下自校書郎至諸曹尚書皆得為之既入院與班行絶迹亦不繫常參類守官三嵗則遷知制誥五代職官志翰林學士入院並先後為定惟承旨一員出自上意不計官資先後在學士之上國朝儀制令敕翰林學士侍讀侍講學士龍圖閣學士樞密直學士龍圖閣直學士並在丞郎之上龍圖閣待制及知制誥三司副使在少卿監之上自唐至國朝翰林學士知制誥待制三司副使與本官絶曹不屬南省官之例載詳會議之文由來非一或出朝廷别旨或循官司舊規故言集本省即南省官也集學士兩省臺官者容有內制給舍中丞之屬集學士臺省及諸司四品以上者容有卿監之屬集文武百官者容有諸衛之屬故謀事有大小集官有等降率繫詔文昨因段少連以覆諡小事謂羣牧普會議列為具奏嬰以嚴科遂使絶曹清列還入本行而良規援求故實理當難奪請自今有臣僚擬諡者止令集南省官屬或緣事體大臨事敕判兼召三省臺寺即並依國朝舊例施行御史臺别奏云良規稱尚書省官任外制者不著臺省之籍故有絶曹之語而以為重則今尚書省官任內制者並係臺省之籍寧有坐曹之實而可輕乎然則論職官之言正為絶曹者設豈有受祿則繫官定俸議事則絶曹為辭況王旦王化基趙安仁朝迥杜鎬楊億皆時之重望嘗集議于尚書省而無變古之論故相李昉為主客郎中知制誥日屢經都省議事與散騎常侍徐鉉言見江南舊儒所説議事次第與此略同又議大事僕射御史大夫入省惟僕射至廳下馬于今行之蓋所以重本省也故都堂會議列狀以品就坐以官忽此更張恐非通理請自今但係本省官帶職令赴議而輒不集者如議國家典禮即從違制諭施行若議常事止依律文處分又祕書省著作郎直集賢院同知太常禮院吳育言若從本省敘官之議有不可者二且自朝廷至臺省以及郡縣上下有次輕重有倫至上莫若君父之前至重莫若朝廷之內上可以統下重可以臨輕舉重則不可以輕者干舉上則不可以下者撓夫尚書省雖制度尊大亦天子之有司官繫其中謂之本省本省相會須有朝廷豈有君父之前朝廷之內列班殊隔一入有司輒易尊卑而云在朝敘職入省敘官以一體為二家以朝省為彼我上下異貫輕重不倫此其不可一也官職之名本非二體官主其號職供其職名實相繫豈有殊途只如庖人是官供庖是職祝人是官致祝是職以何隔絶分官職為兩事蓋自唐室以來臨事雜置遂有别帶職事之名厥後因循未歸本務即今而言須以隸名為輕供職為重倘云入朝敘職入省敘官則是官職相離遂為限絶推之于古蓋紊源流此其不可二也若從絶班不赴之議有不可者三古者尚書為天下綱轄喉舌之地故其官皆材識之士凡國有謀議取決其中今則不然惟以敘遷而其間拔擢英異又多歸侍從之中若絶班不赴則朝事咨決未盡其人此不可一也知制誥稱中書省奏班簿是謂絶班可以不赴本省如翰林學士亦知制誥而不絶班簿此皆因循之制參差不倫未可取為確據縱絶班有例而絶曹無聞謹按唐六典中書舍人以他官兼者謂之兼制誥故白居易草楊嗣復授庫部郎中知制誥辭云前代制誥中書令侍郎舍人通掌之國朝以來或以它官兼領又授元稹中書省舍人辭云元稹自祠曹員外試知制誥謂之兼則豈絶本官謂之試則明未正職斯皆章灼不疑之事也今縱有明文絶其官若遇定事猶當以事體追而正之況無明文但引因循參差之事為據此不可二也今兩制遷改其告身命辭必舉本曹之務為之訓諭凡受一敕牒則下至府寺冗局猶供其職豈有一人命書三省連判而都無所繫若止為俸錢徒加官號命官之理豈若是乎惟兩府大臣不可更親有司之事況其俸祿亦不繫其官自餘縉紳遷次所主者官名俸給盡從本省居常既不復至會議又不一來則是自絶其官矣仲尼不去餼羊粗存告朔之禮若并羊亦去寄禮無地則一省之制自此盡隳縱以班絶皆可不赴若有詔兩制臺省百官諸司畢會則坐次又如何為定此其不可三也臣伏謂是非之議止當歸一若又廣為採托適足為煩今于國朝典故中取一最明之事足以質定大中祥符五年敕新授僕射于都省上事日僕射尚書丞郎郎中員外三司使副學士兩省御史臺文武諸司常參官並集省內幕次以俟僕射自正衙退將至都省堂門外下馬朝廷差人前導諸行尚書丞郎郎中員外郎並于都堂門內分左右列班迎候俟僕射判案訖知班引贊官報班次定禮生贊三司使次學士次兩省待制次三司副使賀此則雖赴本省自有次序之别臣竊詳禮院御史臺兩奏各有未安請自今凡尚書省會議如止集本省官則帶職者皆赴依在朝兩制班列别作一行而坐春秋之義王人雖賤必敘乎諸侯之上所以尊王命而廣臣恭也今兩制侍從之職皆朝廷拔擢殊才王命所旌禮當表異況又自分行列非以相壓亦如僕射上事之儀凡帶絶班之官並赴而别班贊引不與本省官同在迎班顯合本朝之典章亦非今日之臆斷若詔兩制臺省諸司諸衛官畢集則各從其類自作一行其書議亦如其坐次上以羣議所執不同故參用所宜而降是詔治平三年翰林學士承旨張方平奏竊見嘉祐五年諫院陳升之言三班供奉官以下八千八百人乞裁冗濫立條制于時定議事頗酌中升之始言八千八百餘員及此又已五年數當增倍其濫如此而不云救何以立憲度建治功乞下兩府檢討前所奏議早為裁定頒行亦振舉頽弊之一端詔以付樞密院而計三班使臣六千五百三十四人而已遂無所更議元祐三年詔文臣繫銜分左右案九朝編年詔文臣繫銜分左右自朝議至金紫光祿進士為左餘人為右紹聖二年罷之崇寧二年復分左右繫銜原本誤作繫御紹聖崇寧下俱失載二年兩字自朝議以上進士為左餘人為右明年詔朝議以下並分左右紹聖罷之惟朝議以上如故崇寧又詔朝議中散正議光祿分左右兩資應轉者先右而後左蓋元祐之分左右所以别流品崇寧之分左右特以序官爵耳龍圖閣學士一員原注大中祥符三年置龍圗閣直學士七員原注內一員兼景德四年置龍圗閣待制三員原注景德元年置直龍圗閣五員原注大中祥符九年置天章閣學士原注慶厯七年置侍講原注自賈昌朝始直天章閣原注政和六年始置大觀二年二月十三日詔曰朕惟哲宗皇帝英文睿武神機獨運道與時俱沉潛無方然事天治人彰善疸惡訓迪有位綏靖邉方則號令指揮若揭日月蓋自親攬庶政始大有為一話一言罔不儀式刑于神考之典故緝熙紹復著在簡編與熙寧元豐之所行相為始終比命有司廣加裒輯成書來上本末粲然誠可傳無窮施罔極矣若昔祖宗述作皆有寶藏之所參列廣內揭為嘉名擇儒臣以資訪納今將祗率成憲匹休前烈則夫名出于信不可無所考也在詩有之君子有徽猷是為論德之美而觀道之成于是乎在其哲宗皇帝御集建閣以徽猷為名仍置學士直學士待制政和六年增置直閣紹興十年五月七日詔門下恭惟徽宗皇帝躬天縱之睿資輔以日就之聖學因時制治修禮樂恢學校發揮典墳緝熙治具宸章奎翰發為號令著在簡編者煥乎若三辰之文麗天垂光賁飾羣物所以貽謀立教作則萬世者殆與詩書相表裏特加裒輯崇建層閣以嚴寶藏用傳示于永久其閣恭以敷文為名祗遹舊章宜置學士直學士待制直閣以次列職備西清之咨訪為儒學之華寵其著于令直祕閣校理自建隆初三館有書萬二千餘卷乾德元年後平諸國盡收其圖書以實三館先是朱梁都汴正明中始以右長慶門東北廬舍十數間列為三館湫隘卑濕才蔽風雨周廬徼道出于其側衛士騶卒朝夕喧雜歷代以來未遑改作每諸儒受詔有所諭撰即移于他所始能成之太平興國初太宗因幸三館顧左右曰若此之陋豈可以蓄天下圖籍延四方之士耶詔經度左升龍門東北舊車輅院别建三館命中使督其役制度皆上所規畫二年三月書院成盡徙舊館之書以實之凡八萬餘卷端拱元年詔分三館之書萬餘卷别為書庫目曰祕閣以吏部侍郎李至兼祕書監案吏部原本誤作禮部考東都事略李至傳至授禮部侍郎遷吏部為祕書監長編亦作吏部今據以改正右司諫直史館宋泌兼直祕閣右贊善大夫史館檢討杜鎬為校理而直祕閣祕閣校理之官始于此祕書省監少監丞各一人監掌古今經籍圖書國史實録天文厯數之事少監為之二而丞參領之其屬有五著作郎一人著作佐郎二人掌修纂日厯祕書郎二人掌集賢院史館昭文館祕閣圖籍以甲乙丙丁為部各分其類校書郎四人正字二人掌校讎典籍刋正訛謬各以其職隸于長二惟日厯非編修官不預嵗于仲夏曝書則給酒食費尚書學士侍郎待制兩省諫官御史並赴遇庚伏則前期遣中使諭旨聽以早歸大典禮則長二預集議所以待遇儒臣非他司比宴設錫豫率循故事宋初置三館長慶門北謂之西館太平興國初于升龍門東北創立三館書院三年賜名崇文院遷西館書貯焉東廊為集賢書庫西廊分四部為史館書庫大中祥符八年創外院于右掖門外天禧初令以三館為額置檢討校勘等員檢討以京朝官充校勘自京朝幕職至選人皆得備選以內侍二人為勾當官通掌三館圖籍事孔目官表奏官掌舍各一人又有監書庫案監書庫原本誤作監內庫今據宋史改正內侍一人兼監祕閣圖籍孔目官一人祕閣係端拱二年就崇文院中堂建閣以三館書籍真本并內出古畫墨迹等藏之淳化元年詔次三館置直閣原注以朝官充校理原注以京朝官充以諸司三品兩省五品以上官一人判閣事直閣校理通掌閣事掌繕寫祕閣所藏供御人裝裁匠十二人元豐五年職事官貼職悉罷以崇文院為祕書省官屬始立為定員分案四置吏八原注崇文院太平興國三年置端拱二年建祕閣于院中昭文館史館集賢院皆沿唐制立名但有書庫寓于崇文院廡下三館祕閣崇文院各置貼職官又有集賢殿修撰直龍圖閣校勘通謂之館閣初英宗謂輔臣曰館閣所以育雋材比選數人出使無可者豈乏材耶歐陽修曰今取材路狹館閣止用選人編校書籍故進用稍遲上曰卿等各舉數人雖親戚世家勿避于是宰相琦公亮參知政事修概各薦五人未及試神宗登極先召十人試以詩賦而開封府界提點陳汝義别以奏對稱旨預試于是御史吳申言試館職者請策以經史及世務毋用辭賦遂詔自今試館職専用策論熙寧二年置崇文校書始除河南府永安主簿邢恕乃詔自今應選舉可用人並除校書候二年取旨除館職官五年以隸祕書省元祐初復置直集賢院校理自校理而上職有六等內外官並許帶恩數仍舊又立試中人館職法選人除正字京官除校書郎原注校書郎供職二年除集賢校理祕書郎著作佐郎比集賢校理著作郎比直集賢院直祕閣丞及三年除祕閣校理三年二月詔御試唱名日祕書丞至正字升殿侍立九月復試賢良于閣下五年置集賢院學士并校對黃本書籍官員原注紹聖初罷校對以編修日厯選本省易集賢院學士為修撰直院為直祕閣集賢校理為祕書校理為案修撰上宋史有殿字考紹聖二年易集賢院學士修撰政和間改為右文殿修撰宋史因誤為殿修撰其實宋時無此稱當以此書為正十二月詔禮部本省長二定校讎之課月終具奏原注入伏午時減半遇沒伏依舊從蘇軾之請案沒伏宋史誤作渡伏當從此書為正又罷本省官任滿除館職法元符二年詔職事官罷帶館職悉復元豐官制崇寧五年詔館閣並除進士出身人政和五年四月詔祕書省殿以右文為名案宋史置右文殿在政和六年此書作五年四月考九朝編年亦在五年四月足證宋史之誤改集賢殿修撰為右文殿修撰案集賢殿修撰下原本脫為右文殿修撰六字今據宋史增入是月駕詣景靈宫朝獻還幸祕書省詔曰延見多士歷覽藏書之府祖宗遺文在焉屋室淺狹甚非稱太平右文之盛宜重行修展八月詔祕書省移于新左藏庫以其地為堂七年詔類集所訪遺書名曰祕書總目宣和二年立定祕書省員額監少監丞依元豐舊制著作郎以四員為額校書郎二員正字四員渡江後制作未遑紹興元年始詔置祕書省權以祕監或少監一員丞著作郎佐各一員校書正字各二員為額續又參酌舊制校書郎正字召試學士院而後命之自是採求闕文補綴漏逸四庫書略備即祕書省復建史館以修神宗哲宗實録選本省官兼檢討校勘以侍從官充修撰五年效唐人十八學士之制少監丞外置著作郎佐祕書郎各二人校書郎正字通十二人又移史館于省之側别為一所以增重其事九年詔著作局惟修日厯遇修國史修實録則開實録院以正名實十三年詔復每嵗曝書會是冬新省成少監遊操援政和故事乞置提舉官遂以授禮部侍郎秦熺令掌求遺書仍鑄印以賜置編定書籍官二人以校書郎正字充孝宗即位詔館職儲養人才不可定員乾道九年正字至六員淳熙二年少監並置皆前所未有除少監丞外以七員為額尋復詔不立額案乾道淳熙係孝宗年號與江陽譜所云起建隆迄宣和者已不合至下文所記紹熙係光宗年號非李攸所及見當是後人所增紹熙二年館職闕人上令召試二員謹加審擇取學問議論平正之人自是少監丞外多止除二員是時陳傅良上言請以右文祕閣修撰并舊館閣校勘三等為史官自校勘供職稍遷祕閣修撰又遷右文在院三五年如有勞績就遷次對庶幾有専官之效無冷局之嫌時論韙之然不果行中興分案四曰經籍曰祝版曰知雜曰太史吏額都副孔目官二人四庫書官二人表奏官書庫官各一人守當官二人正名楷書五人守闕一人正貼司及守闕各六人監門官一人以武臣充専知官一人日厯所𨽻祕書省以著作郎著作佐郎掌之以宰執時政記左右史起居注所書會集修撰為一代之典舊于門下省置編修院専掌國史實録修纂日厯元豐三年詔宣徽院等供報修注事自今更不供起居院直供編修院日厯所四年十一月廢編修院歸史館官制行屬祕書省國史案六年詔祕書省長二毋得預著作修纂日歷事進書即繫銜以防漏泄如舊編修院法焉八年詔吏部郎中曾鞏禮部郎中林希兼著作職事官兼職自此始元祐五年移國史案置局専掌國史實録編修日厯以國史院為名隸門下省更不隸祕書省紹聖二年詔日歷還祕書省宣和二年詔罷在京修書諸局惟祕書省日歷所係元豐國史案除著作官専管修纂日厯之事無定員外其餘案編修日厯書庫官吏並依元豐法紹興元年初修皇帝日厯詔依修日厯所為名本省長二通行修纂三年詔宰臣提舉侍從官修撰十一月詔以修國史日厯所為名四年詔以史館為名十年詔依舊制併歸祕書省國史案以著作佐郎修纂舊史館官罷歸原官尋復詔以國史日厯所為名續併修神宗哲宗寶訓隆興元年詔編類聖政所併歸日厯所依舊宰臣提領仍令日厯所吏充行遣會要所以省官通任其事紹興九年詔祕書省官讎校國朝會要逐官添給茶湯錢乾道四年詔尚書右僕射陳俊卿兼提舉編修國朝會要每遇提舉官開院過局就本省道山堂聚呈文字提舉諸司官承受官主管諸司官並令國史日厯所官兼五年令本省再加刪定以續修國朝會要為名九年祕書少監陳騤言編類建炎以後會要成書以中興會要為名並從之其後接續修纂並隸祕書省初紹興三年詔置國史院重修神宗哲宗實録以從官充修撰續以左僕射吕頤浩提舉國史右僕射朱勝非監修國史四年置直史館及檢討校勘各一員五年置修撰官二員校勘無定員是時國史實録皆寓史館未有置此廢彼之分九年修徽宗實録詔以實録院為名仍以宰臣提舉以從官充修撰同修撰餘官充檢討無定員明年以未修正史詔罷史館官吏併歸實録院二十八年實録書成詔修三朝正史復置國史院以宰臣兼修侍從官兼同修餘官充編修明年詔國史院以宰臣提舉置修國史同修國史共二員編修官二員又置都大提舉諸司官承受官諸司官各一員以內侍省官充隆興元年以編類聖政所併歸國史院命起居郎胡銓同修國史二年參政錢端禮權監修國史乾道元年參政虞允文權提舉國史皆前所未有二年詔置實録院修欽宗實録其修撰檢討官以史院官兼領四年實録告成詔修欽宗正史以右僕射蔣芾提舉四朝國史詔增置編修官二員續又增置三員淳熙三年特命李燾以祕書監權同修國史權實録院同修撰四年罷實録院専置史院十五年四朝國史成書詔罷史院復開實録院修髙宗實録案此下所記慶元嘉泰係寧宗年號且有修孝光兩朝實録事當亦後人所增慶元元年開實録院修纂孝宗實録六年詔實録院同修撰以四員檢討官以六員為額嘉泰元年開實録院修纂光宗實録二年復開國史院自是國史與實録院並置矣實録院吏兼行國史院事點檢文字一人書庫官八人楷書四人太史局掌測驗天文考定厯法之事日具所占以聞嵗頒厯于天下則豫造進呈祭祀冠昏及大典禮則選所用日其官有令有正有春官夏官中官秋官冬官正有丞有直長有靈臺郎有保章正其判局及同判則選五官正以上業優考深者充保章正五年直長至令十年一遷惟靈臺郎試中乃遷而挈壺正無遷法其别局有天文院測驗渾儀刻漏所掌渾儀臺晝夜刻驗辰象鐘鼓院掌文德殿鐘鼓樓刻漏進牌之事印厯所掌雕印厯書南渡後並同隸祕書省長二丞郎輪季點檢算學元豐七年詔四選命官通算學者許于吏部就試其合格者上等除博士中次為學諭元祐元年初議者謂本監雖準朝旨造算學元未興工其試選學官亦未有應格竊慮徒有煩費乞罷修建崇寧三年遂將元豐算學條制修成敕令五年罷算學令附國子監十一月從薛昻請復置算學大觀三年太常寺考究以黃帝為先師自常先力牧至周王朴以上從祀凡七十人四年以算學生併入太史局後入祕書省宣和二年並罷官吏案自祕書省以下至此俱見宋史職官志永樂大典則以此為宋朝事實內有光寧兩朝年號當非原書江陽譜稱攸書成上之緘封副本啓秦檜不報藏于家則是書或為其子孫所增而宋史採之雍熙元年改匭院為登聞檢院東延恩匭為崇仁檢南招諫匭為思諫檢西申寃匭為申明檢北通玄匭為招賢檢案此條見江少虞事實類苑今採録補入考九朝編年匭院舊隸諫院至是改為登聞院仍命諫院令司諫一人主判此書載之未詳太宗時始置磨勘差遣院後改為審官院真宗時京朝官四年乃得遷天聖中方有三年之制而在外任者不得遷須至京引對乃得改秩明道中始許外任滿嵗亦遷案九朝編年景德四年七月立京朝磨勘限初令現任京朝官三年方得磨勘遷官大中祥符九年初令京朝官在外任滿三年當考課者附驛上聞是三年之制京朝官及外任滿嵗得遷皆真宗時事也此書作天聖明道當為仁宗時事與九朝編年互異時恭謝天地覃恩不隔磨勘有併遷者于是朝士始多皇祐明堂覃恩隔磨勘人情苦其不均英宗神宗即位因有恭謝之例原注一本云太宗用趙普議置考課院審官院以分中書之權是也在案宋史趙普卒在淳化三年七月審官院考課院置四年二月考九朝編年云從蘇易簡之請也此書作趙普或當時普先有此議至是因易簡請始行之也景祐二年十月辛亥詔曰國家分命羣官外釐庶務每代還于京輦或寓止于客坊雜處囂卑頗罹瀆嫚稽信書于往載有朝邸之舊規爰飭攸居用昭豫眷宜于京師置朝集院神宗置大理寺以上府左右院暨司録獄無以離合訊辨三司混金穀視獄不専詔曰稽參故事宜屬理官初置大理寺命李清臣為記清臣以為王者立政以詔天下必辭尚體要則書為近乃倣古立言所以導事者詞灝噩奇甚其載上訓之略曰五教未訓五法亟下是曰暴民治用弗格案此句下疑有脫文以成上德意先教後刑之敘上曰卿言逼近經誥內侍省大中祥符二年內臣冠以省號初補曰小黃門遷內侍黃門遷內侍髙班遷內侍髙品遷內侍殿頭其極為都都知案宋史內侍省有都都知有都知有副都知則其極當為都都知原本誤作都知今據宋史改正國朝諸司使止于宣政真宗以內侍李神福有功特置宣慶使以寵之又以劉承圭特置景福殿使名以寵之班在各省使之上又以秦翰久在邊隅宣力勤藎特置入內都都知以寵異之唐自開元天寶以後藩鎮屯重兵皆自贍租賦所入名曰送使留州其上供者鮮矣五代疆境逼蹙藩鎮益強率令部曲主場院厚斂其屬三司者補大吏以臨之輸額之外頗以入已太祖歷試艱難周知其弊及受命務恢逺略革弊以漸國初猶循前制牧守來朝皆有貢奉以助軍實乾德三年詔諸州度支經費外凡金帛悉送闕下無得占留案長編趙普為相勸上革去其弊申命諸州度支經費外金帛悉送都下無得占留注云去年已有此詔故云申命與此詳略不同時藩鎮有闕稍命文臣權知所在場務或以京朝官廷臣監臨凡一路之財置轉運使掌之一州之財置通判掌之為節度防禦團練留後觀察刺史者皆不預簽書金穀之事于是外權削而利歸公上矣其轉運使職位國初但曰勾當某路水陸計度轉運事官髙者則曰某路計度轉運使太平興國初皆曰使兩省五品以上則為都轉運使又置副使判官又置同勾當轉運事俄罷諸副使止置使二員明年復置副使真宗每用兵或令都部署兼都轉運使或提點轉運事及車駕巡狩置隨軍轉運使事畢即停真宗嘗曰天下物宜民間利病惟轉運使得以周知當召見訪問外事上又嘗戒諸路轉運使曰汝等所至點檢公事固是常職若州郡相承弊事但且改正切勿亟行刑罰致其滋蔓害及無辜也景德元年詔權三司使丁謂等取户稅條敕及臣民所陳農田利害刪定成農田敕五卷上之二年謂等又取唐開元中宇文融請置勸農判官檢校户口田土偽濫等事且言别置官慮益繁擾而諸州長吏職當勸農乃請少卿監刺史閣門使以上知州者並兼管內勸農使餘及同判並兼勸農事諸路轉運使副並兼本路勸農使詔可勸農事入銜自此始景德四年正月詔諸路提點刑獄官為勸農使使臣為副使凡農田事悉領焉置局案鑄印以給之先是軍巡及馬步院判官皆用郡府吏建隆元年始詔兩京軍巡諸州馬步院判官合吏部流內銓擇選人無遺省聽減兩選補之始用文吏也乾德三年詔諸州長吏或有煩藉人代判者即于賓佐中擇公幹者充不得更任親從人先是承五代以來領節旄為郡守者多武人皆不知書所至必自置吏謂之代判政事一以委之用權不法太祖知其弊罷之五代任官凡曹掾簿尉有齷齪無能以至昏老不任驅策者始注為縣令故天下之邑率皆不治甚者誅求刻剝穢迹萬狀故天下優諢之言多以長官為笑而祖宗深嫉貪吏太祖嘗謂左右曰晉漢之世侯伯恣橫非法掊斂百姓田蠶所獲未輸公稅已入權豪之手以至縣令將至有年誅求百端下無所訴國朝以來未革其弊朕每念耕稼之勤茍非兵食所資固當盡復其租稅爾建隆初始以朝官為知縣其後參用京官或試銜幕職三班為之案九朝編年乾德元年六月命朝官知縣大理正奚嶼知館陶監察御史王祐知魏縣楊應夢知永濟屯田員外于繼微知臨清常參官知縣自嶼等始此書作建隆初與九朝編年互異自是懲五代弊政尤重親民之官民政稍稍修舉凡縣事主簿為之佐尉掌盜賊殺傷之事而自五代以來藩侯補署親隨為諸藩鎮副鎮都虞候同掌警邏盜竊之事與縣令抗禮凡公事専達于州縣多闕簿尉建隆三年復置縣尉主簿掌鄉村盜賊其鎮將所主郭內而已自是稍統于縣太平興國二年始禁藩侯不得差親隨其鎮將皆以本州將校為之縣尉専治賊盜而民始無擾矣開寶五年縣令猶兼嶽廟令尉兼廟丞太平興國中以令録州官老耄不治者為廟令判司簿尉老耄者為廟主簿文武換官格中大夫防禦使中大夫團練使中散大夫刺史原注侯通除七年除團練使朝議大夫刺史奉直大夫武功大夫遙郡刺史原注舊皇城使朝請大夫武德大夫遙郡刺史朝散大夫武德大夫遙郡刺史原注舊內藏庫使朝奉大夫武節大夫遙郡刺史原注舊莊宅使朝請郎武略大夫原注舊洛苑使朝散郎武義大夫原注舊西京作坊使朝奉郎武義大夫原注舊禮賓使承議郎武翼大夫原注舊供備庫副使奉議郎武節郎原注舊莊宅副使通直郎武義郎原注舊禮賓副使宣教郎敦武郎原注無出身未及三年换修武郎宣義郎從義郎承事郎秉義郎承奉郎忠訓郎承務郎忠翊郎案此文武换官格不著何年所定據文獻通考謂神宗以大中大夫為宰相官故初除執政只授中大夫舊為祕書監殿中監之官中奉大夫大觀新置中散大夫朝議大夫係卿監奉直大夫亦大觀新置朝請大夫朝散大夫朝奉大夫係正郎朝請郎朝散郎朝奉郎係員外郎承議郎奉議郎通直郎係朝官宣教郎宣義郎承事郎承奉郎承務郎係京官皆元豐以後之文階也武階舊有正使副使政和易以新名自皇城使至供備庫使為武功大夫武德大夫武顯大夫武節大夫武略大夫武經大夫武義大夫武翼大夫自皇城副使至供備庫副使為武功郎武德郎武顯郎武節郎武略郎武經郎武義郎武翼郎自內殿承制至三班借職為敦武郎修武郎從義郎秉義郎忠訓郎忠翊郎成忠郎保義郎承節郎承信郎十者並稱使臣宋史職官志載文臣换右職之制祕書監换防禦使太卿監换團練使祕書少監太常光祿少卿換刺史少卿監換皇城使遙郡刺史自帶職郎中至員外郎換諸司正使並帶遙郡刺史自帶職博士左右正言監察御史至太子左右贊善大夫中舍洗馬換諸司副使自祕書郎著作佐郎至判司簿尉換內殿承旨至三班奉職以所載與通考互證文武之階悉合此書于文階不載中奉大夫武階不載武顯大夫武經大夫武功郎武德郎武顯郎武略郎武經郎武翼郎修武郎又武略大夫武義大夫武翼大夫不著帶遙郡刺史當並由傳寫遺闕勳臣太祖義社兄弟保靜軍節度使楊光義天平軍節度使同平章事兼侍中石守信昭義軍節度使兼侍中李繼勳忠武軍節度使同平章事中書令秦王王審琦忠逺軍節度使觀察留後劉慶義左驍衛上將軍劉守忠右驍衛上將軍劉廷讓彰德軍節度使韓重斌解州刺史王政忠案太祖勳臣不止九人此九人中如楊光義劉慶義劉守忠王政忠四人東都事略及宋史俱無傳石守信諸人傳內亦無義社兄弟之名惟三槐王氏雜録有云太祖即位方鎮多偃蹇所謂十兄弟者是也可為此義社兄弟之證配享太祖室趙普曹彬太宗室薛居正石熙載潘美真宗室李沆王旦李繼隆仁宗室王曽吕夷簡曹瑋案文獻通考載配享功臣自太祖至仁宗十一臣與此同復載英宗二臣韓琦曽公亮神宗一臣富弼哲宗一臣司馬光徽宗一臣韓忠彥高宗四臣吕頤浩趙鼎韓世忠張俊孝宗二臣陳康伯史浩光宗一臣葛邲此書不載富弼司馬光似因南渡後始定議配享故未之及若韓琦曽公亮之配享英宗則早定自神宗時不當失載必由傳寫遺闕宋朝事實卷九
