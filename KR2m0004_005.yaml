body:
  text: 宋朝事實卷五宋李攸撰郊赦二英宗治平二年南郊御札內外文武臣僚等天地者生之本先祖者類之始故禮有報本反始而祀天地尊先祖于是乎致虔恭焉國朝之制郊以三嵗而自皇祐癸巳一紀于今鑾輿之行不踵乎經塗皇邸之設不嚴乎大次交神之道豈不缺然也哉朕以沖眇之姿荷顧託之重巍乎王公士民之上凜乎宗廟社稷之寄日慎一日惟恐弗任而三靈眷懷億姓禔福天清日潤雷動風行嘉生汔臻氛祲蕩定固可以薦四時之和氣總萬國之歡心以報本乎天地而反始乎先祖也朕以今年十一月十六日有事于南郊咨爾攸司務勤厥職諸道州府不得以進奉為名輒行科率必循其故毋或煩民故兹札示想宜知悉赦文門下朕承祖宗之休託王公之上纘嗣丕業誕隆慶基我仁考體道誠明率仁髙厚躬履純儉天俾壽臧熙然億兆之懷隆于父母之愛禮樂明備制作成于百年書軌大同歡心達于四表憲度著明而可則軌迹夷易而可遵肆朕沖人遹當大寶祇荷先訓仰繄母慈永念繼體之艱居有涉冰之懼日慎一日三嵗于兹曷嘗不究皇極之建中順乾剛之正命登籲賢俊監循典刑未明以求衣中昃不暇食宫室苑囿之好或弛以便民鐘鼓管弦之音固不以足欲前日文武多士中外羣臣連上封章求薦稱號朕以繼志述事未有以揚緝熙持盈守成未有以彰休烈下之方以砥百室之富上之方以接神人之歡義所未安抑而不受豈自以得勤民之意蓋將以洪修已之誠深惟就國陽郊肇禋吉土振古盛節本朝上儀儲精迓釐欲止不敢惟孝能饗庶幾與焉是以因黃宫之氣升逮南極之景至躬執圭幣潔修粢盛祼薦清廟之廷燔燎泰壇之奠侑以烈祖對越上穹于時祥景晏溫大圓精粹和氣充塞積曀肅清兹皆諸神受福于懷柔有昊眷顧而饗答發祥降祉豈獨朕躬之敢専洗心自新嘉與海內之均慶可大赦天下云云於戲崇大報之禮有以達于誠心覃渙汗之恩是用孚于至信期爾阜安之俗既臻恥格之風尚賴忠藎揚庭明謨在服共勵敕天之志永砥無疆之休主者施行是年當郊上意未欲躬行謂韓琦曰初服滿恐未當出琦曰大禮不可曠兼陛下即位未嘗郊見天地力請行之故事郊廟讀祝册官至御名必起上至郊宫更衣詣壇下百官皆回班迎向英宗皇帝初告廟詔讀册官毋起及詣壇下又詔百官勿回班迎向以見事郊廟之精意也四年英宗手詔放治平二年南郊赦前編管人罷陜西衙前配買修河木植而罷江淮近嵗衙前復乞置村鄉酒場強率人沽酒者時上不豫猶敕輔臣即時施行之英宗郊祀習儀尚書省賜百官酒食郎官王易知醉飽嘔吐御史前劾失儀已肆赦韓琦以聞帝曰已放罪琦奏故事失儀不以赦原帝曰失儀薄罰也然使士大夫以酒食得過難施而目矣卒赦之帝愛惜臣子欲曲全其名節類如此案東都事略及宋史俱不載是詔此可以補其闕赦文案此為神宗熙寧元年十一月丁亥南郊大赦詔也此書失載年月日永樂大典舊與上英宗事連寫誤合為一今以宋史考之英宗治平四年正月崩神宗即位踰年改元熙寧詔中有述遵無改再期于此等語故知當在是年也門下王者祗遹聖緒所以永無疆之休對越皓穹所以凝溥將之命朕惟列聖垂統盛德在天積纍熙洽付畀沖眇夫以制作大定之丕矩在宥恥格之休風夷易所存燕翼維允肆朕述遵而無改恭默以仰成再期于茲百度咸若是以羣生蒙福方內大寧穡人有秋而屢豐逺夷稽服而慕義兵革靡試疵癘莫興蓋昭天之功自上仁而已厚故佑天之澤逮下武而方深乃眷太和實荷隆慶內惟寡德惟不克任粵稽拜貺之文茲有就陽之祀報本反始事孰重焉夫恭之所隆不可以恩掩禮之所闕尚貴乎義起矧乃真聖舊章著為成訓搢紳頤論折衷前經斷自朕心博觀輿議是用因一陽長極之敘舉三嵗親見之儀朝薦殊庭賓祼清廟而後升禋燎于秦畤合隂祀于柔祇昭假上靈配侑列祖六樂備儛萬玉旅庭侯衛駿奔蠻夷聳觀至誠胥感方交神而塞明祥祉來臻且日升而川至顧豫菲質敢以専享思與黎庶同砥日新可大赦天下云云於戲接三神之歡惟禮可以致孝饗均兆民之慶惟刑可以示哀矜茲朕一心期砥于道尚賴股肱碩輔陪側藎臣共勵協恭之誠以格可封之俗十一月二十五日南郊赦文案東都事略熙寧七年冬十月己未合祭天地于圜丘大赦宋史作十一月己未考是年十月無己未此作十一月二十五日與宋史合可證東都事略之誤門下王者欽崇神天嚴奉宗祏就郊以享所以詔天下之恭假廟而蒸所以教天下之孝洪惟五聖之烈案此書不載熙寧七年但詔中有洪惟五聖之烈一語其為神宗無疑神宗凡四郊其前後赦文俱可考見故知此為熙寧七年詔也誕輯百王之文肆子沖人昭事上帝載念物無以稱維一誠可以展大報之儀祭不欲煩維三嵗可以述躬行之典協會康年之順道迎至日之長是用朝薦殊庭祼將太室乃進登于陽畤以裒對于皇穹合祛柔祇陟配文祖祝燧告潔贊犧尚純大樂變音舞奏而諸物至二精揚燎煙升而萬靈交方丕事之獲成敢蕃禧之專享宜敷大號以賚多邦可大赦天下云云於戲意盡精禋既秩宗祈之舉政施惠衍亶昭慶宥之行維時黎元綏我德澤尚賴謨明四近忠藎羣材儀圖新美之功勱相隆平之運同砥于治永孚厥休熙寧十年十一月二十七日南郊赦文門下國莫重于祭所以作民恭之先禮無大于郊所以報物生之始朕懋建丕命寵綏庶方夙寤晨興任大守重惟文武之謨烈心罔敢弗承惟上下之神祇志罔敢弗肅聿修三嵗之祀稽用一陽之正嚴大路以備儀款殊庭而先享於穆清廟怵惕以見祖宗爰熙紫壇明察而事天地推本陟配升煙合禋裒萬靈而誠交變六樂而物至顧迄成于巨典敢專享于蕃釐渙揚豫恩敷錫爾衆可大赦天下云云於戲答三才之奧無以稱德産之微均萬國之歡有以知惠澤之至尚賴左右勵翼內外交修永孚厥休同砥于道元豐六年十一月五日南郊赦文門下天者物生之始非肇禋無以極其誠親者民恭之先非假廟無以致其孝永惟五聖之烈必躬三嵗之祀顧循沖人嗣膺厯服敢不祗率以時飭修然而禮意寢而不明樂文雜而未正故刺六經之説考諸儒之言緝熙曠儀是正巨典奉罍以款真字祼鬯以享宗祊齋戒乎端誠之宫清肅乎禮神之囿陟配烈祖對越穹昊于時維太常之斿備金玉之駕乃搢大圭以為國之綴乃服大裘以放古之文欽柴之燎四施燭煬泰一圜鍾之樂六變皎繹崇丘孝奏而日月光靈遊而風馬下顧獲成于熙事敢專享于蕃禧宜大澤之肆均與羣生而共慶可大赦天下於戲答三靈之介祉既秩于宗祈格四海之歡心在敷于惠術尚賴秉文之輔經武之臣相協厥恭同砥于治布告逺邇使咸聞知其年遂罷合祭天地案元豐四年四月詔自今親祀北郊並依南郊之儀六年太常禮院上親祀儀並如南郊十一月甲辰冬至祀昊天上帝以大祖配遂罷合祭其北郊當時未行也十一月十四日南郊原注蘇轍郊祀慶成詩注云有司欲羔裘度用百羔上以其害物以黑繒代之以案哲宗元祐七年十一月南郊大赦此書失載年號詔中復舉熙寧故實核之宋史知在是年也赦文門下朕承六聖鴻烈之休御千載丕平之運逖觀歷代之治無右本朝之隆充塞乎協氣之流洋溢乎頌聲之作然而重熙纍洽所以應之者惟艱持盈守成所以保之者靡易顧茲沖昧紹乃基圖永惟幾深罔敢逸豫仰賴文母維持我家保佑八年之間申錫九疇之敘賓禮故老子惠困窮上順帝心下從人欲廣祖宗之遺澤蒙天地之隆康欽言肇郊躬行大禮念嘗再饗乎穹昊未始祗事乎皇祇是用推本建隆之舊章復舉熙寧之故實案自元豐六年罷合祭天地雖定親祀北郊之儀未之舉行至是吕大防蘇轍等謂合祭天地為是宜依熙寧十年故事設皇地祇位遂復合祭執鬯以祼八室奠玉以合兩儀嚴烈祖以配天洽百神而承宇于時禮行而誠意格樂變而祥光浮誕受三神之釐敢專四海之福宜均博施溥宥羣倫可大赦天下於戲乾坤之元始生仰俯之觀象法以為羣臣之道以成覆載之功咨爾內外之庶工咸罄文武之致用惟新厥德永孚于休原注蘇轍詩注又云上至太廟門降輅郊壇止百官回班去黃道褥皆祖宗故事去繖特出上意十一月二十日南郊赦文案東都事略哲宗元符元年十一月甲子祀昊天上帝于圜丘大赦此書失載年號以分祀南郊月日及赦文考之當在是年也門下朕保極以宅師奉先而繼統駿惠先烈慎懷永圖躬攬萬幾于茲五載顧德不敏賴天博臨四夷咸賓萬邦作乂師干獻捷案東都事略是年五月破夏人于大沙堆農扈告豐錫之珍符案東都事略是年三月咸陽民段義獻玉璽授以神策嘉瑞紹至祲氛亟消豈眇末之克堪實穹旻之眷祐興言大報莫重禋郊是用遵昭考之詒謀舉隆周之墜典稽協彞制發揮祲容未奉皇祇之祀先嚴蒼昊之饗案哲宗紹聖元年以張商英言合祭非古三年詔罷合祭議分祀南北郊至元符元年十一月甲子祀圜丘遂罷合祭然北郊親祀終帝之世未克舉云乘一陽之復習三嵗之祥即路寢以齋居至殊庭而朝獻廣牡肆祀初假廟以詔虔欽柴宗祈遂升壇而謁款配侑烈祖對越明神樂成繹純禮敬敕備于時乾端澄霽冬序晏溫靈心嘉虔精意昭格師象山則孝奏天儀申命之休既昭受于上帝斂時之福其敷錫厥庶民揚于端闈孚我大號可大赦天下於戲告成大事敢専享于蕃釐申宥眚災宜溥覃于曠澤尚賴輔弼寅亮官師協恭共維太平之基永砥無疆之祚建中靖國元年十一月二十三日南郊赦文門下朕紹膺寶命祗遹洪圖躬勤儉以御邦本寬仁而敷政維先訓是式維師虞是從永言繼序之艱克謹持盈之戒荷皇天之降佑蒙列聖之詒謀方夏乂寧蠻夷賓服三時不害六府孔修建皇極而王道明即康功而民志愜以迪純熙之運以彰平富之風豈朕德之能勝繄帝臨之下屬肇稱禋祀祇答閎休是用參酌上儀鋪昭曠典奉神考恭行之志繹紹聖申講之文將蕆事于皇祇先致饗乎穹昊乃候景涓日飭躬詔虔祼清廟以肅將款圓壇而拜享侑我烈祖秩于百神禮嚴欽翼之容樂備雍和之奏蒼璧既奠紫煙具升于時乾象潔清靈心嘉饗和氣洋溢景光陸離瑞慶大來俾緝熙于純嘏膏潤并受用敷錫厥庶民豫建新元誕揚渙號可大赦天下於戲潔誠拜貺永祈申命之休肆宥均釐時乃配天而澤尚賴成德之彥正事之臣率黎獻以協衷欽庶明而懋績贊我溥將之緒迄兹伴奐之遊以明年正月一日改元為崇寧元年十一月二十六日南郊赦文案東都事略徽宗崇寧三年十一月丙申祀昊天上帝于圜丘此書失載年號以月日及赦文考之知當在是年也門下祼獻清廟所以承祖宗之靈禋祀紫壇所以答乾坤之貺朕駿膺寶命龍受寵禧丕宣文武之光盡緝熙豐之典取士于學稽古建官亮采百工庶幾三代凡厥成王之式率由昭考之行而九廟垂休案東都事略是年八月達九廟詔已祧翼祖宣祖廟並復兩儀協佑生民砥乂年穀屢豐修德錫符上燦璣衡之政鑄金象物下隆鼎鼐之基案東都事略是年六月籍元祐黨人司馬光等刻石于文德殿之東疵癘聿消雨暘咸若兹豈眇躬之能假時惟上帝之弗違是用奠玉陽丘蒞牲泰畤嚴配烈祖對越皇天于時圭景晏溫璇穹澄鑑二端立而禮無不洽六樂變而物罔不興靈心載嘉精意咸享受茲介福豈豫一人之敢私錫厥庶民思汝萬邦而共慶我有渙號揚于端闈於戲作善降之百祥既茂膺于純嘏惟天佑于一德可共翼于丕平尚賴三事股肱百辟文武咸勵同寅之業永砥無疆之休案東都事略徽宗大觀四年十一月丁邜祀昊天上帝于圜丘大赦天下此下當别有赦文今無從考補政和三年十一月六日南郊赦文門下朕承列聖之丕基奉至尊之休德繼志述事持盈守成躬攬萬幾兹踰一紀荷皇天之垂祐浹函夏以砥寧年穀屢豐雨暘式敘羌夷請吏川嶽效珍禹功無濫溢之災堯瑞告平成之治永惟多祐誕集沖人屬三嵗之親祠刺六經而定制率時昭考欽修時祀之専若昔大猷盡正相沿之陋乃齋居于路寢乃朝獻于殊庭得四表之歡心鬷假于廟乘一陽之至景大報于郊對越昊穹佑我烈祖陶匏象性犧牷貴誠奠蒼璧以禮神秉玄圭而拜貺器協商周之制樂兼韶濩之純案宋史是年十月閲新樂器于崇德殿出古器以示百官紫煙燎而爟火升靈光屬而風馬下禮儀既備知帝顧之不違福祿來崇豈朕躬之専享宜孚渙號溥洽羣倫可大赦天下於戲申命用休俾緝熙于純嘏配天其澤用敷錫厥庶民尚賴同德藎臣秉文多士克咸勵翼永保隆平壬午上神宗哲宗諡號是年十月三日御筆手詔朕若古之訓惟天為大觀天下物無以稱之故先王以類而求祀于圜丘象其形奠以蒼璧象其色冬至之日取其時大裘而冕法其幽而未有以體其道夫天玄而地黃玄天道也上天顧諟錫以玄圭內赤外黑尺有二寸旁列十有二山蓋周之鎮圭有法乎是祗天之休于以昭事上帝而體其道過周逺矣將來冬祀可搢大圭執玄圭庶格上帝之心以孚祐于下民永為定制案宋史是年以十一月癸未祀昊天上帝于圜丘先一日壬午饗太廟因上神宗哲宗諡號十一月十日南郊赦文案宋史徽宗政和六年十一月己亥祀昊天上帝于圜丘大赦此書失載年號以赦文考之知當在是年也門下朕紹膺景命嗣守丕基尊臨九有之師親攬萬幾之務翼翼敢忘夫寅畏兢兢常謹于繼承躬宵旰之勤以圖天下之乂軫淵冰之慮以保天下之安屬者百穀順成五緯來敘干戈載戢囹圄屢空元命之辰九支占南極之瑞誕彌之旦三山紀黃流之清案是年冀州三山黃河清宋史不紀其月日考徽宗以十月生此云誕彌之旦則當在此十月可補宋史之闕樂作而羽鵠翔鼎定而慶雲集名山顯位蘄封禪者數萬人絶域殊方徠臣妾者十一國有邦之應于朕豈功物生本乎天唯聖人為能饗人道先乎祖雖天子必有尊迪惟古訓之循實重國陽之報固嘗辨先王之吉禮庶乎革合祭之非奉上帝之徽稱蓋以正異名之失茲協豐年之屢載迎至日之長于時歌昊天成命之詩奏圜鍾六變之樂奠璧以致蠲潔升煙以適髙明克禋克祀而精意昭來假來饗而珍符下肆緝熙于純嘏以敷錫于庶民其播大猷周推曠澤可大赦天下於戲報本反始得萬國之歡心蕩垢滌瑕對三靈之蕃祉尚賴股肱良弼屏翰舊臣益殫忠藎之圖光輔隆平之運同砥于道永孚厥休十一月十三日南郊赦文案宋史徽宗宣和元年十一月乙邜祀昊天上帝于圜丘大赦此條失載年號以赦文考之當在是年門下觀會通以行其典禮允符昌運之隆美盛德而告于神明茲迪精禋之饗朕肇膺駿命嗣守鴻業撫九有之嘉師開萬邦之壽域兢業克艱于砥乂寅威罔怠于求端聿承燕翼之謀裒對博臨之貺屬者道源闡教帝祉凝釐農扈載謠黍稷報千倉之慶明堂御厯璣衡觀七政之齊氐羌款塞以咸賓案宋史是年六月夏人納款詔六路罷兵狴犴空囹而不式榮河順紀喬嶽錫符丹闕瓊臺屢下叢霄之蹕彤烏秀草共昭炎德之祥永惟奕世之休罔匪自天之祐爰申毖祀比答真祺是用測嶰籥以迎長備鑾輿而展采羽林綺列闢五門象魏之嚴法駕星陳正六引旗章之度夙祗清廟恭祓崇壇耨王籍以奉盛載誕豐年之報潔宫蠶而修幣用端永命之祈案東都事略是年二月詔行籍田三月皇后親蠶景鍾道和樂之音嘉秠薦大尊之齊純精昭格肸蠁潛通月璧星珠紛燎煙而上徹雲車風馬欻飆馭以來臨肆均拜胙之禧式霈滌瑕之宥誕揚渙號敷告多方可大赦天下於戲佑烈祖以格皇天豫惟克邁乃訓綏多福而熙純嘏邦其永孚于休尚賴輔弼同寅官師勵翼共浹無為之化茂隆纍洽之圖四年十一月十五日南郊赦文案宋史徽宗宣和四年十一月庚午祀昊天上帝于圜丘大赦此書失載年號以赦文考之知當在是年也門下事上帝而懷多福非禋祀不足以昭報本之誠紹大業以綏四方非升侑不足以極奉先之孝朕荷三靈之儲祉奉列聖之詒謀制治保邦克懋持盈之訓立政造事敢忘繼緒之思彌文監虞夏之隆成憲復熙豐之舊百度惟正庶繢其凝士迪典常盡革淫朋之習民興淳朴式符道紀之昌人徯志以丕欽天監誠而孚佑清臺觀象瑞占七政之齊陽館頒常運協四時之敘雨澤應期而播潤河宗聽命以回流農扈奏功黍稷嗣豐年之慶燕民效順封疆歸輿地之圖案九朝編年是年八月遼郭藥師髙鳳以涿易二州來降刑清而囹圄屢空物遂而動植咸若驗諸福之畢至豈成功之敢居恭念祭不欲疏者禮之經物無以稱者天之德肇卜迎長之旦聿修肆類之儀簠簋豆籩秩九州之嘉薦旗常罕畢儼八衛之祲容庶邦砥貢以駿奔多士秉文而顯相稽魯人先事之義以前饗于太宫歌周王成命之詩肆靈承于有昊衎我烈祖遍于羣神禮三獻而精意昭樂六奏而靈祗下祥光旁燭景貺備臻修德錫符已應克誠之享行慶施惠用均拜胙之禧嘉與萬方共膺純嘏可大赦天下於戲百神受職知帝命之不違五福錫民浹海隅而丕冒尚賴忠良修輔文武協恭益堅勵翼之心永砥輯寧之治爰咨爾衆咸體朕懷十一月十九日南郊赦文案宋史宣和七年十一月丙戌祀昊天上帝于圜丘大赦此書失載年號以日月及赦文考之知當在是年也門下皇武肇禋是創萬年之業大明制禮爰釐二至之祠朕恭承休光永念丕緒衎我烈祖實賴賢能之衆多格于皇天當由閭里之安樂整飭百度撫綏兆民神明享持守之誠華夏樂憂勤之政屬者多稼徹燕雲之野齊氓安海岱之區逺人慕義而玉帛來川后畏威而波濤弭荷天休之震動莫不率從奉王業之艱難庶無罪悔是用誕舉豐年之報肅迎景至之期吉事有祥先致殊庭之薦大禮必簡併嚴清廟之承焜煌千乘萬騎之容終始七戒三齋之德乃潔誠于陽館遂祗事于泰壇風馬雲車仰百靈之眷顧星珠月璧知四海之清明共錫蕃禧用宏大賚可大赦天下於戲薦馨香之治益承九廟垂裕之休施曠蕩之恩更應一陽發生之候尚賴官師協德黎獻願忠共扶不拔之基永篤無疆之慶十一月二十二日南郊赦文案宋史禮志髙宗建炎二年駕至揚州築壇于江都縣之東南是年十一月壬寅祀昊天上帝于圜丘大赦以太祖配此書失載年號以赦文考之知當在是年也門下觀會通以行典禮莫嚴定位以交神逺罪疾而弭災兵亦或因時而致禱朕承大統誕受多方屬外患之相仍爰省方而臨幸念父母兄弟尚屈于敵疆惟甲胄干戈再淹于嵗序問寢闕溫凊之奉在原深急難之情信使屢馳久猶未報全師再遣坐待砥寧復盜竊之無良乘邊陲之多事馮陵州縣震擾民氓衣冠傾仆于道塗耒耜荒殘于本業行者未知所適居者莫獲其安傷閭里之疾苦則撫循之政尚愆閔行陳之勤勞則休息之期猶逺每撫心而及此纍當食以興嗟險阻艱難固備嘗矣勞來還定孰安集之豈菲德之敢圖惟上穹之悔禍永懷眷祐恭俟監臨雖丁多壘之辰適在當郊之嵗惟祭之或祈或報必大時物之宜而禮之有儉有豐特視情文之稱是用講有虞東巡之制循建武二成之規新卷冕以嚴恭逮胥徒而齊沐蓋髙在上聰明皆自于我民與善惟人治亂尤艱于天位既殫誠悃彌極戰兢仰覆冒之何心詎存時怨況顛危之已甚寧忍我遺疾呼反本而必聞精意默通而可動庶幾來假式燕多難新命舊邦協幽明而並貺此疆爾界一內外以均安其敷曠蕩之恩以廣厖鴻之施可大赦天下於戲為斯民而請命敢忘庶戮之無辜置大器于復安實冀昊天之所子尚賴六服羣辟三事大夫共宏恢復之功亟砥隆平之業案宋史紹興十二年臣僚言南巡來三嵗祀明堂而郊天大祀未舉來嵗乞行之十三年三月築圜丘于臨安府行宫東城之外自是髙宗凡六郊是年十一月庚申冬至合祀天地于圜丘以太祖太宗並配大赦此下當别有赦文今無從考補十一月十日南郊赦文案宋史紹興十六年十一月丙子合祀天地于圜丘大赦此書失載年號以赦文考之知當在是年也門下朕以菲躬獲承大寶賴三靈之純佑宏濟艱難遵列聖之詒謀紹隆基緒干戈載戢囹圄屢空田疇胥慶于豐穰華夏迄臻于綏靖繄神所眷豈朕克堪念物皆本乎天宜謹精禋之報而德無加于孝聿修並侑之儀豫飭司存肇新器用迎土圭之至景即皇邸之齋居祗祓崇壇具嚴吉禮設陶匏而尚質肅繭栗以貢誠籩豆靜嘉璧琮華潤粢盛蠲潔出于耕藉之藏筍虡周環冠以景鍾之奏案紹興十六年正月親饗先農于東郊行藉田禮五月作景鍾十月帝觀新作禮器于射殿撞景鍾奏新樂佩玉鏘鳴而羣心肅燎煙升舉而協氣充惟巨典之備成敢蕃釐之専享旋輿端闕霈澤寰區可大赦天下於戲降祉發祥既荷博臨之貺赦過宥罪誕昭敷錫之恩更賴文武同寅股肱修輔益思懋勉永砥丕平十一月十四日南郊赦文案宋史紹興十九年十一月壬辰合祀天地于圜丘大赦此書失載年號以赦文考之知當在是年也門下父天母地報莫重于精禋尊祖欽宗孝莫嚴于陟配朕祗承駿命纂紹丕圖每念王業之難所其無逸矧茲神器之重必置諸安方撥亂而興衰惟履信而思順上穹孚佑列聖垂休甘露降而風雨時五穀熟而民人育案宋史是年四月湖廣江西路建康府並降甘露七月頒農書于郡邑邊鄙不聳囹圄屢空顧以眇躬膺斯景貺是用迎一陽之長至舉合祭之上儀先清廟以告虔衎我烈祖升圜壇而肆類遍于羣神禮三獻而肸蠁通樂六變而風馬降祥光旁燭協氣橫流載惟熙事之成實得歡心之助上焉承祐豈豫一人之敢専下以錫民惟爾萬方之並受於戲易薦上帝德崇而刑罰清詩美太平神寧而福祿下更賴忠良協贊內外交修共隆不拔之基永砥無為之治十八日南郊赦文案宋史紹興二十二年十一月戊申合祀天地于圜丘大赦此書但稱十八日失載年月以十一月戊申推之為十八日知當在是年也門下肅若古先鋪聞典制蓋物本乎天而人本乎祖肇郊廟之明禋唯聖能饗帝而孝能饗親展皇王之髙致重循菲德獲履丕圖體昊穹率育之仁每計安于黎庶嗣列聖好生之訓不輕用于干戈陟降既孚邇遐咸乂九穀秀康年之畝五辰澄宣夜之躔犴圄簡清疆陲整服祗荷博臨之眷敢忘昭事之誠爰修三嵗之彌文式蕆一純之大報款真庭而朝獻假太室以祼將遂造雲陽之宫以迎日至之景合祛天地升侑祖宗踐豆薦芳見會通之行禮鳴鐘應律寫和樂以成音佳氣焜于樵蒸美光充于陔陛髙靈並貺熙事備成濟濟駿奔有同寅之多士穰穰山委可専饗于蕃釐發肆恩言普施惠術可大赦天下於戲惇將禮以秩祀儀模日月之昭受厚福以漸民號法風雷之布更賴經邦公輔服采臣工永肩勵翼之衷共托隆平之業赦文案宋史紹興二十五年十一月癸亥合祀天地于圜丘大赦此書失載年月日以赦文考之知當在是年也門下朕膺申命之休履中興之運惟發祥流慶之既逺敢昧靈承念創業守文之為難每勤紹復儲精神而聽斷寶慈儉以化民荷穹昊之降康賴列聖之孚佑五兵不試寰宇阜安百穀用成刑罰清省靈芝連葉于廟柱案宋史是年五月太廟仁宗室柱生芝九莖昭朝饗之孝祥嘉禾合穎于甸郊備粢盛之潔薦諸福畢至豈朕敢當是用敦報本反始之誠備飭躬施教之義維天神地祇之貴祭莫重于合祛維祖功宗德之隆孝尤先于升侑乃備乘輿之駕乃率侍祠之臣謁款殊庭祼將太室候黃鍾之初氣奉紫畤之明禋禮三獻而有儀樂六變而告備神光並見協氣橫流賚我思成既秩精能之祀配天其澤爰施汪􅐮之恩肆舉邦彞誕敷渙號可大赦天下於戲事上帝而懷多福益堅不已之純惠中國以綏四方宜有大賚之慶更賴爽邦哲輔服采羣工共循宏逺之模永保安強之治赦文案宋史紹興二十八年十一月己邜合祀天地于圜丘大赦此書失載年月日以赦文考之知當在是年也門下朕欽紹慶基肅遵昭式謂因天事天而因地事地有丘澤之合祠惟以聖繼聖而以明繼明宜祖宗之並侑每躬三嵗之祀茂輯百神之釐既益厲精更思圖乂體覆載無私之德廓爾大公奉燕詒有永之謀丕釐庶政中外闓懌顯幽統和靈臺申偃伯之占砥路息鳴桴之警象載昭察甫田登成既膺孚佑之休當極濟明之報是用躬飭鸞路涓熙紫壇斂帝籍以共粢盛裁天歌以序金石案宋史是年七月帝親製郊廟樂章祗見恭館祼將太宫遂迎景至之長載蕆郊禋之吉大宗祈而宴饗嚴陟配以宣延實俎焚膏旅令芳之嘉薦展詩應律鏘皎繹之和聲精意洞乎九閡祥光襲乎五瑞清明鬯矣事既砥于備成福履綏之美敢矜于専享誕受函蒙之祉普施曠蕩之恩於戲馨香感于神明裒對一純之祐膏澤洽乎黎庶並臻四極之熙尚賴輔弼同寅官師率職協亮有邦之采永恢長世之圖宋朝事實卷五
