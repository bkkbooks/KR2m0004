body:
  text: 宋朝事實卷十五宋李攸撰籍田明道元年十二月上謂宰臣曰朕觀古之興王皆重農桑以為厚生之本朕欲躬耕耤田庶驅天下游食之民盡歸南畆宰臣賀曰陛下親發徳音躬耕以勸天下之民皆致治之大本臣等備位宰輔不勝慶幸乃下詔曰庶政之本蓋先于農五禮之經莫重于祭所以敦化阜俗昭孝息民致理之源率由兹道朕祗若靈命臨拊萬方守積累之洪基荷清寜之大徳然賴母儀訓助衡宰輔成暨中外之庶官皆夙夜而勤軄是致九圍靜謐百姓康熙内惟涼薄之姿敢怠寅威之戒圜丘告類雖屢展于國容千畆躬耕尚闕修于古制念太宗在御之日行東郊執耒之儀憲度具存典章咸備今欲述先烈循祖考前規申命攸司因時蕆事恭惟皇太后恢宣聖範保佑沖人于兹十年克成丕業亦未嘗親詣太室祗薦嘉羞伸昭事之誠答眷懐之祉復以嵗時大順宫寢肇新元厯載更休祥沓應顧兹縟禮可舉而行朕則躬稼穡之艱難勤身而率下皇太后則謝祖宗之貺祐精意以告䖍信有合于經彞庶永光于簡冊爰伸誕告用示先期朕以來年二月内擇日行耤田之禮兼皇太后自垂簾聽政以來未曾恭謝宗廟朕已禀奉慈旨于耤田前請皇太后恭謝宗廟其來年冬至更不行南郊之禮所有合行諸般恩賞竝特就耤田恭謝宗廟禮畢一依南郊例施行二年二月乙巳皇太后赴太廟親享七室禮成還宫案宋史皇太后服衮衣儀天冠饗太廟皇太妃亞獻皇后終獻此書所載稍畧上御天安殿發冊上太后尊號曰應天齊聖顯功崇徳仁慈保夀皇太后禮畢是日上宿天安殿百官宿齋于朝堂丙午宿齋于東郊日旁有黄雲如龍鳳丁未祀神農氏于壇乃就耕位執耜行耤田之禮禮儀使張士遜奏三推而止上曰朕將耕終千畝以勸天下之力農士遜固請乃耕十二歩而止案宋史禮志及本紀皆不載仁宗耕十二歩事此可補其闕御親耕壇公卿以下執耒耤田令奉穜稑之種司農卿受而灑之率屬以終其事還御正陽門下制曰朕欽承皇統遵奉母儀厎定萬邦勤勞一紀陽郊嚴配既屢展于孝思儲駕躬耕尚未遵于祖則是用秩開元之遺事述端拱之舊章毖祀農壇親臨帝籍復慈闈之憲古款清廟以謝成圭瓚告䖍翬珩從獻樂崇九奏禮備三犧嘉夷夏之駿奔感神靈之降格威儀卒獲福祿來同可大赦天下云云宣制畢百官稱賀上御天安殿攝太尉吕夷簡等上尊號曰睿聖文武體天法道仁明孝徳皇帝財用仁宗寳元二年陜西用兵輔臣議節浮費有議減百官及軍班等俸賜者上曰朕所欲去者乗輿服御至于宫掖奢侈竒巧無名之費不急之用爾國家當擇人以任職至于俸賜自有定制何用紛紛裁減以駭中外乎可下詔申諭之六月壬戌詔曰朕猥奉鴻業深惟永圗恭已愛人勵精求治欲素樸形于天下風化始于朝廷專命近臣議去浮費爰自乘輿之所御以至宫掖之所須盡屏紛華一敦簡儉若夫設官置吏分總事聨經武制軍參處營衛惟其廪稍之給具載等差之常務從定規無或過議其文武百官及軍班等俸賜宜令詳定所不得輒行裁減故兹詔示想宜知悉嘉祐四年正月丁亥詔三司以天下廣惠倉隸司農逐州選幕職曹官各一人專監每嵗十月别差官檢視老弱病疾不能自給之人籍定姓名自次月一日給米一升㓜者半升毎三日一給至明年二月止有餘積量諸縣大小而均給之六月詔諸路轉運司鄰路鄰州災傷而輒閉糴者以違制坐之初諫官吳及言春秋之時諸侯相傾竊地専封固不以天下生靈為憂然猶同盟之國有救患分災之義也凡外災則不書莊公十一年書宋大水昭公十八年書宋衛陳鄭災然則皆外災也所以書者是亦承告之辭而患難相恤之謂也又莊公二十八年臧孫辰告糴于齊魯記之又以鬯圭玉磬如齊告糴曰不腆先君之敝器敢告滯積以舒職事齊人歸其玉而與之糴僖公十五年晉侯及秦伯戰于韓獲晉侯傳云晉饑秦輸之粟秦饑晉閉之糴故秦伯伐晉諸侯無書獲之例而經書曰獲晉侯貶絶之也戰國之世王道不絶如綫一有閉糴而春秋誅之陛下恩施動植視人如傷然州郡之間官司各專其民擅造閉糴之令一路饑則鄰路為之閉糴一郡饑則鄰郡為之閉糴矣二千石以上所宜同國休戚而班布主恩坐視流離又甚于春秋之時豈聖朝所以子育兆民之意哉故下是詔英宗嘉祐八年十二月庚寅詔京師老疾孤窮丐者雖有東西福田院給錢米者才二十四人可即寳勝夀聖禪院置南北福田院并東西各葢屋五十間所養各以三百人為額嵗出内藏錢五千貫給之始益州豪民十餘萬户連保作交子每年與官中出夏秋倉盤量人夫及出修糜棗堰丁夫物料諸豪以時聚首同用一色紙印造印文用屋木人物鋪户押字各自隱密題號朱墨間錯以為私記書填貫不限多少収入人戸見錢便給交子無逺近行用動及萬百貫街市交易如將交子要取見錢每貫割落三十文為利每嵗絲蠶米麥將熟又印交子一兩番㨗如鑄錢収買蓄積廣置邸店屋宇園田寳貨亦有詐偽者興行詞訟不少或人户衆來要錢聚頭取索印闗閉門户不出以至聚衆爭閙官為差官攔約每一貫多只得七八百侵欺貧民知府事諫議大夫宼瑊奏臣到任誘勸交子户王昌懿等令収閉交子鋪封印卓更不書放直至今年春方始支還人上錢了當其餘外縣有交子户竝皆訴納將印卓毁棄訖乞下益州今後民間更不得似日前置交子鋪奉聖旨令轉運司張若谷知益州薛田同共定奪奏稱川界用鐵錢小錢每十貫重六十五斤折大錢一貫重十二斤街市買賣至三五貫文即難以攜持自來交子之法久為民便今街市並無交子行用合是交子之法歸于官中臣等相度欲于益州就係官廨宇保差京朝官别置一務選差專副曹司揀搯子逐日侵早入務委本州同判專一提轄其交子一依自來百姓出給者闊狹大小仍使本州銅印印記若民間偽造許人陳告支小錢五百貫犯人決訖配銅錢界奉敇令梓路提刑王繼明與薛田張若谷同定奪聞奏稱自住交子後來市肆經營買賣寥索今若廢私交子官中置造甚為穩便仍乞鑄益州交子務銅印一面降下益州付本務行使仍使益州觀察使印記仍起置簿歴逐道交子上書出錢數自一貫至十貫文合用印過上簿封押逐旋納監官處収掌候有人户將到見錢不拘大小鐵錢依例凖折交納置庫収鎖據合同字號給付人户取便行使毎小鐵錢一貫文依例剋下三十文入官其回納交子逐旋毁抹合同簿歴天聖元年十一月二十八日到本府至二年二月二十日起首書旋一週年共書放第二界三百八十八萬四千六百貫景祐三年置監官二員輪宿皇祐三年二月三日三司使田况奏自天聖元年薛田擘劃興置益州交子至今累有臣僚講求利害乞行廢罷然以行用既乆卒難改更兼自秦州兩次借卻交子六十萬貫並無見錢樁管只是虚行刷印發徃秦州入中糧草今來散在民間轉用艱阻己是壞卻元法為弊至深轉運司雖収積餘錢撥還更五七年未得了當卻勒第十三界書造交子兌換行用慿虛無信一至于此乞今後更不許秦州借支奉聖㫖依奏熙寜元年轉運司奏逐界交子十分内紐定六分書造一貫文四分書造五百文重輕相權易為流轉奉聖旨依行蘇轍元祐㑹計錄序曰臣聞漢祖入闗蕭何収秦圖籍周知四方盈虛强弱之實漢祖賴之以并天下丙吉為相匈奴嘗入雲中代郡吉使東曹攷按邊瑣條其兵食之有無與將吏之才否逡巡進對指揮遂定由此觀之古之人所以運籌帷幄之中制勝千里之外者圖籍之功也蓋事之在官必見于書其始無不具者獨患多而易忘久而易滅數十嵗之後人亡而書散其不可攷者多矣唐李吉甫始簿錄元和國計并包巨細無所不具國朝三司使丁謂等因之為景徳皇祐治平熙寜四書網羅一時出納之計首尾八十餘年本末相授有司得以居今而知昔參酌同異因時施宜此前人作書之本意也臣以不佞待罪地官上承元豐之餘業親覩二聖之新政時事之變易財賦之登耗可得而言也謹按藝祖皇帝創業之始海内分裂租賦之入不能半今世然而宗室尚鮮諸王不過數人仕者寡少自朝廷郡縣皆不能備官士卒精練常以少克衆用此三者故能奮于不足之中而綽然常若有餘及其列國款附琛貢相屬于道府庫充塞創景福内庫以蓄金幣為征討之備太宗因之克平太原真宗繼之懐服契丹二患既弭天下安樂日登庶富故咸平景徳之間號稱太平羣臣稱頌功徳不知所以裁之者于是請封泰山祀汾陰禮亳社屬車所至費以鉅萬而上清昭應崇禧景靈之宫相繼而起累世之積糜耗多矣其後昭應之災臣下復以營繕為言大臣力爭章獻感悟沛然遂與天下休息仁宗仁聖清心省事以幸天下然而民物蕃庶未復其舊而夏賊竊發邊久無備遂命益兵以應敵急征以養兵雖間出内藏之積以求紓民而四方騷然民不安其居矣其後西戎既平而已益之兵遂不復汰加以宗子蕃衍充牣宫邸官吏冗積員溢于位財之不贍為日久矣英宗嗣位慨然有捄弊之意羣臣竦觀幾見日新之政而大業未遂神考嗣世忿流弊之委積閔財力之傷耗覽政之初為强兵富國之計有司奉承違失本㫖始為青苗助役以病農民繼為市易鹽鐵以困商賈利孔百出不專于三司于是經入竭于上民力屈于下繼以南征交阯西討拓跋用兵之費一日千金雖内帑别藏時有以助之而國亦憊矣今二聖臨御方恭黙無為求民之疾苦而療之令之不便無不釋去民亦少休矣而西夏不賓水旱繼作凡國之用度大率多于前世當此之時而不思所以濟之豈不殆哉臣歴觀前世持盈守成艱于創業之君蓋盈之必溢而成之必毁物理之至有不可逃者盈成之間非有徳者不安非有法者不久昔秦隋之盛非無法也内建百官外列郡縣至于漢唐因而行之卒不能改然皆二世而亡何者無徳以為安也漢文帝恭儉寡欲專務以徳化民民富而國治後世莫及然身没之後七國作難幾于亂亡晉武帝削平吳蜀任賢使能容受直言有明王之風然而亡不旋踵子弟内叛敵兵外亂遂以失國此二帝者皆無法以為久也今二聖之治安而靜仁而恕徳積於世秦隋之憂臣無所措心矣然而空匱之極法度不立雖無漢晉强臣敵國之患而數年之後國用曠竭臣恐未可安枕而卧也故臣願得終言之凡㑹計之實取元豐之八年而其為别有五一曰収支二曰民賦三曰課入四曰饋運五曰經費五者既具然後著之以見在列之以通表而天下之大計可以畫地而談也若夫内藏右曹之積與天下封樁之實非昔三司所領則不入㑹計將著之他書以備覽觀焉蘇轍民賦序曰古之民政有不可復者三焉自祖宗以來論事者嘗以為言而為政者嘗試其事矣然為之愈詳而民愈擾事之愈力而功愈難其故何哉古者隱兵于農無事則耕有事則戰安平之世無廩給之費征伐之際得勤力之士此儒者之所嘆息而言也然而熙寜之初為保甲之令民始嫁母贅子斷壊支體以求免丁及其既成子弟挾縣官之勢以邀其父兄擅弓矢之技以暴其鄉鄰至今河朔京東之盗皆保甲之餘也其後元豐之中為保馬之法使民計産養馬畜馬者衆馬不可得民至持金帛買馬于江淮小不中度輒斥不用郡縣嵗時閱視可否權在醫駔民不堪命民兵之害乃至于此此所謂不可復者一也周官泉府之制凡民之貸者以國服為之息貸而求息三代之政有不然者矣詩曰倬彼甫田嵗取十千我取其陳食我農人自古有年而孟子亦云春省耕而補不足秋省斂而助不給蓋有是道矣而未必有常數亦未必有常息也至于熙寜青苗之法凡主客户得相保任而貸其息嵗取十二出入之際吏縁為姦請納之勞民費自倍凢自官而及私者率取二而得一自私而入公者率輸十而得五錢積于上布帛米粟賤不可售嵗暮寒苦吏卒在門民號無告二十年之間民無貧富家産盡耗此所謂不可復者二也古者治民必周知其夫家田畝六畜器械之數未有不知其數而能制其貧富者也未有不能制其貧富而能得其心者也故三代之君開井田畫溝洫謹歩畝嚴版圖因口之衆寡以授田因田之厚薄以制賦經界既定仁政自成下及隋唐風流已逺然其授民田有口分永業皆取之于官其斂民財有租庸調皆計之于口其後世亂法壊變為兩稅戸無主客以見居為簿人無丁中以貧富為差田之在民其漸由此貿易之際不可復知貧者急于售田則田少而稅多富者利于避役則田多而稅少僥倖一興稅役皆弊故丁謂之記景徳田況之記皇祐皆以均税為言矣然嘉祐中薛向孫琳始議方田量歩畝審肥瘠以定賦稅之入熙寜中吕恵卿復建手實抉私隱崇告訐以實貧富之等元豐中李琮追究逃絶均虛數虐編户以補失陷之稅此三者皆為國斂怨所得不補所失事不旋踵而罷此所謂不可復者三也故臣愚以謂為國者當務實而已不求其名誠使民盡力耕田賦輸以養兵終身無復征戍之勞而朝廷招募勇力强狡之民教之戰陣以衛良民二者各得其利亦何所不可哉富民之家取有餘以貸不足雖有倍稱之息而子本之債官不為理償進之日布縷菽粟雞豚狗彘百物皆售州縣晏然處曲直之斷而民自相養蓋亦足矣至于田賦厚薄多寡之異雖小有不齊而安靜不擾民樂其業賦以時入所失無幾因其交易而質其欺隱繩之以法亦足以禁其太甚昔宇文融括諸道客戸州縣觀望虛張其數以實戸為客雖得戸八十萬餘嵗得錢數百萬緡而百姓困敝實召天寳之亂均稅之害何以異此凡此三者皆儒者平昔之所稱頌以為先王遺法用之足以致太平者也然數十年以來屢試而屢敗足以為後世好名者之戒矣惟嘉祐以前百役在民衙前大者主倉庫躬饋運小者治燕饗職迎送破家之禍易于反掌至于州縣役人皆貪官暴吏之所誅求仰以為生者先帝深究其病鬻坊場以募衙前均役錢以雇諸役使民得闔門治生而吏不敢苛問有司奉行不得其當坊場求數倍之價役錢取寛剩之積而民始困躓不堪其生矣今二聖鑒觀前事知其得失之實既盡去保甲青苗均稅至于役法舉差雇之中惟便民者取之郡縣奉承雖未即能盡而天下之民知天子之愛我矣故臣于民賦之篇備論其得失俾後有攷焉宋朝事實卷十五
