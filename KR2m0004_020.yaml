body:
  text: 宋朝事實卷二十宋李攸撰經畧幽燕唐貞觀初始置松漠府以靡㑹為都督賜姓李氏開元中降以公主會昌中始賜契丹之印于是統有八部雄據北漠懿僖之亂中國不靖後有安巴堅遂僭帝號抗衡中國南侵鎮定邢洺冀貝之郡朱全忠時劉仁恭與其子守光盗據幽薊政令苛虐燕人苦之逃入契丹安巴堅撫存慰納不取租稅以致檀順平營之人亦多歸之會後唐莊宗領兵入洛誅滅梁氏尋亦翦除劉守光父子于是幽薊不復有抗捍焉安巴堅攻雲朔諸州安次潞縣三河漁陽懐柔密雲等縣俘掠赤子萬數入蕃至明宗約為兄弟且以解邊人之倒縶紓國家之外憂安巴堅改元稱制分建京闕宫室官號盡依中國安巴堅死子徳光立㑹石敬瑭叛于河東遣趙瑩桑維翰等奉使求援許以得志後割地為獻徳光乃率兵十萬送敬瑭入洛冊為晉主名之為子遂割代北應朔寰雲蔚及范陽山前幽薊瀛莫涿易檀順及山後儒媯新武十六州以與之仍嵗與帛三十萬疋供給稍稽則詬辱陵責及少主嗣立恥稱臣而稱孫自是有隙而兵始交矣詔天下㸃抽鄉兵七户出一卒而四方于是騷然及景延廣矜横磨之刃趙延夀希統天之業杜重威領兵而降于中渡張彦澤斬關而為彼鄉道邊馬嘶于宫闕戰塵坌于河洛天地失常少主乃遷于黄龍府鬼神含怒徳光尋斃于欒城大順之時荒淫失政周世宗乘其衰削遂奪其關南之地以瓦橋關為雄州以益津關為霸州淤口關置寨案周世宗兵下三闗五代史秪載瓦橋關益津關而闕其一攷晁以道嵩山集云三闗謂淤口闗瓦橋闗益津闗也與此書合復破楊顯仁于髙平至顯徳二年又遣劉崇襲府州為折徳扆所敗觀其累世恃强負勢侵削中土亦已甚矣契丹有五京原註上京中京東京燕京西京也上鎮十二原註奉聖州雲州平州祖州懐州顯州乾州興中府建州宜州慶州黄龍府是也中鎮六原註應州饒州白川州錦州番州蔚州也下鎮七原註湖州連州同州宣州可汗州寜州河州也觀察州十三原註永利州利州髙州耀州徳州宜州坤思州遂州信州三河州咸州朝州營州也刺史上州九原註涿州易州歸州化州保州昌州義州吉州昭延州也中州十一原註瀛州順州儒州海州原州惠州濠州新州鳯州京州長安州也下州三十四原註睦州集州衛州泉州宗州銀州巖州慈州陳州通州化州麓州朝州長春州鈐州澤州葉州嚴州温州潤州般州蘭州番州閭州雙州鐵州暉州渭州還州元州福州烏州金州懿州是也案此所載州名與遼史多不相合如衛陳泉鈐葉温般番暉還元等州皆不見遼史遼史有儀坤州此作坤思州遼史有檀薊瀋淥等州此又無之盖以宋人記遼地所聞岐異而傳寫復不免脫訛也自京鎮等處土田豐好兵馬强盛地利物産頗有厚利其他自中下州固已寂寥荒漠然折長補短地利綿亙周圍不過五千里計其所出所産未必敵河東河北州郡也其他方兵旅大約計之未必滿三十萬且自諸京統軍司及寨幕契丹兵不過十五萬奚家渤海兵不過六萬漢兒諸指揮不過一萬五千刺字父子軍五指揮不過數千鄉兵義軍不過三萬刺手背揀不中老弱兵不過七千然而分守諸州及河東河北接界州縣又東屯女羅女真新羅百濟野人國狗國灰國黑水國西屯珠爾布固番遊獵國沃濟國室韋國托歡番舒嚕國党項部族番達靼國川瓜沙州土番遇野國土番夾山土番西番諸處寨戍縱少亦須十萬方可分守外餘二十萬為戰鬭之兵若傾國而來亦須留三萬人防守外餘一十七萬人其間亦有負糧持器護從等不過止有十萬人其来不過一出梁門遂城一出雄霸一出鴈門句注一出并代然而雄滄霸州以来頗多溏水決河東注于我為便則雄霸以來不足為慮矣又縁邊要害之處多張旗幟增加兵守晝飛沙塵夜多烽火有二十萬人精兵足以禦之其次清野而待之多方而誘之又選良將十餘人領兵十萬四出密襲其巢穴自易州以東至于欒州以来一自紫荆嶺口路一自白羊口連大安山路一自南口以北居庸闗八答嶺一自得勝口湯山口古北口一自遺安口燕市口一自松亭闗口白淀口一自首符家口大林土山口所至攻其城邑盡受大將軍節㑹于幽州取山前郡則山後州縣自下矣又命兵自梁門至虎北口石門或鴈門句注以來設伏用竒要敵之兵斷其徃來之路如此敵騎進退失措滅之必矣凡此者廟堂之所宜知者也國初天贊賢案遼史景宗名賢初即位羣臣上尊號曰天贊皇帝此合尊號與名書之遣兵攻鎮定聞藝祖登極乃驚曰中國今有英武聖主吾豈敢以螳蜋而禦轍耶于是遁去先是五代時募民盗戎人馬官給其直籍數以補戰騎之闕大祖受命務保境息民不欲生事邊境盡令還前所盗馬仍申明條禁無得出塞為盗未幾契丹入邊為棣州刺史何繼筠擊敗乾徳二年昭義軍節度使李繼勲攻遼州州將杜延韜以城来降并人引衆歩騎六萬復来援繼勲與彰徳軍節度使羅彦瓌洺州防禦使郭進内客省使武懷節率馬歩軍六萬人擊其衆于遼州城下敗之又攻平晉軍上遣郭進内客省使曹彬等領歩騎萬餘赴之未至而遁案宋史乾徳元年北漢引契丹攻平晉軍遣洺州防禦使郭進等救之此在乾徳二年與史互異三年冬來攻易州畧居民上令監軍李謙昇率兵入其境俘生口如所畧之數俟契丹放還易州之民然後縱之四年正月又攻易州監軍任徳義擊走之上令闗南監軍及雄霸瀛莫等四州刺史勒所部兵校獵于幽州之境以耀威武四年天徳軍節度使于延超與其子來降上以延超為左千牛衛大將軍六月偽横海軍節度桑興来降開寳二年太祖親征河東契丹兩道率衆来援一道攻石嶺闗為何繼筠所破一道攻定州為韓重斌擊敗之是秋涿州刺史許周瓊來降上以為涿州刺史契丹錫里伊里等凡一十六族歸款上以其大首領四人為懷化將軍八人為懐化郎將餘八十五人為歸徳司戈是嵗契丹主為其下所殺國人立明記為帝案遼史景宗小字明扆世宗子也穆宗遇弑乃即位此書以明扆為眀記互詳第二卷紀元篇三年十月契丹以六萬騎攻定州上遣判四方館事田欽祚領兵三千人赴之上戒欽祚曰彼衆我寡但背城列陣以待之敵至即戰勿與追逐欽祚于是與敵衆戰于滿城敵騎少卻乘勝逐北至遂城殺獲甚衆值夜入保遂城敵圍欽祚數日欽祚度城中糧少是夜整衆突圍而出至保寨軍中不亡一矢北邊傳言三千折六萬太祖自是益修邊備嘗謂左右曰若契丹敢復犯邊我毎以三十匹絹購一敵人之首其精兵不過萬人止費我三百萬匹絹此宼盡矣太祖一日内出取幽州圖以示宰相趙普謂曰卿意此圖孰能為者普詳觀歎曰他人不能為惟曹翰能為之帝問何以知之對曰方今將帥材謀無出于翰者陛下若使翰徃必得幽州既得之後但不知陛下遣何人代翰帝黙然先是開寳九年正月羣臣上尊號曰應天廣運一統太平聖文神武明道至徳仁孝皇帝帝曰今汾晉未平燕薊未復謂之一統可乎卻而不受帝痛恨開運之禍華人百萬皆没于契丹自即位專務節儉乘輿服用一皆簡素别作私藏以貯供御羡餘之物謂左右曰俟及三百萬貫我當移書契丹用贖晉朝陷沒百姓然則帝欲大一統而復幽燕者其意在此不在彼也七年十一月其涿州刺史耶律琮以書遺知雄州孫全興曰琮受君恩猥當邊任臣無交于境外言則非宜事有利于國家專之亦可竊思南北兩地古今所同曷嘗不世載歡盟時通贄幣徃者晉氏後主政出多門惑彼彊臣忘我大義干戈以之日用生靈于是罹災今兹兩朝本無纖隙若或交馳一介之使顯布二君之心用息疲民重修舊好長為與國不亦休哉琮以甚㣲敢干斯義逺希通悟洞垂鑒詳太祖命全興以書答焉八年三月遣款附使格什古星什奉書来聘稱契丹國上命閤門副使郝崇信至境上迓之及至館于都亭驛太祖召見賜以襲衣金帶銷金皂羅帽烏皮鞾器幣二百銀鞍勒馬具傔從衣物器幣有差宴于内殿仍召至便坐觀諸班騎射令其一使者與衛士馳射毛毬截桞枝及辭歸國召見賜器幣衣服帝因謂宰相曰自五代以來北敵強盛蓋由中原衰弱以至晉帝䝉塵亦否之極也今慕化而至乃期運使然非涼徳能致左右皆稱萬嵗自是契丹始與中國交聘八月遣使獻御衣玉帶名馬太祖皆厚賜之因令其使人從獵近郊太祖親射走獸矢無虚發使者俯伏呼萬嵗私謂譯者曰皇帝神武無敵射必命中所未嘗見也及平江南獻弓矢名馬九年長春節遣使貢御衣玉帶銀鞍勒馬太祖升遐遣使修賻禮太宗即位遣使獻御衣金玉鞍勒馬等賀太祖山陵獻馬金銀乾明節遣使来賀詔遣監察御史李瀆借太府卿閤門祗候鄭偉借右千牛衛將軍報聘開寳四年遣使問起居尋入宼石嶺關以援晉陽為郭進所敗及王師既平河東詔發兗鄆齊魏貝博滄鎮冀邢磁洺徳易定祁瀛莫雄霸深趙等州及乾寜保塞等軍芻粟赴北面行營分遣使督之將有事于幽薊六月十九日車駕次金臺二十日帝躬擐甲胄率兵次東易州偽刺史劉宇率官吏開門迎王師乞降二十三日未明次幽州城南契丹衆萬餘屯于城北帝親率兵乘之斬首千餘級餘黨遁去二十五日命諸將分兵攻城帝乘歩輦至城下督諸將進攻七月三日契丹偽武雄軍節度使知順州劉廷素率官屬十四人來降五日偽節度使知薊州劉守恩與官屬十七人来降六日幸城西北隅督攻城七日詔班師二十八日車駕至自范陽原註先是上平并汾迴欲乗勝攻范陽諸將皆贊成其事至是以士卒疫癘轉輪迴逺日虞敵兵之至遂班師五年十一月十日詔曰邊境多虞兵戎猶梗介胄之士息肩未遑樽俎之籌折衝之暇兩河之際列陣相望烽火時至于近郊羽檄尚馳于絶塞是用大興戈甲遂殄氛霾昔者師人多寒楚子所以躬撫匈奴未滅漢武于是親巡蓋以慰虎旅之心銷狼烽之氣雖在窮冬之候敢辭夙駕之勞朕取此月暫幸邊陲親撫士卒應經過頓舍凡百費用悉以官物充所在不得輒有裒斂又詔幽州朕祗膺景命光宅中區右蜀全吳盡在提封之内東漸西被咸歸覆育之中常令萬物以由庚每慮一夫之不獲睠此北燕之地本為中國之民晉漢以来契丹竊據迨今不復垂五十年國家化被華夷恩覃動植豈可使幽燕奥壤猶違禮義之鄉冠帶遺民尚限邊荒之俗爰興師律以正封疆拯溺救焚聿從于民望執訊獲醜即震于皇威凡爾衆多宜體兹意今遣行營前軍都部署曹彬等振旅長驅朕當續御戎軍親臨寇境徑指西樓之地盡焚沙漠之庭灌爝火之㣲寜勞巨浸折蠢螽之股豈待隆車應大軍入界百姓倍加安撫不得誤有傷殺及發掘墳墓焚燒廬舍斬伐桑棗擄掠人畜犯者竝當處斬十三日車駕發京師十四日闗南言破契丹萬餘衆斬首三千餘級翌日從官詣行宫稱賀十九日駐蹕于大名府雄州言契丹皆遁邊候徹警從臣稱賀上乘勝欲進討幽州以問李昉扈䝉等事之可否昉等上奏曰北方自古為㓂乘秋犯塞徃徃有之一昨輒率甲兵來擾疆境陛下櫛沐風雨衝冒嚴凝親御戎衣以攘民害乗茲北兵畏威而逃因而翦之易于拉朽况幽薊之壤乆陷殊方慕化之心倒懸斯切今若擁百萬横行之衆弔一方徯后之民合勢而攻指期可定其如大兵所聚糧餉是資况河朔之區連嵗飛輓近經蹂躪尤極蕭然雖洊遇于豐穰恐不堪其調發屬兹寒冽益復罷勞况今敵兵宵奔邊陲寜肅若親巡塞下振耀戎容固足懼彼殘魂亦恐勞于大舉伏望申戒羽衛善養驍雄講習武經繕修攻具俟府藏之充溢閭里之富盛朞嵗之間用師未晩上深納其言即日下詔南歸七年明記卒有子三人隆緒隆慶隆裕至是隆緒立年十二嵗母燕燕専國政五月以三萬騎入邊潘美等分兵撃敗之十月下詔北邊州軍曰朕受天景命奄宅中區以四海為家兆民如子冀咸登于富夀豈務勝于甲兵況與契丹本通鄰好昨以河東劉繼元不尊朝化盗據一方念彼遺民行兹薄伐素非瀆武惟切弔民而契丹轉舉干戈輒来救援一鼓既平于晉壘六師遂指于燕郊靡辭六月之征聊報東門之役雖彼曲可見而罪已良多今聞邊境謐寧田秋豐稔軍民所宜安堵無或相侵如今後輒入北界擄掠及盗竊亦仰所屬州軍収捉重斷所盗物竝送還之未幾錫里伊里等十一族七萬餘帳内降者又三千帳羊馬萬計十二月髙陽闗捕得敵中首領言契丹種族攜貳慮王師致討頗于近塞築城為備太宗謂宰相曰北人以剽畧為務乃修城壘為自全之計耳曩者劉繼元盗據汾晉周世宗及太祖皆親征不利朕決取之為世宗太祖刷恥遂擒繼元至闕下今日視之猶几上肉耳當其保堅城結契丹為援豈易制乎宋琪對曰臣少陷北庭備知戎馬之數自晉末始强盛然種類蕃多其心不一自石嶺闗之敗及平繼元縁邊諸郡頻有克㨗以臣度之其部下攜貳必矣國家不須致討可坐待其滅亡後上謂宰相曰數有人自北邊来偵知敵中事自朝廷増修邊備北人甚懼昔晉漢衰弱邊陲無盡節之臣大率張皇事勢以要恩寵為自利之計今之邊將皆朕所推擇咸能盡心無復襲舊態也幽州四面平川無險阻可恃難于控扼異時収復幽州當于古北口以来據其要害不過三五處屯兵設堡寨自絶南牧矣原註古北口兩傍皆峻崖中有路僅容車轍口北有鋪彀弓連繩本范陽控扼契丹之所最為隘束琪對曰范陽是前代屯兵建節之地古北口及松亭闗野狐闗三路竝設堡障至今石壘基堞尚存將来定幽朔止于此數處置戍可也雍熙初知雄州賀令圖與其父岳州刺史懷浦等上言案李燾長編賀令圖及懷浦與文思使薛繼昭軍器庫使劉文裕崇儀副使侯莫陳利用等相繼上言幽州可取狀較此所載為詳契丹主㓜國事皆決于母葉葉大將韓徳讓寵倖用事請乘其釁以取幽州太宗以為然雍熙三年大發師以天平軍節度曹彬為幽州行營前軍都總管出涿州河陽節度崔彦副之馬軍都指揮使米信為幽州西北道行營都總管出雲中代州觀察杜彦圭副之步軍都指揮使田重進為定州路行營都統出飛狐口蘄州刺史譚延美副之忠武軍節度使潘美為靈應州行營都總管出鴈門靈州觀察使楊業副之是時權知髙麗國王治遣使修貢京師帝以王師北征其國與契丹接境常為其所侵乃命監察御史韓國華假太常少卿往使其國降詔諭之曰朕誕膺丕構奄宅萬方草木蟲魚罔不䝉澤華夏蠻貊罔不率俾蠢兹北方敢拒皇威倔强沙漠之中遷延嵗月之命幽薊之地本被皇風曩以晉漢多虞契丹因而盜據詩云我疆我理南東其畆今國家照臨所及書軌大同豈使齊民陷兹朔漠今已董齊師旅殄滅塵氛元戎啓行分道間出即期誅翦以慶混同惟王乆慕華風素懐眀畧輸此忠勤之節撫兹禮義之邦而接彼境壤困于蠆毒舒泄積憤其在兹乎便可申戒師徒迭相掎角叶此鄰國同力盪平奮其一鼓之雄戡此垂亡之敵良時不再王其圖之應擄獲生口牛羊財物器械並給本國將士用申賞勸于是彬下固安城又下新城重進戰飛狐南斬首五百級美攻寰州刺史趙彦辛來降又克涿州美進圍朔州其節度副使趙希贊以城降契丹以萬騎來援飛狐口重進大破之擒其將大鵬翼康州刺史馬頵案長編載監軍馬頵及副將何萬通竝為彬所擒與此詳畧互異彬又戰涿州南斬首千餘級殺奚宰相賀斯美遂圍應州其節度副使艾正以城降重進攻飛狐又下靈丘四月美克靈州蔚州押衙李存璋等以城来降初太宗謂彬曰朕令潘美出鴈門先取靈應卿以大軍聲言取幽州而持重緩行敵聞之必聚勁兵于彼不復出援山後矣既美果下寰朔靈應重進得山後要害地太宗疑彬進兵速而饟道不繼彬乃留涿州旬日食果盡還軍以援供饋上聞之曰安有大敵在前而退軍就食者即遣使止之令引軍沿白溝河與米信合待潘美盡得山後之地然後東取幽州彬之諸將至是聞美等屢戰勝自以持重兵而功少遂欲儌功彬不得已于是裹五十日糧再趨涿州且行且戰歴二十日始至城中屬盛暑士卒疲乏不能進還至岐溝契丹躡戰王師遂敗彬宵渉拒馬河營于易水之南彦進亦為契丹所敗奏至詔諸將分屯沿邊諸郡召彬彥進等還闕留田重進守中山令潘美還代州遣使部徙靈應寰朔四州民五萬户及其吐渾突厥三部落安慶等族八百餘帳分置于河南孟曹汝洛等四處是年冬復攻易州自曹彬失律諸將多坐黜免至是上復思宿將劉廷讓宋偓張永徳時皆罷節制在環衛上欲令進撃自效遂遣廷讓屯雄州偓屯霸州永徳屯定州廷讓與敵戰君子館軍敗僅以身免先鋒賀令圖高陽闗部署楊重進沒焉原註賀令圖少謹愿太宗在藩邸以隸左右即位改綾綿副使知莫州雍熙二年領平州刺史幽州行營濠寨使令圖握兵邊郡十餘年恃藩邸舊恩毎嵗入奏多言邊塞利害及幽薊可取之狀上信之故有岐溝之舉既而師敗議者皆咎令圖貪功生事復輕而無謀敵將耶律遜寜號裕悅者使諜紿令圖曰我獲罪本國旦夕願歸南朝無路自拔幸君侯少留意焉令圖不虞其詐自以終獲大功私遺以重錦十兩是年十二月敵將裕悅率衆入攻大將劉廷讓與戰于君子館令圖為先鋒敵圍我師數重裕悅傳言軍中願得見雄州賀使君令圖嘗為所紿意其来降即引麾下百十騎逆之將至其帳百歩外裕悦據胡牀罵曰汝小子年在乳臭乃今送死来耳命左右盡殺其從騎反縳令圖與其父首謀北伐一嵗中父子皆陷焉敵復入深析陷易州殺畧甚衆上為下哀痛之詔大發兵戍鎮定髙陽闗四年正月詔問文武羣臣詢平寇之策又議作方田為戰守之備上乃以手詔諭縁邊將帥曰夫料敵之强弱古人以為難前嵗之舉蓋救民之塗炭蠢兹北寇敢肆憑陵蹂踐我士民攻掠我城寨朕定必勝之策畫必當之計將以保民安邊畧舉大意且戎人勝則深入而不相讓敗則逃竄而不相救固不可力戰也又皆騎兵利于平陸馳逐來徃難于羈制固不可追奔也若棄小城就大鎮但屯兵于鎮定瀛莫之間其縁邊城寨必苦于寇掠固不可分兵也悠乆之謀在于設險若乃決大河築長城又徒自示弱為後代笑朕今立法令縁邊作方田已頒條制量地里之逺近列置寨柵此可以限其戎馬而大利我之歩兵雖使彼衆百萬亦無所施其勇自春至秋其功告成持重養銳挫彼强敵如此則復幽薊滅林胡有日矣淳化元年上遣使至定州密諭旨于都部署李繼隆曰若將来復入邊朕當自行繼隆上奏以謂扞城禦侮臣等之責況蕞爾殘衆豈煩戎輅親舉言甚懇切至道元年正月其將韓徳威率衆萬騎誘党項十六大首領自振武入攻府州折彥卿大敗其衆四月復攻雄州知州何承矩敗之梟鐵林大將一人宋朝事實卷二十
