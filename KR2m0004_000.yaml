  text: 欽定四庫全書史部十三
  hash: sha256:37715509aef7f3494164bc585a87d8624d4b4517ea757749fe3b4d88b8516ad7
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2m0004_WYG_000-1a, image: WYG0608/WYG0608-0001a.png}
body:
  text: 宋朝事實政書類一通制之屬提要臣等謹案宋朝事實二十卷宋李攸撰文獻通考作李伋考宋史藝文志亦作李攸通考傳寫誤也攸字好德陳振孫書録解題稱其官為承議郎而不詳其里貫原序稱政和初編輯西山圖經九域志等書瀘帥孫義叟招之書上轉一官張浚入朝約與俱以家事辭考西山屬成都府瀘州屬潼川路則攸當為屬人其曰張浚入朝蓋紹興四年浚自川陜宣撫使召還時也其書據原序蓋上起建隆下迄宣和凡六十卷其三十卷先聞於時後以餘三十卷上之因語觸秦檜寢其書不報故朝陳二家書目俱作三十卷與序相合而趙希辨讀書附志宋史藝文忠乃俱作三十五卷今書中有髙孝兩朝登極赦詔及紹興間南郊赦詔而紀元亦迄於紹興殆又有所附益兼及南宋之初歟攸熟於掌故經靖康兵燹之後圖籍散佚獨汲汲搜輯舊聞使一代典章粲然具備其用力頗為勤摯所載厯朝登極南郊大赦詔令太宗親製趙普碑銘西京崇福宫記景靈西宫記太晟樂記往往為宋文鑑名臣碑傳琬琰集播芳大全諸書所闕漏他如宗室換官之制不見於宋史職官志郊祀勘箭之儀不詳於禮志太廟崇寧廟圖紫宸殿集英殿上夀賜宴再坐立班起居諸圖宫架鼓吹十二按圖尤為記宋代掌故者所未備至其事蹟之異同年月之先後紀載之詳略尤多可與東都事略續通鑑長編及宋史互相參訂又如石晉賂契丹十六州分代北山前山後足訂薛歐五代史稱山後十六州之誤周世宗兵下三關並載淤口關亦足補薛歐二史祗載瓦橋益津二關之闕當時如江少虞事實類苑錦繡萬花谷多引用之宋史亦多採用其文第原本久佚惟散見於永樂大典各韻下者尚存梗概而割裂瑣碎莫由考見其體例惟趙希辨讀書附志稱祖宗世次登極紀元詔書聖學御製郊廟道釋玉牒公主官職爵邑勛臣配享宰執拜罷科目儀注兵刑律厯籍田財用削平僣為升降州縣經略幽燕之類具載本末云云蓋即當日之門目今據以分類編次釐為二十卷雖未悉復原書之舊而綱舉目從咸歸條貫亦得其十之七八矣攸别有通今集二十卷宋史藝文志入故事類今佚不傳又嘗上書秦檜戒以居寵思危尤為侃侃不阿則其人亦足重不獨以博洽見長云乾隆四十六年二月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀欽定四庫全書史部十三宋朝事實目録政書類一通制之屬卷一祖宗世次卷二登極赦紀元卷三詔書聖學御製卷四郊赦一卷五郊赦二卷六廟制卷七道釋卷八玉牒公主卷九官職勳臣配享卷十宰執拜罷卷十一儀注一卷十二儀注二卷十三儀注三卷十四科目樂律歷象卷十五籍田財用卷十六兵制卷十七削平僭僞卷十八升降州縣一卷十九升降州縣二卷二十經略幽燕
