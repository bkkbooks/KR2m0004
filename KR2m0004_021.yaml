front:
  text: 江陽譜李攸字好德政和初編輯西山圖經九域志等書瀘帥孫羲叟招原注下有闕文書上轉一官張公浚入朝約與俱以家事辭手編皇朝事實起建隆迄宣和凡六十卷其三十卷先聞于時有旨制司上太常少卿何麒言請命以宫觀居家終其書後以餘三十卷上之緘封副本并贄啓秦相檜啓云方今雖為中興其實創業作事成于果斷亦貴聽言思始議之艱危尚軫鈞懷之惴栗已窒申棖之欲方和傅說之羮宜俊乂旁招于庶位之中無顔色拒人于千里之外更願無忘在莒居寵思危秦怒寢其書不報今藏于家
